    if(vistos[clave]) avisos.push({ texto: f.nombre + ' y ' + vistos[clave] + ' libran exactamente los mismos dias (' + f.libreDias.map(x => DIAS[x].toLowerCase()).join(' y ') + ').' });
    else vistos[clave] = f.nombre;
  });

  activos().forEach(e => {
    const dias = diasLibresRecientes(e.id, ctx.k, 4);
    if(dias.length >= 3 && dias.every(x => x === dias[0]))
      avisos.push({ texto: e.nombre + ' ha tenido libre siempre el ' + DIAS[dias[0]].toLowerCase() + '. Conviene rotarlo.' });
  });

  // Un mismo problema puede aparecer en varios dias: se muestra una sola vez
  const unicos = (lista) => {
    const vistos = new Set();
    return lista.filter(x => { if(vistos.has(x.texto)) return false; vistos.add(x.texto); return true; });
  };
  return { conflictos: unicos(conflictos), avisos: unicos(avisos), faltantes, equidad: eq };
}

function candidatosPara(ctx, d, turnoId, puestoId, excluirId){
  const out = [];
  for(const e of activos()){
    if(e.id === excluirId) continue;
    const c = ctx.celdas[ck(e.id, d)];
    if(c && c.t !== LIBRE) continue;
    if(c && (c.o === 'manual' || c.b || c.fijo)) continue;   // libre bloqueado o del patron
    const r = validar(ctx, e.id, d, turnoId, puestoId, { reemplazar:true });
    if(r.ok) out.push({ empId:e.id, puntos: puntuarCandidato(ctx, e, d, turno(turnoId), puestoId) });
  }
  return out.sort((a,b) => b.puntos - a.puntos);
}
function casiPodrian(ctx, d, turnoId, puestoId){
  const out = [];
  for(const e of activos()){
    const r = validar(ctx, e.id, d, turnoId, puestoId, { reemplazar:true });
    if(!r.ok && ['dias','consecutivos','descanso','cupo','doble','terminalB'].includes(r.motivo))
      out.push({ empId:e.id, motivo:r.motivo, texto:r.texto, sugerencia:r.sugerencia });
  }
  return out;
}

/* Explica, empleado por empleado, por que no puede cubrir un puesto.
   Se usa en el aviso de "puesto sin cubrir" para que no haya que adivinar. */
function porQueNadiePuede(ctx, d, turnoId, puestoId){
  const out = [];
  for(const e of activos()){
    const c = ctx.celdas[ck(e.id, d)];
    // primero se mira si podria si lo quitaramos de lo que tiene ese dia
    const sin = ctxCopia(ctx.k, ctx.celdas);
    delete sin.celdas[ck(e.id, d)];
    const r = validar(sin, e.id, d, turnoId, puestoId, { reemplazar:true });
    let estado, detalle;
    if(c && c.t !== LIBRE){
      const t = turno(c.t), p = puesto(c.p);
      estado = 'ocupado';
      detalle = 'ya trabaja ese dia en ' + (t ? t.corto : '?') + (p ? ' / ' + p.corto : '') +
                (r.ok ? '. Podria cambiarse a este puesto si mueves lo otro.' : '.');
    } else if(r.ok){
      estado = 'puede';
      detalle = c ? 'esta libre ese dia y podria cubrirlo.' : 'podria cubrirlo.';
    } else {
      estado = 'no';
      detalle = r.texto;
    }
    out.push({ empId:e.id, nombre:e.nombre, estado, detalle });
  }
  return out;
}

/* =====================================================================
   HISTORIAL
   ===================================================================== */
function historialEmpleado(empId, kActual, nSemanas){
  nSemanas = nSemanas || 8;
  const h = { horas:0, dias:0, tardes:0, tempranos:0, intermedios:0, findes:0, libres:0, visitasB:0,
              libresPorDia:[0,0,0,0,0,0,0], porPuesto:{}, porTurno:{}, semanas:0 };
  for(let i = 1; i <= nSemanas; i++){
    const w = S.semanas[addDias(kActual, -7*i)];
    if(!w) continue;
    h.semanas++;
    for(let d = 0; d < 7; d++){
      const c = w.celdas[ck(empId, d)];
      if(!c) continue;
      if(c.t === LIBRE){ if(!c.aus) { h.libres++; h.libresPorDia[d]++; } continue; }
      const t = turno(c.t); if(!t) continue;
      h.horas += horasTurno(t); h.dias++;
      h.porTurno[c.t] = (h.porTurno[c.t]||0) + 1;
      if(t.tipo === 'tarde') h.tardes++; else if(t.tipo === 'temprano') h.tempranos++; else h.intermedios++;
      if(d >= 5) h.findes++;
      if(c.p){ h.porPuesto[c.p] = (h.porPuesto[c.p]||0) + 1; if(esTerminalB(c.p)) h.visitasB++; }
    }
  }
  h.horas = Math.round(h.horas*10)/10;
  return h;
}
function diasLibresRecientes(empId, kActual, n){
  const out = [];
  for(let i = 1; i <= n; i++){
    const w = S.semanas[addDias(kActual, -7*i)];
    if(!w) continue;
    for(let d = 0; d < 7; d++){
      if(esLibreReal(w.celdas[ck(empId,d)])){ out.push(d); break; }
    }
  }
  return out;
}

/* =====================================================================
   EQUIDAD
   ===================================================================== */
function equidad(ctx){
  ctx = ctx || ctxReal();
  const filas = activos().map(e => {
    const objetivo = diasObjetivoDe(e.id, ctx.k);   // cada uno tiene el suyo
    let horas=0, dias=0, tardes=0, tempranos=0, intermedios=0, findes=0, libres=0, vB=0, ausente=0;
    const libreDias = [], porPuesto = {}, porTurno = {};
    for(let d = 0; d < 7; d++){
      const c = ctx.celdas[ck(e.id,d)];
      if(!c) continue;
      if(c.t === LIBRE){ if(c.aus){ ausente++; continue; } libres++; libreDias.push(d); continue; }
      const t = turno(c.t); if(!t) continue;
      horas += horasTurno(t); dias++;
      porTurno[c.t] = (porTurno[c.t]||0)+1;
      if(t.tipo === 'tarde') tardes++; else if(t.tipo === 'temprano') tempranos++; else intermedios++;
      if(d >= 5) findes++;
      if(c.p){ porPuesto[c.p] = (porPuesto[c.p]||0)+1; if(esTerminalB(c.p)) vB++; }
    }
    const hist = historialEmpleado(e.id, ctx.k, 8);
    const prefOk = e.prefLibre < 0 ? null : libreDias.includes(e.prefLibre);
    return { empId:e.id, nombre:e.nombre, horas:Math.round(horas*10)/10, dias, tardes, tempranos, intermedios,
             findes, libres, libreDias, porPuesto, porTurno, visitasB:vB, prefOk, objetivo, hist, ausente };
  });

  const rango = (arr) => arr.length ? Math.max(...arr) - Math.min(...arr) : 0;
  const conTrabajo = filas.filter(f => f.dias > 0);
  const difHoras = conTrabajo.length ? rango(conTrabajo.map(f => f.horas)) : 0;
  const difB = rango(filas.map(f => f.visitasB));
  const difTardes = rango(filas.map(f => f.tardes));
  const difFindes = rango(filas.map(f => f.findes));

  // cumplimiento de los dias que toca esta semana
  let sumaDif = 0;
  filas.forEach(f => sumaDif += Math.abs(f.dias - f.objetivo));
  const cumplimiento = filas.length ? Math.max(0, Math.round(100 - (sumaDif / filas.length) * 25)) : 100;

  const eqB = Math.max(0, 100 - difB * 30);
  const eqT = Math.max(0, 100 - difTardes * 20);
  const eqF = Math.max(0, 100 - difFindes * 25);
  const equilibrio = Math.round(cumplimiento*0.34 + eqB*0.26 + eqT*0.22 + eqF*0.18);

  let prefTotal = 0, prefOk = 0;
  filas.forEach(f => { if(f.prefOk !== null){ prefTotal++; if(f.prefOk) prefOk++; } });

  let faltan = 0, sinPuesto = 0;
  for(let d = 0; d < 7; d++) for(const cmb of combinaciones()){
    const nec = cobNec(cmb.puestoId, cmb.turnoId, d, ctx.k);
    const n = ocupacion(ctx, d, cmb.turnoId, cmb.puestoId);
    if(n < nec) faltan += nec - n;
  }
  for(const e of activos()) for(let d = 0; d < 7; d++){
    const c = ctx.celdas[ck(e.id,d)];
    if(c && c.t !== LIBRE && !c.p) sinPuesto++;
  }

  return { filas, objetivo: diasObjetivo(ctx.k), difHoras, difB, difTardes, difFindes, cumplimiento,
           equilibrio, prefTotal, prefOk, faltan, sinPuesto };
}

/* =====================================================================
   PUNTUACION DE UN CANDIDATO
   ===================================================================== */
/* Cuantos turnos de cada tipo le tocarian a cada empleado en una semana
   perfectamente repartida. Se guarda en memoria porque se consulta mucho. */
let _objTipo = { k:null, val:null };
function objetivoPorTipo(k){
  if(_objTipo.k === k && _objTipo.val) return _objTipo.val;
  const total = { temprano:0, intermedio:0, tarde:0 };
  for(let d = 0; d < 7; d++)
    for(const cmb of combinaciones()){
      const t = turno(cmb.turnoId);
      if(!t || !t.activo) continue;
      total[t.tipo] = (total[t.tipo] || 0) + cobNec(cmb.puestoId, cmb.turnoId, d, k);
    }
  const n = Math.max(1, activos().length);
  const val = { temprano: total.temprano / n, intermedio: total.intermedio / n, tarde: total.tarde / n };
  _objTipo = { k, val };
  return val;
}
function olvidarObjetivoTipo(){ _objTipo = { k:null, val:null }; }

function puntuarCandidato(ctx, emp, d, t, puestoId, pesos){
  const P = pesos || { equilibrio:1, preferencias:1 };
  const hist = emp._hist || (emp._hist = historialEmpleado(emp.id, ctx.k, 8));
  const cfg = S.config;
  let pts = 0;

  // 1. Llegar a los dias que toca esta semana
  const objetivo = diasObjetivoDe(emp.id, ctx.k);
  const dias = diasTrabCtx(ctx, emp.id);
  pts += Math.max(0, objetivo - dias) * 30 * P.equilibrio;

  // 2. Reparto justo de la Terminal B
  const metaB = objetivoBDe(emp.id);
  if(esTerminalB(puestoId)){
    const vB = visitasBCtx(ctx, emp.id);
    pts -= vB * 55 * P.equilibrio;                       // quien menos ha ido esta semana, primero
    /* y de las semanas pasadas: sin esto la cuenta se iba desviando y al
       cabo de dos meses unos llevaban cinco visitas mas que otros */
    pts -= (hist.visitasB / Math.max(1, hist.semanas)) * 42 * P.equilibrio;
    /* pasarse de la cuota pesa mucho mas que cualquier otra preferencia:
       con 14 turnos de B y 7 personas la cuenta sale exacta a 2 cada una,
       y sin este freno el reparto se iba a 1 y 3. */
    if(vB >= metaB) pts -= (140 + (vB - metaB) * 90) * P.equilibrio;
  } else {
    const vB = visitasBCtx(ctx, emp.id);
    const faltanB = metaB - vB;
    const diasLibresRest = objetivo - dias;
    if(faltanB >= diasLibresRest && diasLibresRest > 0) pts -= 35 * P.equilibrio;  // le urge ir a B
  }

  /* 2b. El descanso alrededor de los dias libres.
     El dia antes de librar se entra lo mas temprano posible, para salir
     pronto y empezar antes el descanso; el dia que se vuelve se entra lo
     mas tarde posible, para estirarlo por el otro lado. Con el 7-3 y el
     3-11 son 8 horas de trabajo pero mas de tres dias enteros de descanso. */
  /* Ojo con el lunes y el domingo: el dia de antes del lunes no es el
     domingo de esta semana, es el de la anterior. Por eso se mira por
     fecha y no por la posicion en la tabla. Justo ese es el caso de quien
     libra fijo los domingos: su lunes es siempre un dia de regreso. */
  const fecha = fechaDe(ctx.k, d);
  const esLibre = (a) => !!(a && a.t === LIBRE);
  const manana = asigEnFecha(ctx, emp.id, addDias(fecha, 1));
  const ayer   = asigEnFecha(ctx, emp.id, addDias(fecha, -1));
  const entra = min2(t.inicio);
  const sale  = min2(finRealDe(t));
  /* pesa el doble en la semana de los dos dias seguidos: ahi es donde de
     verdad se nota estirar el descanso por los dos lados */
  const suyos = libresSemana(emp.id, ctx.k) >= 2 ? 2 : 1;
  /* Por escalones y no por minutos: entre salir a las 3 y salir a las 4 no
     hay diferencia practica, y si se puntuaba al minuto ese desempate de
     una hora le quitaba turnos de la Terminal B a quien libra siempre el
     mismo dia. Lo que importa es salir pronto o tarde, no el minuto. */
  const escalon = (v, bueno, medio) => v <= bueno ? 1 : (v <= medio ? 0.5 : 0);
  if(esLibre(manana)) pts += escalon(sale, 16*60, 18*60)          * 240 * suyos * P.equilibrio;  // manana libra: salir pronto
  if(esLibre(ayer))   pts += escalon(-entra, -15*60, -12*60)      * 240 * suyos * P.equilibrio;  // ayer libro: entrar tarde

  /* Y el turno concreto, que es lo que se pidio: el 7-3 la vispera y el
     3-11 el dia de vuelta. Pesa mucho mas que lo de arriba, que se queda
     como desempate para los dias en que ese turno ya lo cogio otro.

     Quien esta en entrenamiento se queda fuera: solo hace los turnos de
     relleno de Dollar Thrifty, asi que ni el 7-3 ni el 3-11 son suyos y
     empujarlo hacia ellos solo estropearia el reparto de los demas. */
  if(!entrenando(emp)){
    const ext = extremosDelDia(d, ctx.k);
    const vispera = esLibre(manana), vuelta = esLibre(ayer);
    /* Entre dos dias libres la regla se contradice sola: no se puede entrar
       a las 7 por irse manana y a las 3 por haber vuelto hoy. Ese dia se
       deja pasar y vale cualquiera de los dos. */
    if(vispera !== vuelta){
      const quiere = vispera ? ext.pronto : ext.tarde;   // el que le toca
      const evita  = vispera ? ext.tarde  : ext.pronto;  // justo el contrario
      if(quiere !== null && entra === quiere) pts += 2000 * suyos * P.equilibrio;
      /* Y el castigo, que es la mitad que faltaba: los turnos de tarde se
         reparten ANTES que los de manana, asi que sin esto la persona ya
         estaba cogida en el 3-11 cuando le llegaba el turno al 7-3. */
      else if(evita !== null && entra === evita) pts -= 2000 * suyos * P.equilibrio;
    }
  }

  // 3. Rotacion de turnos: que no le toque siempre el mismo
  const mismoTurno = (ctx.celdas && Object.keys(ctx.celdas).reduce((n,key) => {
    if(!key.startsWith(emp.id + '_')) return n;
    return ctx.celdas[key].t === t.id ? n+1 : n;
  }, 0)) || 0;
  pts -= mismoTurno * 14 * P.equilibrio;
  pts -= (hist.porTurno[t.id] || 0) * 2.5 * P.equilibrio;

  // 4. Reparto de turnos tempranos, intermedios y tardios.
  //    Cada uno deberia llevar mas o menos la misma cantidad de cada tipo.
  const cuenta = (tipo) => { let n = 0; for(let x = 0; x < 7; x++){ const c = ctx.celdas[ck(emp.id,x)]; if(c && c.t !== LIBRE){ const tt = turno(c.t); if(tt && tt.tipo === tipo) n++; } } return n; };
  const metaTipo = objetivoPorTipo(ctx.k)[t.tipo] || 0;
  const yaTiene = cuenta(t.tipo);
  pts -= Math.max(0, (yaTiene + 1) - metaTipo) * 85 * P.equilibrio;
  if(t.tipo === 'tarde')    pts -= hist.tardes * 3 * P.equilibrio;
  if(t.tipo === 'temprano') pts -= hist.tempranos * 1.5 * P.equilibrio;

  // 5. Fines de semana
  if(d >= 5){
    let f = 0;
    for(let x = 5; x < 7; x++){ const c = ctx.celdas[ck(emp.id,x)]; if(c && c.t !== LIBRE) f++; }
    pts -= (f * 16 + hist.findes * 2.5) * P.equilibrio;
  }

  // 6. Preferencias
  if((emp.turnosPreferidos||[]).includes(t.id)) pts += 28 * P.preferencias;
  if(emp.prefLibre === d) pts -= 38 * P.preferencias;
  if(hist.libresPorDia[d] > 0) pts += 3;

  // 7. Dias seguidos
  const guardado = ctx.celdas[ck(emp.id,d)];
  ctx.celdas[ck(emp.id,d)] = { t:t.id, p:puestoId, o:'tmp' };
  const racha = rachaSi(ctx, emp.id, fechaDe(ctx.k, d));
  if(guardado) ctx.celdas[ck(emp.id,d)] = guardado; else delete ctx.celdas[ck(emp.id,d)];
  pts -= Math.max(0, racha - 4) * 14;

  return pts;
}
/* =====================================================================
   BLOQUE 3 - COMPLETADO AUTOMATICO
   Tu pones a mano lo que quieras: queda bloqueado y nadie lo toca.
   El resto de la semana se llena solo, repartiendo parejo.
   ===================================================================== */

/* =====================================================================
   REGLAS DURAS DE UNA CASILLA
   Lo que ni siquiera un turno puesto a mano puede saltarse. Si cambias
   una ficha o un turno despues de haber armado el horario, manda la
   regla nueva y la casilla se cae sola.

   Aqui esta la razon de que aparecieran conflictos que no se iban solos:
   antes solo se miraba el dia libre fijo y la disponibilidad, asi que un
   turno que quedaba fuera de uso, o un puesto que la persona ya no puede
   hacer, se quedaban pegados en la semana dando error para siempre.
   ===================================================================== */
function chocaConReglaDura(empId, d, c, k){
  if(!c || c.t === LIBRE) return false;
  const e = empleado(empId);
  if(!e) return false;
  if(fijoVigente(e, k) === d) return true;
  if(e.diasDisponibles && e.diasDisponibles[d] === false) return true;
  if(ausenteEnDia(empId, d, SEMANA)) return true;                   // esta de vacaciones o de licencia
  const t = turno(c.t);
  if(!t || !t.activo) return true;                                  // el turno ya no esta en uso
  if((t.equipos || []).indexOf(equipoDe(e)) < 0) return true;        // no es un turno de su equipo
  if(vetoTurnos(e, d, k).indexOf(c.t) >= 0) return true;
  if(c.p && !puesto(c.p)) return true;                              // la marca ya no existe
  if(c.p && vetoPuestos(e, d, k).indexOf(c.p) >= 0) return true;
  return false;
}
function partirClave(key){
  const i = key.lastIndexOf('_');
  return i < 0 ? null : { empId: key.slice(0, i), d: Number(key.slice(i+1)) };
}

/* Solo lo que puso el supervisor */
function baseManual(k){
  const w = semana(k), out = {};
  for(const key in w.celdas){
    const c = w.celdas[key];
    if(!(c.o === 'manual' || c.b)) continue;
    const p = partirClave(key);
    if(p && chocaConReglaDura(p.empId, p.d, c, k)) continue;   // la regla manda
    out[key] = JSON.parse(JSON.stringify(c));
  }
  return out;
}
/* Lo manual mas las sugerencias que siguen siendo validas */
function baseVigente(k){
  const w = semana(k);
  const ctx = ctxCopia(k, w.celdas);
  for(const e of activos()){
    for(let d = 0; d < 7; d++){
      const key = ck(e.id, d);
      const c = ctx.celdas[key];
      if(c && chocaConReglaDura(e.id, d, c, k)){ delete ctx.celdas[key]; continue; }
      if(!c || c.o === 'manual' || c.b) continue;
      if(c.t === LIBRE){ delete ctx.celdas[key]; continue; }     // los libres se recalculan
      const r = validar(ctx, e.id, d, c.t, c.p, { reemplazar:true });
      if(!r.ok) delete ctx.celdas[key];
    }
  }
  return ctx.celdas;
}

/* Puestos que van a quedar vacios si o si: cuando la cobertura pide mas
   turnos de los que la plantilla puede dar, por mucho que se rebusque
   sobraran puestos. Sirve para no dejar la aplicacion pensando en balde. */
function puestosImposibles(k){
  /* Por cabezas la cuenta cierra sola: se abren tantos puestos como gente
     trabaje. Lo que si puede dejar huecos es que quien trabaja ese dia no
     pueda hacer los puestos que quedan abiertos, y eso se estima con los
     principales, que son los que de verdad importan. */
  return manosPrevistas(k);
}

/* =====================================================================
   EL TURNO DE ANTES Y EL DE DESPUES DEL DESCANSO
   El dia antes de librar se entra en el PRIMER turno del dia -el 7-3-, y
   el dia que se vuelve, en el ULTIMO -el 3-11-. Asi el descanso se estira
   por los dos lados: se sale a las 3 de la tarde, se libra, y se vuelve a
   las 3 de la tarde del otro dia. Con dos dias libres son mas de tres
   dias enteros fuera.

   No se escriben "7-3" y "3-11" a mano: se miran los turnos que ese dia
   abre la lista de prioridad y se cogen el que entra mas temprano y el
   que entra mas tarde. Si mañana cambias la lista, la regla sigue
   valiendo sin tocar nada.
   ===================================================================== */
function extremosDelDia(d, k){
  let pronto = null, tarde = null;
  prioridadDia(d, k || SEMANA).forEach(x => {
    const tt = turno(x.turnoId);
    if(!tt) return;
    const m = min2(tt.inicio);
    if(pronto === null || m < pronto) pronto = m;
    if(tarde  === null || m > tarde)  tarde  = m;
  });
  return { pronto, tarde };
}

/* Cuantos podrian, en principio, cubrir ese puesto ese dia */
function elegiblesEstaticos(d, t, puestoId){
  let n = 0;
  for(const e of activos()){
    if(!e.diasDisponibles[d]) continue;
    if(vetoTurnos(e, d).includes(t.id)) continue;
    if(vetoPuestos(e, d).includes(puestoId)) continue;
    n++;
  }
  return n;
}

/* Construye una propuesta partiendo de una base */
/* =====================================================================
   REPARTO DE DIAS LIBRES
   Los dias libres van siempre seguidos y cada empleado recibe una pareja
   distinta, rotando cada semana para que no le toque siempre lo mismo.
   Con 7 empleados salen las 7 parejas posibles: lunes-martes, martes-miercoles,
   ... , sabado-domingo y domingo-lunes.
   ===================================================================== */
function patronLibres(k, base, azar){
  azar = azar || 0;
  const emps = activos();
  const offset = semanasDesdeRef(k);
  const out = {};
  if(!emps.length) return out;
  /* Cada persona tiene los suyos: con el reparto por mitades, esta semana
     unos llevan 2 dias libres y otros 1. */
  const cuantos = {};
  emps.forEach(e => { cuantos[e.id] = libresSemana(e.id, k); });
  if(emps.every(e => cuantos[e.id] === 0)){ emps.forEach(e => out[e.id] = []); return out; }

  // Que tiene ya puesto a mano cada empleado
  const info = emps.map((e, i) => {
    const ocupados = [], libres = [];
    for(let d = 0; d < 7; d++){
      const c = base[ck(e.id,d)];
      if(!c || !(c.o === 'manual' || c.b)) continue;
      /* Un dia de ausencia no es un dia libre suyo: cuenta como dia
         ocupado, para que el reparto no le ponga ahi el descanso. */
      if(c.t === LIBRE && !c.aus) libres.push(d); else ocupados.push(d);
    }
    let noDisp = 0;
    for(let d = 0; d < 7; d++) if(!e.diasDisponibles[d]) noDisp++;
    /* Quien lleva los dos dias seguidos elige antes que quien lleva uno
       suelto: el de uno se mueve a cualquier dia sin romper nada, y el de
       dos, si le pisan uno de los suyos, se le parte el bloque. */
    const bloque = (libresSemana(e.id, k) >= 2) ? 2 : 0;
    return { e, i, ocupados, libres, r: Math.random(),
             atado: libres.length * 3 + noDisp * 3 + ocupados.length + bloque + (e.libreFijo >= 0 ? 4 : 0) };
  });
  // Los que tienen menos margen (dias no disponibles o cosas que fijaste) eligen primero
  info.sort((a,b) => (b.atado - a.atado) || (azar ? (a.r - b.r) : (a.i - b.i)));

  /* Cuanta gente puede librar cada dia: los que hay menos los puestos de ese
     dia. Cambia de un dia a otro porque el refuerzo ya no entra todos los dias. */
  /* El cupo es lo que el dia AGUANTA, no lo que el plan habia previsto.
     Con el plan como tope, un dia que nadie habia pedido quedaba cerrado
     aunque cupieran dos, y el bloque de dos dias seguidos de alguien se
     partia por no tener donde caer. Lo que se reparta aqui es luego lo que
     cuenta para abrir puestos, asi que las dos cifras no se separan. */
  const cupoDia = [];
  for(let d = 0; d < 7; d++) cupoDia.push(cupoLibresMax(d, k));
  /* Si hay mas dias libres que repartir que sitios donde ponerlos (pasa
     cuando falta gente para cubrir todos los puestos), el excedente se
     reparte a mano por los dias que menos cargados van, sin pasar nunca
     del tope de Ajustes. Sin esto, el reparto de emergencia amontonaba
     tres personas librando el mismo dia. */
  const topeDia = S.config.maxLibresDia >= 1 ? S.config.maxLibresDia : 2;
  let porRepartir = 0; emps.forEach(e => { porRepartir += cuantos[e.id]; });
  let sitios = cupoDia.reduce((a,b) => a + b, 0);
  let vueltas = 0;
  while(sitios < porRepartir && vueltas++ < 40){
    let mejorD = -1;
    for(let d = 0; d < 7; d++) if(cupoDia[d] < topeDia && (mejorD < 0 || cupoDia[d] < cupoDia[mejorD])) mejorD = d;
    if(mejorD < 0) break;                       // todos al tope: no cabe mas
    cupoDia[mejorD]++; sitios++;
  }

  /* Para cada empleado, las parejas posibles ordenadas de mejor a peor.
     Las que rompen una regla dura se descartan directamente. */
  const opciones = info.map(x => {
    const e = x.e;
    const ideal = diaLibreIdeal(e.id, k);
    const ultimoPrevio = ultimoLibreSemanaAnterior(e.id, k);
    const primeroSiguiente = primerLibreSemanaSiguiente(e.id, k);
    const tope = e.maxDiasConsec || 7;
    /* Los dias en que el empleado no esta disponible tienen que caer dentro de
       su bloque de libres. Si no, ese dia se queda una persona de menos. */
    const noDisp = [];
    for(let d = 0; d < 7; d++) if(!e.diasDisponibles[d]) noDisp.push(d);
    const nLibres = cuantos[e.id];                 // los suyos, no los de todos
    const cabenTodos = noDisp.length > 0 && noDisp.length <= nLibres;

    if(!nLibres){
      const nada = { c:0, dias:[], pts:0, sueltos:false, id:'sinlibres-' + e.id };
      return { x, lista:[nada], ampliada:[nada] };
    }

    /* Comprueba y puntua un conjunto de dias libres cualquiera */
    const evaluar = (dias, c, mirarRacha, sueltos) => {
      const primero = Math.min.apply(null, dias);
      if(dias.some(d => x.ocupados.includes(d))) return null;                     // hay un turno tuyo ahi
      if(x.libres.length && !x.libres.every(d => dias.includes(d))) return null;  // no incluye tus libres
      const racha = ultimoPrevio === null ? 0 : (6 - ultimoPrevio) + primero;
      if(mirarRacha && racha > tope) return null;                                 // pasaria de los dias seguidos
      /* Lo mismo por el otro lado: si la semana siguiente ya esta hecha, la
         racha no se corta el domingo y hay que contarla hasta el primer
         dia libre de esa semana. */
      if(mirarRacha && primeroSiguiente !== null){
        const ultimo = Math.max.apply(null, dias);
        if((6 - ultimo) + primeroSiguiente > tope) return null;
      }
      /* El dia libre fijo no se negocia: si no cae dentro, esa opcion no vale */
      const fj = fijoVigente(e, k);
      if(fj >= 0 && !dias.includes(fj)) return null;
      const fuera = noDisp.filter(d => !dias.includes(d)).length;
      if(cabenTodos && fuera) return null;                                        // sus dias no disponibles van dentro
      let pts = fuera * 3000 + Math.max(0, racha - tope) * 400;
      /* La racha con la semana SIGUIENTE tambien cuenta al puntuar, no solo
         al descartar. Sin esto, cuando no quedaba mas remedio que pasarse,
         la opcion elegida arreglaba un lado y disparaba el otro: asi salian
         rachas de doce dias entre dos semanas ya hechas. */
      if(primeroSiguiente !== null){
        const ultimo = Math.max.apply(null, dias);
        pts += Math.max(0, ((6 - ultimo) + primeroSiguiente) - tope) * 400;
      }
      /* =================================================================
         EN LOS DIAS JUSTOS, QUE LIBRE QUIEN NO PUEDE CUBRIR LO PRINCIPAL
         Si un dia solo dan las manos para los puestos principales y esta
         persona no puede hacer ninguno de ellos (por ejemplo alguien en
         entrenamiento que solo va a una marca), trabajando ocuparia un
         puesto de relleno que ese dia ni se abre, y dejaria un turno
         clave sin nadie. Mejor que ese dia libre ella.
         ================================================================= */
      dias.forEach(dd => {
        const vpD = vetoPuestos(e, dd, k), vtD = vetoTurnos(e, dd, k);
        const puedeClave = prioridadDia(dd, k).some(x => x.clave &&
          vpD.indexOf(x.puestoId) < 0 &&
          vtD.indexOf(x.turnoId)  < 0);
        /* =================================================================
           EL DIA EN QUE LOS APTOS VAN JUSTOS
           Si ese dia hay tantas personas capaces de hacer los puestos
           principales como puestos principales hay, que libre una de ellas
           deja un mostrador sin nadie. Que libre quien NO puede hacerlos no
           cuesta nada, porque su sitio era de relleno y ese dia el relleno
           ni se abre.
           Lo destapo una semana con dos personas de vacaciones: WILSON
           libraba el martes, quedaban tres aptos para cuatro puestos, y el
           reparto perdia un principal pudiendo no perderlo.
           ================================================================= */
        if(capacesNucleo(dd, k) <= nucleoDia(dd, k)){
          if(puedeClave) pts += 6000;      // que libre otro dia, o que libre otro
          else           pts -= 4000;      // este es justo el mejor dia para el
          return;
        }
        if(puestosDia(dd, k) > nucleoDia(dd, k)) return;      // ese dia hay holgura
        if(!puedeClave) pts -= 4000;
      });

      /* Pegarse al dia que toca por rotacion pesa mucho: es lo que hace que
         dos semanas cualesquiera encajen entre si aunque se hayan armado en
         distinto orden. Si cada quien se queda en su dia, la racha entre
         semanas sale de 7 clavados sin tener que negociar nada. */
      let dist = Math.abs(c - ideal); dist = Math.min(dist, 7 - dist);
      pts += dist * 900;
      if(e.prefLibre >= 0 && dias.includes(e.prefLibre)) pts -= 22;
      pts += Math.random() * azar;
      /* Separarlos es el ultimo recurso: penaliza fuerte y ademas prefiere
         el hueco mas pequeno posible entre los dos dias. */
      if(sueltos) pts += 100000 + separacion(dias) * 500;
      return { c, dias, pts, sueltos: !!sueltos, id: (sueltos ? 'x' : 'b') + dias.join('-') };
    };

    const armar = (mirarRacha) => {
      const lista = [];
      for(let c = 0; c < 7; c++){
        const op = evaluar(bloqueDias(c, nLibres), c, mirarRacha, false);
        if(op) lista.push(op);
      }
      return lista.sort((a,b) => a.pts - b.pts);
    };
    /* Los mismos dias libres pero SIN exigir que vayan pegados. Solo se usan
       si con los bloques seguidos no sale un horario completo. */
    const armarSueltos = (mirarRacha) => {
      const lista = [];
      for(const dias of combosDias(nLibres)){
        if(diasSeguidos(dias)) continue;                       // eso ya esta en la lista normal
        const op = evaluar(dias, Math.min.apply(null, dias), mirarRacha, true);
        if(op) lista.push(op);
      }
      return lista.sort((a,b) => a.pts - b.pts);
    };
    /* Si respetar la racha de dias seguidos deja al empleado sin ninguna
       pareja posible, se afloja esa regla antes que dejar un puesto vacio. */
    let lista = armar(true);
    if(!lista.length) lista = armar(false);
    let sueltos = armarSueltos(true);
    if(!sueltos.length) sueltos = armarSueltos(false);
    return { x, lista, ampliada: lista.concat(sueltos) };
  });
  // Primero los que tienen menos salidas posibles: asi se poda antes
  opciones.sort((a,b) => (b.x.atado - a.x.atado) || (a.lista.length - b.lista.length));

  const cuentaDia = [0,0,0,0,0,0,0];
  const usados = new Set();
  const elegidas = [];
  let pasos = 0;

  /* Quien tiene permiso para llevar los dias libres separados esta semana.
     -1 = nadie;  un indice = solo esa persona;  -2 = cualquiera (ultimo recurso). */
  let quienSuelto = -1;

  function buscar(idx, permitirRepetir, conSueltos){
    if(idx >= opciones.length) return true;
    /* Con los dias sueltos hay el triple de combinaciones, asi que se le pone
       un tope mas corto para que la aplicacion no se quede pensando. */
    if(pasos++ > (conSueltos ? 1200 : 3000)) return false;
    const o = opciones[idx];
    const permitido = conSueltos && (quienSuelto === -2 || quienSuelto === idx);
    const lista = permitido ? o.ampliada : o.lista;
    for(const op of lista){
      if(!permitirRepetir && usados.has(op.id)) continue;
      if(op.dias.some(d => cuentaDia[d] >= cupoDia[d])) continue;   // ese dia ya tiene sus libres
      op.dias.forEach(d => cuentaDia[d]++);
      usados.add(op.id); elegidas[idx] = op;
      if(buscar(idx + 1, permitirRepetir, conSueltos)) return true;
      op.dias.forEach(d => cuentaDia[d]--);
      usados.delete(op.id); elegidas[idx] = null;
    }
    return false;
  }
  const reiniciar = () => { pasos = 0; cuentaDia.fill(0); usados.clear(); elegidas.length = 0; };

  /* Se intenta en este orden. Solo se baja un escalon si el anterior no da
     un reparto completo, para que separar los dias libres sea el ultimo paso
     antes de dejar casillas sin llenar. */
  /* Con un solo dia libre no hay nada que separar: esos dos escalones sobran. */
  const haySueltos = opciones.some(o => o.ampliada.length > o.lista.length);
  let ok = buscar(0, false, false);                                            // 1) pegados, pareja distinta cada uno
  if(!ok){ reiniciar(); ok = buscar(0, true, false); }                         // 2) pegados, repitiendo pareja

  /* 3) Si con todos pegados no sale, se separa los dias libres de UNA sola
        persona. Se prueba primero con quien menos veces le ha tocado, para
        que vaya rotando semana a semana y no caiga siempre en el mismo. */
  if(!ok && haySueltos){
    const turnoJusto = opciones
      .map((o, i) => ({ i, veces: vecesLibresSueltos(o.x.e.id, k, 12), r: Math.random() }))
      .filter(z => opciones[z.i].ampliada.length > opciones[z.i].lista.length)
      .sort((a,b) => (a.veces - b.veces) || (a.r - b.r));
    for(const z of turnoJusto){
      quienSuelto = z.i;
      reiniciar(); ok = buscar(0, false, true);
      if(!ok){ reiniciar(); ok = buscar(0, true, true); }
      if(ok) break;
    }
  }
  /* 4) Ultimo recurso: ni separandole los dias a uno solo sale. Se deja
        que se separen los que hagan falta antes que dejar casillas vacias. */
  if(!ok && haySueltos){ quienSuelto = -2; reiniciar(); ok = buscar(0, true, true); }
  quienSuelto = -1;

  if(ok){
    opciones.forEach((o, idx) => out[o.x.e.id] = elegidas[idx].dias);
  } else {
    /* Ni con todo relajado hay solucion limpia: se reparte lo mejor posible
       y la aplicacion avisara de lo que quede descuadrado. */
    cuentaDia.fill(0);
    opciones.forEach(o => {
      const nL = cuantos[o.x.e.id] || 0;
      const fijo = fijoVigente(o.x.e, k);
      const porDefecto = fijo >= 0 ? bloqueDias(fijo, nL) : bloqueDias(0, nL);
      const lista = o.ampliada.length ? o.ampliada : [{ c:0, dias:porDefecto, pts:0 }];
      let mejor = lista[0];
      for(const op of lista){
        const exceso = op.dias.filter(d => cuentaDia[d] >= cupoDia[d]).length;
        const mejorExceso = mejor.dias.filter(d => cuentaDia[d] >= cupoDia[d]).length;
        if(exceso < mejorExceso) mejor = op;
      }
      mejor.dias.forEach(d => cuentaDia[d]++);
      out[o.x.e.id] = mejor.dias;
    });
  }

  /* =================================================================
     REPASO FINAL DE LAS RACHAS
     Las semanas de al lado pueden estar ya hechas y ser incompatibles
     entre si: entonces la de en medio no puede contentar a las dos y a
     alguien le sale una racha mas larga de su maximo. Aqui se le cambia
     el dia libre con un companero al que le venga bien.
     Solo se intercambian bloques del mismo tamano, asi ningun dia cambia
     el numero de gente que libra y el reparto sigue cuadrando.
     ================================================================= */
  const infoDe = {};
  opciones.forEach(o => infoDe[o.x.e.id] = o.x);

  const puedeLibrar = (empId, dias) => {
    const x = infoDe[empId];
    if(!x) return false;
    const e = x.e;
    if(dias.some(d => x.ocupados.includes(d))) return false;              // tiene un turno tuyo ahi
    if(x.libres.length && !x.libres.every(d => dias.includes(d))) return false;
    const fj = fijoVigente(e, k);
    if(fj >= 0 && !dias.includes(fj)) return false;
    const noDisp = [];
    for(let d = 0; d < 7; d++) if(!e.diasDisponibles[d]) noDisp.push(d);
    if(noDisp.length && noDisp.length <= dias.length && noDisp.some(d => !dias.includes(d))) return false;
    return true;
  };
  /* La racha mas larga que le queda a esa persona con esos dias libres,
     contando lo que ya hay en las semanas de al lado */
  const rachaCon = (empId, dias) => {
    if(!dias || !dias.length) return 0;
    const prev = ultimoLibreSemanaAnterior(empId, k);
    const sig  = primerLibreSemanaSiguiente(empId, k);
    const primero = Math.min.apply(null, dias), ultimo = Math.max.apply(null, dias);
    let peor = 0;
    if(prev !== null) peor = Math.max(peor, (6 - prev) + primero);
    if(sig  !== null) peor = Math.max(peor, (6 - ultimo) + sig);
    return peor;
  };
  const exceso = (empId, dias) =>
    Math.max(0, rachaCon(empId, dias) - ((empleado(empId) || {}).maxDiasConsec || 7));

  const ids = Object.keys(out);
  for(let vuelta = 0; vuelta < 4; vuelta++){
    let hubo = false;
    for(const a of ids){
      if(!out[a] || !out[a].length) continue;
      if(!exceso(a, out[a])) continue;
      let mejorB = null, mejorGanancia = 0;
      for(const b of ids){
        if(a === b || !out[b] || out[a].length !== out[b].length) continue;
        if(!puedeLibrar(a, out[b]) || !puedeLibrar(b, out[a])) continue;
        const antes   = exceso(a, out[a]) + exceso(b, out[b]);
        const despues = exceso(a, out[b]) + exceso(b, out[a]);
        if(antes - despues > mejorGanancia){ mejorGanancia = antes - despues; mejorB = b; }
      }
      if(mejorB){
        const t = out[a]; out[a] = out[mejorB]; out[mejorB] = t;
        hubo = true;
      }
    }
    if(!hubo) break;
  }
  return out;
}

/* Cuantas veces, en las ultimas semanas, le han tocado a este empleado los
   dias libres separados. Se usa para ir rotando a quien le toca. */
function vecesLibresSueltos(empId, k, cuantas){
  let n = 0;
  for(let i = 1; i <= (cuantas || 12); i++){
    const w = S.semanas[addDias(k, -7 * i)];
    if(!w || !w.celdas) continue;
    const libres = [];
    for(let d = 0; d < 7; d++){ if(esLibreReal(w.celdas[ck(empId, d)])) libres.push(d); }
    if(libres.length > 1 && !diasSeguidos(libres)) n++;
  }
  return n;
}

/* Primer dia libre del empleado en la semana siguiente, si ya esta hecha.
   Devuelve null cuando esa semana todavia no existe o esta vacia. */
function primerLibreSemanaSiguiente(empId, k){
  const w = S.semanas[addDias(k, 7)];
  if(!w || !w.celdas) return null;
  let hayAlgo = false;
  for(let d = 0; d < 7; d++){
    const c = w.celdas[ck(empId, d)];
    if(!c) continue;
    hayAlgo = true;
    if(c.t === LIBRE) return d;
  }
  return hayAlgo ? 7 : null;   // trabaja la semana entera sin librar
}

/* Ultimo dia libre que tuvo el empleado en la semana anterior */
function ultimoLibreSemanaAnterior(empId, k){
  const w = S.semanas[addDias(k, -7)];
  if(!w || !w.celdas) return null;
  let ultimo = null;
  for(let d = 0; d < 7; d++){
    const c = w.celdas[ck(empId, d)];
    if(c && c.t === LIBRE) ultimo = d;
  }
  return ultimo;
}

/* =====================================================================
   LLENADO DE UN DIA
   Cada dia es un encaje exacto: hay tantas personas disponibles como
   puestos. Se prueba combinacion por combinacion (con retroceso) para
   no quedarse atascado por una mala eleccion inicial.
   ===================================================================== */
function llenarDia(ctx, d, slots, azar){
  const usados = new Set();
  let pasos = 0;

  /* Si ese dia hay menos gente libre que puestos, van a quedar puestos
     vacios hagamos lo que hagamos: se le da menos cuerda a la busqueda
     para que la pantalla no se quede pensando varios segundos. */
  let sitio = 0;
  for(const e of activos()){
    const c = ctx.celdas[ck(e.id, d)];
    if(!c || (c.t === LIBRE && c.o !== 'manual' && !c.b && !c.fijo)) sitio++;
  }
  const tope = slots.length > sitio ? 120 : 900;

  /* laxo = se aceptan los avisos (dias de mas, dias seguidos de mas, cupo).
     Nunca se aceptan las reglas estrictas como el descanso minimo. */
  const disponibles = (s, laxo) => {
    const out = [];
    for(const e of activos()){
      if(usados.has(e.id)) continue;
      const c = ctx.celdas[ck(e.id, d)];
      if(c && (c.t !== LIBRE || c.o === 'manual' || c.b || c.fijo)) continue;
      const r = validar(ctx, e.id, d, s.turnoId, s.puestoId, { reemplazar:true });
      if(r.ok) out.push({ e, penal:0 });
      else if(laxo && r.aviso) out.push({ e, penal:120 });
      // los dias seguidos nunca se saltan: eso es lo que generaba conflictos
    }
    return out;
  };

  function intentar(idx, laxo){
    if(idx >= slots.length) return true;
    if(pasos++ > tope) return false;
    const s = slots[idx];
    const t = turno(s.turnoId);
    const cands = disponibles(s, laxo)
      .map(x => ({ e:x.e, p: puntuarCandidato(ctx, x.e, d, t, s.puestoId, { equilibrio:1, preferencias:1 }) - x.penal + (Math.random() - 0.5) * azar }))
      .sort((a,b) => b.p - a.p);
    for(const c of cands){
      const clave = ck(c.e.id, d);
      const prev = ctx.celdas[clave];
      usados.add(c.e.id);
      ctx.celdas[clave] = { t:s.turnoId, p:s.puestoId, o:'auto', b:false };
      if(intentar(idx + 1, laxo)) return true;
      if(prev) ctx.celdas[clave] = prev; else delete ctx.celdas[clave];
      usados.delete(c.e.id);
    }
    return false;
  }

  if(intentar(0, false)) return [];
  // Segundo intento: se permite dejar avisos con tal de no dejar el puesto vacio
  usados.clear(); pasos = 0;
  if(intentar(0, true)) return [];

  // Ultimo recurso: se coloca lo que se pueda y se avisa de lo que falta
  usados.clear();
  const faltan = [];
  slots.forEach(s => {
    const cands = disponibles(s, true)
      .map(x => ({ e:x.e, p: puntuarCandidato(ctx, x.e, d, turno(s.turnoId), s.puestoId, { equilibrio:1, preferencias:1 }) - x.penal }))
      .sort((a,b) => b.p - a.p);
    if(!cands.length){ faltan.push(s); return; }
    usados.add(cands[0].e.id);
    ctx.celdas[ck(cands[0].e.id, d)] = { t:s.turnoId, p:s.puestoId, o:'auto', b:false };
  });
  return faltan;
}

/* Coloca a la mejor persona en un puesto concreto */
function colocar(ctx, s, azar){
  if(ocupacion(ctx, s.d, s.turnoId, s.puestoId) >= cobNec(s.puestoId, s.turnoId, s.d, ctx.k)) return true;
  const cands = candidatosPara(ctx, s.d, s.turnoId, s.puestoId);
  if(!cands.length) return false;
  const t = turno(s.turnoId);
  const puntuados = cands.map(c => ({
    empId: c.empId,
    p: puntuarCandidato(ctx, empleado(c.empId), s.d, t, s.puestoId, { equilibrio:1, preferencias:1 }) + (Math.random() - 0.5) * azar
  })).sort((a,b) => b.p - a.p);
  ctx.celdas[ck(puntuados[0].empId, s.d)] = { t:s.turnoId, p:s.puestoId, o:'auto', b:false };
  return true;
}

/* Si un puesto se quedo vacio, se intenta un cambio entre dos personas del mismo dia */
function repararDia(ctx, s){
  const sueltos = activos().filter(e => {
    const c = ctx.celdas[ck(e.id, s.d)];
    return !c || (c.t === LIBRE && !c.fijo && c.o !== 'manual' && !c.b);
  });
  for(const x of sueltos){
    for(const y of activos()){
      if(y.id === x.id) continue;
      const cy = ctx.celdas[ck(y.id, s.d)];
      if(!cy || cy.t === LIBRE || cy.o === 'manual' || cy.b) continue;
      const guardadoX = ctx.celdas[ck(x.id, s.d)];
      delete ctx.celdas[ck(x.id, s.d)];
      delete ctx.celdas[ck(y.id, s.d)];
      const rx = validar(ctx, x.id, s.d, cy.t, cy.p, { reemplazar:true });
      const ry = validar(ctx, y.id, s.d, s.turnoId, s.puestoId, { reemplazar:true });
      if(rx.ok && ry.ok){
        ctx.celdas[ck(x.id, s.d)] = { t:cy.t, p:cy.p, o:'auto', b:false };
        ctx.celdas[ck(y.id, s.d)] = { t:s.turnoId, p:s.puestoId, o:'auto', b:false };
        return true;
      }
      ctx.celdas[ck(y.id, s.d)] = cy;
      if(guardadoX) ctx.celdas[ck(x.id, s.d)] = guardadoX; else delete ctx.celdas[ck(x.id, s.d)];
    }
  }
  return false;
}

function construir(k, base, azar){
  const ctx = ctxCopia(k, base);
  S.empleados.forEach(e => { delete e._hist; });
  olvidarObjetivoTipo();
  const sinCubrir = [];

  /* 0) Las ausencias van primero: son fechas, no una decision del reparto.
     Lo que haya en esos dias se sustituye por la ausencia. */
  for(const e of activos()){
    for(let d = 0; d < 7; d++){
      const a = celdaAusencia(e.id, d, k);
      if(a) ctx.celdas[ck(e.id, d)] = a;
      else if(esAusencia(ctx.celdas[ck(e.id, d)])) delete ctx.celdas[ck(e.id, d)];
    }
  }

  // 1) Primero los dias libres, seguidos y sin repetir pareja
  const libres = patronLibres(k, ctx.celdas, azar > 8 ? 55 : 0);
  /* El dia libre fijo se pone aunque el reparto no lo haya elegido: es una
     regla dura, no una preferencia. */
  for(const e of activos()){
    const fj = fijoVigente(e, k);
    if(fj < 0) continue;
    /* sin excepciones: aunque hubiera un turno puesto a mano, la regla manda.
       Lo unico que no se pisa es una ausencia: si ese dia esta de vacaciones
       o de licencia, no es un dia libre suyo, es un dia que no esta. */
    if(esAusencia(ctx.celdas[ck(e.id, fj)])) continue;
    ctx.celdas[ck(e.id, fj)] = { t:LIBRE, p:null, o:'auto', b:false, fijo:true };
  }
  for(const e of activos()){
    (libres[e.id] || []).forEach(d => {
      const c = ctx.celdas[ck(e.id,d)];
      if(c && (c.o === 'manual' || c.b)) return;
      if(esAusencia(c)) return;
      ctx.celdas[ck(e.id,d)] = { t:LIBRE, p:null, o:'auto', b:false, fijo:true };
    });
  }

  /* Ya estan todos los dias libres puestos: a partir de aqui, los puestos
     que se abren cada dia se cuentan sobre este borrador. */
  fijarLibranDe(ctx);

  // 2) Despues los turnos, dia por dia. Dentro de cada dia, primero los tardios:
  //    son los que condicionan el dia siguiente por el descanso minimo.
  for(let d = 0; d < 7; d++){
    const slots = [];
    for(const cmb of combinaciones()){
      const t = turno(cmb.turnoId);
      if(!t || !t.activo) continue;
      const nec = cobNec(cmb.puestoId, cmb.turnoId, d, k);
      const ya = ocupacion(ctx, d, cmb.turnoId, cmb.puestoId);
      for(let i = ya; i < nec; i++)
        slots.push({ d, turnoId:cmb.turnoId, puestoId:cmb.puestoId,
                     tarde: t.tipo === 'tarde' ? 1 : 0,
                     terminalB: esTerminalB(cmb.puestoId) ? 1 : 0,
                     dif: elegiblesEstaticos(d, t, cmb.puestoId), r: Math.random() });
    }
    slots.sort((a,b) => (b.tarde - a.tarde) || (b.terminalB - a.terminalB) || (a.dif - b.dif) || (a.r - b.r));

    const pendientes = llenarDia(ctx, d, slots, azar);
    for(let i = pendientes.length - 1; i >= 0; i--)
      if(colocar(ctx, pendientes[i], azar) || repararDia(ctx, pendientes[i])) pendientes.splice(i, 1);
    pendientes.forEach(s => sinCubrir.push(s));
  }

  /* 3) Ultimo intento moviendo piezas de otros dias. Si de entrada faltan
     manos, una parte va a quedar vacia igual: solo se rebusca por los que
     de verdad se podrian salvar. */
  const imposibles = puestosImposibles(k);
  if(sinCubrir.length > imposibles){
    for(let i = sinCubrir.length - 1; i >= 0; i--)
      if(reparar(ctx, k, sinCubrir[i])) sinCubrir.splice(i, 1);
  }

  /* 4) Nadie se queda con una casilla vacia teniendo que trabajar.
     Si a alguien le faltan dias y no cabe en ningun puesto previsto, se le
     coloca donde menos moleste: primero donde falte gente, si no como apoyo.
     Puede quedar un aviso, pero es mejor que un hueco sin explicar. */
  for(const e of activos()){
    const objetivoDias = diasObjetivoDe(e.id, k);
    for(let d = 0; d < 7; d++){
      if(ctx.celdas[ck(e.id, d)]) continue;
      if(!e.diasDisponibles[d]) continue;                 // ese dia no puede: se marca aparte
      if(fijoVigente(e, k) === d) continue;               // dia libre fijo: no se toca
      if(diasTrabCtx(ctx, e.id) >= objetivoDias) continue; // ya tiene sus dias
      let mejor = null;
      for(const cmb of combinaciones()){
        const t = turno(cmb.turnoId);
        if(!t || !t.activo) continue;
        const r = validar(ctx, e.id, d, cmb.turnoId, cmb.puestoId, { reemplazar:true });
        // las reglas de verdad duras no se tocan nunca
        if(!r.ok && ['diaNoDisp','turnoProhibido','puestoProhibido','inactivo','doble','descanso'].includes(r.motivo)) continue;
        const falta = Math.max(0, cobNec(cmb.puestoId, cmb.turnoId, d, k) - ocupacion(ctx, d, cmb.turnoId, cmb.puestoId));
        let pts = falta * 1000;                              // lo primero, tapar lo que falta
        if(r.ok) pts += 400; else if(r.aviso) pts += 150;    // mejor sin avisos
        pts += puntuarCandidato(ctx, e, d, t, cmb.puestoId, { equilibrio:1, preferencias:1 }) * 0.1;
        if(!mejor || pts > mejor.pts) mejor = { pts, cmb };
      }
      if(mejor) ctx.celdas[ck(e.id, d)] = { t:mejor.cmb.turnoId, p:mejor.cmb.puestoId, o:'auto', b:false };
    }
  }

  /* 5) Dia libre en lo que quede vacio, sin pasarse de los que le tocan y
     sin que ningun dia acabe con mas gente librando de la permitida. */
  const topeLibres = S.config.maxLibresDia >= 1 ? S.config.maxLibresDia : 2;
  const librandoEse = (d) => {
    let n = 0;
    for(const x of activos()){ if(esLibreReal(ctx.celdas[ck(x.id,d)])) n++; }
    return n;
  };
  const pendientes = [];
  for(const e of activos()){
    const maxLibres = libresSemana(e.id, k);
    let ya = 0;
    for(let d = 0; d < 7; d++){ if(esLibreReal(ctx.celdas[ck(e.id,d)])) ya++; }
    for(let d = 0; d < 7; d++){
      if(ctx.celdas[ck(e.id,d)]) continue;
      if(ya >= maxLibres) continue;
      if(librandoEse(d) >= topeLibres){ pendientes.push({ e, d }); continue; }   // ese dia ya esta al tope
      ctx.celdas[ck(e.id,d)] = { t:LIBRE, p:null, o:'auto', b:false };
      ya++;
    }
  }
  /* Lo que no cupo como dia libre se intenta colocar como apoyo. Solo si
     tampoco cabe ahi se deja el dia libre aunque pase del tope: es mejor
     eso que una casilla en blanco. */
  for(const x of pendientes){
    if(ctx.celdas[ck(x.e.id, x.d)]) continue;
    let mejor = null;
    for(const cmb of combinaciones()){
      const t = turno(cmb.turnoId);
      if(!t || !t.activo) continue;
      const r = validar(ctx, x.e.id, x.d, cmb.turnoId, cmb.puestoId, { reemplazar:true });
      if(!r.ok && ['libreFijo','diaNoDisp','turnoProhibido','puestoProhibido','inactivo','doble','descanso'].includes(r.motivo)) continue;
      let pts = (r.ok ? 400 : (r.aviso ? 150 : 0));
      pts += puntuarCandidato(ctx, x.e, x.d, t, cmb.puestoId, { equilibrio:1, preferencias:1 }) * 0.1;
      if(!mejor || pts > mejor.pts) mejor = { pts, cmb };
    }
    ctx.celdas[ck(x.e.id, x.d)] = mejor
      ? { t:mejor.cmb.turnoId, p:mejor.cmb.puestoId, o:'auto', b:false }
      : { t:LIBRE, p:null, o:'auto', b:false };
  }

  soltarLibran();
  return { celdas: ctx.celdas, sinCubrir };
}

/* Intenta cubrir un puesto que quedo vacio moviendo una sola pieza:
   busca a alguien libre ese dia que ya llego a sus dias, le pasa uno de sus
   turnos a un companero con dias de sobra, y lo coloca en el puesto vacio. */
function reparar(ctx, k, s){
  const libresEseDia = activos().filter(e => {
    const c = ctx.celdas[ck(e.id, s.d)];
    return !c || (c.t === LIBRE && c.o !== 'manual' && !c.b);
  });
  for(const x of libresEseDia){
    const guardado = ctx.celdas[ck(x.id, s.d)];
    delete ctx.celdas[ck(x.id, s.d)];
    const r = validar(ctx, x.id, s.d, s.turnoId, s.puestoId, { reemplazar:true });
    if(guardado) ctx.celdas[ck(x.id, s.d)] = guardado;
    // solo sirve si lo unico que sobra son sus dias o el cupo
    if(!r.ok && r.motivo !== 'dias' && r.motivo !== 'cupo') continue;

    for(let d2 = 0; d2 < 7; d2++){
      if(d2 === s.d) continue;
      const cel = ctx.celdas[ck(x.id, d2)];
      if(!cel || cel.t === LIBRE || cel.o === 'manual' || cel.b) continue;

      const copiaX = JSON.parse(JSON.stringify(ctx.celdas[ck(x.id, s.d)] || null));
      delete ctx.celdas[ck(x.id, d2)];
      ctx.celdas[ck(x.id, s.d)] = { t:s.turnoId, p:s.puestoId, o:'auto', b:false };

      const r2 = validar(ctx, x.id, s.d, s.turnoId, s.puestoId, { reemplazar:true });
      if(r2.ok || r2.aviso){
        const cands = candidatosPara(ctx, d2, cel.t, cel.p);
        if(cands.length){
          ctx.celdas[ck(cands[0].empId, d2)] = { t:cel.t, p:cel.p, o:'auto', b:false };
          return true;
        }
      }
      // deshacer
      ctx.celdas[ck(x.id, d2)] = cel;
      if(copiaX) ctx.celdas[ck(x.id, s.d)] = copiaX; else delete ctx.celdas[ck(x.id, s.d)];
    }
  }
  return false;
}

function evaluar(k, celdas){
  const ctx = { k, celdas };
  const eq = equidad(ctx);
  const rev = revisar(ctx);
  // Un conflicto pesa mucho mas que cualquier otra cosa: se prefiere
  // cualquier reparto valido antes que uno con reglas rotas.
  const objetivo = eq.equilibrio - rev.conflictos.length * 600 - eq.faltan * 45 - eq.sinPuesto * 20;
  return { eq, rev, objetivo };
}

/* Prueba varias veces y se queda con la mejor. Si se le pasa "evitar",
   intenta que la propuesta sea distinta a esa. */
function mejorPropuesta(k, base, intentos, evitar){
  let mejor = null;
  const total = intentos || 16;
  /* Sin esto, cuando faltan manos la aplicacion probaria las 50 alternativas
     una por una buscando un cero que no existe. */
  const imposibles = puestosImposibles(k);
  /* Y ademas un tope de tiempo: en semanas muy justas (media plantilla de
     vacaciones) el buscador puede tirarse veinte segundos persiguiendo una
     solucion perfecta que no existe. Mejor dar la mejor que haya en un par
     de segundos y avisar de lo que falta. */
  const t0 = Date.now();
  for(let i = 0; i < total; i++){
    if(i >= 4 && Date.now() - t0 > 2200) break;
    const prop = construir(k, base, 6 + (i % 10) * 2.6);
    const ev = evaluar(k, prop.celdas);
    const firma = firmaDe(prop.celdas);
    let obj = ev.objetivo;
    if(evitar && firma === evitar) obj -= 30;       // penaliza repetir lo mismo
    if(!mejor || obj > mejor.obj) mejor = { prop, ev, firma, obj };
    // en cuanto sale un reparto limpio y distinto al anterior, se usa
    if(i >= 3 && mejor.ev.rev.conflictos.length === 0 && mejor.ev.eq.faltan <= imposibles &&
       (!evitar || mejor.firma !== evitar)) break;
  }
  return mejor;
}
/* Los puestos principales que una propuesta deja sin nadie */
function principalesVaciosEn(k, celdas){
  const ctx = { k, celdas };
  let n = 0;
  for(let d = 0; d < 7; d++) prioridadDia(d, k).forEach(x => {
    if(x.clave && ocupacion(ctx, d, x.turnoId, x.puestoId) < 1) n++;
  });
  return n;
}
function firmaDe(celdas){
  return Object.keys(celdas).sort().map(x => x + ':' + celdas[x].t + ':' + (celdas[x].p||'')).join('|');
}

/* =====================================================================
   EL REPARTO DEL COUNTER SOLO MANDA SOBRE EL COUNTER
   Los tres horarios comparten el mismo saco de casillas, y el reparto
   automatico devuelve un saco entero. Si se guardaba tal cual, se llevaba
   por delante lo de supervisores y agentes de servicio: "Otra alternativa"
   les borraba el horario. Aqui se cose: lo que no es del counter se queda
   exactamente como estaba.
   ===================================================================== */
function celdasSoloCounter(k, propuestas){
  const w = semana(k), out = {};
  for(const key in w.celdas){
    const q = partirClave(key);
    if(q && equipoDe(q.empId) !== 'rotativo') out[key] = w.celdas[key];
  }
  for(const key in propuestas){
    const q = partirClave(key);
    if(q && equipoDe(q.empId) === 'rotativo') out[key] = propuestas[key];
  }
  return out;
}

/* Completa lo que falte sin deshacer las sugerencias que ya funcionan */
function autocompletar(k){
  k = k || SEMANA;
  const w = semana(k);
  const mejor = mejorPropuesta(k, baseVigente(k), 40);
  w.celdas = celdasSoloCounter(k, mejor.prop.celdas);
  w.modificado = new Date().toISOString();
  guardar();
  return mejor.ev;
}

/* Rehace toda la semana desde cero, respetando solo lo que pusiste a mano */
function otraAlternativa(k){
  k = k || SEMANA;
  const w = semana(k);
  const actual = firmaDe(w.celdas);
  const mejor = mejorPropuesta(k, baseManual(k), 50, actual);
  w.celdas = celdasSoloCounter(k, mejor.prop.celdas);
  w.modificado = new Date().toISOString();
  bitacora('Se genero otra alternativa para la semana del ' + fechaLarga(k) + '.');
  guardar();
  return mejor.ev;
}

/* Tres opciones comparadas, para cuando quieras elegir con calma */
function tresAlternativas(k){
  k = k || SEMANA;
  const base = baseManual(k);
  const vistas = new Set(), res = [];
  const titulos = ['Opcion 1', 'Opcion 2', 'Opcion 3'];
  for(let i = 0; i < 3; i++){
    let mejor = null;
    for(let j = 0; j < 14; j++){
      const prop = construir(k, base, 8 + j * 3);
      const ev = evaluar(k, prop.celdas);
      const firma = firmaDe(prop.celdas);
      let obj = ev.objetivo - (vistas.has(firma) ? 40 : 0);
      if(!mejor || obj > mejor.obj) mejor = { prop, ev, firma, obj };
    }
    vistas.add(mejor.firma);
    res.push({ titulo: titulos[i], celdas: mejor.prop.celdas, eq: mejor.ev.eq, rev: mejor.ev.rev });
  }
  return res;
}

function aplicarCeldas(celdas, k){
  k = k || SEMANA;
  const w = semana(k);
  const manual = baseManual(k);
  /* solo el counter: las tres opciones son repartos del counter y no
     tienen nada que decir sobre los otros dos horarios */
  w.celdas = celdasSoloCounter(k, JSON.parse(JSON.stringify(celdas)));
  for(const key in manual) w.celdas[key] = manual[key];
  w.modificado = new Date().toISOString();
  guardar();
}

function limpiarSugerencias(k){
  const w = semana(k);
  for(const key in w.celdas) if(w.celdas[key].o === 'auto' && !w.celdas[key].b) delete w.celdas[key];
  w.modificado = new Date().toISOString();
  bitacora('Se limpiaron las sugerencias de la semana del ' + fechaLarga(k) + '.');
  guardar();
}

/* =====================================================================
   BLOQUE 3B - LOS OTROS DOS HORARIOS
   Ni los supervisores ni los agentes de servicio entran en la rotacion
   del counter: no van a la Terminal B, no tienen grupo de descanso y no
   se reparten dias libres en pareja. Sus horarios son mucho mas simples
   y se arman cada uno por su lado, sobre las mismas casillas.
   ===================================================================== */

/* Una casilla que pusiste tu no se toca nunca, la arme quien la arme */
function celdaFijada(empId, d, k){
  const c = celda(empId, d, k);
  return !!(c && (c.b || c.o === 'manual'));
}

/* -----------------------------------------------------------------
   SUPERVISORES
   De lunes a viernes 7:00 a.m. a 4:00 p.m., el sabado 8:00 a.m. a
   12:00 del mediodia y el domingo libre. Lo unico que cambia son los
   feriados: los cubre uno si y otro no, por orden de la lista.
   ----------------------------------------------------------------- */
/* A quien le toca el feriado de esa fecha */
/* Quien entra ese feriado. Puede ser mas de uno, o ninguno: cada persona
   tiene su regla, asi que ya no es "uno si y otro no" entre los dos. */
function supervisoresDeFeriado(fecha){
  return plantilla('supervision').filter(e => trabajaFeriado(e.id, fecha));
}
function supervisorDeFeriado(fecha){
  return supervisoresDeFeriado(fecha)[0] || null;
}
/* Turno que le toca a un supervisor un dia normal. null = libre */
/* La ficha de horario de esa persona. Si no la tiene, la de por defecto. */
function horarioSupervisorDe(empId){
  const cfg = S.config.supervision || {};
  const p = (cfg.personas || {})[empId];
  if(p) return p;
  return { turnoSemana: cfg.turnoSemana, turnoSabado: cfg.turnoSabado,
           dias: (cfg.dias || [1,1,1,1,1,2,0]).slice(), feriados:'alterna', desfase:0 };
}
/* El turno que le toca ese dia de la semana, sin contar feriados */
function turnoSupervisionDe(empId, d){
  const p = horarioSupervisorDe(empId);
  const codigo = (p.dias || [])[d];
  if(codigo === 2) return p.turnoSabado || null;
  if(codigo === 1) return p.turnoSemana || null;
  return null;
}
/* Se conserva para lo que aun pregunte por el horario en general */
function turnoSupervision(d){
  const cfg = S.config.supervision;
  const codigo = (cfg.dias || [])[d];
  if(codigo === 2) return cfg.turnoSabado || null;
  if(codigo === 1) return cfg.turnoSemana || null;
  return null;
}
/* =====================================================================
   LOS FERIADOS, CADA UNO CON SU REGLA
   El gerente los tiene libres siempre. Car Control trabaja uno si y otro
   no, por el orden en que estan los feriados en la lista. Y queda la
   opcion de "siempre", por si algun dia hace falta.
   ===================================================================== */
function trabajaFeriado(empId, fecha){
  const p = horarioSupervisorDe(empId);
  if(p.feriados === 'libre')   return false;
  if(p.feriados === 'siempre') return true;
  const i = ordenFeriado(fecha);
  if(i < 0) return true;
  return ((i + (p.desfase || 0)) % 2) === 0;
}
/* Que hace esa persona ese dia: el turno que sea, o null si libra */
function turnoDelDiaSupervision(empId, d, k){
  k = k || SEMANA;
  const fecha = addDias(k, d);
  const p = horarioSupervisorDe(empId);
  if(feriadoEn(fecha)){
    /* En feriado, quien entra hace el turno de lunes a viernes, aunque ese
       dia normalmente librara. */
    let entra = trabajaFeriado(empId, fecha);
    /* "Otra alternativa" le da la vuelta a los feriados de ESA semana y de
       nadie mas: el resto del ano sigue como estaba. Solo afecta a quien
       tiene la regla de uno si y otro no; a quien los tiene libres siempre
       no hay alternativa que darle. */
    if(p.feriados === 'alterna' && (((S.semanas[k] || {}).varSup || 0) % 2)) entra = !entra;
    if(!entra) return null;
    return turnoSupervisionDe(empId, d) || p.turnoSemana || null;
  }
  return turnoSupervisionDe(empId, d);
}
/* Quien entra ese feriado EN ESA SEMANA, ya contando la vuelta que le haya
   dado "Otra alternativa" */
function supervisoresDeFeriadoEn(k, d){
  return plantilla('supervision').filter(e => !!turnoDelDiaSupervision(e.id, d, k));
}
function generarSupervision(k, opciones){
  opciones = opciones || {};
  const eq = plantilla('supervision');
  const cfg = S.config.supervision;
  let puestos = 0;
  for(let d = 0; d < 7; d++){
    for(const e of eq){
      if(!opciones.rehacer && celdaFijada(e.id, d, k)) continue;
      let tid = turnoDelDiaSupervision(e.id, d, k);
      if(tid && !turno(tid)) tid = null;
      if(tid && (diaReservado(e.id, d, k) || (e.turnosProhibidos||[]).indexOf(tid) >= 0)) tid = null;
      if(tid) puestos++;
      ponerCelda(e.id, d, tid || LIBRE, tid ? (cfg.puestoId || null) : null, 'auto', false, k);
    }
  }
  return puestos;
}

/* -----------------------------------------------------------------
   AGENTES DE SERVICIO
   Cada dia hay que cubrir los turnos que diga la cobertura y los tres
   agentes van girando un puesto por dia. El giro va hacia atras a
   proposito: asi quien cierra a las 11 de la noche entra mas tarde al
   dia siguiente y nunca se queda corto de descanso.
   ----------------------------------------------------------------- */
/* El turno que una persona tiene clavado ese dia por su ficha, si lo hay */
function fijoDe(empId, d){
  const e = empleado(empId);
  if(!e) return null;
  const f = (e.fijos || []).find(x => (x.dias || []).indexOf(d) >= 0 && turno(x.turnoId));
  return f || null;
}
/* Lista de turnos que se abren ese dia, ordenados por hora de entrada.
   Sale de la lista de prioridad recortada a la gente que hay. */
function turnosNecesariosServicio(d, k){
  return turnosServicioDia(d, k).map(x => x.turnoId)
    .sort((a, b) => min2(turno(a).inicio) - min2(turno(b).inicio));
}
function generarServicio(k, opciones){
  opciones = opciones || {};
  const eq = plantilla('servicio');
  const cfg = S.config.servicio || {};
  const giroSemana = semanasAbsolutas(k) + ((S.semanas[k] || {}).varSer || 0);
  let puestos = 0;

  /* Los dias libres se deciden antes que nada: de ahi sale cuanta gente
     trabaja cada dia, y de ahi cuantos turnos se abren. */
  const plan = patronLibresServicio(k);

  for(let d = 0; d < 7; d++){
    const giran = [];      // los que entran en el giro
    const clavados = [];   // los que tienen turno clavado por ficha ese dia
    const aMano = [];      // turnos que ya cubriste tu y que no hay que repartir

    for(const e of eq){
      /* 1. lo que pusiste a mano manda */
      if(!opciones.rehacer && celdaFijada(e.id, d, k)){
        const c = celda(e.id, d, k);
        if(c && c.t !== LIBRE){ aMano.push(c.t); puestos++; }
        continue;
      }
      /* 2. vacaciones, licencia, permiso o dia que no trabaja: ni se intenta.
            La ausencia se escribe tal cual, para que salga marcada en
            amarillo y no como un dia libre cualquiera. */
      if(diaReservado(e.id, d, k)){
        const aus = celdaAusencia(e.id, d, k);
        if(aus) semana(k).celdas[ck(e.id, d)] = aus;
        else ponerCelda(e.id, d, LIBRE, null, 'auto', false, k);
        continue;
      }
      /* 3. el dia libre que le toca esta semana */
      if((plan[e.id] || []).indexOf(d) >= 0){
        ponerCelda(e.id, d, LIBRE, null, 'auto', false, k);
        continue;
      }
      /* 4. turno clavado por ficha (el 11-7 de los lunes y los sabados) */
      const f = fijoDe(e.id, d);
      if(f) clavados.push({ e, f }); else giran.push(e);
    }

    /* 4. Los turnos que se abren ese dia: tantos como agentes vayan a
          trabajar, por orden de la lista. Los que ya cubriste a mano salen
          de la cuenta, que su sitio ya esta ocupado. */
    const lista = prioridadServicioDia(d).slice();
    aMano.forEach(tid => { const i = lista.findIndex(x => x.turnoId === tid); if(i >= 0) lista.splice(i, 1); });
    const manos = clavados.length + giran.length;
    const pendientes = lista.slice(0, Math.min(lista.length, manos)).map(x => x.turnoId);

    /* 5. El turno clavado se respeta solo si ese dia llega a abrirse. Si no
          llega -porque falta gente y su turno es de los de abajo- esa
          persona entra en el giro y cubre uno de los principales, que es lo
          que de verdad no puede faltar. */
    clavados.forEach(({ e, f }) => {
      const i = pendientes.indexOf(f.turnoId);
      if(i >= 0){
        pendientes.splice(i, 1);
        ponerCelda(e.id, d, f.turnoId, f.puestoId || cfg.puestoId || null, 'auto', false, k);
        puestos++;
      } else giran.push(e);
    });

    /* 6. El resto gira: un puesto hacia atras por dia y otro por semana. El
          giro va hacia atras a proposito, asi quien cierra a las 11 de la
          noche entra mas tarde al dia siguiente y nunca se queda corto de
          descanso. */
    const n = giran.length;
    if(!n) continue;
    pendientes.sort((a, b) => min2(turno(a).inicio) - min2(turno(b).inicio));
    const giro = (((d + giroSemana) % n) + n) % n;
    const rotados = giran.slice(giro).concat(giran.slice(0, giro));
    const asig = {};
    rotados.forEach((e, i) => { asig[e.id] = pendientes[i] || null; });
    /* Si a alguien le toco por el giro un turno que tiene vetado en su
       ficha, se lo cambia con un companero que si pueda: asi el giro se
       mantiene y el turno no se cae por el veto de una sola persona. */
    rotados.forEach(a => {
      const t = asig[a.id];
      if(!t || (a.turnosProhibidos || []).indexOf(t) < 0) return;
      const b = rotados.find(x => x.id !== a.id &&
        (x.turnosProhibidos || []).indexOf(t) < 0 &&
        (!asig[x.id] || (a.turnosProhibidos || []).indexOf(asig[x.id]) < 0));
      if(b){ const tmp = asig[b.id]; asig[b.id] = t; asig[a.id] = tmp; }
      else asig[a.id] = null;
    });
    /* =================================================================
       LA VISPERA Y LA VUELTA DEL DIA LIBRE
       Lo mismo que en agentes de renta: el dia antes de librar se entra en
       el PRIMER turno del dia -el 7-3- y el dia que se vuelve, en el
       ULTIMO -el 3-11-. Asi se sale a las 3, se libra, y se vuelve a las 3
       del otro dia: casi 48 horas seguidas fuera.

       Se hace intercambiando turnos entre companeros y no puntuando: el
       giro ya reparte, y lo unico que hace falta es corregirlo cuando a
       alguien le toco el turno contrario al que le corresponde.
       ================================================================= */
    const extS = extremosServicioDia(d, k);
    /* Se mira el PLAN de descansos, no las casillas: los dias se reparten
       de lunes a domingo, asi que cuando se esta repartiendo el lunes la
       casilla del martes todavia no existe y nunca se veia que manana
       libraba. El plan si esta hecho de antemano para la semana entera.
       Un dia de vacaciones cuenta igual que un dia libre: la vispera se
       sale pronto y el regreso se entra tarde lo mismo. */
    const libreEn = (e, dd) => {
      if(dd >= 0 && dd <= 6)
        return (plan[e.id] || []).indexOf(dd) >= 0 || ausenteEnDia(e.id, dd, k);
      const c = dd < 0 ? celda(e.id, 6, addDias(k, -7)) : celda(e.id, 0, addDias(k, 7));
      return !!(c && c.t === LIBRE);
    };
    /* que turno le toca hoy por la regla, o null si no le aplica */
    const leToca = (e) => {
      const vispera = libreEn(e, d + 1), vuelta = libreEn(e, d - 1);
      if(vispera === vuelta) return null;            // ni lo uno ni lo otro, o las dos
      return vispera ? extS.pronto : extS.tarde;
    };
    for(let pasada = 0; pasada < 2; pasada++){
      rotados.forEach(a => {
        const quiere = leToca(a);
        if(quiere === null) return;
        const suyo = asig[a.id] && turno(asig[a.id]);
        if(suyo && min2(suyo.inicio) === quiere) return;      // ya lo tiene
        /* quien lo tenga y no lo necesite */
        const b = rotados.find(x => {
          if(x.id === a.id) return false;
          const t2 = asig[x.id] && turno(asig[x.id]);
          if(!t2 || min2(t2.inicio) !== quiere) return false;
          if(leToca(x) === quiere) return false;              // a el tambien le toca: no se le quita
          if((x.turnosProhibidos || []).indexOf(asig[a.id]) >= 0) return false;
          if((a.turnosProhibidos || []).indexOf(asig[x.id]) >= 0) return false;
          return true;
        });
        if(b){ const tmp = asig[b.id]; asig[b.id] = asig[a.id]; asig[a.id] = tmp; }
      });
    }

    /* Con dos personas y dos turnos el giro puro los hace alternar todos
       los dias, y quien cierra a las 11 abriria a las 7: justo el descanso
       minimo, y por debajo si lo cambias en Ajustes. Si intercambiando dos
       turnos entre companeros se arregla, se intercambian.
       Ojo: no se toca a quien tiene turno por la vispera o la vuelta, que
       esos ya estan donde deben. */
    const ayerDe = (e) => {
      const c = d > 0 ? celda(e.id, d - 1, k) : celda(e.id, 6, addDias(k, -7));
      return (c && c.t !== LIBRE && !esAusencia(c)) ? turno(c.t) : null;
    };
    const descansoDe = (e, tid) => {
      const a = ayerDe(e), t = tid && turno(tid);
      return (a && t) ? descansoEntre(a, t) : 99;
    };
    const minD = S.config.descansoMin > 0 ? S.config.descansoMin : 8;
    for(let pasada = 0; pasada < 2; pasada++){
      for(let i = 0; i < rotados.length; i++) for(let j = i + 1; j < rotados.length; j++){
        const A = rotados[i], B = rotados[j];
        const ta = asig[A.id], tb = asig[B.id];
        if(ta === tb) continue;
        if(leToca(A) !== null || leToca(B) !== null) continue;   // la vispera y la vuelta mandan
        if(ta && (B.turnosProhibidos || []).indexOf(ta) >= 0) continue;
        if(tb && (A.turnosProhibidos || []).indexOf(tb) >= 0) continue;
        const antes = Math.min(descansoDe(A, ta), descansoDe(B, tb));
        if(antes >= minD) continue;                 // no hay nada que arreglar
        const luego = Math.min(descansoDe(A, tb), descansoDe(B, ta));
        if(luego > antes){ asig[A.id] = tb; asig[B.id] = ta; }
      }
    }
    rotados.forEach(e => {
      const tid = asig[e.id];
      if(tid){ ponerCelda(e.id, d, tid, cfg.puestoId || null, 'auto', false, k); puestos++; }
      else ponerCelda(e.id, d, LIBRE, null, 'auto', false, k);
    });
  }
  /* Nadie se queda con la casilla en blanco. Una casilla vacia no es
     informacion, es un agujero: no se sabe si esa persona libra, si falta
     por repartir o si se perdio por el camino. Si algun dia alguien no
     entro en el reparto, se le pone el dia libre y se ve. */
  for(let d = 0; d < 7; d++) for(const e of eq)
    if(!celda(e.id, d, k)) ponerCelda(e.id, d, LIBRE, null, 'auto', false, k);
  return puestos;
}
/* =====================================================================
   LOS HUECOS DE LOS OTROS DOS HORARIOS SE RELLENAN SOLOS
   Al abrir una semana, sanearSemana quita lo que ya no encaja con las
   reglas. Para el counter eso lo recompone autocompletar, pero los otros
   dos horarios no los miraba nadie: una casilla que se caia se quedaba en
   blanco para siempre. Era justo lo que le pasaba a la fila del turno
   clavado al pasar de una semana a otra.
   Solo se rellena lo que falta, y solo si la hoja de ese equipo ya esta
   empezada: una hoja entera en blanco se arma cuando tu pulses su boton.
   ===================================================================== */
function completarOtrosEquipos(k){
  k = k || SEMANA;
  let n = 0;
  ['supervision', 'servicio'].forEach(eq => {
    const emps = plantilla(eq);
    if(!emps.length || equipoVacio(eq, k)) return;
    let faltan = 0;
    emps.forEach(e => { for(let d = 0; d < 7; d++) if(!celda(e.id, d, k)) faltan++; });
    if(!faltan) return;
    try {
      if(eq === 'servicio') generarServicio(k, {}); else generarSupervision(k, {});
      n += faltan;
    } catch(e){}
  });
  return n;
}

/* Un solo punto de entrada para los botones de la pantalla */
function generarEquipo(eq, k, opciones){
  k = k || SEMANA;
  const n = eq === 'supervision' ? generarSupervision(k, opciones)
          : eq === 'servicio'    ? generarServicio(k, opciones)
          : 0;
  bitacora('Se armo el horario de ' + infoEquipo(eq).nombre.toLowerCase() +
           ' de la semana del ' + fechaLarga(k) + '.');
  guardar();
  return n;
}

/* =====================================================================
   REVISION DE LOS EQUIPOS DE HORARIO FIJO
   No se les aplican las reglas del counter (dias libres en pareja,
   Terminal B, refuerzos). Lo unico que se comprueba es lo que si les
   afecta: descanso entre turnos, dias reservados en la ficha y puestos
   del dia sin cubrir.
   ===================================================================== */
function revisarEquipo(eq, k){
  k = k || SEMANA;
  const avisos = [], conflictos = [];
  /* Un horario que todavia no se ha armado no esta mal, esta sin hacer:
     no hay nada que revisar. Se mira ESTE equipo y no la semana entera,
     porque cada horario va por su cuenta y uno puede estar hecho y otro no. */
  if(equipoVacio(eq, k)) return { avisos, conflictos };
  const ctx = ctxReal(k);
  const cfg = S.config;

  for(const e of plantilla(eq)){
    for(let d = 0; d < 7; d++){
      const c = celda(e.id, d, k);
      if(!c || c.t === LIBRE) continue;
      const t = turno(c.t);
      if(!t){ conflictos.push({ empId:e.id, dia:d, texto: e.nombre + ' tiene un turno que ya no existe el ' + DIAS[d].toLowerCase() + '.' }); continue; }
      if(diaReservado(e.id, d, k))
        conflictos.push({ empId:e.id, dia:d, texto: e.nombre + ' tiene turno el ' + DIAS[d].toLowerCase() + ' y ese dia lo tiene reservado en su ficha.' });
      if(!cfg.permitirSinDescanso && !c.exc){
        const ant = asigEnFecha(ctx, e.id, addDias(fechaDe(k,d), -1));
        if(ant && ant.t !== LIBRE && turno(ant.t)){
          const h = descansoEntre(turno(ant.t), t);
          if(h < cfg.descansoMin)
            conflictos.push({ empId:e.id, dia:d, texto: e.nombre + ' solo descansa ' + h + ' horas entre el turno del dia anterior y el del ' + DIAS[d].toLowerCase() + ' (el minimo es ' + cfg.descansoMin + ').' });
        }
      }
    }
  }


  /* =================================================================
     SUPERVISORES: lo que hay en la hoja contra su horario fijo
     Su horario no lo decide un reparto, lo decide la ficha: de lunes a
     viernes su turno, el sabado el corto y el domingo libre, con los
     feriados uno si y otro no. Si alguien mueve una casilla a mano y le
     deja trabajando su domingo, hay que decirlo: antes no se miraba.
     ================================================================= */
  if(eq === 'supervision'){
    const equipo = plantilla('supervision');
    for(const e of equipo){
      for(let d = 0; d < 7; d++){
        const c = celda(e.id, d, k);
        if(!c) continue;                       // casilla sin armar: no hay nada que juzgar
        let toca = turnoDelDiaSupervision(e.id, d, k);
        if(toca && !turno(toca)) toca = null;
        /* si ese dia lo tiene reservado en su ficha, librar es lo correcto */
        if(toca && diaReservado(e.id, d, k)) toca = null;
        const trabaja = c.t !== LIBRE && !esAusencia(c);
        if(trabaja && !toca)
          conflictos.push({ empId:e.id, dia:d, texto: e.nombre + ' trabaja el ' + DIAS[d].toLowerCase() +
            ' y ese dia lo tiene libre en su horario fijo.' });
        else if(!trabaja && toca && !esAusencia(c))
          conflictos.push({ empId:e.id, dia:d, texto: e.nombre + ' esta libre el ' + DIAS[d].toLowerCase() +
            ' y su horario fijo dice que trabaja de ' + hora12(turno(toca).inicio) + ' a ' + hora12(turno(toca).fin) + '.' });
        else if(trabaja && toca && c.t !== toca)
          avisos.push({ empId:e.id, dia:d, texto: e.nombre + ' hace el turno de ' + (turno(c.t)||{}).corto +
            ' el ' + DIAS[d].toLowerCase() + '; en su horario fijo ese dia es el de ' + (turno(toca)||{}).corto + '.' });
      }
    }
  }
  if(eq === 'servicio'){
    /* SOLO se avisa de los principales. El 9-5, el 11-7 y los demas son
       refuerzo: si un dia no se llegan a usar no falta nada, porque la
       manana y la noche de la Terminal A estan cubiertas. Avisar de ellos
       llenaba la pantalla de rojos que no habia que arreglar. */
    for(let d = 0; d < 7; d++){
      const abren = turnosServicioDia(d, k);
      const hechos = [];
      plantilla('servicio').forEach(e => {
        const c = celda(e.id, d, k);
        if(c && c.t !== LIBRE && !esAusencia(c)) hechos.push(c.t);
      });
      /* los que se abrieron y no los hace nadie */
      let faltan = 0;
      abren.filter(x => x.clave).forEach(x => {
        const i = hechos.indexOf(x.turnoId);
        if(i >= 0) hechos.splice(i, 1); else faltan++;
      });
      /* y los que ni siquiera llegaron a abrirse por falta de agentes */
      const nuc = nucleoServicioDia(d);
      faltan += Math.max(0, nuc - abren.filter(x => x.clave).length);
      if(faltan && !avisos.some(a => a.clave === 'm' + d))
        avisos.push({ clave:'m' + d, texto: 'El ' + DIAS[d].toLowerCase() + ' queda ' + faltan +
          ' turno(s) principal(es) de la Terminal A sin nadie: hay ' + agentesServicioDia(d, k) +
          ' agente(s) para ' + nuc + '.' });
    }
    /* =================================================================
       DOS AGENTES NO VAN A LA VEZ EN EL MISMO TURNO
       Esta es la regla de verdad cuando hay que improvisar. Si un dia no
       se puede cubrir un principal, puedes poner a esa persona en
       cualquier otro turno y no pasa nada; lo unico que no vale es que
       dos coincidan en el mismo horario.
       Un turno que la lista abre dos veces si admite dos: eso se cuenta.
       ================================================================= */
    for(let d = 0; d < 7; d++){
      const quien = {};
      plantilla('servicio').forEach(e => {
        const c = celda(e.id, d, k);
        if(!c || c.t === LIBRE || esAusencia(c)) return;
        (quien[c.t] = quien[c.t] || []).push(e);
      });
      for(const tid in quien){
        const juntos = quien[tid];
        const abre = prioridadServicioDia(d).filter(x => x.turnoId === tid).length;
        const caben = Math.max(1, abre);
        if(juntos.length <= caben) continue;
        conflictos.push({ empId: juntos[juntos.length - 1].id, dia: d,
          texto: juntos.map(e => e.nombre).join(' y ') + ' estan los ' + juntos.length +
                 ' en el turno ' + ((turno(tid) || {}).corto || '?') + ' el ' + DIAS[d].toLowerCase() + '.',
          sugerencia: 'Cambiale el turno a uno de ellos: dos agentes de servicio no van a la vez en el mismo horario.' });
      }
    }
    /* Y los dias libres: cada semana uno libra dos seguidos y los demas
       uno. Si no caben, es que falta gente, y eso se dice. */
    const tocan = libresServicioPorPersona(k);
    plantilla('servicio').forEach(e => {
      const suyos = [];
      for(let d = 0; d < 7; d++) if(esLibreReal(celda(e.id, d, k))) suyos.push(d);
      const n2 = tocan[e.id] || 0;
      if(suyos.length < n2)
        avisos.push({ clave:'l' + e.id, texto: e.nombre + ' deberia librar ' + n2 + ' dia(s) esta semana y libra ' +
          suyos.length + '. No caben mas descansos sin dejar un turno principal de la Terminal A sin nadie.' });
      if(suyos.length === 2){
        const a = suyos[0], b = suyos[1];
