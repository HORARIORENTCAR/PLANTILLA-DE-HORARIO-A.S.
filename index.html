/* ---------- accesos rapidos ---------- */
const turno = (id) => (id === LIBRE ? {id:LIBRE, nombre:'Libre', corto:'Libre', tipo:'libre', inicio:'', fin:''} : S.turnos.find(t => t.id === id));
const puesto = (id) => (id ? S.puestos.find(p => p.id === id) : null);
const empleado = (id) => S.empleados.find(e => e.id === id);
const turnosActivos = () => S.turnos.filter(t => t.activo);
const puestosActivos = () => S.puestos.filter(p => p.activo);
const esTerminalB = (puestoId) => { const p = puesto(puestoId); return !!p && p.terminal === 'B'; };

/* =====================================================================
   QUIEN ES DE QUE EQUIPO
   El motor de rotacion (dias libres, Terminal B, refuerzos, equidad) fue
   escrito para el equipo de counter y solo para el. Por eso activos()
   sigue significando "los del counter": asi ninguna de sus reglas se
   aplica por error a los supervisores ni a los agentes de servicio.
   Para hablar de la plantilla entera esta activosTodos().
   ===================================================================== */
function equipoDe(e){
  const x = (typeof e === 'string') ? empleado(e) : e;
  const q = x && x.equipo;
  return EQUIPO_IDS.includes(q) ? q : 'rotativo';
}
const activosTodos = () => S.empleados.filter(e => e.activo);
const plantilla = (eq) => S.empleados.filter(e => e.activo && equipoDe(e) === eq);
const activos = () => plantilla('rotativo');
/* Turnos que salen en los menus de un equipo. El 7-3 y el 3-11 estan en
   dos: los hacen el counter y los agentes de servicio. */
const turnosDe = (eq) => S.turnos.filter(t => t.activo && (t.equipos||[]).indexOf(eq) >= 0);

/* =====================================================================
   AUSENCIAS: VACACIONES, LICENCIAS Y PERMISOS
   Se guardan por fechas, no por dias de la semana, porque van y vienen.
   Un dia de ausencia no es un dia libre ni un turno: es un tercer estado.
   Cuenta como dia no trabajado y el reparto se rehace alrededor.

   La cuenta se ajusta sola. Con una persona fuera toda la semana quedan
   seis, que dan 35 turnos, y los cinco puestos fijos de los siete dias
   son justo 35: el sexto puesto no entra esa semana y todo cuadra.
   ===================================================================== */
const AUSENTE = 'ausente';
const TIPOS_AUSENCIA = {
  vacaciones: 'Vacaciones',
  medica:     'Licencia medica',
  permiso:    'Permiso',
  otro:       'Ausencia'
};
function ausencias(){ return (S.ausencias || []); }
/* La ausencia que cubre esa fecha, si la hay */
function ausenciaEn(empId, fecha){
  return ausencias().find(a => a.empId === empId && a.desde <= fecha && fecha <= a.hasta) || null;
}
function ausenteEnDia(empId, d, k){
  return !!ausenciaEn(empId, addDias(k || SEMANA, d));
}
/* Los dias de esa semana en que la persona esta fuera */
function diasAusente(empId, k){
  const out = [];
  for(let d = 0; d < 7; d++) if(ausenteEnDia(empId, d, k)) out.push(d);
  return out;
}
function ausenteTodaLaSemana(empId, k){ return diasAusente(empId, k).length === 7; }
/* Que motivos de ausencia salen en la semana que se esta viendo. Sirve
   para poner en la leyenda solo los colores que de verdad estan en la
   tabla: una leyenda con cuatro cosas de las que no se ve ninguna estorba
   mas que ayuda. */
function motivosDeLaSemana(k){
  k = k || SEMANA;
  const vistos = [];
  activos().forEach(e => {
    for(let d = 0; d < 7; d++){
      const a = ausenciaEn(e.id, addDias(k, d));
      if(!a) continue;
      const t = TIPOS_AUSENCIA[a.tipo] ? a.tipo : 'otro';
      if(vistos.indexOf(t) < 0) vistos.push(t);
    }
  });
  return Object.keys(TIPOS_AUSENCIA).filter(t => vistos.indexOf(t) >= 0);
}
/* En la casilla, una ausencia se guarda como un dia sin turno con una
   marca encima. Asi todo lo que ya preguntaba "¿trabaja o no?" sigue
   valiendo, y lo unico que hay que afinar es donde se cuentan los dias
   libres, que son otra cosa. */
const esAusencia  = (c) => !!(c && c.t === LIBRE && c.aus);
const esLibreReal = (c) => !!(c && c.t === LIBRE && !c.aus);
function celdaAusencia(empId, d, k){
  const a = ausenciaEn(empId, addDias(k || SEMANA, d));
  /* Va marcada como puesta a mano y bloqueada a proposito: es un dato de
     fechas, no una sugerencia. Sin esto el reparto la veia como un dia
     libre cualquiera y le encajaba un turno encima. */
  return a ? { t:LIBRE, p:null, o:'manual', b:true, fijo:true, aus:(a.tipo || 'otro') } : null;
}
/* Deja escritas en la semana las ausencias que toquen */
function marcarAusencias(k){
  const w = S.semanas[k];
  if(!w || !w.celdas) return 0;
  let n = 0;
  activosTodos().forEach(e => {
    for(let d = 0; d < 7; d++){
      const a = celdaAusencia(e.id, d, k);
      const c = w.celdas[ck(e.id, d)];
      if(a){ if(!esAusencia(c) || c.aus !== a.aus){ w.celdas[ck(e.id,d)] = a; n++; } }
      else if(esAusencia(c)){ delete w.celdas[ck(e.id,d)]; n++; }   // ya volvio
    }
  });
  return n;
}
/* =====================================================================
   ¿FALTAN MANOS ESA SEMANA?
   Cuando hay gente de vacaciones o de licencia puede que no de para
   cubrirlo todo. Entonces los puestos que quedan vacios no son un fallo
   del reparto: es que no hay nadie. Sirve para no llenar la pantalla de
   avisos sobre los dias libres cuando el problema es otro.
   ===================================================================== */
/* =====================================================================
   ¿SE PUEDEN CUBRIR LOS PUESTOS PRINCIPALES ESTA SEMANA?
   Con la lista de prioridad, los puestos de relleno se abren o no segun
   la gente que haya: nunca "faltan". Lo unico que puede quedarse sin
   cubrir de verdad son los principales, y por dos motivos: o no hay
   bastantes manos, o las que hay no pueden hacerlos (alguien en
   entrenamiento no cubre la manana de Hertz).
   Esta es la cuenta a ojo, para avisar de semanas que aun no has armado.
   ===================================================================== */
/* La cuenta a ojo, para semanas que aun no estan armadas. Mira dos cosas:
   lo que da la semana entera y lo que da cada dia por separado, porque una
   cosa puede cuadrar y la otra no. Con tres personas un miercoles no se
   cubren cuatro puestos principales, aunque la suma de la semana salga. */
function manosPrevistas(k){
  k = k || SEMANA;
  let pide = 0;
  for(let d = 0; d < 7; d++) pide += nucleoDia(d, k);
  let dan = 0;
  activos().forEach(e => {
    let puede = 0;
    for(let d = 0; d < 7; d++) if(!ausenteEnDia(e.id, d, k) && puedeCubrirNucleo(e, d, k)) puede++;
    dan += Math.min(puede, diasObjetivoDe(e.id, k));
  });
  const semana = Math.max(0, pide - dan);
  let porDia = 0;
  for(let d = 0; d < 7; d++)
    porDia += Math.max(0, nucleoDia(d, k) - Math.min(trabajanDia(d, k), capacesNucleo(d, k)));
  return Math.max(semana, porDia);
}
/* Cuantos puestos principales se van a quedar sin nadie. Si la semana ya
   esta armada se cuenta sobre ella, que es la verdad; si no, se estima. */
function faltanManos(k){
  k = k || SEMANA;
  if(!semanaArmada(k)) return manosPrevistas(k);
  const w = S.semanas[k];
  let n = 0;
  for(let d = 0; d < 7; d++){
    let capaces = 0;
    activos().forEach(e => {
      const c = w.celdas[ck(e.id, d)];
      if(c && c.t !== LIBRE && !esAusencia(c) && puedeCubrirNucleo(e, d, k)) capaces++;
    });
    n += Math.max(0, nucleoDia(d, k) - capaces);
  }
  return n;
}
/* Lo que de verdad quedo sin cubrir de lo principal en lo ya repartido */
function principalesSinCubrir(k){
  k = k || SEMANA;
  const ctx = ctxReal(k);
  let n = 0;
  for(let d = 0; d < 7; d++) prioridadDia(d, k).forEach(x => {
    if(x.clave && ocupacion(ctx, d, x.turnoId, x.puestoId) < 1) n++;
  });
  return n;
}

/* Quien esta disponible esa semana, aunque sea un solo dia */
function disponibles(k){ return activos().filter(e => !ausenteTodaLaSemana(e.id, k)); }
/* Cuantos pueden trabajar ese dia concreto */
function disponiblesDia(d, k){
  return activos().filter(e => !ausenteEnDia(e.id, d, k)).length;
}

/* ---------- feriados ---------- */
function feriados(){ return (S.feriados || []).slice().sort((a,b) => a.fecha < b.fecha ? -1 : 1); }
function feriadoEn(fecha){ return feriados().find(f => f.fecha === fecha) || null; }
/* Posicion del feriado en la lista: es lo que hace que se alternen */
function ordenFeriado(fecha){ return feriados().findIndex(f => f.fecha === fecha); }

/* ---------- tipo de semana (5 o 6 dias) ---------- */
/* Ya no hay semanas de 5 y de 6 dias: todas tienen la misma forma. Lo
   normal es trabajar 6 dias; solo quien lleva los dos libres seguidos
   trabaja 5. Se conserva la funcion porque la usan varias pantallas. */
function tipoSemana(k){ return 6; }
/* =====================================================================
   EL TURNO DE LOS DOS DIAS LIBRES SEGUIDOS
   Cada semana le toca a UNA sola persona librar dos dias seguidos. Las
   demas libran uno. Al terminar la semana el turno pasa al siguiente de
   la lista, y nadie repite hasta que todos hayan pasado.

   La cuenta cierra sola: 7 personas x 7 dias = 49; menos 8 dias libres
   (uno con 2 y seis con 1) quedan 41 turnos, que son exactamente los
   cinco puestos fijos de los siete dias (35) mas el 12-8 seis dias (6).

   Quien no quiera entrar en la rotacion (por ejemplo alguien que esta en
   entrenamiento) simplemente no aparece en la lista: librara un dia
   todas las semanas.
   ===================================================================== */
function rotacionLibres(){
  const r = S.config.rotacionLibres;
  const orden = (r && Array.isArray(r.orden) ? r.orden : [])
    .filter(id => { const e = empleado(id); return e && e.activo && equipoDe(e) === 'rotativo'; });
  return { orden, inicio: (r && r.inicio >= 0) ? r.inicio : 0 };
}
/* A quien le tocan los dos dias seguidos esa semana */
function turnoDosLibres(k){
  k = k || SEMANA;
  const w = S.semanas[k];
  /* una semana concreta se puede cambiar a mano sin mover toda la rotacion */
  if(w && w.turno2 && empleado(w.turno2)) return w.turno2;
  const { orden, inicio } = rotacionLibres();
  if(!orden.length) return null;
  const n = orden.length;
  const base = ((semanasAbsolutas(k) + inicio) % n + n) % n;
  /* Si a quien le toca ya falta esa semana por vacaciones, licencia o
     permiso, el turno pasa al siguiente. Con dos o mas dias fuera ya
     descansa seguido de sobra, y ademas sus dos dias libres tendrian que
     encajar en los pocos dias que le quedan, que es lo que desordenaba el
     reparto. La rotacion sigue por donde iba, asi que a el le llegara. */
  for(let j = 0; j < n; j++){
    const id = orden[(base + j) % n];
    if(diasAusente(id, k).length < 2) return id;
  }
  return orden[base];
}
/* Posicion de una persona en la vuelta actual, para explicarlo en pantalla */
function proximaVezDosLibres(empId, k){
  const { orden } = rotacionLibres();
  const i = orden.indexOf(empId);
  if(i < 0) return null;
  for(let n = 0; n < orden.length; n++) if(turnoDosLibres(addDias(k, 7*n)) === empId) return n;
  return null;
}

/* Dias libres que le tocan a una persona en una semana.
   Quien tenga marcado "2 dias seguidos todas las semanas" los tiene
   siempre; el resto, solo cuando les llega su turno. */
/* =====================================================================
   LOS DIAS LIBRES DE LA SEMANA, AJUSTADOS A QUIEN ESTA
   Con gente de vacaciones o de licencia puede que los dias libres de
   todos no quepan: si se reparten igual, sobra descanso y faltan manos
   para los puestos fijos. Entonces se recorta, pero SOLO lo justo y
   empezando por quien mas dias lleva fuera, que es quien menos falta le
   hace un dia libre de mas.

   El caso que lo destapo: alguien de vacaciones seis dias, disponible
   solo el domingo. Si ese domingo se le daba como dia libre, trabajaba
   cero dias esa semana y el turno se perdia. Ahora trabaja ese dia.
   ===================================================================== */
let _libresCache = { k:null, firma:null, val:null };
function olvidarLibres(){ _libresCache = { k:null, firma:null, val:null }; }
/* =====================================================================
   DOS SEMANAS, DOS DESCANSOS
   El reparto de siempre le da dos dias seguidos a UNA persona por semana y
   uno a las demas. Este es el otro: TODOS libran dos dias seguidos una
   semana, uno la siguiente, dos la otra, y asi. Nadie queda fuera, ni
   siquiera quien esta en entrenamiento.

   La plantilla se parte en DOS GRUPOS sorteados. Una semana el primer
   grupo libra dos dias seguidos y el segundo libra uno; a la semana
   siguiente se cambian. Asi nunca libran dos dias todos a la vez -que
   dejaba una semana con catorce descansos y la siguiente con siete, y el
   mostrador daba tumbos- y cada persona alterna dos, uno, dos, uno.

   Con siete personas salen 4 y 3, y se van turnando quien lleva los dos.
   Con un numero par, mitad y mitad exactas.

   Con siete personas la cuenta sale asi:
     - Semana del grupo de 4: 4x2 + 3x1 = 11 descansos en 7 dias.
     - Semana del grupo de 3: 3x2 + 4x1 = 10 descansos.
   Entre uno y dos descansos por dia, o sea 5 o 6 trabajando: de sobra
   para los cuatro principales y un relleno.

   Se enciende en Ajustes y se apaga igual. Todo lo demas sigue mandando:
   los cuatro principales, los dos dias seguidos de verdad, el descanso
   minimo, los siete dias como maximo y el 7-3 de la vispera con el 3-11
   de la vuelta.

   Con cuatro personas o menos se apaga solo: ahi no hay margen ni para el
   primer dia de descanso, y menos para el segundo.
   ===================================================================== */
function modoDosUno(){ return !!(S.config && S.config.modoDosUno); }
/* =====================================================================
   EL SORTEO DE LOS GRUPOS
   Sale de una semilla guardada, no de Math.random(): tiene que dar SIEMPRE
   lo mismo. Si cambiara en cada calculo, el horario saldria distinto cada
   vez que se rehace, dos equipos verian repartos distintos y una semana ya
   publicada cambiaria sola. Para volver a sortear esta el boton, que
   cambia la semilla y deja constancia.
   ===================================================================== */
function azarEstable(semilla){
  let x = Math.abs((semilla | 0) * 48271) % 2147483647;
  if(x === 0) x = 1;
  return function(){ x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
}
function gruposDosUno(){
  const ids = activos().map(e => e.id);
  const rnd = azarEstable((S.config && S.config.modoDosUnoSemilla) || 7);
  const baraja = ids.slice();
  for(let i = baraja.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = baraja[i]; baraja[i] = baraja[j]; baraja[j] = t;
  }
  const mitad = Math.ceil(baraja.length / 2);
  return { a: baraja.slice(0, mitad), b: baraja.slice(mitad) };
}
/* A quien le tocan los dos dias seguidos esta semana */
function leTocanDosLibres(empId, k){
  const g = gruposDosUno();
  const des = (S.config && S.config.modoDosUnoDesfase) ? 1 : 0;
  const par = (((semanasAbsolutas(k || SEMANA) + des) % 2) + 2) % 2 === 0;
  return (par ? g.a : g.b).indexOf(empId) >= 0;
}
/* Los nombres de cada grupo, para poder ensenarlos */
function nombresGrupo(ids){
  return ids.map(id => (empleado(id) || {}).nombre || '?');
}
function libresPorPersona(k){
  k = k || SEMANA;
  const emps = activos();
  const turno2 = turnoDosLibres(k);
  /* Con la plantilla muy corta se acaba el turno de dos dias seguidos: cada
     uno libra uno y punto. Con cuatro personas no hay margen para regalos. */
  let disponibles = 0;
  emps.forEach(e => { if(diasAusente(e.id, k).length < 7) disponibles++; });
  const corta = disponibles <= PLANTILLA_CORTA;
  const dosUno = modoDosUno() && !corta;
  const firma = emps.map(e => e.id + ':' + diasAusente(e.id, k).length +
                              (e.dosLibresFijos ? 'F' : '')).join(',') + '|' + (turno2 || '-') +
                (corta ? '|c' : '') +
                (dosUno ? '|d' + emps.map(e => leTocanDosLibres(e.id, k) ? 2 : 1).join('') : '');
  if(_libresCache.k === k && _libresCache.firma === firma) return _libresCache.val;

  const info = emps.map(e => {
    const fuera = diasAusente(e.id, k).length;
    /* En el reparto de dos-y-uno, un grupo lleva dos y el otro uno */
    const suyos = corta ? 1
                : dosUno ? (leTocanDosLibres(e.id, k) ? 2 : 1)
                : (e.dosLibresFijos ? 2 : (turno2 === e.id ? 2 : 1));
    /* A quien tiene dia libre fijo en su ficha no se le puede recortar por
       debajo de ese dia: va a librarlo igual, y si aqui pusiera cero la
       cuenta del cupo saldria torcida y ese dia acabarian librando dos.
       Lo destapo ALAN, con domingo fijo y un permiso el jueves. */
    const piso = (e.libreFijo >= 0 && !ausenteEnDia(e.id, e.libreFijo, k)) ? 1 : 0;
    return { id:e.id, fuera, piso, disp: 7 - fuera, libres: Math.max(0, Math.min(suyos, 7 - fuera)) };
  });
  /* Los puestos fijos de los siete dias: es el minimo que hay que cubrir */
  let base = 0;
  for(let d = 0; d < 7; d++) base += puestosBaseDia(d, k);
  const trabajo = () => info.reduce((n, x) => n + (x.disp - x.libres), 0);

  /* Cuantos dias libres caben en la semana: la suma de lo que aguanta
     cada dia sin dejar los puestos principales sin gente que los haga. */
  let sitios = 0;
  for(let d = 0; d < 7; d++) sitios += cupoLibresMax(d, k);
  const pedidos = () => info.reduce((n, x) => n + x.libres, 0);

  let vueltas = 0;
  while((trabajo() < base || pedidos() > sitios) && vueltas++ < 30){
    /* Solo se le quita el dia libre a quien YA descansa por la ausencia.
       A quien esta la semana entera no se le toca: antes que dejar a
       alguien siete dias seguidos sin descansar, es mejor decir la verdad
       y avisar de que faltan manos. */
    let cand = info.filter(x => x.libres > x.piso && x.libres > 0 && x.fuera >= 1)
                   .sort((a,b) => (b.fuera - a.fuera) || (a.disp - b.disp));
    if(!cand.length){
      /* Nadie sobra por ausencia. Entonces se le aplaza el segundo dia
         libre a quien tenia turno de dos: pierde el gusto, no el descanso.
         De un dia libre por persona no se baja nunca. */
      cand = info.filter(x => x.libres >= 2 && x.libres > x.piso);
    }
    if(!cand.length) break;      // no queda de donde recortar sin pasarse
    cand[0].libres--;
  }
  const val = {};
  info.forEach(x => val[x.id] = x.libres);
  _libresCache = { k, firma, val };
  return val;
}
function libresSemana(empId, k){
  const m = libresPorPersona(k);
  if(m[empId] != null) return m[empId];
  /* alguien que no esta en la plantilla activa del counter */
  const e = empleado(empId);
  const fuera = diasAusente(empId, k).length;
  const suyos = modoDosUno() ? (leTocanDosLibres(empId, k) ? 2 : 1)
              : ((e && e.dosLibresFijos) ? 2 : (turnoDosLibres(k) === empId ? 2 : 1));
  return Math.max(0, Math.min(suyos, 7 - fuera));
}
/* Dias de trabajo que le tocan a una persona en una semana */
function diasObjetivoDe(empId, k){
  return Math.max(0, 7 - libresSemana(empId, k) - diasAusente(empId, k).length);
}

/* =====================================================================
   ENTRENAMIENTO
   Mientras alguien esta en entrenamiento se le apuntan aparte las cosas
   que todavia no puede hacer: marcas donde no va, turnos que no hace y
   si entra o no en el turno de los dos dias libres seguidos.

   El dia que esta listo se levanta todo de golpe y pasa a trabajar como
   los demas. Y si hiciera falta volver atras, se le devuelven tal cual
   estaban, porque quedaron guardadas.
   ===================================================================== */
function entrenando(e){
  if(typeof e === 'string') e = empleado(e);
  return !!(e && e.entrenamiento && e.entrenamiento.activo);
}
/* =====================================================================
   EL ENTRENAMIENTO CEDE LOS DIAS EN QUE NO SOBRA NADIE
   Las limitaciones del entrenamiento tienen sentido cuando hay gente de
   sobra: si ISAAC no va a la Terminal B ni lleva el uniforme de Hertz,
   siempre queda otro que si. Pero los dias en que solo hay tres o cuatro
   personas no queda otro: esa limitacion deja un puesto principal sin
   nadie, y un mostrador vacio es peor que un uniforme que todavia no
   toca. Esos dias -y solo esos- las limitaciones se levantan.

   Se levanta SOLO lo que quedo apuntado como entrenamiento. Una
   restriccion que pusiste a mano en la ficha manda siempre, la haya el
   dia que la haya.

   Solo mira cuanta gente esta ese dia, que se sabe antes de repartir
   nada: preguntar por quien trabaja seria la pescadilla que se muerde la
   cola, porque quien libra se decide despues.
   ===================================================================== */
const ENTRENO_CEDE = 4;
function entrenoCede(e, d, k){
  if(!(d >= 0)) return false;
  if(typeof e === 'string') e = empleado(e);
  if(!entrenando(e)) return false;
  return disponiblesDia(d, k || SEMANA) <= ENTRENO_CEDE;
}
/* Las marcas y los turnos que esa persona no puede hacer ESE dia */
function vetoPuestos(e, d, k){
  if(typeof e === 'string') e = empleado(e);
  const v = (e && e.puestosProhibidos) || [];
  if(!entrenoCede(e, d, k)) return v;
  const t = (e.entrenamiento || {}).puestos || [];
  return v.filter(id => t.indexOf(id) < 0);
}
function vetoTurnos(e, d, k){
  if(typeof e === 'string') e = empleado(e);
  const v = (e && e.turnosProhibidos) || [];
  if(!entrenoCede(e, d, k)) return v;
  const t = (e.entrenamiento || {}).turnos || [];
  return v.filter(id => t.indexOf(id) < 0);
}
/* Lo que va a cambiar al darle por listo, en palabras, para poder
   ensenarselo antes de tocar nada */
function cambiosAlTerminarEntrenamiento(empId){
  const e = empleado(empId);
  const t = (e && e.entrenamiento) || {};
  const out = [];
  (t.puestos || []).forEach(id => { const p = puesto(id); if(p) out.push('Podra trabajar en <b>' + esc(p.corto) + '</b>'); });
  (t.turnos  || []).forEach(id => { const x = turno(id);  if(x) out.push('Podra hacer el turno <b>' + esc(x.corto) + '</b>'); });
  if(t.sinDosLibres) out.push('Entrara en el turno de <b>2 dias libres seguidos</b>');
  return out;
}
function ponerEntrenamiento(empId, activo){
  const e = empleado(empId);
  if(!e) return;
  if(!e.entrenamiento) e.entrenamiento = { activo:false, puestos:[], turnos:[], sinDosLibres:false };
  const t = e.entrenamiento;
  const rl = S.config.rotacionLibres;
  if(!Array.isArray(e.puestosProhibidos)) e.puestosProhibidos = [];
  if(!Array.isArray(e.turnosProhibidos))  e.turnosProhibidos  = [];

  if(activo){
    (t.puestos || []).forEach(id => { if(e.puestosProhibidos.indexOf(id) < 0) e.puestosProhibidos.push(id); });
    (t.turnos  || []).forEach(id => { if(e.turnosProhibidos.indexOf(id)  < 0) e.turnosProhibidos.push(id); });
    if(t.sinDosLibres){
      const i = rl.orden.indexOf(empId);
      if(i >= 0){
        rl.orden.splice(i, 1);
        if(rl.orden.length && i < rl.inicio) rl.inicio = (rl.inicio - 1 + rl.orden.length) % rl.orden.length;
      }
    }
  } else {
    e.puestosProhibidos = e.puestosProhibidos.filter(id => (t.puestos || []).indexOf(id) < 0);
    e.turnosProhibidos  = e.turnosProhibidos.filter(id  => (t.turnos  || []).indexOf(id) < 0);
    if(t.sinDosLibres && rl.orden.indexOf(empId) < 0) rl.orden.push(empId);
  }
  t.activo = !!activo;
  olvidarRefuerzos();
  olvidarObjetivoTipo();
}
/* Rehace los borradores de esta semana en adelante. Al cambiar quien puede
   hacer que, los repartos ya hechos se quedan viejos; las semanas
   publicadas y las pasadas no se tocan. */
function rehacerBorradoresProximos(){
  const desde = lunesDe(hoyISO());
  const ks = Object.keys(S.semanas)
    .filter(k => k >= desde && S.semanas[k].estado !== 'publicado' &&
                 Object.keys(S.semanas[k].celdas || {}).length)
    .sort();
  /* Se reparte de cero (respetando solo lo que pusiste a mano) y no
     "completando lo que falta": al levantar unas limitaciones, los turnos
     que ya tenia siguen siendo validos y se quedarian pegados. Rehaciendo
     entra de verdad en el reparto de la Terminal B y de las dos marcas. */
  ks.forEach(k => { try { otraAlternativa(k); } catch(e){} });
  return ks.length;
}

/* Visitas a la Terminal B que le tocan: cero a quien tiene esa terminal
   prohibida, para que el resumen no lo marque en rojo cada semana. */
function objetivoBDe(empId){
  const e = empleado(empId);
  if(!e) return S.config.objetivoB;
  const prohibidos = e.puestosProhibidos || [];
  const puedeB = puestosActivos().some(p => p.terminal === 'B' && prohibidos.indexOf(p.id) < 0);
  return puedeB ? S.config.objetivoB : 0;
}

/* =====================================================================
   LOS PUESTOS DEL DIA, POR ORDEN DE IMPORTANCIA
   Este es el corazon del reparto y conviene entenderlo.

   No hay un numero fijo de puestos que haya que cubrir si o si. Hay una
   LISTA ORDENADA, y cada dia se abren tantos puestos como gente haya
   trabajando: primero los principales y, si sobra gente, los de relleno.

   Los principales (marcados "clave") son los que sostienen la operacion:
   la manana y la noche de la Terminal A, y la manana y la noche de la
   Terminal B. Esos son los que nunca deben quedarse sin cubrir. El resto
   amortigua: entra cuando hay manos y se cae cuando no las hay.

   Asi la semana cuadra sola aunque un dia solo trabajen cuatro personas:
   se abren cuatro puestos, no cinco, y no queda nada "sin cubrir".
   ===================================================================== */
/* Esta lista se consulta decenas de miles de veces al armar una semana,
   asi que se guarda hecha. Se vacia en guardar() y al tocar los ajustes. */
let _priCache = null;
let _cortaCache = { k:null, firma:null, dias:null };
function olvidarPrioridad(){ _priCache = null; _cortaCache = { k:null, firma:null, dias:null }; }
function listaPrioridad(){
  if(_priCache) return _priCache.todos;
  const l = (S.config && Array.isArray(S.config.prioridad)) ? S.config.prioridad : [];
  const valida = (x) => x && puesto(x.puestoId) && turno(x.turnoId) &&
                        puesto(x.puestoId).activo && turno(x.turnoId).activo;
  let todos = l.filter(valida);
  /* Si no queda ni un puesto en pie, la aplicacion no abriria ninguno y los
     botones de llenar pareceria que no hacen nada. Antes que eso, se rehace
     la lista de fabrica con lo que si esta en uso. Pasa con datos guardados
     de una version anterior o si alguien desactiva media configuracion. */
  if(!todos.length && S.config){
    S.config.prioridad = prioridadInicial(S.puestos, S.turnos).filter(valida);
    todos = S.config.prioridad.slice();
  }
  const porDia = [], nucleo = [];
  for(let d = 0; d < 7; d++){
    const dia = todos.filter(x => !x.dias || x.dias[d]);
    porDia.push(dia);
    nucleo.push(dia.filter(x => x.clave).length);
  }
  _priCache = { todos, porDia, nucleo };
  return todos;
}
/* =====================================================================
   PLANTILLA CORTA
   Cuando de todo el counter solo quedan cuatro personas disponibles, uno de
   ellos libra y quedan tres. Tres no dan para cuatro puestos principales,
   asi que la Terminal B deja de cubrirse con dos turnos y pasa a cubrirse
   con uno solo de 11 a 7: uno se queda la Terminal B entera y los otros dos
   hacen las dos puntas de la Terminal A.
   Se mira la gente DISPONIBLE, no la que trabaja: quien libra se decide
   despues, a partir de cuantos puestos hay que cubrir, y preguntarlo aqui
   seria una pescadilla que se muerde la cola.
   ===================================================================== */
const PLANTILLA_CORTA = 4;
function turnoUnicoB(){
  const t = S.turnos.find(x => x.corto === '11-7' && x.activo &&
                               (x.equipos || []).indexOf('rotativo') >= 0);
  return t || null;
}
function puestoTerminalB(){
  return S.puestos.find(x => x.terminal === 'B' && x.activo) || null;
}
/* Quien sabe hacer alguno de los cuatro puestos principales DE SIEMPRE.
   Se pregunta contra la lista guardada y no contra la del dia, que es justo
   lo que estamos decidiendo aqui: si no, seria una pescadilla que se muerde
   la cola. */
function sabeCubrirNucleoBase(e, d, k){
  if(!_priCache) listaPrioridad();
  const base = _priCache.porDia[d] || [];
  const vp = vetoPuestos(e, d, k), vt = vetoTurnos(e, d, k);
  return base.some(x => x.clave &&
    vp.indexOf(x.puestoId) < 0 &&
    vt.indexOf(x.turnoId)  < 0) &&
    e.diasDisponibles[d] !== false;
}
function esPlantillaCorta(d, k){
  k = k || SEMANA;
  /* El caso que describio el usuario: solo quedan cuatro personas. */
  if(disponiblesDia(d, k) <= PLANTILLA_CORTA) return true;
  /* Y el mismo problema con otra cara: hay cinco, pero uno de ellos no puede
     hacer ninguno de los principales (por ejemplo alguien en entrenamiento).
     Entonces quedan cuatro aptos, uno de ellos libra, y otra vez son tres
     manos para cuatro puestos. Se aplica la misma solucion. */
  let aptos = 0;
  activos().forEach(e => {
    if(ausenteEnDia(e.id, d, k)) return;
    if(e.libreFijo === d) return;
    if(sabeCubrirNucleoBase(e, d, k)) aptos++;
  });
  return aptos <= PLANTILLA_CORTA;
}
/* Los puestos que se pueden abrir ese dia, ya en orden */
function prioridadDia(d, k){
  if(!_priCache) listaPrioridad();
  const normal = _priCache.porDia[d] || [];
  k = k || SEMANA;
  if(!esPlantillaCorta(d, k)) return normal;
  const tB = turnoUnicoB(), pB = puestoTerminalB();
  if(!tB || !pB) return normal;
  /* memoria: esto se consulta miles de veces al armar una semana */
  const firma = activos().map(e => e.id + ':' + diasAusente(e.id, k).length).join(',');
  if(!(_cortaCache.k === k && _cortaCache.firma === firma)) _cortaCache = { k, firma, dias:[] };
  if(_cortaCache.dias[d]) return _cortaCache.dias[d];
  /* fuera los dos principales de la Terminal B, y en su lugar el turno unico */
  const out = normal.filter(x => !(x.clave && x.puestoId === pB.id));
  /* Y delante de todo. La Terminal B es la que nunca puede quedarse sin
     nadie, asi que es el primer puesto que se abre: los puestos se abren
     por orden y en cuanto no dan las manos se cae el ultimo. Antes iba
     detras de las dos puntas de la Terminal A y era justo la Terminal B
     la que se quedaba vacia los dias mas cortos. */
  out.unshift({ puestoId:pB.id, turnoId:tB.id, dias:[1,1,1,1,1,1,1], clave:true, unicoB:true });
  _cortaCache.dias[d] = out;
  return out;
}
/* Cuantos de ellos son principales */
function nucleoDia(d, k){
  if(esPlantillaCorta(d, k)) return prioridadDia(d, k).filter(x => x.clave).length;
  if(!_priCache) listaPrioridad();
  return _priCache.nucleo[d] || 0;
}
/* Lo que antes era "los puestos fijos": ahora es el nucleo, que es lo
   unico que de verdad hay que cubrir siempre */
function puestosBaseDia(d, k){ return nucleoDia(d, k); }
/* =====================================================================
   CUANTA GENTE PUEDE LIBRAR UN DIA
   Sale de restar los puestos de ese dia a la plantilla, pero nunca pasa
   del tope que hay en Ajustes (2 por defecto). Es el unico sitio donde se
   calcula: antes cada pantalla hacia su propia cuenta.
   ===================================================================== */
/* Los puestos que se abren de verdad ese dia: tantos como gente trabaje,
   sin pasar de los que hay en la lista */
function puestosDia(d, k){
  k = k || SEMANA;
  return Math.min(prioridadDia(d, k).length, trabajanDia(d, k));
}
/* =====================================================================
   QUIEN PUEDE SOSTENER LOS PUESTOS PRINCIPALES
   No basta con contar cabezas: alguien en entrenamiento que solo va a una
   marca no sirve para cubrir la manana de Hertz. Si ese dia no quedan
   suficientes personas que SI puedan, no se puede dejar librar a nadie
   mas, por muchos que sean.
   ===================================================================== */
/* ¿Sabe esta persona hacer alguno de los puestos principales de ese dia?
   Con 'ignorarFijo' se pregunta sin contar su dia libre fijo, que es lo que
   hace falta para decidir si ese dia fijo tiene que ceder. */
function sabeCubrirNucleo(e, d, k){
  const vp = vetoPuestos(e, d, k), vt = vetoTurnos(e, d, k);
  return prioridadDia(d, k).some(x => x.clave &&
    vp.indexOf(x.puestoId) < 0 &&
    vt.indexOf(x.turnoId)  < 0) &&
    e.diasDisponibles[d] !== false;
}
function puedeCubrirNucleo(e, d, k){
  return sabeCubrirNucleo(e, d, k) && e.libreFijo !== d;
}
/* Los que saben y ademas ese dia no lo tienen libre fijo. Es la cuenta
   "si se respetan todos los dias fijos", la que usa fijoVigente para saber
   si alguno tiene que ceder. */
function capacesRespetandoFijos(d, k){
  k = k || SEMANA;
  return activos().filter(e => !ausenteEnDia(e.id, d, k) && puedeCubrirNucleo(e, d, k)).length;
}
/* Los que de verdad van a poder cubrir un principal ese dia, ya contando
   que algun dia fijo puede haber cedido. */
function capacesNucleo(d, k){
  k = k || SEMANA;
  return activos().filter(e => !ausenteEnDia(e.id, d, k) &&
                               sabeCubrirNucleo(e, d, k) &&
                               fijoVigente(e, k) !== d).length;
}
/* El dia libre fijo de esa persona ESA semana. Si cae dentro de unas
   vacaciones o un permiso, esa semana no manda: ya esta descansando ese
   dia, y seguir exigiendolo dejaria a la persona sin ningun dia libre de
   verdad. Lo destapo ALAN, que libra los domingos, con un permiso de
   sabado y domingo. */
function fijoVigente(e, k){
  if(typeof e === 'string') e = empleado(e);
  if(!e || !(e.libreFijo >= 0)) return -1;
  k = k || SEMANA;
  const d = e.libreFijo;
  /* si ese dia esta de vacaciones o de permiso, no es un dia libre suyo */
  if(ausenteEnDia(e.id, d, k)) return -1;
  /* Y si sin el no quedan bastantes que puedan cubrir los puestos
     principales, su dia fijo cede: cubrir lo principal manda sobre la
     comodidad de librar siempre el mismo dia. Ese descanso no se pierde,
     se lo lleva a otro dia de la misma semana. */
  if(sabeCubrirNucleo(e, d, k) && capacesRespetandoFijos(d, k) < nucleoDia(d, k)) return -1;
  return d;
}
/* Quien libra ese dia si o si porque lo tiene fijo en su ficha */
function libresForzados(d, k){
  k = k || SEMANA;
  return activos().filter(e => fijoVigente(e, k) === d).length;
}
/* Cuanta gente puede librar ese dia COMO MUCHO. Es el limite de verdad:
   por encima de el, o falta gente para los puestos principales, o falta
   gente que pueda hacerlos.
   Los dias libres fijos van aparte: no se negocian, asi que no compiten
   por el cupo, se suman a el. */
function cupoLibresIdeal(d, k){
  k = k || SEMANA;
  const disp = disponiblesDia(d, k);
  const forz = libresForzados(d, k);
  const nuc  = nucleoDia(d, k);
  const tope = S.config.maxLibresDia >= 1 ? S.config.maxLibresDia : 2;
  /* Dos limites a la vez: que queden cabezas para los puestos principales
     y que las que queden PUEDAN hacerlos. Lo segundo importa: si de seis
     personas libran dos y una de las cuatro que quedan esta en
     entrenamiento, solo hay tres manos para cuatro puestos principales.
     capacesNucleo ya deja fuera a quien tiene ese dia como libre fijo, por
     eso los libres fijos se suman aparte y no compiten por el cupo. */
  const extra = Math.max(0, Math.min(disp - forz - nuc, capacesNucleo(d, k) - nuc, tope - forz));
  return Math.max(minLibresDia(d, k), forz + extra);
}
/* El techo de verdad de cada dia.
   Se parte del ideal, y si los descansos que la semana debe repartir no
   caben en el, se sube. Es una decision, no un descuido: antes que dejar a
   alguien siete dias seguidos trabajando se prefiere abrir el descanso y
   avisar de que falta cubrir un puesto principal, que es la verdad y se ve
   en la propia hoja. */
let _techoCache = { k:null, firma:null, val:null };
function techoLibres(k){
  k = k || SEMANA;
  const emps = activos();
  const turno2 = turnoDosLibres(k);
  const firma = emps.map(e => e.id + ':' + diasAusente(e.id, k).length +
                              (e.dosLibresFijos ? 'F' : '')).join(',') + '|' + (turno2 || '-');
  if(_techoCache.k === k && _techoCache.firma === firma) return _techoCache.val;
  const t = [];
  for(let d = 0; d < 7; d++) t.push(cupoLibresIdeal(d, k));
  /* Los descansos que la semana debe SI O SI: uno por cabeza. El segundo
     dia de quien tiene turno de dos no entra aqui a proposito. Si la
     semana viene justa se prefiere aplazarle el turno de dos (lo hace
     libresPorPersona) antes que ensanchar el cupo y perder un puesto
     principal: el segundo dia es un gusto y vuelve, un mostrador vacio no.
     Aqui no se puede preguntar por libresSemana: ese es justo quien nos
     llama para saber si recorta, y se armaria la pescadilla que se muerde
     la cola. */
  let deben = 0;
  emps.forEach(e => { if(diasAusente(e.id, k).length < 7) deben++; });
  let sitios = t.reduce((a, b) => a + b, 0);
  const tope = S.config.maxLibresDia >= 1 ? S.config.maxLibresDia : 2;
  let v = 0;
  while(sitios < deben && v++ < 30){
    /* se ensancha siempre el dia mas vacio, para repartir el estropicio */
    let mejor = -1;
    for(let d = 0; d < 7; d++){
      if(t[d] >= Math.min(tope, disponiblesDia(d, k))) continue;
      if(mejor < 0 || t[d] < t[mejor]) mejor = d;
    }
    if(mejor < 0) break;
    t[mejor]++; sitios++;
  }
  _techoCache = { k, firma, val:t };
  return t;
}
function cupoLibresMax(d, k){
  return techoLibres(k || SEMANA)[d] || 0;
}
/* Cuanta gente libra ese dia segun el plan de la semana. Es lo que usa el
   reparto automatico, para que los puestos que se abren y los dias libres
   que se reparten sean la misma cuenta y no se contradigan. */
function cupoLibres(d, k){
  k = k || SEMANA;
  return libranPorDia(k)[d] || 0;
}
/* El minimo de gente que TIENE que librar ese dia: si hay mas gente que
   puestos en la lista, alguien sobra y su sitio es el descanso */
function minLibresDia(d, k){
  return Math.max(0, disponiblesDia(d, k || SEMANA) - prioridadDia(d, k).length);
}
/* Cuantos libran de verdad ese dia en lo que hay guardado */
function libranEse(d, k){
  let n = 0;
  activos().forEach(e => { if(esLibreReal(celda(e.id, d, k))) n++; });
  return n;
}

/* =====================================================================
   CUANTA GENTE TRABAJA CADA DIA
   Es la resta entre quien esta y quien libra. Los dias libres se predicen
   con la rotacion (que es deterministica) y con lo que hayas fijado tu a
   mano, asi que se puede saber antes de repartir nada. De aqui sale
   cuantos puestos se abren.
   ===================================================================== */
/* Donde va a librar cada persona esa semana, esquivando los dias en que
   esta de vacaciones o de licencia */
function librePrevistoDe(empId, k){
  k = k || SEMANA;
  const n = libresSemana(empId, k);
  if(!n) return [];
  /* lo que fijaste tu manda */
  const w = S.semanas[k];
  if(w && w.celdas){
    const aMano = [];
    for(let d = 0; d < 7; d++){
      const c = w.celdas[ck(empId, d)];
      if(esLibreReal(c) && (c.o === 'manual' || c.b)) aMano.push(d);
    }
    if(aMano.length) return aMano.slice(0, n);
  }
  const bloque = n >= 2 ? bloqueDosLibres(empId, k) : [diaLibreIdeal(empId, k)];
  /* El bloque de dos se mueve ENTERO. Si se empujara dia a dia, un permiso
     de un solo dia en medio partiria los dos libres y quedarian sueltos,
     que es justo lo que no se quiere. */
  if(bloque.length >= 2){
    for(let i = 0; i < 7; i++){
      const a = (bloque[0] + i) % 7, b = (a + 1) % 7;
      if(!ausenteEnDia(empId, a, k) && !ausenteEnDia(empId, b, k)) return [a, b];
    }
    /* si no hay dos dias seguidos fuera de la ausencia, se sigue abajo y se
       da lo que quepa */
  }
  /* si algun dia del bloque cae en una ausencia, se busca el siguiente
     dia en que si esta: un dia libre dentro de las vacaciones no cuenta */
  const out = [];
  bloque.forEach(d0 => {
    let d = d0;
    for(let i = 0; i < 7 && (ausenteEnDia(empId, d, k) || out.indexOf(d) >= 0); i++) d = (d + 1) % 7;
    if(!ausenteEnDia(empId, d, k) && out.indexOf(d) < 0) out.push(d);
  });
  return out;
}
/* Mientras se esta armando una semana, los dias libres YA estan puestos en
   el borrador. Los puestos que se abren cada dia tienen que contar esos, no
   los que el plan preveia: si no, el plan dice "el lunes libran cero", el
   reparto ha puesto dos, y ese dia se abren dos puestos que no hay quien
   ocupe. Con esto las dos cuentas miran siempre lo mismo. */
let _libranAhora = null;
function fijarLibranDe(ctx){
  const v = [0,0,0,0,0,0,0];
  for(let d = 0; d < 7; d++)
    activos().forEach(e => { if(esLibreReal(ctx.celdas[ck(e.id, d)])) v[d]++; });
  _libranAhora = v;
}
function soltarLibran(){ _libranAhora = null; }
/* Una semana esta armada cuando TODOS tienen sus siete casillas puestas.
   A medio llenar no vale: si se contaran los libres de una hoja con dos
   celdas, saldria que no libra nadie y se abririan puestos de mas. */
function semanaArmada(k){
  const w = S.semanas[k || SEMANA];
  if(!w || !w.celdas) return false;
  const emps = activos();
  if(!emps.length) return false;
  for(const e of emps)
    for(let d = 0; d < 7; d++) if(!w.celdas[ck(e.id, d)]) return false;
  return true;
}
let _trabCache = { k:null, firma:null, val:null };
function libranPorDia(k){
  if(_libranAhora) return _libranAhora;
  k = k || SEMANA;
  /* Si la semana ya esta armada, la cuenta buena es la de la propia hoja:
     lo que se ve es lo que hay. La prevision de mas abajo solo sirve para
     semanas que aun no existen. */
  if(semanaArmada(k)){
    const w = S.semanas[k];
    const v = [0,0,0,0,0,0,0];
    for(let d = 0; d < 7; d++)
      activos().forEach(e => { if(esLibreReal(w.celdas[ck(e.id, d)])) v[d]++; });
    return v;
  }
  const emps = activos();
  const firma = emps.map(e => e.id + ':' + diasAusente(e.id, k).length + ':' + libresSemana(e.id, k)).join(',');
  if(_trabCache.k === k && _trabCache.firma === firma) return _trabCache.val;
  /* El techo de cada dia se calcula primero, sin depender de nadie: asi no
     hay pescadilla que se muerde la cola. */
  const techo = [];
  for(let d = 0; d < 7; d++) techo.push(cupoLibresMax(d, k));
  const libran = [0,0,0,0,0,0,0];
  /* Los mas atados primero: quien tiene dia libre fijo o esta de baja
     tiene menos donde elegir, asi que coge sitio antes. */
  const ataduraDe = e => (e.libreFijo >= 0 ? 2 : 0) + (libresSemana(e.id, k) >= 2 ? 1 : 0);
  emps.slice().sort((a,b) => ataduraDe(b) - ataduraDe(a))
      .forEach(e => {
    librePrevistoDe(e.id, k).forEach(d0 => {
      let d = d0;
      for(let i = 0; i < 7; i++){
        if(libran[d] < techo[d] && !ausenteEnDia(e.id, d, k)) break;
        d = (d + 1) % 7;
      }
      /* Si no cabe en ningun dia, esa persona no libra esa semana. Se vera
         en el aviso de que faltan manos, que es la verdad. */
      if(libran[d] < techo[d] && !ausenteEnDia(e.id, d, k)) libran[d]++;
    });
  });
  _trabCache = { k, firma, val:libran };
  return libran;
}
function trabajanDia(d, k){
  k = k || SEMANA;
  return Math.max(0, disponiblesDia(d, k) - (libranPorDia(k)[d] || 0));
}

/* Las cuentas del dia se consultan miles de veces al generar una semana.
   Sin esta memoria cada consulta rehacia el calculo entero y la
   aplicacion se volvia diez veces mas lenta. Se vacia en guardar(). */
let _refCache = {};
function olvidarRefuerzos(){
  _refCache = {};
  try { olvidarLibresServicio(); } catch(e){}
  _trabCache = { k:null, firma:null, val:null };
  _techoCache = { k:null, firma:null, val:null };
  try { olvidarLibres(); } catch(e){}
  try { olvidarPrioridad(); } catch(e){}
}
/* =====================================================================
   EL DIA LIBRE QUE LE TOCA A CADA UNO POR ROTACION
   Avanza un dia por semana. Esa es justo la cuenta que hace que entre dos
   semanas nunca se junten mas de 7 dias seguidos de trabajo: si esta
   semana libras el martes y la siguiente el miercoles, en medio trabajas
   siete dias clavados.
   ===================================================================== */
function diaLibreIdeal(empId, k){
  const e = empleado(empId);
  /* Quien tiene dia libre fijo no rota: su dia es siempre el mismo. Salvo
     la semana en que ese dia le cae dentro de una ausencia: entonces entra
     en la rotacion como los demas para no quedarse sin descanso. */
  const fj = fijoVigente(e, k);
  if(fj >= 0) return fj;
  /* Los demas giran por los dias que quedan, saltandose los que ya son de
     alguien. Si no se saltaran, cada semana a uno le tocaria por rotacion
     el dia que otro tiene fijo, tendria que moverse, y ese empujon se iba
     encadenando hasta descolocar a media plantilla. */
  const fijos = {};
  activos().forEach(x => { if(x.libreFijo >= 0) fijos[x.libreFijo] = 1; });
  const dias = [];
  for(let d = 0; d < 7; d++) if(!fijos[d]) dias.push(d);
  if(!dias.length) return 0;
  const giran = activos().filter(x => x.libreFijo < 0);
  const i = giran.findIndex(x => x.id === empId);
  if(i < 0) return dias[0];
  const n = ((semanasAbsolutas(k) % dias.length) + dias.length) % dias.length;
  return dias[(i + n) % dias.length];
}
/* Donde van a caer los dos dias libres seguidos de quien le toca. Casi
   siempre empiezan en su dia de rotacion, pero quien tiene dia libre fijo
   (ALAN los domingos) arrastra el bloque para incluirlo. */
function bloqueDosLibres(empId, k){
  const e = empleado(empId);
  const ideal = diaLibreIdeal(empId, k);
  const f = fijoVigente(e, k);
  if(!e || f < 0) return bloqueDias(ideal, 2);
  /* con dia fijo solo caben dos bloques: el de antes y el de despues.
     Se elige el que quede mas cerca de su dia de rotacion. */
  const dist = (c) => { const d = Math.abs(c - ideal); return Math.min(d, 7 - d); };
  const a = (f + 6) % 7;
  return bloqueDias(dist(a) <= dist(f) ? a : f, 2);
}
/* Los dias en que un puesto de relleno no entra, para poder decirlo en
   pantalla: son aquellos en que no hay gente para toda la lista */
function diasSinRelleno(k){
  const out = [];
  for(let d = 0; d < 7; d++) if(puestosDia(d, k) < prioridadDia(d, k).length) out.push(d);
  return out;
}
/* Cambiar a mano a quien le tocan los dos libres mueve las cuentas */
function olvidarSemana(k){
  for(const x in _refCache) if(x.indexOf(k + '|') === 0) delete _refCache[x];
  _trabCache = { k:null, firma:null, val:null };
  _techoCache = { k:null, firma:null, val:null };
  try { olvidarLibres(); } catch(e){}
}

/* El objetivo "de la semana" para textos generales: lo que trabaja la mayoria */
function diasObjetivo(k){ return 6; }
function horasObjetivo(k){ return diasObjetivo(k) * 8; }
function semanasAbsolutas(k){
  return Math.round((s2d(k) - s2d(S.config.semanaRef)) / (7*86400000));
}
function semanasDesdeRef(k){
  const dif = Math.round((s2d(k) - s2d(S.config.semanaRef)) / (7*86400000));
  return ((dif % 7) + 7) % 7;
}

/* Un bloque de dias libres seguidos, dando la vuelta a la semana si hace falta */
function bloqueDias(inicio, n){
  const out = [];
  for(let j = 0; j < n; j++) out.push((inicio + j) % 7);
  return out;
}
/* Comprueba que unos dias libres van pegados (domingo y lunes cuentan como seguidos) */
function diasSeguidos(dias){
  if(!dias || dias.length <= 1) return true;
  const seguidos = (arr) => { for(let i = 1; i < arr.length; i++) if(arr[i] !== arr[i-1] + 1) return false; return true; };
  const s = dias.slice().sort((a,b) => a-b);
  if(seguidos(s)) return true;
  const rot = dias.map(x => (x + 1) % 7).sort((a,b) => a-b);
  return seguidos(rot);
}

/* Todas las formas de elegir n dias de la semana, pegados o no.
   Con n=2 salen 21 combinaciones; con n=1, las 7 del calendario. */
function combosDias(n){
  const out = [];
  const paso = (inicio, actual) => {
    if(actual.length === n){ out.push(actual.slice()); return; }
    for(let d = inicio; d < 7; d++){ actual.push(d); paso(d + 1, actual); actual.pop(); }
  };
  if(n > 0 && n <= 7) paso(0, []);
  return out;
}

/* Cuantos dias de trabajo quedan metidos entre unos dias libres sueltos.
   Cero cuando van pegados. Sirve para preferir la separacion mas pequena. */
function separacion(dias){
  if(!dias || dias.length <= 1) return 0;
  const s = dias.slice().sort((a,b) => a-b);
  const huecos = [];
  for(let i = 1; i < s.length; i++) huecos.push(s[i] - s[i-1] - 1);
  huecos.push((s[0] + 7) - s[s.length-1] - 1);          // el salto que da la vuelta a la semana
  const mayor = Math.max.apply(null, huecos);           // ese es el bloque de trabajo normal
  return huecos.reduce((a,b) => a + b, 0) - mayor;      // lo demas son dias sueltos en medio
}

/* ---------- cobertura ---------- */
function cob(puestoId, turnoId){
  const k = puestoId + '|' + turnoId;
  let c = S.cobertura[k];
  if(!c || typeof c !== 'object') c = S.cobertura[k] = { dias:Array(7).fill(0), extra:Array(7).fill(0) };
  // acepta el formato antiguo {min,max} y lo convierte
  if(!Array.isArray(c.dias)) c.dias = Array.isArray(c.min) ? c.min.slice(0,7) : Array(7).fill(0);
  if(!Array.isArray(c.extra)) c.extra = Array(7).fill(0);
  while(c.dias.length < 7) c.dias.push(0);
  while(c.extra.length < 7) c.extra.push(0);
  for(let i = 0; i < 7; i++){
    if(!(c.dias[i] >= 0)) c.dias[i] = 0;
    if(!(c.extra[i] >= 0)) c.extra[i] = 0;
  }
  delete c.min; delete c.max;
  return c;
}
/* =====================================================================
   ¿HACE FALTA ESTE PUESTO ESE DIA?
   Se mira su sitio en la lista de prioridad: si entra dentro de los
   puestos que se abren ese dia (tantos como gente trabaje), hace falta.
   Si no, ese dia no se abre y no cuenta como "sin cubrir".
   ===================================================================== */
function cobNec(puestoId, turnoId, d, k){
  const lista = prioridadDia(d, k);
  const i = lista.findIndex(x => x.puestoId === puestoId && x.turnoId === turnoId);
  if(i < 0) return 0;
  return i < puestosDia(d, k) ? 1 : 0;
}
/* Si ese puesto es de los principales */
function esPuestoClave(puestoId, turnoId, d, k){
  const x = prioridadDia(d, k).find(y => y.puestoId === puestoId && y.turnoId === turnoId);
  return !!(x && x.clave);
}
function combinaciones(){
  const vistos = {}, out = [];
  const meter = (puestoId, turnoId) => {
    const key = puestoId + '|' + turnoId;
    if(vistos[key]) return;
    vistos[key] = 1;
    out.push({ puestoId, turnoId });
  };
  /* Solo lo que existe de verdad: una linea que apunte a una marca o a un
     turno borrado no tiene nada que abrir. */
  listaPrioridad().forEach(x => { if(puesto(x.puestoId) && turno(x.turnoId)) meter(x.puestoId, x.turnoId); });
  /* El turno unico de la Terminal B no esta en la lista guardada: aparece
     solo los dias de plantilla corta. Si no se metiera aqui, el reparto no
     lo veria nunca y esos dias la Terminal B se quedaria sin nadie. */
  const tB = turnoUnicoB(), pB = puestoTerminalB();
  if(tB && pB) meter(pB.id, tB.id);
  return out;
}
/* Turnos y puestos que exige la semana completa */
function necesidadSemanal(k){
  let turnosN = 0;
  for(let d = 0; d < 7; d++) for(const cmb of combinaciones()) turnosN += cobNec(cmb.puestoId, cmb.turnoId, d, k);
  return { turnos: turnosN, horas: turnosN * 8 };
}

/* ---------- semanas y celdas ---------- */
function semana(k){
  k = k || SEMANA;
  const w = S.semanas[k];
  if(!w || typeof w !== 'object') S.semanas[k] = { estado:'borrador', publicado:null, modificado:null, celdas:{}, tipo:null };
  else if(!w.celdas || typeof w.celdas !== 'object') w.celdas = {};
  return S.semanas[k];
}
const ck = (empId, d) => empId + '_' + d;
function celda(empId, d, k){ return semana(k).celdas[ck(empId,d)] || null; }

/* Dias que la persona tiene reservados por ficha: dia libre fijo y dias en
   los que no esta disponible. No es una preferencia ni un aviso: ahi no se
   pone un turno por ninguna via. */
function diaReservado(empId, d, k){
  const e = empleado(empId);
  if(!e) return false;
  if(fijoVigente(e, k) === d) return true;
  if(e.diasDisponibles && e.diasDisponibles[d] === false) return true;
  if(ausenteEnDia(empId, d, k || SEMANA)) return true;   // vacaciones, licencia o permiso
  return false;
}

function ponerCelda(empId, d, turnoId, puestoId, origen, bloqueada, k){
  const w = semana(k);
  /* Candado unico: da igual si viene de asignar, de arrastrar, de un
     reemplazo, de un intercambio o de duplicar la semana anterior. */
  if(turnoId != null && turnoId !== LIBRE && diaReservado(empId, d, k)){
    const e = empleado(empId);
    const aus = celdaAusencia(empId, d, k);
    if(aus) w.celdas[ck(empId,d)] = aus;                 // vacaciones, licencia o permiso
    else if(e && fijoVigente(e, k) === d) w.celdas[ck(empId,d)] = { t:LIBRE, p:null, o:'auto', b:false, fijo:true };
    else delete w.celdas[ck(empId,d)];
    w.modificado = new Date().toISOString();
    return false;
  }
  if(turnoId == null) delete w.celdas[ck(empId,d)];
  else w.celdas[ck(empId,d)] = { t:turnoId, p: turnoId === LIBRE ? null : (puestoId || null), o:origen || 'manual', b: !!bloqueada };
  w.modificado = new Date().toISOString();
  return true;
}

/* =====================================================================
   ARREGLO AUTOMATICO DE UNA SEMANA
   Recorre lo guardado y quita los turnos que se saltan un dia reservado.
   Sirve para las semanas hechas antes de poner la regla: se corrigen solas
   al abrirlas, sin tener que regenerar nada a mano.
   ===================================================================== */
function sanearSemana(k){
  const w = S.semanas[k];
  if(!w || !w.celdas) return 0;
  /* Primero las ausencias: son datos de fechas, mandan sobre lo repartido */
  let n = marcarAusencias(k);
  for(const e of activosTodos()){
    for(let d = 0; d < 7; d++){
      const key = ck(e.id, d);
      const c = w.celdas[key];
      if(!c || c.t === LIBRE) continue;
      if(!chocaConReglaDura(e.id, d, c, k)) continue;
      /* El dia libre fijo deja la casilla en "Libre"; lo demas la vacia
         para que se vuelva a repartir. */
      const ausK = celdaAusencia(e.id, d, k);
      if(ausK) w.celdas[key] = ausK;                       // la ausencia manda sobre el libre fijo
      else if(fijoVigente(e, k) === d) w.celdas[key] = { t:LIBRE, p:null, o:'auto', b:false, fijo:true };
      else delete w.celdas[key];
      n++;
    }
  }
  return n;
}

/* ---------- cuentas de la semana ---------- */
function horasSemana(empId, k){
  let h = 0;
  for(let d = 0; d < 7; d++){
    const c = celda(empId, d, k);
    if(c && c.t !== LIBRE) h += horasTurno(turno(c.t));
  }
  return Math.round(h*10)/10;
}
function diasTrabajados(empId, k){
  let n = 0;
  for(let d = 0; d < 7; d++){ const c = celda(empId,d,k); if(c && c.t !== LIBRE) n++; }
  return n;
}
function visitasB(empId, k){
  let n = 0;
  for(let d = 0; d < 7; d++){ const c = celda(empId,d,k); if(c && c.t !== LIBRE && esTerminalB(c.p)) n++; }
  return n;
}
/* =====================================================================
   BLOQUE 1B - SINCRONIZACION EN LA NUBE (opcional)
   Guarda una copia de toda la informacion en Supabase para que varias
   computadoras trabajen con los mismos datos. Si no se configura,
   la aplicacion funciona igual usando solo el navegador.
   ===================================================================== */

const NUBE_TABLA = 'horarios';
let _nubeTimer = null;      // espera antes de subir, para no mandar en cada tecla
let _nubeBajando = false;   // evita subir mientras se esta bajando
let _nubeEstado = '';       // texto que se muestra al usuario

function nubeConfig(){
  if(!S.nube) S.nube = { url:'', clave:'', activa:false, id:'principal', ultima:null };
  return S.nube;
}
function nubeLista(){
  const n = nubeConfig();
  return !!(n.activa && n.url && n.clave);
}
function nubeCabeceras(clave){
  return { apikey:clave, Authorization:'Bearer ' + clave, 'Content-Type':'application/json' };
}
function nubeBase(url){
  return String(url).trim().replace(/\/+$/,'') + '/rest/v1/' + NUBE_TABLA;
}
function nubeMensajeError(e){
  const t = String(e && e.message ? e.message : e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(t))
    return 'No se pudo contactar con la nube. Revisa tu conexion a internet y que la direccion del proyecto este bien escrita.';
  if(/relation .* does not exist|42P01/i.test(t))
    return 'La tabla "horarios" todavia no existe en tu proyecto. Copia el texto de la casilla de abajo y ejecutalo en Supabase.';
  if(/JWT|apikey|401|Invalid/i.test(t))
    return 'La clave no es valida. Copia de nuevo la clave publica (anon) desde Supabase.';
  return t;
}

/* Comprueba que la direccion y la clave funcionen */
async function nubeProbar(url, clave, id){
  const r = await fetch(nubeBase(url) + '?id=eq.' + encodeURIComponent(id) + '&select=id,actualizado',
    { headers: nubeCabeceras(clave) });
  const txt = await r.text();
  if(!r.ok) throw new Error(txt || ('Error ' + r.status));
  const filas = JSON.parse(txt || '[]');
  return { existe: filas.length > 0, actualizado: filas.length ? filas[0].actualizado : null };
}

/* Sube toda la informacion (la clave de la nube no se sube) */
async function nubeSubir(){
  if(!nubeLista()) return;
  const n = nubeConfig();
  const copia = JSON.parse(JSON.stringify(S));
  delete copia.nube;
  const cuando = new Date().toISOString();
  const r = await fetch(nubeBase(n.url), {
    method:'POST',
    headers: Object.assign(nubeCabeceras(n.clave), { Prefer:'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ id:n.id, datos:copia, actualizado:cuando }])
  });
  if(!r.ok) throw new Error(await r.text());
  n.ultima = cuando;
  _nubeEstado = 'Guardado en la nube a las ' + new Date(cuando).toLocaleTimeString('es');
  localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(S));
  pintarEstadoNube();
}

/* Trae la informacion de la nube y reemplaza la local */
async function nubeBajar(){
  if(!nubeLista()) return false;
  const n = nubeConfig();
  const r = await fetch(nubeBase(n.url) + '?id=eq.' + encodeURIComponent(n.id) + '&select=datos,actualizado',
    { headers: nubeCabeceras(n.clave) });
  if(!r.ok) throw new Error(await r.text());
  const filas = JSON.parse((await r.text()) || '[]');
  if(!filas.length) return false;
  _nubeBajando = true;
  const guardadaNube = JSON.parse(JSON.stringify(n));
  S = filas[0].datos;
  S.nube = guardadaNube;
  S.nube.ultima = filas[0].actualizado;
  localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(S));
  _nubeBajando = false;
  _nubeEstado = 'Datos traidos de la nube (' + new Date(filas[0].actualizado).toLocaleString('es') + ')';
  return true;
}

/* Se llama despues de cada cambio: espera un momento y sube */
function nubeProgramarSubida(){
  if(!nubeLista() || _nubeBajando) return;
  clearTimeout(_nubeTimer);
  _nubeEstado = 'Guardando en la nube...';
  pintarEstadoNube();
  _nubeTimer = setTimeout(() => {
    _nubeTimer = null;              // sin esto la vigilancia se quedaba bloqueada
    nubeSubir().catch(e => { _nubeEstado = 'No se pudo guardar en la nube: ' + nubeMensajeError(e); pintarEstadoNube(); });
  }, 1500);
}

/* Al abrir la aplicacion: se queda con la version mas reciente */
async function nubeSincronizarInicio(){
  if(!nubeLista()) return;
  try {
    const n = nubeConfig();
    const info = await nubeProbar(n.url, n.clave, n.id);
    if(!info.existe){ await nubeSubir(); return; }
    const localTxt = S.semanas ? JSON.stringify(S).length : 0;
    if(!n.ultima || info.actualizado > n.ultima){ await nubeBajar(); }
    else if(info.actualizado < n.ultima && localTxt){ await nubeSubir(); }
    else { await nubeBajar(); }
  } catch(e){
    _nubeEstado = 'Trabajando sin nube: ' + nubeMensajeError(e);
  }
  pintarEstadoNube();
}

/* =====================================================================
   VIGILANCIA: avisa cuando el otro equipo guarda algo nuevo
   No baja nada por su cuenta para no pisarte lo que estes haciendo:
   solo te lo dice y tu decides cuando traerlo.
   ===================================================================== */
let _nubeVigila = null;
let _nubeHayCambios = null;      // fecha del cambio pendiente, o null
let _ultimaEdicion = 0;          // cuando tocaste algo por ultima vez
const ESPERA_EDITANDO = 20000;   // si acabas de editar, no se toca nada solo

function marcarEdicion(){ _ultimaEdicion = Date.now(); }
function estasEditando(){ return (Date.now() - _ultimaEdicion) < ESPERA_EDITANDO; }

function nubeVigilar(){
  clearInterval(_nubeVigila);
  if(!nubeLista()) return;
  _nubeVigila = setInterval(nubeMirarCambios, 15000);
}
async function nubeMirarCambios(){
  if(!nubeLista() || _nubeBajando || _nubeTimer) return;
  try {
    const n = nubeConfig();
    const info = await nubeProbar(n.url, n.clave, n.id);
    if(info.existe && n.ultima && info.actualizado > n.ultima){
      _nubeHayCambios = info.actualizado;
      /* Si no estas editando, se actualiza solo. Si estas a media faena,
         se avisa y decides tu, para no pisarte lo que llevas hecho. */
      if(!estasEditando()) traerCambios(true);
      else pintarAvisoNube();
    }
  } catch(e){}
}
/* =====================================================================
   BOTON "ACTUALIZAR"
   nubeMirarCambios() es la vigilancia de fondo: esta hecha para no molestar,
   asi que si no hay nada nuevo se calla y si estas editando no toca nada.
   Eso servia para el reloj, pero al pulsar un boton parecia que no hacia
   nada. Esta funcion siempre mira, siempre responde y siempre avisa.
   ===================================================================== */
let _actualizando = false;

async function actualizarAhora(){
  if(_actualizando) return;
  if(!nubeLista()){
    modal('La nube no esta conectada',
      '<p>Este equipo esta trabajando <b>solo con su navegador</b>, asi que no hay nada que traer.</p>' +
      '<p class="muted">Para que dos equipos compartan los horarios hay que conectar la nube una sola vez.</p>',
      '<button class="btn sec" onclick="cerrar()">Cerrar</button>' +
      '<button class="btn" onclick="cerrar();ir(\'ajustes\')">Ir a Ajustes</button>');
    return;
  }
  _actualizando = true;
  const bt = document.getElementById('btnActualizar');
  if(bt){ bt.disabled = true; bt.textContent = 'Buscando...'; }
  try {
    /* Si habia una subida en cola, se manda antes: si no, se bajaria
       la version de la nube encima de lo que acabas de escribir. */
    if(_nubeTimer){ clearTimeout(_nubeTimer); _nubeTimer = null; await nubeSubir(); }

    const n = nubeConfig();
    const info = await nubeProbar(n.url, n.clave, n.id);

    if(!info.existe){
      await nubeSubir();
      toast('La nube estaba vacia: se subio lo de este equipo');
    } else if(!n.ultima || info.actualizado > n.ultima){
      _nubeHayCambios = null; pintarAvisoNube();
      await nubeBajar();
      render();
      toast('Actualizado con los cambios del otro equipo');
    } else if(info.actualizado < n.ultima){
      await nubeSubir();
      toast('Este equipo tenia lo mas reciente: se subio a la nube');
    } else {
      _nubeHayCambios = null; pintarAvisoNube();
      toast('Ya tienes lo ultimo (' + new Date(info.actualizado).toLocaleTimeString('es') + ')');
    }
  } catch(e){
    _nubeEstado = nubeMensajeError(e);
    pintarEstadoNube();
    modal('No se pudo actualizar', '<div class="alert bad"><b>La nube no respondio</b>' +
      esc(nubeMensajeError(e)) + '</div>' +
      '<p class="muted">Tus datos siguen guardados en este equipo. Puedes seguir trabajando y volver a intentarlo.</p>',
      '<button class="btn sec" onclick="cerrar()">Cerrar</button>' +
      '<button class="btn" onclick="cerrar();actualizarAhora()">Reintentar</button>');
  } finally {
    _actualizando = false;
    const b2 = document.getElementById('btnActualizar');
    if(b2){ b2.disabled = false; b2.textContent = 'Actualizar'; }
  }
}

/* Mira la nube en cuanto vuelves a la pestana, sin esperar al reloj */

    document.addEventListener('visibilitychange', () => {
      if(!document.hidden && nubeLista()) nubeMirarCambios();

/* =====================================================================
   BLOQUE 2 - REGLAS, CONFLICTOS Y EQUIDAD
   Reglas estrictas: el sistema nunca las rompe solo.
   Avisos: te lo dice, pero tu decides y puedes seguir adelante.
   ===================================================================== */

const MOTIVOS_AVISO = ['dias','cupo','terminalB','libresDeMas'];

function ctxReal(k){ k = k || SEMANA; return { k, celdas: semana(k).celdas }; }
function ctxCopia(k, celdas){ return { k: k || SEMANA, celdas: JSON.parse(JSON.stringify(celdas)) }; }
function fechaDe(k, d){ return addDias(k, d); }

function asigEnFecha(ctx, empId, fecha){
  const wk = lunesDe(fecha);
  const d = Math.round((s2d(fecha) - s2d(wk)) / 86400000);
  if(wk === ctx.k) return ctx.celdas[ck(empId, d)] || null;
  const w = S.semanas[wk];
  return w ? (w.celdas[ck(empId, d)] || null) : null;
}

function finAbs(t){ let f = min2(finRealDe(t)); if(f <= min2(t.inicio)) f += 1440; return f; }
function descansoEntre(tAnterior, tSiguiente){
  return ((1440 + min2(tSiguiente.inicio)) - finAbs(tAnterior)) / 60;
}

/* Cuanta gente del counter cubre ya ese puesto y turno. Se mira solo el
   counter: si un agente de servicio hace el 7-3, ese no es el puesto de
   Hertz de la Terminal A y no debe contar como cubierto. */
function ocupacion(ctx, d, turnoId, puestoId){
  let n = 0;
  for(const e of S.empleados){
    if(equipoDe(e) !== 'rotativo') continue;
    const c = ctx.celdas[ck(e.id, d)];
    if(!c || c.t !== turnoId) continue;
    if(puestoId === undefined || c.p === puestoId) n++;
  }
  return n;
}

function rachaSi(ctx, empId, fecha){
  let n = 1;
  for(let i = 1; i <= 12; i++){
    const a = asigEnFecha(ctx, empId, addDias(fecha, -i));
    if(a && a.t !== LIBRE) n++; else break;
  }
  for(let i = 1; i <= 12; i++){
    const a = asigEnFecha(ctx, empId, addDias(fecha, i));
    if(a && a.t !== LIBRE) n++; else break;
  }
  return n;
}

/* La misma cuenta, pero diciendo desde que dia y hasta que dia va la racha.
   Sirve para explicar el conflicto: casi siempre la racha se sale de la
   semana que estas mirando y cruza a la de antes o a la de despues. */
function rangoRacha(ctx, empId, fecha){
  let desde = fecha, hasta = fecha, n = 1;
  for(let i = 1; i <= 12; i++){
    const a = asigEnFecha(ctx, empId, addDias(fecha, -i));
    if(a && a.t !== LIBRE){ n++; desde = addDias(fecha, -i); } else break;
  }
  for(let i = 1; i <= 12; i++){
    const a = asigEnFecha(ctx, empId, addDias(fecha, i));
    if(a && a.t !== LIBRE){ n++; hasta = addDias(fecha, i); } else break;
  }
  return { n, desde, hasta };
}

/* "del lunes 27/07 al miercoles 05/08" */
function textoRango(r){
  const nom = (f) => DIAS[(s2d(f).getDay() + 6) % 7].toLowerCase() + ' ' + fechaCorta(f);
  return 'del ' + nom(r.desde) + ' al ' + nom(r.hasta);
}

function diasTrabCtx(ctx, empId){
  let n = 0;
  for(let d = 0; d < 7; d++){ const c = ctx.celdas[ck(empId,d)]; if(c && c.t !== LIBRE) n++; }
  return n;
}
function horasSemanaCtx(ctx, empId){
  let h = 0;
  for(let d = 0; d < 7; d++){ const c = ctx.celdas[ck(empId,d)]; if(c && c.t !== LIBRE) h += horasTurno(turno(c.t)); }
  return Math.round(h*10)/10;
}
function visitasBCtx(ctx, empId){
  let n = 0;
  for(let d = 0; d < 7; d++){ const c = ctx.celdas[ck(empId,d)]; if(c && c.t !== LIBRE && esTerminalB(c.p)) n++; }
  return n;
}

/* =====================================================================
   REGLA CENTRAL
   ===================================================================== */
function validar(ctx, empId, d, turnoId, puestoId, opciones){
  opciones = opciones || {};
  const emp = empleado(empId);
  const t = turno(turnoId);
  const p = puesto(puestoId);
  const cfg = S.config;
  const no = (motivo, texto, sugerencia) => ({ ok:false, motivo, texto, sugerencia: sugerencia || '', aviso: MOTIVOS_AVISO.includes(motivo) });

  if(!emp) return no('empleado', 'El empleado no existe.');
  if(!emp.activo) return no('inactivo', emp.nombre + ' esta inactivo.', 'Actiualo en la pantalla Empleados si debe trabajar.');
  /* Cada turno vive en el horario de su equipo. Sin esto, arrastrar un turno
     del counter encima de un supervisor solo se frenaba de rebote (por el
     cupo de libres o por los dias que le tocan), y en cuanto esos limites
     daban de si se colaba: un supervisor acabaria con el 3-11 del mostrador. */
  if(t && turnoId !== LIBRE){
    const eqEmp = equipoDe(emp);
    if((t.equipos || []).indexOf(eqEmp) < 0)
      return no('otroEquipo',
        'El turno ' + t.corto + ' no es del horario de ' + infoEquipo(eqEmp).nombre.toLowerCase() + '.',
        'Cada horario tiene sus propios turnos. Si ' + emp.nombre + ' tiene que poder hacerlo, ' +
        'anade ese equipo al turno en Ajustes.');
  }
  /* Dia libre: lo unico que se mira es que no acumule mas libres de los
     que le tocan esa semana (2 en las de 5 dias, 1 en las de 6). */
  if(turnoId === LIBRE){
    const maxLibres = libresSemana(empId, ctx.k);
    let ya = 0;
    for(let x = 0; x < 7; x++){
      if(x === d) continue;
      if(esLibreReal(ctx.celdas[ck(empId, x)])) ya++;
    }
    if(ya + 1 > maxLibres) return no('libresDeMas',
      emp.nombre + ' tendria ' + (ya+1) + ' dias libres y esta semana le tocan ' + maxLibres + '.',
      'Quitale otro dia libre o ponle un turno aqui.');
    /* Y que ese dia no acabe con mas gente librando de la que cabe.
       Cada dia tiene su cupo: los que hay menos los puestos de ese dia.
       Sin esta comprobacion se podia arrastrar un dia libre a otro dia y
       la aplicacion lo aceptaba sin decir nada, dejando un puesto sin
       cubrir. Todos los dias tienen ya a alguien librando, asi que mover
       un libre casi siempre pasa del cupo: lo que cuadra es intercambiarlo
       con un companero. */
    let eseDia = 0;
    for(const x of activos()){
      if(x.id === empId) continue;
      if(esLibreReal(ctx.celdas[ck(x.id, d)])) eseDia++;
    }
    /* Lo que se juzga aqui es el limite de verdad: que los puestos
       principales de ese dia sigan cubiertos. Por debajo de eso tienes
       margen, y los puestos de relleno se abren o no segun la gente. */
    const cupoD = cupoLibresMax(d, ctx.k);
    if(eseDia + 1 > cupoD) return no('cupoLibres',
      'El ' + DIAS[d].toLowerCase() + ' ya libran ' + eseDia + ' persona(s). Con uno mas no quedaria gente para los ' +
      nucleoDia(d, ctx.k) + ' puestos principales de ese dia.',
      'Intercambia el dia libre con un companero (asi uno entra y el otro sale) en vez de moverlo suelto.');
    return { ok:true };
  }
  if(!t || !t.activo) return no('turno', 'Ese turno no esta activo.');

  // 0. Dia libre fijo: ese dia no trabaja nunca
  if(fijoVigente(emp, ctx.k) === d) return no('libreFijo',
    emp.nombre + ' tiene el ' + DIAS[d].toLowerCase() + ' como dia libre fijo.',
    'Si quiere trabajar ese dia, quitale el dia libre fijo en su ficha.');

  // 1. Dia no disponible
  if(!emp.diasDisponibles[d]) return no('diaNoDisp',
    emp.nombre + ' no esta disponible los ' + DIAS[d].toLowerCase() + '.',
    'Cambia su disponibilidad en la ficha o asigna a otra persona.');

  // 2. Turno no permitido
  if(vetoTurnos(emp, d, ctx.k).includes(turnoId)) return no('turnoProhibido',
    emp.nombre + ' tiene marcado el turno ' + t.corto + ' como no permitido.',
    'Quita esa restriccion en su ficha o asigna a otra persona.');

  // 3. Puesto no permitido
  if(p && vetoPuestos(emp, d, ctx.k).includes(puestoId)) return no('puestoProhibido',
    emp.nombre + ' no puede trabajar en ' + p.corto + '.',
    'Quita esa restriccion en su ficha o manda a otra persona.');

  // 4. Ya tiene algo ese dia
  const actual = ctx.celdas[ck(empId, d)];
  if(actual && !opciones.reemplazar && !(actual.t === turnoId && actual.p === puestoId)) return no('doble',
    emp.nombre + ' ya tiene asignado ' + (actual.t === LIBRE ? 'dia libre' : turno(actual.t).corto) + ' el ' + DIAS[d] + '.',
    'Usa el menu de la casilla para cambiarlo.');

  // 5. Dias de la semana (AVISO)
  const objetivo = diasObjetivoDe(empId, ctx.k);
  const diasSinEste = diasTrabCtx(ctx, empId) - (actual && actual.t !== LIBRE ? 1 : 0);
  if(diasSinEste + 1 > objetivo) return no('dias',
    emp.nombre + ' trabajaria ' + (diasSinEste+1) + ' dias y esta semana le tocan ' + objetivo + '.',
    'Puedes autorizarlo igualmente, o darle el dia libre a otra persona.');

  // 6. Descanso minimo entre turnos
  if(!cfg.permitirSinDescanso && !opciones.autorizarSinDescanso){
    const ant = asigEnFecha(ctx, empId, addDias(fechaDe(ctx.k,d), -1));
    if(ant && ant.t !== LIBRE){
      const ta = turno(ant.t);
      if(ta){
        const h = descansoEntre(ta, t);
        if(h < cfg.descansoMin) return no('descanso',
          emp.nombre + ' no puede entrar el ' + DIAS[d] + ' a las ' + hora12(t.inicio) +
          ' porque el dia anterior sale a las ' + hora12(finRealDe(ta)) + ' (solo ' + h + ' horas de descanso, el minimo es ' + cfg.descansoMin + ').',
          'Cambiale el turno, intercambialo con otro companero, o autoriza la excepcion desde la casilla.');
      }
    }
    const sig = asigEnFecha(ctx, empId, addDias(fechaDe(ctx.k,d), 1));
    if(sig && sig.t !== LIBRE){
      const ts = turno(sig.t);
      if(ts){
        const h = descansoEntre(t, ts);
        if(h < cfg.descansoMin) return no('descanso',
          'Si ' + emp.nombre + ' sale a las ' + hora12(finRealDe(t)) + ' el ' + DIAS[d] +
          ', no alcanza el descanso minimo para su turno del dia siguiente (' + h + ' horas).',
          'Cambia el turno del dia siguiente o autoriza la excepcion.');
      }
    }
  }

  // 7. Dias seguidos
  const guardado = ctx.celdas[ck(empId, d)];
  ctx.celdas[ck(empId, d)] = { t:turnoId, p:puestoId, o:'tmp', b:false };
  const rr = rangoRacha(ctx, empId, fechaDe(ctx.k, d));
  if(guardado) ctx.celdas[ck(empId, d)] = guardado; else delete ctx.celdas[ck(empId, d)];
  if(rr.n > emp.maxDiasConsec){
    /* Si la racha se sale de esta semana hay que decirlo, o parece un error:
       en la pantalla solo se ven 5 o 6 dias y la cuenta habla de mas. */
    const fuera = lunesDe(rr.desde) !== ctx.k || lunesDe(rr.hasta) !== ctx.k;
    return no('consecutivos',
      emp.nombre + ' trabajaria ' + rr.n + ' dias seguidos (' + textoRango(rr) + ') y su maximo es ' + emp.maxDiasConsec + '.',
      fuera
        ? 'La cuenta no se corta el domingo: sigue en las semanas de al lado. Mueve un dia libre en ' +
          (lunesDe(rr.desde) !== ctx.k ? 'la semana anterior' : 'la semana siguiente') + ', o sube el maximo en su ficha.'
        : 'Mueve su dia libre, o sube el maximo en su ficha.');
  }

  // 8. Veces en la Terminal B (AVISO)
  if(esTerminalB(puestoId)){
    const yaB = visitasBCtx(ctx, empId) - (actual && actual.t !== LIBRE && esTerminalB(actual.p) ? 1 : 0);
    if(yaB + 1 > cfg.maxB) return no('terminalB',
      emp.nombre + ' iria ' + (yaB+1) + ' veces a la Terminal B esta semana y el tope es ' + cfg.maxB + '.',
      'Manda a alguien que haya ido menos veces, o autorizalo si esta semana toca asi.');
  }

  // 9. Cupo del puesto (AVISO)
  if(p){
    const ya = ocupacion(ctx, d, turnoId, puestoId) - (actual && actual.t === turnoId && actual.p === puestoId ? 1 : 0);
    const nec = cobNec(puestoId, turnoId, d, ctx.k);
    if(ya >= nec && !opciones.refuerzo) return no('cupo',
      nec === 0
        ? 'No tenias previsto cubrir ' + p.corto + ' con el turno ' + t.corto + ' el ' + DIAS[d].toLowerCase() + '.'
        : 'En ' + p.corto + ', el turno ' + t.corto + ' del ' + DIAS[d].toLowerCase() + ' ya tiene ' + ya + ' persona(s) y lo previsto es ' + nec + '.',
      'Puedes asignarlo igualmente como refuerzo, o cambiar el numero en Ajustes.');
  }

  return { ok:true };
}

/* =====================================================================
   REVISION DE LA SEMANA
   ===================================================================== */
function revisar(ctx){
  ctx = ctx || ctxReal();
  const conflictos = [], avisos = [], faltantes = [];

  for(const e of activos()){
    for(let d = 0; d < 7; d++){
      const c = ctx.celdas[ck(e.id, d)];
      if(!c) continue;
      const r = validar(ctx, e.id, d, c.t, c.p, { reemplazar:true, refuerzo: !!c.refuerzo, autorizarSinDescanso: !!c.exc });
      if(!r.ok){
        if(r.aviso) avisos.push({ texto:r.texto, empId:e.id, dia:d });
        else conflictos.push({ empId:e.id, dia:d, motivo:r.motivo, texto:r.texto, sugerencia:r.sugerencia });
      }
      if(c.t !== LIBRE && !c.p)
        avisos.push({ texto: e.nombre + ' tiene turno el ' + DIAS[d].toLowerCase() + ' sin terminal ni marca.', empId:e.id, dia:d });
    }
  }

  for(let d = 0; d < 7; d++){
    for(const cmb of combinaciones()){
      const nec = cobNec(cmb.puestoId, cmb.turnoId, d, ctx.k);
      if(!nec) continue;
      const n = ocupacion(ctx, d, cmb.turnoId, cmb.puestoId);
      if(n < nec){
        const p = puesto(cmb.puestoId), t = turno(cmb.turnoId);
        /* Si la marca o el turno ya no existen, no hay nada que reclamar:
           esa linea es de unos datos que ya no estan. */
        if(!p || !t) continue;
        const cands = candidatosPara(ctx, d, cmb.turnoId, cmb.puestoId);
        const casi = casiPodrian(ctx, d, cmb.turnoId, cmb.puestoId);
        faltantes.push({
          dia:d, turnoId:cmb.turnoId, puestoId:cmb.puestoId, faltan: nec - n,
          texto: 'El ' + DIAS[d].toLowerCase() + ' en ' + p.corto + ', turno ' + t.corto +
                 ' (' + hora12(t.inicio) + ' a ' + hora12(t.fin) + '), falta ' + (nec-n) + ' persona(s).',
          motivo: cands.length ? 'Hay ' + cands.length + ' que si podrian cubrirlo.' :
                  (casi.length ? 'Ninguno puede sin romper una regla.' : 'No hay nadie disponible ese dia.'),
          candidatos: cands.map(c => c.empId), casi
        });
      }
    }
  }

  const eq = equidad(ctx);
  eq.filas.forEach(f => {
    if(f.dias > 0 && f.dias !== f.objetivo)
      avisos.push({ texto: f.nombre + ' tiene ' + f.dias + ' dias y esta semana le tocan ' + f.objetivo + '.' });
    if(f.dias > 0 && f.visitasB !== objetivoBDe(f.empId) && objetivoBDe(f.empId) > 0)
      avisos.push({ texto: f.nombre + ' va ' + f.visitasB + ' vez(veces) a la Terminal B; lo parejo serian ' + objetivoBDe(f.empId) + '.' });
    if(f.libreDias.length > 1 && !diasSeguidos(f.libreDias))
      avisos.push({ texto: f.nombre + ' tiene los dias libres separados (' + f.libreDias.map(x => DIAS[x].toLowerCase()).join(' y ') + '). Deberian ir seguidos.' });

    if(f.libres > 7 - f.objetivo)
      avisos.push({ texto: f.nombre + ' tiene ' + f.libres + ' dias libres y esta semana le tocan ' + (7 - f.objetivo) + '.' });
  });
  /* Si demasiada gente tiene el mismo dia libre fijo, ese dia no habra
     manos suficientes y conviene decirlo antes de que salte el conflicto. */
  for(let d = 0; d < 7; d++){
    const fijos = activos().filter(e => fijoVigente(e, ctx.k) === d);
    if(!fijos.length) continue;
    const cupo = cupoLibres(d, ctx.k);
    if(fijos.length > cupo)
      avisos.push({ texto: 'El ' + DIAS[d].toLowerCase() + ' hay ' + fijos.length + ' persona(s) con dia libre fijo (' +
        fijos.map(e => e.nombre).join(', ') + ') y ese dia solo pueden librar ' + cupo + '.' });
  }

  /* Como mucho una persona por semana puede llevar los libres separados */
  const separados = eq.filas.filter(f => f.libreDias.length > 1 && !diasSeguidos(f.libreDias));
  if(separados.length > 1)
    avisos.push({ texto: 'Hay ' + separados.length + ' personas con los dias libres separados (' +
      separados.map(f => f.nombre).join(', ') + '). Solo deberia haber una. Prueba con "Otra alternativa".' });

  // dos empleados con exactamente los mismos dias libres
  const vistos = {};
  eq.filas.forEach(f => {
    if(!f.libreDias.length) return;
    const clave = f.libreDias.slice().sort((a,b)=>a-b).join(',');
