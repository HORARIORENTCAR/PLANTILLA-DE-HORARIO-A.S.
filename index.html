/* =====================================================================
   PRUEBAS INTERNAS
   ===================================================================== */
function pruebas(){
  const r = [];
  const ok = (nombre, cond, det) => r.push({ nombre, ok: !!cond, det: det || '' });
  const k = SEMANA;
  const E = activos();
  const T = {}; S.turnos.forEach(t => T[t.corto] = t.id);
  const P = {}; S.puestos.forEach(p => P[p.corto] = p.id);
  const tipo = tipoSemana(k);

  ok('Hay 7 empleados activos', E.length >= 7, E.length + ' activos');

  /* Si marcaste a mano el tipo de esta semana o de la siguiente, la alternancia
     se rompe a proposito y un par de comprobaciones no aplican. */
  /* si cambiaste a mano de quien son los 2 dias libres, un par de comprobaciones no aplican */
  const fijadas = !!((S.semanas[k] && S.semanas[k].turno2) || (S.semanas[addDias(k,7)] && S.semanas[addDias(k,7)].turno2));

  /* --- dia libre fijo --- */
  ok('El dia libre fijo bloquea cualquier turno ese dia',
     (() => {
       const e = E[0], guarda = e.libreFijo;
       e.libreFijo = 6;
       const r = validar(ctxCopia(k, {}), e.id, 6, T['7-3'], P['A - Hertz'], { reemplazar:true });
       e.libreFijo = guarda;
       return !r.ok && r.motivo === 'libreFijo';
     })());
  ok('Sin dia fijo no bloquea nada',
     (() => {
       const e = E[0], guarda = e.libreFijo;
       e.libreFijo = -1;
       const r = validar(ctxCopia(k, {}), e.id, 6, T['7-3'], P['A - Hertz'], { reemplazar:true });
       e.libreFijo = guarda;
       return r.ok || r.motivo !== 'libreFijo';
     })());
  ok('Quien tiene dia fijo lo tiene libre en el horario',
     activos().every(e => {
       if(e.libreFijo < 0) return true;
       const c = celda(e.id, e.libreFijo, k);
       return !c || c.t === LIBRE;
     }),
     activos().filter(e => e.libreFijo >= 0).map(e => e.nombre + ':' + DIAS_CORTO[e.libreFijo]).join(' ') || 'nadie tiene dia fijo');

  /* --- el turno de los dos dias libres seguidos --- */
  const ROT = rotacionLibres();
  ok('Cada semana el turno de 2 dias libres es de UNA sola persona',
     E.filter(e => libresSemana(e.id, k) === 2 && !e.dosLibresFijos).length === (ROT.orden.length ? 1 : 0),
     'esta semana: ' + (empleado(turnoDosLibres(k)) || {}).nombre +
     (E.some(e => e.dosLibresFijos) ? '  (ademas ' + E.filter(e => e.dosLibresFijos).map(e => e.nombre).join(', ') + ' los tiene siempre)' : ''));
  ok('A cada persona le tocan 2 o 1 dias libres, nunca otra cosa',
     E.every(e => [1,2].includes(libresSemana(e.id, k))),
     E.map(e => libresSemana(e.id, k)).join(','));
  ok('El turno pasa al siguiente de la lista cada semana',
     (() => {
       if(ROT.orden.length < 2) return true;
       const a = ROT.orden.indexOf(turnoDosLibresRotacion(k));
       const b = ROT.orden.indexOf(turnoDosLibresRotacion(addDias(k,7)));
       return b === (a + 1) % ROT.orden.length;
     })(),
     ROT.orden.map(id => (empleado(id)||{}).nombre).join(' -> '));
  ok('Nadie repite hasta que todos hayan pasado',
     (() => {
       if(!ROT.orden.length) return true;
       const vistos = new Set();
       for(let n = 0; n < ROT.orden.length; n++) vistos.add(turnoDosLibresRotacion(addDias(k, 7*n)));
       return vistos.size === ROT.orden.length;
     })(),
     'la vuelta dura ' + ROT.orden.length + ' semanas');
  ok('Quien no entra en la rotacion libra siempre un solo dia',
     E.filter(e => ROT.orden.indexOf(e.id) < 0 && !e.dosLibresFijos)
      .every(e => { for(let n = 0; n < 10; n++) if(libresSemana(e.id, addDias(k, 7*n)) !== 1) return false; return true; }),
     E.filter(e => ROT.orden.indexOf(e.id) < 0 && !e.dosLibresFijos).map(e => e.nombre).join(', ') || 'todos entran');
  ok('Y quien los tiene siempre, siempre libra dos',
     E.filter(e => e.dosLibresFijos)
      .every(e => { for(let n = 0; n < 10; n++) if(libresSemana(e.id, addDias(k, 7*n)) !== 2) return false; return true; }),
     E.filter(e => e.dosLibresFijos).map(e => e.nombre).join(', ') || 'nadie');
  ok('Los turnos que hay que cubrir cuadran con los puestos de la semana',
     (() => {
       let trabajo = 0; E.forEach(e => trabajo += diasObjetivoDe(e.id, k));
       let puestos = 0;
       for(let d = 0; d < 7; d++) for(const c of combinaciones()) puestos += cobNec(c.puestoId, c.turnoId, d, k);
       return trabajo === puestos;
     })(),
     (() => {
       let trabajo = 0; E.forEach(e => trabajo += diasObjetivoDe(e.id, k));
       let puestos = 0;
       for(let d = 0; d < 7; d++) for(const c of combinaciones()) puestos += cobNec(c.puestoId, c.turnoId, d, k);
       return trabajo + ' turnos y ' + puestos + ' puestos';
     })());
  ok('El 6o puesto entra solo los dias que hacen falta',
     (() => { for(let d = 0; d < 7; d++){
       if(puestosDia(d, k) < nucleoDia(d, k)) return false;          // el nucleo siempre
       if(puestosDia(d, k) > prioridadDia(d, k).length) return false; // nunca mas de los que hay
     } return true; })(),
     (() => { const o = []; for(let d = 0; d < 7; d++) o.push(puestosDia(d, k) + '/' + prioridadDia(d, k).length); return o.join(' '); })());

  ok('El aviso de dias seguidos dice desde que dia y hasta cual',
     (() => {
       const T7 = (S.turnos.find(t => t.corto === '7-3') || {}).id;
       if(!T7 || !E.length) return false;
       /* Se hace en dos semanas vacias, lejos de las tuyas, para no tocar nada.
          Tiene que ser alguien que trabaje 6 dias esa semana y sin dia libre
          fijo: si no, salta antes el aviso de los dias o el del dia reservado. */
       let esc = addDias(k, 700);
       if(S.semanas[esc] || S.semanas[addDias(esc,-7)]) return true;
       const e = E.find(x => x.libreFijo < 0 && turnoDosLibres(esc) !== x.id);
       if(!e) return true;
       const prev = addDias(esc, -7);
       semana(prev); semana(esc);
       for(let d = 0; d < 7; d++){
         S.semanas[prev].celdas[ck(e.id,d)] = d === 0 ? { t:LIBRE,p:null,o:'manual',b:true } : { t:T7,p:S.puestos[0].id,o:'manual',b:true };
         S.semanas[esc].celdas[ck(e.id,d)]  = d === 6 ? { t:LIBRE,p:null,o:'manual',b:true } : { t:T7,p:S.puestos[0].id,o:'manual',b:true };
       }

         const antes = S.feriados.slice();
         S.feriados = [{ id:uid(), fecha:'2030-01-01', nombre:'A' }, { id:uid(), fecha:'2030-01-21', nombre:'B' }];
         const p2 = horarioSupervisorDe(car.id);
         const v1 = S.feriados.map(f => trabajaFeriado(car.id, f.fecha));
         p2.desfase = p2.desfase ? 0 : 1;                 // es lo que hace el boton
         const v2 = S.feriados.map(f => trabajaFeriado(car.id, f.fecha));
         p2.desfase = p2.desfase ? 0 : 1;                 // se deja como estaba
         S.feriados = antes;
         return v1.every((x, i) => x !== v2[i]);
       })());
    delete S.semanas[ke];
  }

  if(serE.length){
    semana(ke);
    generarServicio(ke, { rehacer:true });
    ok('Cada agente de servicio tiene una sola cosa por dia',
       serE.every(e => { for(let d = 0; d < 7; d++) if(!celda(e.id, d, ke)) return false; return true; }));
    ok('Cada dia se cubren todos los turnos que se abren',
       (() => {
         for(let d = 0; d < 7; d++){
           /* la semana de la prueba, no la que estes mirando: los turnos que
              se abren dependen de quien libra, y eso es distinto cada semana */
           const nec = turnosNecesariosServicio(d, ke);
           let hay = 0;
           serE.forEach(e => { const c = celda(e.id, d, ke); if(c && c.t !== LIBRE && !esAusencia(c)) hay++; });
           if(hay !== nec.length) return false;

         o.push(hay + '/' + turnosNecesariosServicio(d, ke).length); } return o.join(' '); })());
    ok('El turno clavado en la ficha se respeta siempre que ese dia se abra',
       serE.every(e => (e.fijos||[]).every(f =>
         f.dias.every(d => {
           /* si ese dia no hay gente para llegar hasta el, cede ante un
              principal: eso es lo correcto, no un fallo */
           if(!turnosServicioDia(d, ke).some(x => x.turnoId === f.turnoId)) return true;
           const c = celda(e.id, d, ke); return c && c.t === f.turnoId;
         }))),
       serE.filter(e => (e.fijos||[]).length).map(e => e.nombre).join(', ') || 'nadie tiene turno clavado');
    ok('Los agentes de servicio nunca se quedan sin el descanso minimo',
       (() => {
         for(const e of serE) for(let d = 1; d < 7; d++){
           const a = celda(e.id, d-1, ke), b = celda(e.id, d, ke);
           if(!a || !b || a.t === LIBRE || b.t === LIBRE) continue;
           if(descansoEntre(turno(a.t), turno(b.t)) < S.config.descansoMin) return false;
         }
         return true;
       })());
    ok('Los turnos rotan: nadie repite el mismo los siete dias',
       serE.every(e => {
         const vistos = {};
         for(let d = 0; d < 7; d++){ const c = celda(e.id, d, ke); if(c && c.t !== LIBRE) vistos[c.t] = 1; }
         return Object.keys(vistos).length > 1 || serE.length < 2;
       }),
       serE.map(e => { const v = {}; for(let d=0;d<7;d++){ const c = celda(e.id,d,ke); if(c && c.t !== LIBRE) v[c.t]=1; }
         return e.nombre + ':' + Object.keys(v).length; }).join(' '));

  /* =================================================================
     AGENTES DE SERVICIO: LA LISTA DE PRIORIDAD
     Mismo modelo que el counter. Cada dia se abren tantos turnos como
     agentes haya, por orden; los principales -la manana y la noche de la
     Terminal A- son los que no pueden faltar, y el refuerzo del mediodia
     se cae solo cuando falta gente.
     ================================================================= */
  (function(){
    const serE2 = plantilla('servicio');
    if(serE2.length < 2) return;
    const l = prioridadServicio();

    ok('La lista de los agentes de servicio tiene dos principales',
       l.filter(x => x.clave).length === 2,
       l.map(x => (x.clave ? '*' : '') + ((turno(x.turnoId)||{}).corto || '?')).join(' | '));
    ok('Los principales del servicio son la manana y la noche de la Terminal A',
       (() => {
         const tipos = l.filter(x => x.clave).map(x => (turno(x.turnoId)||{}).tipo);
         return tipos.filter(t => t === 'temprano').length === 1 &&
                tipos.filter(t => t === 'tarde').length === 1;
       })(),
       l.filter(x => x.clave).map(x => (turno(x.turnoId)||{}).corto).join(' y '));
    ok('Los principales van los primeros de la lista del servicio',
       (() => { let visto = false;
         for(const x of l){ if(!x.clave) visto = true; else if(visto) return false; }
         return true; })());
    ok('El 11-7 entra solo los lunes y los sabados',
       (() => { const x = l.find(y => (turno(y.turnoId)||{}).corto === '11-7');
         return !x || (x.dias[0] && x.dias[5] && !x.dias[1] && !x.dias[2] && !x.dias[3] && !x.dias[4] && !x.dias[6]); })(),
       (() => { const x = l.find(y => (turno(y.turnoId)||{}).corto === '11-7');
         return x ? x.dias.map((v,i) => v ? DIAS_CORTO[i] : null).filter(Boolean).join(' y ') : 'no esta en la lista'; })());
    ok('Los turnos sueltos para casos especiales estan disponibles en servicio',
       ['10-6','11-7','12-8'].every(c => turnosDe('servicio').some(t => t.corto === c)),
       turnosDe('servicio').map(t => t.corto).join(' '));

    /* Una semana vacia y lejana, y una ausencia de verdad para ver que el
       refuerzo se cae y los principales aguantan. */
    let ks = addDias(k, 6300);
    for(let i = 0; i < 80 && (S.semanas[ks] || S.semanas[addDias(ks,-7)]); i++) ks = addDias(ks, 7);
    const guardaSem = SEMANA, guardaAus = (S.ausencias || []).slice();
    SEMANA = ks; semana(ks);

    const cubiertos = (kk) => {
      let faltan = 0;
      for(let d = 0; d < 7; d++){
        const abren = turnosServicioDia(d, kk);
        const hechos = [];
        plantilla('servicio').forEach(e => { const c = celda(e.id, d, kk); if(c && c.t !== LIBRE) hechos.push(c.t); });
        abren.forEach(x => { const i = hechos.indexOf(x.turnoId); if(i >= 0) hechos.splice(i, 1); else faltan++; });
      }
      return faltan;
    };

    generarServicio(ks, { rehacer:true });
    ok('Con toda la plantilla de servicio no queda ningun turno sin cubrir',
       cubiertos(ks) === 0);

    /* --- los dias libres: uno por cabeza --- */
    ok('Cada agente de servicio libra UN dia por semana',
       (() => { const t = libresServicioPorPersona(ks);
         return plantilla('servicio').every(e => t[e.id] === 1); })(),
       plantilla('servicio').map(e => e.nombre + ':' + libresServicioPorPersona(ks)[e.id]).join(' '));
    ok('Y ese dia esta puesto en la hoja',
       plantilla('servicio').every(e => {
         let L = 0;
         for(let d = 0; d < 7; d++) if(esLibreReal(celda(e.id, d, ks))) L++;
         return L === libresServicioPorPersona(ks)[e.id];
       }),
       plantilla('servicio').map(e => { const L = [];
         for(let d = 0; d < 7; d++) if(esLibreReal(celda(e.id, d, ks))) L.push(DIAS_CORTO[d]);
         return e.nombre + ':' + (L.join('+') || '-'); }).join('  '));
    ok('Ya no hay turno de dos dias seguidos en agentes de servicio',
       (() => { const t = libresServicioPorPersona(ks);
         return !plantilla('servicio').some(e => t[e.id] >= 2); })());

    /* --- la vispera y la vuelta --- */
    ok('La vispera del dia libre se entra en el primer turno y el dia de vuelta en el ultimo',
       (() => {
         let mal = 0;
         for(const e of plantilla('servicio')){
           for(let d = 0; d < 7; d++){
             const c = celda(e.id, d, ks);
             if(!c || c.t === LIBRE || esAusencia(c)) continue;
             const t = turno(c.t);
             if(!t) continue;
             /* el turno clavado manda sobre esto: lo hace siempre el mismo */
             if(fijoDe(e.id, d)) continue;
             const ext = extremosServicioDia(d, ks), entra = min2(t.inicio);
             const man = d < 6 ? celda(e.id, d+1, ks) : celda(e.id, 0, addDias(ks, 7));
             const ay  = d > 0 ? celda(e.id, d-1, ks) : celda(e.id, 6, addDias(ks, -7));
             const esV = !!(man && man.t === LIBRE && !esAusencia(man));
             const esR = !!(ay  && ay.t  === LIBRE && !esAusencia(ay));
             if(esV === esR) continue;                 // ni lo uno ni lo otro, o las dos
             const quiere = esV ? ext.pronto : ext.tarde;
             if(quiere !== null && entra !== quiere) mal++;
           }
         }
         return mal === 0;
       })(),
       (() => {
         const l = [];
         for(const e of plantilla('servicio')){
           for(let d = 0; d < 7; d++){
             const c = celda(e.id, d, ks);
             if(!c || c.t === LIBRE || esAusencia(c) || fijoDe(e.id, d)) continue;
             const man = d < 6 ? celda(e.id, d+1, ks) : null;
             const ay  = d > 0 ? celda(e.id, d-1, ks) : null;
             if(man && man.t === LIBRE) l.push(e.nombre + ' vispera ' + DIAS_CORTO[d] + ':' + (turno(c.t)||{}).corto);
             if(ay  && ay.t  === LIBRE) l.push(e.nombre + ' vuelta '  + DIAS_CORTO[d] + ':' + (turno(c.t)||{}).corto);
           }
         }
         return l.join('  ') || 'nadie libra esta semana';
       })());

    ok('Con los descansos puestos, los dos principales siguen cubiertos todos los dias',
       (() => { for(let d = 0; d < 7; d++)
                  if(turnosServicioDia(d, ks).filter(x => x.clave).length < nucleoServicioDia(d)) return false;
                return cubiertos(ks) === 0; })(),
       (() => { const o = []; for(let d = 0; d < 7; d++) o.push(agentesServicioDia(d, ks)); return 'trabajan ' + o.join(''); })());
    /* =================================================================
       LOS DE REFUERZO NO SON OBLIGATORIOS
       Si un dia el 9-5 o el 11-7 no los hace nadie, no falta nada: los
       principales estan cubiertos y eso es lo unico que se exige. Lo que
       si no vale es que dos agentes coincidan en el mismo turno.
       ================================================================= */
    (function(){
      const eqS = plantilla('servicio');
      if(eqS.length < 2) return;
      const guardaC = JSON.parse(JSON.stringify(S.semanas[ks].celdas || {}));
      const refu = prioridadServicioDia(3).find(x => !x.clave);   // un jueves cualquiera

      /* alguien que ese dia hace un turno de refuerzo, se le quita */
      let quien = null;
      if(refu) quien = eqS.find(e => { const c = celda(e.id, 3, ks); return c && c.t === refu.turnoId; });
      ok('Un turno de refuerzo sin nadie no cuenta como turno sin cubrir',
         (() => {
           if(!refu || !quien) return true;
           S.semanas[ks].celdas[ck(quien.id, 3)] = { t:LIBRE, p:null, o:'manual', b:true };
           const r = revisarEquipo('servicio', ks);
           S.semanas[ks].celdas = JSON.parse(JSON.stringify(guardaC));
           return !r.avisos.some(a => /falta quien cubra/i.test(a.texto || '')) &&
                  !r.conflictos.length;
         })(),
         refu ? 'probado quitando el ' + ((turno(refu.turnoId)||{}).corto || '?') : 'no hay turnos de refuerzo');

      ok('Poner a alguien en otro turno cualquiera no genera conflicto',
         (() => {
           const libre = turnosDe('servicio').find(t => t.activo &&
             !eqS.some(e => { const c = celda(e.id, 3, ks); return c && c.t === t.id; }));
           if(!libre || !quien) return true;
           S.semanas[ks].celdas[ck(quien.id, 3)] = { t:libre.id, p:null, o:'manual', b:true };
           const r = revisarEquipo('servicio', ks);
           S.semanas[ks].celdas = JSON.parse(JSON.stringify(guardaC));
           return r.conflictos.length === 0;
         })());

      ok('Dos agentes en el mismo turno el mismo dia si es un conflicto',
         (() => {
           const a = eqS[0], b = eqS[1];
           const ca = celda(a.id, 3, ks);
           const tid = (ca && ca.t !== LIBRE) ? ca.t : (turnosDe('servicio')[0] || {}).id;
           if(!tid) return true;
           S.semanas[ks].celdas[ck(a.id, 3)] = { t:tid, p:null, o:'manual', b:true };
           S.semanas[ks].celdas[ck(b.id, 3)] = { t:tid, p:null, o:'manual', b:true };
           const r = revisarEquipo('servicio', ks);
           S.semanas[ks].celdas = JSON.parse(JSON.stringify(guardaC));
           return r.conflictos.some(c => c.dia === 3 && /en el turno/i.test(c.texto || ''));
         })(),
         'se avisa con nombre y dia');

      ok('Si la lista abre el mismo turno dos veces, dos agentes si pueden hacerlo',
         (() => {
           const a = eqS[0], b = eqS[1];
           const l = S.config.servicio.prioridad;
           const t0 = (turnosDe('servicio')[0] || {}).id;
           if(!t0) return true;
           l.push({ turnoId:t0, dias:[1,1,1,1,1,1,1], clave:false });
           l.push({ turnoId:t0, dias:[1,1,1,1,1,1,1], clave:false });
           S.semanas[ks].celdas[ck(a.id, 3)] = { t:t0, p:null, o:'manual', b:true };
           S.semanas[ks].celdas[ck(b.id, 3)] = { t:t0, p:null, o:'manual', b:true };
           const r = revisarEquipo('servicio', ks);
           l.pop(); l.pop();
           S.semanas[ks].celdas = JSON.parse(JSON.stringify(guardaC));
           olvidarLibresServicio();
           return !r.conflictos.some(c => c.dia === 3 && /en el turno/i.test(c.texto || ''));
         })());
    })();

    ok('Los dias del turno clavado se quedan completos: nadie libra ese dia',
       (() => {
         const dc = diasClavadoServicio();
         if(!dc.length) return true;
         const cl = clavadoServicio();
         return dc.every(d => {
           const c = celda(cl.emp.id, d, ks);
           return c && c.t === cl.fijo.turnoId;
         });
       })(),
       (() => { const cl = clavadoServicio();
         return cl ? cl.emp.nombre + ' hace el ' + textoClavado(cl.fijo) : 'no hay turno clavado'; })());
    ok('Con toda la plantilla se abren los dos principales todos los dias',
       (() => { for(let d = 0; d < 7; d++)
                  if(turnosServicioDia(d, ks).filter(x => x.clave).length < nucleoServicioDia(d)) return false;
                return true; })(),
       (() => { const o = []; for(let d = 0; d < 7; d++) o.push(turnosServicioDia(d, ks).length); return o.join(' '); })());

    /* uno de vacaciones toda la semana */
    const fuera = serE2[serE2.length - 1];
    S.ausencias = guardaAus.concat([{ id:'serT1', empId:fuera.id, tipo:'vacaciones', nota:'',
                                      desde:ks, hasta:addDias(ks, 6) }]);
    generarServicio(ks, { rehacer:true });
    ok('Con un agente de vacaciones los dos principales siguen cubiertos',
       (() => { for(let d = 0; d < 7; d++)
                  if(turnosServicioDia(d, ks).filter(x => x.clave).length < nucleoServicioDia(d)) return false;
                return cubiertos(ks) === 0; })(),
       fuera.nombre + ' fuera y ' + (serE2.length - 1) + ' agente(s) dentro');
    ok('Con un agente de vacaciones lo que se cae es el refuerzo, no un principal',
       (() => { for(let d = 0; d < 7; d++){
           const abren = turnosServicioDia(d, ks);
           if(abren.length !== Math.min(prioridadServicioDia(d).length, serE2.length - 1)) return false;
           if(abren.some(x => !x.clave) && abren.filter(x => x.clave).length < nucleoServicioDia(d)) return false;
         } return true; })(),
       (() => { const o = []; for(let d = 0; d < 7; d++) o.push(turnosServicioDia(d, ks).length); return o.join(' '); })());
    ok('El dia de una ausencia sale marcado como ausencia, no como dia libre',
       (() => { for(let d = 0; d < 7; d++){ const c = celda(fuera.id, d, ks); if(!esAusencia(c)) return false; } return true; })(),
       fuera.nombre);
    S.ausencias = guardaAus;

    if(serE2.length >= 2){
      const antes = clavadoServicio();
      const otro2 = serE2.find(e => !antes || e.id !== antes.emp.id);
      pasarClavadoServicio(otro2.id);
      const ahora = clavadoServicio();
      ok('El turno clavado se le puede pasar a otro agente de un boton',
         !!ahora && ahora.emp.id === otro2.id,
         (antes ? antes.emp.nombre : 'nadie') + ' -> ' + (ahora ? ahora.emp.nombre : 'nadie'));
      ok('El turno clavado lo tiene una sola persona a la vez',
         plantilla('servicio').filter(e => (e.fijos || []).length).length <= 1,
         plantilla('servicio').filter(e => (e.fijos||[]).length).map(e => e.nombre).join(', ') || 'nadie');
      generarServicio(ks, { rehacer:true });
      ok('Tras pasarlo, el horario sigue cuadrando', cubiertos(ks) === 0);
      /* se deja como estaba */
      plantilla('servicio').forEach(e => { e.fijos = []; });
      if(antes) pasarClavadoServicio(antes.emp.id);
      ok('Y se puede devolver a quien lo tenia',
         (!antes && !clavadoServicio()) ||
         (!!antes && !!clavadoServicio() && clavadoServicio().emp.id === antes.emp.id),
         antes ? antes.emp.nombre : 'no lo tenia nadie');
    }

    SEMANA = guardaSem;
    delete S.semanas[ks];
    generarServicio(k, { rehacer:true });
  })();

  ok('Un turno de un equipo no se puede arrastrar al de otro',
     plantilla('supervision').length === 0 || plantilla('rotativo').length === 0 ||
     equipoDe(plantilla('supervision')[0]) !== equipoDe(plantilla('rotativo')[0]));
  /* =================================================================
     LAS SEMANAS VIEJAS SE ARREGLAN SOLAS
     Si cambias un turno o una ficha, lo ya repartido puede quedar fuera
     de las reglas. Eso no debe quedarse dando error para siempre.
     ================================================================= */
  (function(){
    let kv = addDias(k, 3500);
    for(let i = 0; i < 60 && (S.semanas[kv] || S.semanas[addDias(kv,-7)] || S.semanas[addDias(kv,7)]); i++) kv = addDias(kv, 7);
    const guardaba = !!S.semanas[kv];
    const t83 = S.turnos.find(x => x.corto === '8-3');
    const hertz = S.puestos.find(p => p.terminal === 'A' && /^hertz$/i.test(p.nombre || ''));
    const isaac = E.find(x => /isaac/i.test(x.nombre));
    const otro  = E.find(x => !/isaac/i.test(x.nombre));
    const w = semana(kv);

    ok('Un turno fuera de uso no se puede quedar en una semana',
       (() => {
         if(!t83 || !otro) return true;
         w.celdas = {};
         w.celdas[ck(otro.id, 0)] = { t:t83.id, p:null, o:'manual', b:true };
         return chocaConReglaDura(otro.id, 0, w.celdas[ck(otro.id,0)]) && sanearSemana(kv) >= 1 && !w.celdas[ck(otro.id,0)];
       })(),
       t83 ? 'probado con el ' + t83.corto : 'no hay turnos guardados');

    ok('Una marca prohibida en la ficha no se puede quedar en una semana',
       (() => {
         if(!isaac || !hertz) return true;
         const t73 = S.turnos.find(x => x.corto === '7-3');
         w.celdas = {};
         w.celdas[ck(isaac.id, 0)] = { t:t73.id, p:hertz.id, o:'manual', b:true };
         return sanearSemana(kv) >= 1 && !w.celdas[ck(isaac.id,0)];
       })(),
       isaac ? isaac.nombre + ' no puede llevar Hertz' : '');

    ok('Al arreglar una semana vieja no quedan conflictos ni puestos sin cubrir',
       (() => {
         if(!t83 || !isaac || !hertz || !otro) return true;
         const t73 = S.turnos.find(x => x.corto === '7-3');
         w.celdas = {};
         const guardaSem = SEMANA; SEMANA = kv;
         otraAlternativa(kv);
         w.celdas[ck(otro.id, 0)]  = { t:t83.id, p:null, o:'manual', b:true };
         w.celdas[ck(isaac.id, 0)] = { t:t73.id, p:hertz.id, o:'manual', b:true };
         sanearSemana(kv);
         const ev = autocompletar(kv);
         const rev = revisar(ctxReal(kv));
         SEMANA = guardaSem;
         return rev.conflictos.length === 0 && ev.eq.faltan === 0;
       })());

    if(!guardaba) delete S.semanas[kv];
  })();

  /* =================================================================
     QUIEN LIBRA 2 SEGUIDOS TODAS LAS SEMANAS
     ================================================================= */
  (function(){
    const fijos = E.filter(x => x.dosLibresFijos);
    ok('Quien libra 2 seguidos siempre esta fuera del turno rotativo',
       fijos.every(x => rotacionLibres().orden.indexOf(x.id) < 0),
       fijos.map(x => x.nombre).join(', ') || 'nadie tiene los 2 fijos');
    if(!fijos.length) return;

    let kd = addDias(k, 5600);
    for(let i = 0; i < 60 && (S.semanas[kd] || S.semanas[addDias(kd,-7)]); i++) kd = addDias(kd, 7);
    const guardaSem = SEMANA; SEMANA = kd;
    const semanas = [];
    for(let n = 0; n < 4; n++){ const kk = addDias(kd, 7*n); semana(kk); otraAlternativa(kk); semanas.push(kk); }

    ok('Le salen 2 dias libres seguidos todas las semanas, sin excepcion',
       fijos.every(x => semanas.every(kk => {
         const L = []; for(let d = 0; d < 7; d++){ const c = celda(x.id, d, kk); if(c && c.t === LIBRE) L.push(d); }
         return L.length === 2 && diasSeguidos(L);
       })),
       fijos.map(x => x.nombre + ': ' + semanas.map(kk => {
         const L = []; for(let d = 0; d < 7; d++){ const c = celda(x.id, d, kk); if(c && c.t === LIBRE) L.push(d); }
         return textoLibres(L);
       }).join(' / ')).join('  '));

    ok('Y si tiene dia libre fijo, ese dia va dentro del bloque',
       fijos.every(x => x.libreFijo < 0 || semanas.every(kk => {
         const c = celda(x.id, x.libreFijo, kk);
         return c && c.t === LIBRE;
       })));

    ok('Con esa persona librando 2 siempre, la semana sigue cuadrando',
       semanas.every(kk => {
         const eq = equidad(ctxReal(kk));
         return eq.faltan === 0 && eq.sinPuesto === 0 && revisar(ctxReal(kk)).conflictos.length === 0;
       }),
       (() => { let t = 0, p = 0;
         activos().forEach(x => t += diasObjetivoDe(x.id, kd));
         for(let d = 0; d < 7; d++) for(const c of combinaciones()) p += cobNec(c.puestoId, c.turnoId, d, kd);
         return t + ' turnos y ' + p + ' puestos'; })());

    SEMANA = guardaSem;
    semanas.forEach(kk => delete S.semanas[kk]);
  })();

  /* =================================================================
     VACACIONES, LICENCIAS Y PERMISOS
     Un dia de ausencia no es un dia libre ni un turno. El reparto se
     rehace alrededor y la cuenta de la semana se ajusta sola.
     ================================================================= */
  (function(){
    let ka = addDias(k, 6300);
    for(let i = 0; i < 60 && (S.semanas[ka] || S.semanas[addDias(ka,-7)]); i++) ka = addDias(ka, 7);
    const guardaSem = SEMANA, guardaAus = (S.ausencias || []).slice();
    SEMANA = ka;
    const e = E.find(x => x.libreFijo < 0) || E[0];

    /* una semana entera fuera */
    S.ausencias = guardaAus.concat([{ id:'test1', empId:e.id, tipo:'vacaciones', nota:'',
                                      desde:ka, hasta:addDias(ka,6) }]);
    olvidarRefuerzos();
    semana(ka); otraAlternativa(ka);

    ok('Quien esta de vacaciones no trabaja ningun dia de esa semana',
       (() => { for(let d = 0; d < 7; d++){ const c = celda(e.id, d, ka); if(!esAusencia(c)) return false; } return true; })(),
       e.nombre + ': ' + diasObjetivoDe(e.id, ka) + ' dias de trabajo');
    ok('Los dias fuera no cuentan como dias libres',
       libresSemana(e.id, ka) === 0 && equidad(ctxReal(ka)).filas.find(f => f.empId === e.id).libres === 0);
    ok('Con una persona fuera la semana sigue cuadrando sola',
       (() => {
         const eq = equidad(ctxReal(ka)), rev = revisar(ctxReal(ka));
         return eq.faltan === 0 && rev.conflictos.length === 0 && faltanManos(ka) === 0;
       })(),
       (() => { let t = 0, p = 0;
         activos().forEach(x => t += diasObjetivoDe(x.id, ka));
         for(let d = 0; d < 7; d++) for(const c of combinaciones()) p += cobNec(c.puestoId, c.turnoId, d, ka);
         return t + ' turnos y ' + p + ' puestos'; })());
    ok('El resto del equipo sigue con sus dias y sus libres',
       activos().filter(x => x.id !== e.id).every(x => {
         if(diasTrabajados(x.id, ka) !== diasObjetivoDe(x.id, ka)) return false;
         const L = []; for(let d = 0; d < 7; d++) if(esLibreReal(celda(x.id, d, ka))) L.push(d);
         return L.length === libresSemana(x.id, ka) && (L.length < 2 || diasSeguidos(L));
       }));

    /* un permiso de tres dias: el turno de 2 libres pasa al siguiente */
    const p2 = empleado(turnoDosLibres(ka));
    if(p2){
      S.ausencias = guardaAus.concat([{ id:'test2', empId:p2.id, tipo:'permiso', nota:'',
                                        desde:addDias(ka,2), hasta:addDias(ka,4) }]);
      olvidarRefuerzos();
      ok('Si a quien le toca librar 2 dias le caen 2 o mas de permiso, el turno pasa al siguiente',
         turnoDosLibres(ka) !== p2.id,
         p2.nombre + ' -> ' + ((empleado(turnoDosLibres(ka)) || {}).nombre || '-'));
    }

    /* un turno puesto a mano en un dia de ausencia se cae solo */
    S.ausencias = guardaAus.concat([{ id:'test3', empId:e.id, tipo:'medica', nota:'',
                                      desde:addDias(ka,1), hasta:addDias(ka,1) }]);
    olvidarRefuerzos();
    const w3 = semana(ka);
    w3.celdas[ck(e.id,1)] = { t:T['7-3'], p:P['A - Hertz'], o:'manual', b:true };
    ok('Un turno puesto a mano en un dia de ausencia no se sostiene',
       sanearSemana(ka) >= 1 && esAusencia(w3.celdas[ck(e.id,1)]));

    /* Lo que destapo el caso real: alguien de vacaciones casi toda la
       semana. Si su unico dia disponible se le daba como dia libre, ese
       turno se perdia y quedaba un puesto sin cubrir. */
    ok('Con una persona fuera, la semana cuadra sea cual sea la duracion',
       (() => {
         const guardaA = S.ausencias.slice();
         let mal = 0;
         for(let ini = 0; ini < 7; ini++) for(let largo = 1; largo <= 7 - ini; largo++){
           S.ausencias = [{ id:'t', empId:e.id, tipo:'vacaciones', nota:'',
                            desde:addDias(ka, ini), hasta:addDias(ka, ini + largo - 1) }];
           olvidarRefuerzos();
           if(faltanManos(ka) > 0) mal++;
         }
         S.ausencias = guardaA; olvidarRefuerzos();
         return mal === 0;
       })(),
       'probadas las 28 formas de faltar de una persona');

    ok('Nunca se deja sin descanso a quien esta la semana entera',
       (() => {
         const guardaA = S.ausencias.slice();
         const otros = E.filter(x => x.id !== e.id);
         let mal = 0;
         if(otros.length){
           /* el caso mas duro: dos personas fuera la semana completa */
           S.ausencias = [{ id:'t1', empId:e.id, tipo:'vacaciones', nota:'', desde:ka, hasta:addDias(ka,6) },
                          { id:'t2', empId:otros[0].id, tipo:'medica', nota:'', desde:ka, hasta:addDias(ka,6) }];
           olvidarRefuerzos();
           const m = libresPorPersona(ka);
           activos().forEach(x => { if(m[x.id] === 0 && diasAusente(x.id, ka).length === 0) mal++; });
         }
         S.ausencias = guardaA; olvidarRefuerzos();
         return mal === 0;
       })(),
       'antes que dejar a alguien 7 dias seguidos, se avisa de que faltan manos');

    S.ausencias = guardaAus; SEMANA = guardaSem;
    delete S.semanas[ka];
    olvidarRefuerzos();
  })();

  /* =================================================================
     MOVER UN DIA LIBRE SUELTO NO PUEDE COLARSE
     Todos los dias tienen ya a alguien librando, asi que llevarse un
     libre a otro dia deja un puesto sin cubrir. Antes se podia hacer
     arrastrando la casilla y la aplicacion lo aceptaba sin decir nada.
     ================================================================= */
  (function(){
    let kl = addDias(k, 4900);
    for(let i = 0; i < 60 && (S.semanas[kl] || S.semanas[addDias(kl,-7)]); i++) kl = addDias(kl, 7);
    const guardaSem = SEMANA; SEMANA = kl;
    semana(kl); otraAlternativa(kl);

    const e = activos().filter(x => x.libreFijo < 0 && libresSemana(x.id, kl) === 1)[0];
    let da = -1;
    for(let d = 0; d < 7; d++){ const c = celda(e.id, d, kl); if(c && c.t === LIBRE) da = d; }

    ok('Cada dia de la semana tiene a alguien librando',
       (() => { for(let d = 0; d < 7; d++){ let n = 0;
           activos().forEach(x => { const c = celda(x.id, d, kl); if(c && c.t === LIBRE) n++; });
           if(n < 1) return false; } return true; })(),
       (() => { const o = []; for(let d = 0; d < 7; d++){ let n = 0;
           activos().forEach(x => { const c = celda(x.id, d, kl); if(c && c.t === LIBRE) n++; }); o.push(n); }
         return o.join(''); })());

    ok('Un dia libre de mas nunca deja el nucleo del dia sin cubrir',
       (() => {
         if(da < 0) return true;
         for(let salto = 1; salto < 7; salto++){
           const db = (da + salto) % 7;
           const r = validar(ctxReal(kl), e.id, db, LIBRE, null, { reemplazar:true });
           if(!r.ok) continue;
           let libran = 1; activos().forEach(x => { if(x.id !== e.id && esLibreReal(celda(x.id, db, kl))) libran++; });
           if(disponiblesDia(db, kl) - libran < nucleoDia(db)) return false;
         }
         return true;
       })(),
       e ? e.nombre + ' libra el ' + DIAS_CORTO[da] : '');

    ok('Mover un dia libre solo se permite si el nucleo del dia aguanta',
       (() => {
         if(da < 0) return true;
         let bien = true;
         for(let salto = 1; salto < 7; salto++){
           const db = (da + salto) % 7;
           let libran = 0;
           activos().forEach(x => { if(x.id !== e.id && esLibreReal(celda(x.id, db, kl))) libran++; });
           const cabe = libran + 1 <= cupoLibresMax(db, kl);
           const r = validar(ctxReal(kl), e.id, db, LIBRE, null, { reemplazar:true });
           /* si lo rechaza por otro motivo (ya tendria demasiados libres) no aplica */
           if(!r.ok && r.motivo !== 'cupoLibres') continue;
           if(cabe !== r.ok) bien = false;
         }
         return bien;
       })(),
       'se acepta justo cuando quedan manos para los ' + nucleoDia(0) + ' puestos principales');

    SEMANA = guardaSem;
    delete S.semanas[kl];
  })();

  /* =================================================================
     EL INTERRUPTOR DEL ENTRENAMIENTO
     Tiene que levantar todas las limitaciones de un golpe, dejar el
     horario sin errores, y poder volver atras dejandolo como estaba.
     ================================================================= */
  (function(){
    const ent = E.find(x => entrenando(x));
    ok('Hay alguien en entrenamiento y sus limitaciones estan guardadas aparte',
       !ent || ((ent.entrenamiento.puestos || []).length > 0 || ent.entrenamiento.sinDosLibres),
       ent ? ent.nombre + ': ' + cambiosAlTerminarEntrenamiento(ent.id).length + ' limitacion(es)' : 'nadie en entrenamiento');
    if(!ent) return;

    const antes = {
      pp: ent.puestosProhibidos.slice(),
      tp: ent.turnosProhibidos.slice(),
      orden: S.config.rotacionLibres.orden.slice(),
      inicio: S.config.rotacionLibres.inicio
    };
    const enRot = () => S.config.rotacionLibres.orden.indexOf(ent.id) >= 0;
    const rotAntes = enRot();

    ponerEntrenamiento(ent.id, false);
    ok('Al darle por listo se le levantan todas las limitaciones',
       ent.puestosProhibidos.length === 0 && !entrenando(ent),
       ent.nombre + ' pasa de ' + antes.pp.length + ' marca(s) vetada(s) a ' + ent.puestosProhibidos.length);
    ok('Al darle por listo entra en el turno de 2 dias libres',
       !ent.entrenamiento.sinDosLibres || enRot(),
       'la vuelta pasa a ser de ' + S.config.rotacionLibres.orden.length + ' semanas');
    ok('Ya sin limitaciones le tocan visitas a la Terminal B como a los demas',
       objetivoBDe(ent.id) === S.config.objetivoB,
       'objetivo ' + objetivoBDe(ent.id));

    /* el horario tiene que seguir saliendo limpio con el ya integrado */
    ok('Con esa persona trabajando normal el horario sale sin errores',
       (() => {
         let kk = addDias(k, 4200);
         for(let i = 0; i < 60 && (S.semanas[kk] || S.semanas[addDias(kk,-7)]); i++) kk = addDias(kk, 7);
         const guardaSem = SEMANA; SEMANA = kk;
         semana(kk); otraAlternativa(kk);
         const ev = equidad(ctxReal(kk));
         const rev = revisar(ctxReal(kk));
         const dias = diasTrabajados(ent.id, kk);
         SEMANA = guardaSem;
         delete S.semanas[kk];
         return ev.faltan === 0 && rev.conflictos.length === 0 && dias === diasObjetivoDe(ent.id, kk);
       })());

    ponerEntrenamiento(ent.id, true);
    ok('Se puede volver a entrenamiento y queda todo como estaba',
       entrenando(ent) &&
       ent.puestosProhibidos.slice().sort().join() === antes.pp.slice().sort().join() &&
       ent.turnosProhibidos.slice().sort().join() === antes.tp.slice().sort().join() &&
       enRot() === rotAntes,
       ent.puestosProhibidos.map(id => (puesto(id)||{}).corto).join(', ') || 'sin marcas vetadas');

    /* por si acaso, se deja exactamente como estaba */
    ent.puestosProhibidos = antes.pp; ent.turnosProhibidos = antes.tp;
    S.config.rotacionLibres.orden = antes.orden; S.config.rotacionLibres.inicio = antes.inicio;
    olvidarRefuerzos(); olvidarObjetivoTipo();
  })();

  /* =================================================================
     PLANTILLA CORTA: CUATRO PERSONAS Y EL ENTRENAMIENTO QUE CEDE
     Con cuatro disponibles uno libra y quedan tres. La Terminal B pasa
     entonces a un turno unico de 11 a 7 y, sobre todo, es el PRIMER
     puesto que se abre: los puestos se abren por orden, asi que el que
     se cae cuando no dan las manos es siempre uno de la Terminal A y
     nunca la Terminal B.
     Esos mismos dias las limitaciones del entrenamiento ceden: si quien
     entrena no puede ir a la Terminal B ni ponerse el uniforme de
     Hertz, un mostrador se queda sin nadie por una limitacion que solo
     tiene sentido cuando hay gente de sobra.
     ================================================================= */
  (function(){
    const rot = S.empleados.filter(x => equipoDe(x) === 'rotativo');
    if(rot.length < 4) return;
    const ent = rot.find(x => entrenando(x));
    const guardaAct = rot.map(x => x.activo);
    const guardaSem = SEMANA;
    let kc = addDias(k, 5600);
    for(let i = 0; i < 60 && (S.semanas[kc] || S.semanas[addDias(kc,-7)]); i++) kc = addDias(kc, 7);
    const limpiar = () => { olvidarPrioridad(); olvidarRefuerzos(); olvidarLibres(); olvidarObjetivoTipo(); };

    /* cuatro personas, y una de ellas la que esta en entrenamiento */
    const cuatro = [];
    if(ent) cuatro.push(ent);
    rot.forEach(x => { if(cuatro.length < 4 && x !== ent) cuatro.push(x); });
    rot.forEach(x => x.activo = cuatro.indexOf(x) >= 0);
    SEMANA = kc; limpiar();
    semana(kc); otraAlternativa(kc);

    const ctxC = ctxReal(kc);
    const tB = turnoUnicoB(), pB = puestoTerminalB();

    ok('Con cuatro personas la Terminal B es el primer puesto que se abre',
       (() => { if(!tB || !pB) return false;
         for(let d = 0; d < 7; d++){
           if(!esPlantillaCorta(d, kc)) return false;
           const pri = prioridadDia(d, kc);
           if(!pri.length || pri[0].puestoId !== pB.id || pri[0].turnoId !== tB.id) return false;
         } return true; })(),
       'turno unico de 11-7 y por delante de las dos puntas de la Terminal A');

    ok('Con cuatro personas la Terminal B no se queda vacia ningun dia',
       (() => { if(!tB || !pB) return false;
         for(let d = 0; d < 7; d++) if(ocupacion(ctxC, d, tB.id, pB.id) < 1) return false;
         return true; })());

    ok('Con cuatro personas no queda ningun puesto principal sin cubrir',
       principalesSinCubrir(kc) === 0 && revisar(ctxC).conflictos.length === 0,
       principalesSinCubrir(kc) + ' sin cubrir y ' + revisar(ctxC).conflictos.length + ' conflicto(s)');

    ok('Con cuatro personas se acaba el turno de dos dias libres: cada uno libra uno',
       activos().every(x => libresSemana(x.id, kc) === 1),
       activos().map(x => x.nombre + ':' + libresSemana(x.id, kc)).join(' '));

    if(ent) ok('Con cuatro personas las limitaciones del entrenamiento ceden',
       (() => { for(let d = 0; d < 7; d++) if(!entrenoCede(ent, d, kc)) return false; return true; })(),
       ent.nombre + ' puede hacer la Terminal B y Hertz mientras solo haya cuatro');

    /* y en cuanto vuelve a haber gente, mandan otra vez */
    rot.forEach((x, i) => x.activo = guardaAct[i]);
    limpiar();
    if(ent) ok('Con la plantilla completa el entrenamiento vuelve a mandar',
       (() => { for(let d = 0; d < 7; d++) if(entrenoCede(ent, d, kc)) return false; return true; })(),
       ent.nombre + ' no va a la Terminal B mientras haya con quien cubrirla');

    SEMANA = guardaSem;
    delete S.semanas[kc];
    limpiar();
  })();

  /* =================================================================
     EL TURNO DE ANTES Y EL DE DESPUES DEL DESCANSO
     La vispera del dia libre se entra en el primer turno del dia -el 7-3-
     y el dia de vuelta en el ultimo -el 3-11-.

     Se mide la puntuacion directamente y no armando semanas: armar tres
     semanas dentro de las pruebas se llevaba mas de medio minuto, y lo
     que hay que comprobar es que la regla empuja hacia el turno correcto.
     ================================================================= */
  (function(){
    const t73  = turno(T['7-3']), t311 = turno(T['3-11']);
    if(!t73 || !t311) return;
    const pA = P['A - Hertz'];

    ok('El primer y el ultimo turno del dia son el 7-3 y el 3-11',
       (() => { const ext = extremosDelDia(1, k);
         return ext.pronto === min2(t73.inicio) && ext.tarde === min2(t311.inicio); })(),
       (() => { const ext = extremosDelDia(1, k);
         const nom = (m) => { const x = turnosActivos().find(y => min2(y.inicio) === m); return x ? x.corto : m; };
         return 'entra primero el ' + nom(ext.pronto) + ' y ultimo el ' + nom(ext.tarde); })());

    /* Un empleado normal, con el martes de trabajo entre un lunes libre y
       un miercoles libre segun el caso. Se puntua el mismo dia con los dos
       turnos y se compara. */
    const e = E.find(x => !entrenando(x) && x.libreFijo < 0);
    const puntos = (celdas, turnoX) => {
      const ctx = ctxCopia(k, celdas);
      delete e._hist;
      return puntuarCandidato(ctx, e, 1, turnoX, pA, { equilibrio:1, preferencias:1 });
    };
    const libreEl = (dia) => { const c = {}; c[ck(e.id, dia)] = { t:LIBRE, p:null, o:'auto', b:false }; return c; };

    ok('Si manana libra, el 7-3 puntua mas que el 3-11',
       (() => {
         if(!e) return true;
         const c = libreEl(2);                      // miercoles libre, martes es la vispera
         return puntos(c, t73) > puntos(c, t311);
       })(),
       e ? e.nombre + ': ' + Math.round(puntos(libreEl(2), t73)) + ' contra ' + Math.round(puntos(libreEl(2), t311)) : '');

    ok('Si ayer libro, el 3-11 puntua mas que el 7-3',
       (() => {
         if(!e) return true;
         const c = libreEl(0);                      // lunes libre, martes es la vuelta
         return puntos(c, t311) > puntos(c, t73);
       })(),
       e ? e.nombre + ': ' + Math.round(puntos(libreEl(0), t311)) + ' contra ' + Math.round(puntos(libreEl(0), t73)) : '');

    ok('Entre dos dias libres la regla no empuja a ningun lado',
       (() => {
         if(!e) return true;
         /* lunes y miercoles libres: el martes es vispera Y vuelta a la vez,
            asi que la regla se contradice y no debe inclinar la balanza */
         const c = {};
         c[ck(e.id, 0)] = { t:LIBRE, p:null, o:'auto', b:false };
         c[ck(e.id, 2)] = { t:LIBRE, p:null, o:'auto', b:false };
         return Math.abs(puntos(c, t73) - puntos(c, t311)) < 900;
       })());

    ok('Quien esta en entrenamiento se queda fuera de esa regla',
       (() => {
         const ent = E.find(x => entrenando(x));
         if(!ent) return true;
         const c = libreEl2(ent, 2);
         const ctx = ctxCopia(k, c);
         delete ent._hist;
         const a = puntuarCandidato(ctx, ent, 1, t73,  pA, { equilibrio:1, preferencias:1 });
         const b = puntuarCandidato(ctx, ent, 1, t311, pA, { equilibrio:1, preferencias:1 });
         return Math.abs(a - b) < 900;              // sin el empujon de 2000
       })(),
       (E.find(x => entrenando(x)) || {}).nombre || 'nadie en entrenamiento');

    function libreEl2(quien, dia){ const c = {}; c[ck(quien.id, dia)] = { t:LIBRE, p:null, o:'auto', b:false }; return c; }
  })();

  /* =================================================================
     EL REPARTO DE DOS-Y-UNO
     El interruptor de Ajustes: la plantilla se parte en dos grupos
     sorteados y, mientras uno libra dos dias seguidos, el otro libra uno;
     a la semana siguiente se cambian. Entra todo el mundo, tambien quien
     este en entrenamiento. Se mide sobre las cuentas y no armando
     semanas, que eso tarda demasiado para una prueba; que el reparto de
     verdad cuadra esta comprobado aparte.
     ================================================================= */
  (function(){
    const guarda = S.config.modoDosUno, guardaDes = S.config.modoDosUnoDesfase;
    const limpiar = () => { olvidarLibres(); olvidarRefuerzos(); olvidarObjetivoTipo(); };

    /* --- apagado: como toda la vida --- */
    S.config.modoDosUno = false; limpiar();
    ok('Con el reparto de dos-y-uno apagado, solo una persona libra dos dias',
       E.filter(e => libresSemana(e.id, k) === 2 && !e.dosLibresFijos).length <= 1,
       E.map(e => e.nombre + ':' + libresSemana(e.id, k)).join(' '));

    /* --- encendido --- */
    S.config.modoDosUno = true; S.config.modoDosUnoDesfase = 0; limpiar();
    const cuentas = (kk) => E.map(e => libresSemana(e.id, kk));
    const retrato = (kk) => E.map(e => e.nombre + ':' + libresSemana(e.id, kk)).join(' ');

    ok('Encendido, cada semana unos libran dos dias y otros uno: nunca todos dos',
       (() => {
         for(let i = 0; i < 6; i++){
           const v = cuentas(addDias(k, 7*i));
           if(v.indexOf(2) < 0 || v.indexOf(1) < 0) return false;
         }
         return true;
       })(),
       retrato(k) + '  //  ' + retrato(addDias(k, 7)));
    ok('Los dos grupos salen mitad y mitad (con siete, 4 y 3)',
       (() => {
         const g = gruposDosUno();
         return g.a.length === Math.ceil(E.length/2) && g.b.length === Math.floor(E.length/2) &&
                g.a.concat(g.b).sort().join(',') === E.map(e => e.id).sort().join(',');
       })(),
       (() => { const g = gruposDosUno();
         return nombresGrupo(g.a).join('/') + '  vs  ' + nombresGrupo(g.b).join('/'); })());
    ok('Cada persona alterna dos, uno, dos, uno semana tras semana',
       E.every(e => {
         const v = [];
         for(let i = 0; i < 6; i++) v.push(libresSemana(e.id, addDias(k, 7*i)));
         for(let i = 1; i < v.length; i++) if(v[i] === v[i-1]) return false;
         return true;
       }),
       (() => { const e = E[0]; const v = [];
         for(let i = 0; i < 6; i++) v.push(libresSemana(e.id, addDias(k, 7*i)));
         return e.nombre + ': ' + v.join(' - '); })());
    ok('Los dos grupos se cambian los papeles cada semana',
       (() => {
         const g = gruposDosUno();
         for(let i = 0; i < 6; i++){
           const kk = addDias(k, 7*i);
           const p = leTocanDosLibres(g.a[0], kk);
           if(!g.a.every(id => leTocanDosLibres(id, kk) === p)) return false;
           if(!g.b.every(id => leTocanDosLibres(id, kk) !== p)) return false;
         }
         return true;
       })());
    ok('Quien esta en entrenamiento tambien entra en el reparto de dos-y-uno',
       (() => {
         const ent = E.find(x => entrenando(x));
         if(!ent) return true;
         const g = gruposDosUno();
         return g.a.indexOf(ent.id) >= 0 || g.b.indexOf(ent.id) >= 0;
       })(),
       (E.find(x => entrenando(x)) || {}).nombre || 'nadie en entrenamiento');
    ok('El sorteo es repetible: la misma semilla da siempre los mismos grupos',
       gruposDosUno().a.join(',') === gruposDosUno().a.join(','));
    ok('Sortear otra vez cambia quien va con quien',
       (() => {
         const g0 = S.config.modoDosUnoSemilla;
         const antes = gruposDosUno().a.join(',');
         let distinto = false;
         for(let i = 1; i <= 60 && !distinto; i++){
           S.config.modoDosUnoSemilla = g0 + i;
           if(gruposDosUno().a.join(',') !== antes) distinto = true;
         }
         S.config.modoDosUnoSemilla = g0; limpiar();
         return distinto;
       })());
    ok('Rehacer solo toca borradores de esta semana en adelante, nunca lo publicado',
       (() => {
         const guardaSem = S.semanas;
         const lun = lunesDe(hoyISO());
         const celda1 = {}; celda1[ck(E[0].id, 0)] = { t:'x', p:'y', o:'auto', b:false };
         S.semanas = {
           [addDias(lun, -7)]: { estado:'borrador', celdas: celda1 },   // pasada: no
           [lun]:              { estado:'borrador', celdas: celda1 },   // esta: si
           [addDias(lun, 7)]:  { estado:'publicado', celdas: celda1 },  // publicada: no
           [addDias(lun, 14)]: { estado:'borrador', celdas: {} },       // vacia: no
           [addDias(lun, 21)]: { estado:'borrador', celdas: celda1 }    // futura: si
         };
         const ks = borradoresDeRenta();
         S.semanas = guardaSem;
         return ks.length === 2 && ks[0] === lun && ks[1] === addDias(lun, 21);
       })(),
       'de cinco semanas solo entran las dos que tocan');
    ok('El boton "Empezar al reves" le da la vuelta a los papeles',
       (() => {
         const g = gruposDosUno();
         const antes = leTocanDosLibres(g.a[0], k);
         S.config.modoDosUnoDesfase = 1; limpiar();
         const luego = leTocanDosLibres(g.a[0], k);
         S.config.modoDosUnoDesfase = 0; limpiar();
         return antes !== luego;
       })());
    ok('Con cuatro personas o menos el reparto de dos-y-uno se apaga solo',
       (() => {
         const rot = S.empleados.filter(x => equipoDe(x) === 'rotativo');
         if(rot.length < 5) return true;
         const guardaAct = rot.map(x => x.activo);
         rot.forEach((x, i) => x.activo = i < 4);          // solo cuatro
         limpiar();
         const todosUno = activos().every(x => libresSemana(x.id, k) === 1);
         rot.forEach((x, i) => x.activo = guardaAct[i]);
         limpiar();
         return todosUno;
       })(),
       'con cuatro no hay margen ni para el primer dia');

    /* se deja como estaba */
    S.config.modoDosUno = guarda; S.config.modoDosUnoDesfase = guardaDes;
    limpiar();
    ok('El interruptor queda como estaba despues de probarlo',
       S.config.modoDosUno === guarda);
  })();

  /* =================================================================
     LA VISTA DE UN DIA Y LA DE LA SEMANA
     El fallo que arreglan: la vista se decidia una sola vez y se quedaba
     ahi. Quien abria la aplicacion con la ventana estrecha se quedaba
     viendo un solo dia para siempre, aunque despues ensanchara.
     ================================================================= */
  (function(){
    const anchoDeVerdad = pantallaAngosta;
    const gDia = DIA_MOVIL, gMano = VISTA_A_MANO;
    const fingir = (a) => { window.pantallaAngosta = () => a; };

    fingir(false); VISTA_A_MANO = false; decidirVista();
    ok('En pantalla ancha se ve la semana entera', DIA_MOVIL === -1, 'DIA_MOVIL=' + DIA_MOVIL);

    fingir(true); decidirVista();
    ok('Al estrechar la ventana pasa sola a un dia', DIA_MOVIL >= 0, 'DIA_MOVIL=' + DIA_MOVIL);

    fingir(false); decidirVista();
    ok('Y al ensanchar vuelve sola a la semana entera', DIA_MOVIL === -1, 'DIA_MOVIL=' + DIA_MOVIL);

    /* lo que elige la persona se respeta */
    DIA_MOVIL = 3; VISTA_A_MANO = true;
    fingir(false); decidirVista();
    ok('El dia elegido a mano no lo pisa el tamano de la ventana',
       DIA_MOVIL === 3, 'DIA_MOVIL=' + DIA_MOVIL);
    fingir(true); decidirVista();
    ok('Ni al estrechar', DIA_MOVIL === 3, 'DIA_MOVIL=' + DIA_MOVIL);

    /* y se puede devolver a automatico */
    VISTA_A_MANO = false; fingir(false); decidirVista();
    ok('"Vista automatica" devuelve el mando al tamano de la ventana', DIA_MOVIL === -1);

    window.pantallaAngosta = anchoDeVerdad;
    DIA_MOVIL = gDia; VISTA_A_MANO = gMano;
  })();

  ok('El color de la marca se convierte bien en sus tres tonos',
     (() => {
       const t = tonosPuesto({ fondo:'#a8781a' });
       return /^#[0-9a-f]{6}$/.test(t.c) && /^#[0-9a-f]{6}$/.test(t.bg) &&
              /^#[0-9a-f]{6}$/.test(t.line) && /^#[0-9a-f]{6}$/.test(t.txt) && t.bg !== t.c;
     })());

  return r;
}
function verPruebas(){
  const r = pruebas();
  const fallos = r.filter(x => !x.ok).length;
  let h = '<div class="alert ' + (fallos ? 'bad' : 'ok') + '"><b>' + (r.length - fallos) + ' de ' + r.length + ' pruebas correctas</b>' +
          (fallos ? 'Revisa los puntos en rojo.' : 'Todas las reglas funcionan como se espera.') + '</div>';
  h += '<table class="data"><tbody>' + r.map(x =>
    '<tr><td style="width:34px">' + (x.ok ? '<span class="pill ok">OK</span>' : '<span class="pill bad">X</span>') + '</td>' +
    '<td>' + esc(x.nombre) + '<br><span class="tiny muted">' + esc(x.det) + '</span></td></tr>').join('') + '</tbody></table>';
  modal('Pruebas del sistema', h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>', true);
  render();
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function inicio(){
  const existia = cargar();
  SEMANA = lunesDe(hoyISO());
  if(!existia) sembrarDemo();
  SEMANA = lunesDe(hoyISO());
  restaurarVista();                 // vuelve a la pantalla y semana donde estabas
  render();
  el('pin').addEventListener('keydown', ev => { if(ev.key === 'Enter') entrar(); });
  /* Si ya habias entrado, al refrescar no se vuelve a pedir la clave */
  if(sesionAbierta()){
    document.documentElement.classList.add('consesion');
    el('login').classList.add('hidden');
  } else {
    document.documentElement.classList.remove('consesion');
    el('pin').focus();
  }
  if(nubeLista()){
    el('pinmsg').style.color = 'var(--soft)';
    el('pinmsg').textContent = 'Sincronizando con la nube...';
    nubeSincronizarInicio().then(() => {
      el('pinmsg').textContent = '';
      restaurarVista();             // la nube trae otra semana guardada, pero tu vista manda
      render();
      nubeVigilar();
      nubeMirarAlVolver();
    });
  }
}
/* Sin espera: el guion va al final del documento, asi que el HTML ya esta
   leido. Los 30 milisegundos de antes obligaban al navegador a dibujar una
   vez con la pantalla de la clave delante. */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inicio);
else inicio();

/* =====================================================================
   LA APLICACION EN EL TELEFONO
   Solo cuando la pagina se sirve por internet (http o https). Abriendo el
   archivo suelto con doble clic esto no aplica y se salta sin ruido.
   ===================================================================== */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
