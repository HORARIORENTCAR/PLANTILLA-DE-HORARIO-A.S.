/* =====================================================================
   CALENDARIO PARA ELEGIR Y EDITAR LA SEMANA
   ===================================================================== */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let _calMes = null;      // primer dia del mes que se esta mirando

function abrirCalendario(){
  _calMes = SEMANA.slice(0,8) + '01';
  pintarCalendario();
}
function calMover(n){
  const d = s2d(_calMes);
  d.setMonth(d.getMonth() + n);
  _calMes = d2s(d).slice(0,8) + '01';
  pintarCalendario();
}
function pintarCalendario(){
  const base = s2d(_calMes);
  const mes = base.getMonth(), anio = base.getFullYear();
  const hoy = hoyISO(), semanaHoy = lunesDe(hoy);

  let h = '<div class="mescab">' +
    '<button class="btn sec sm" onclick="calMover(-1)">&larr;</button>' +
    '<b>' + MESES[mes] + ' ' + anio + '</b>' +
    '<button class="btn sec sm" onclick="calMover(1)">&rarr;</button>' +
    '<button class="btn sec sm" onclick="_calMes=hoyISO().slice(0,8)+\'01\';pintarCalendario()">Mes actual</button>' +
  '</div>';
  h += '<p class="tiny muted" style="text-align:center;margin-top:-4px">Pulsa cualquier semana para abrirla.</p>';
  h += '<table class="mes"><thead><tr><th class="est">Semana</th>' +
       DIAS.map(d => '<th>' + d.slice(0,3) + '</th>').join('') + '</tr></thead><tbody>';

  let k = lunesDe(d2s(base));
  for(let f = 0; f < 6; f++){
    const dentro = [];
    for(let i = 0; i < 7; i++){ const dd = s2d(addDias(k, i)); if(dd.getMonth() === mes) dentro.push(i); }
    if(!dentro.length && f > 0){ k = addDias(k, 7); continue; }
    const w = S.semanas[k];
    /* en vez del tipo de semana, que ya no existe, se dice a quien le tocan
       los dos dias libres seguidos: es lo que distingue una semana de otra */
    const dos = empleado(turnoDosLibres(k));
    const estado = !w ? '<span class="pill off">Sin crear</span>'
      : (w.estado === 'publicado' ? '<span class="pill ok">Publicado</span>' : '<span class="pill warn">Borrador</span>');
    h += '<tr class="sem' + (k === SEMANA ? ' sel' : '') + '" onclick="elegirSemana(\'' + k + '\')">' +
      '<td><span class="estsem">' + estado + '<small>' + (dos ? esc(dos.nombre) + ': 2 libres' : 'sin rotacion') +
      (k === semanaHoy ? ' &middot; actual' : '') + '</small></span></td>';
    for(let i = 0; i < 7; i++){
      const f2 = addDias(k, i), dd = s2d(f2);
      const cls = 'dnum' + (dd.getMonth() !== mes ? ' fuera' : '') + (f2 === hoy ? ' hoy' : '');
      h += '<td><span class="' + cls + '">' + dd.getDate() + '</span></td>';
    }
    h += '</tr>';
    k = addDias(k, 7);
  }
  h += '</tbody></table>';

  const w = semana(SEMANA);
  h += '<div class="card" style="margin:14px 0 0;background:#f7f9fc"><h3 style="margin-bottom:6px">Semana abierta ahora</h3>' +
    '<p style="margin:0 0 8px">Del <b>' + fechaLarga(SEMANA) + '</b> al <b>' + fechaLarga(addDias(SEMANA,6)) + '</b> &middot; ' +
    'dos dias libres para <b>' + esc((empleado(turnoDosLibres(SEMANA))||{}).nombre || '-') + '</b> &middot; ' +
    (w.estado === 'publicado' ? '<span class="pill ok">Publicado</span>' : '<span class="pill warn">Borrador</span>') + '</p>' +
    '<div class="row">' +
      '<button class="btn sec sm" onclick="cerrar();cambiarTurnoSemana()">Cambiar de turno solo esta semana</button>' +
      (S.semanas[SEMANA] && Object.keys(w.celdas).length
        ? '<button class="btn sec sm" onclick="vaciarSemana()">Vaciar esta semana</button>' : '') +
    '</div></div>';

  h += '<label class="f" style="margin-top:12px"><span>Ir a una fecha concreta</span>' +
       '<input type="date" id="cal_fecha" value="' + SEMANA + '" onchange="elegirSemana(lunesDe(this.value))"></label>';

  modal('Elegir semana en el calendario', h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>');
}
function elegirSemana(k){
  if(!k) return;
  SEMANA = lunesDe(k);
  cerrar(); render();
  toast('Semana del ' + fechaLarga(SEMANA));
}
function vaciarSemana(){
  confirmar('Se borrara todo el horario de la semana del <b>' + fechaLarga(SEMANA) + '</b>, incluido lo que pusiste a mano.', () => {
    const w = semana(SEMANA);
    w.celdas = {}; w.estado = 'borrador'; w.publicado = null; w.modificado = new Date().toISOString();
    bitacora('Se vacio la semana del ' + fechaLarga(SEMANA) + '.');
    guardar(); render(); toast('Semana vaciada');
  });
}

/* =====================================================================
   LIMPIAR O VACIAR
   Tres niveles: quitar solo lo que puso el sistema, desbloquear lo tuyo,
   o dejar la semana completamente en blanco.
   ===================================================================== */
function menuLimpiar(){
  const w = semana(SEMANA);
  let auto = 0, mano = 0, total = 0;
  for(const key in w.celdas){
    const c = w.celdas[key];
    total++;
    if(c.o === 'manual' || c.b) mano++; else auto++;
  }

  let h = '<p class="muted" style="margin-top:0">La semana del ' + fechaLarga(SEMANA) + ' tiene <b>' + total +
          '</b> casilla(s): <b>' + auto + '</b> que puso el sistema y <b>' + mano + '</b> que fijaste tu.</p>';

  h += '<button class="opt' + (auto ? '' : ' off') + '" ' + (auto ? 'onclick="hacerLimpiar(\'auto\')"' : 'disabled style="opacity:.5;cursor:default"') + '>' +
       '<b>Quitar solo lo que puso el sistema</b><small>' +
       (auto ? 'Borra ' + auto + ' casilla(s) y deja intactas las ' + mano + ' que fijaste tu.'
             : 'No hay nada del sistema que quitar: todo lo de esta semana lo fijaste tu.') + '</small></button>';

  h += '<button class="opt' + (mano ? '' : ' off') + '" ' + (mano ? 'onclick="hacerLimpiar(\'soltar\')"' : 'disabled style="opacity:.5;cursor:default"') + '>' +
       '<b>Soltar lo que fijaste, sin borrarlo</b><small>' +
       (mano ? 'Las ' + mano + ' casillas fijadas siguen ahi, pero el sistema podra cambiarlas al generar.'
             : 'No hay nada fijado.') + '</small></button>';

  h += '<button class="opt" ' + (total ? 'onclick="hacerLimpiar(\'todo\')"' : 'disabled style="opacity:.5;cursor:default"') + '>' +
       '<b>Dejar la semana en blanco</b><small>' +
       (total ? 'Borra las ' + total + ' casillas y vuelve a borrador. Empiezas de cero.'
              : 'La semana ya esta vacia.') + '</small></button>';

  /* Y por equipo, que los tres horarios van por libre: se puede rehacer el
     del counter sin perder lo de supervisores ni lo de servicio. */
  h += '<p class="tiny muted" style="margin:14px 0 6px"><b>O solo uno de los tres horarios</b></p>';
  EQUIPO_IDS.forEach(q => {
    let n = 0;
    plantilla(q).forEach(e => { for(let d = 0; d < 7; d++) if(w.celdas[ck(e.id, d)]) n++; });
    h += '<button class="opt" ' + (n ? 'onclick="vaciarEquipo(\'' + q + '\')"' : 'disabled style="opacity:.5;cursor:default"') + '>' +
         '<b>Vaciar solo ' + esc(infoEquipo(q).nombre) + '</b><small>' +
         (n ? 'Borra sus ' + n + ' casilla(s) y deja los otros dos horarios como estan.'
            : 'Ese horario ya esta vacio.') + '</small></button>';
  });

  modal('Limpiar o vaciar la semana', h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>');
}
/* =====================================================================
   POR QUE NO CUADRA UNA SEMANA
   No basta con decir "faltan manos": hay que decir QUE DIA, QUIEN queda
   y POR QUE no llega. Casi nunca es por los dias de vacaciones; suele ser
   porque quien queda no puede hacer los puestos principales.
   ===================================================================== */
function porQueNoCuadra(k){
  k = k || SEMANA;
  /* el dia mas apretado: donde mas falta para cubrir los principales */
  let peor = -1, falta = 0;
  for(let d = 0; d < 7; d++){
    const n = Math.max(0, nucleoDia(d, k) - Math.min(trabajanDia(d, k), capacesNucleo(d, k)));
    if(n > falta){ falta = n; peor = d; }
  }
  if(peor < 0){
    /* no hay un dia concreto: es la cuenta de toda la semana la que no sale */
    for(let d = 0; d < 7; d++){
      const c = capacesNucleo(d, k);
      if(peor < 0 || c < capacesNucleo(peor, k)) peor = d;
    }
  }
  /* ¿es que ese dia faltan aptos, o es que no caben los descansos? */
  const cortos = [];
  for(let d = 0; d < 7; d++) if(capacesNucleo(d, k) <= nucleoDia(d, k)) cortos.push(d);
  const faltanAptos = capacesNucleo(peor, k) < nucleoDia(peor, k);
  const dia = DIAS[peor].toLowerCase();
  const fuera = [], fijos = [], noAptos = [];
  activos().forEach(e => {
    if(ausenteEnDia(e.id, peor, k)){ fuera.push(e.nombre); return; }
    if(fijoVigente(e, k) === peor){ fijos.push(e.nombre); return; }
    if(!puedeCubrirNucleo(e, peor, k)) noAptos.push(e.nombre);
  });
  const capaces = capacesNucleo(peor, k);
  const razones = [];
  if(fuera.length)   razones.push(fuera.join(' y ') + (fuera.length === 1 ? ' esta fuera' : ' estan fuera'));
  if(fijos.length)   razones.push(fijos.join(' y ') + ' libra fijo ese dia');
  if(noAptos.length){
    const enEntreno = noAptos.filter(n => entrenando(activos().find(x => x.nombre === n)));
    razones.push(noAptos.join(' y ') + (noAptos.length === 1 ? ' no puede' : ' no pueden') +
                 ' cubrir puestos principales' +
                 (enEntreno.length === noAptos.length ? ' mientras este en entrenamiento' : ''));
  }
  /* la salida mas util que se le puede dar */
  let arreglo = '';
  if(noAptos.length){
    const enEntreno = noAptos.filter(n => { const e = activos().find(x => x.nombre === n); return entrenando(e); });
    if(enEntreno.length)
      arreglo = 'Esto se arregla solo cuando ' + enEntreno.join(' y ') + ' termine el entrenamiento: ' +
                'quita la casilla en su ficha y la semana cuadra sin tocar nada mas.';
    else
      arreglo = 'Revisa en su ficha las marcas y turnos que tiene vetados.';
  } else {
    arreglo = 'Mueve alguna fecha de ausencia, o quita un puesto principal de la lista en Ajustes.';
  }
  /* La frase de cabecera, distinta segun el motivo */
  let titular;
  if(faltanAptos){
    titular = 'el ' + dia + ' solo <b>' + capaces + ' persona(s)</b> pueden cubrir los <b>' +
              nucleoDia(peor, k) + ' puestos principales</b>';
  } else {
    const nombresDias = cortos.map(d => DIAS[d].toLowerCase());
    const lista = nombresDias.length > 2
      ? nombresDias.slice(0, -1).join(', ') + ' y ' + nombresDias[nombresDias.length - 1]
      : nombresDias.join(' y ');
    titular = 'los descansos de la semana no caben. El ' + lista + ' hay <b>' + capaces +
              ' persona(s) aptas</b> para <b>' + nucleoDia(peor, k) + ' puestos principales</b>, ' +
              'asi que ninguna de ellas puede librar esos dias';
  }
  return { dia, falta, capaces, nucleo: nucleoDia(peor, k), razones, arreglo, titular, faltanAptos };
}
/* Lo que el boton Revisar lleva entre parentesis. Cuenta EXACTAMENTE lo
   mismo que luego se ve al abrirlo: si pone (3), dentro hay tres cosas.
   Antes ponia (0) y al abrir salian dos avisos, que es peor que no poner
   nada. Los horarios sin armar no cuentan: no tienen nada que revisar. */
function numeroPendientes(k, revCounter){
  k = k || SEMANA;
  let n = 0;
  if(!equipoVacio('rotativo', k) && revCounter)
    n += revCounter.conflictos.length + revCounter.faltantes.length + (revCounter.avisos || []).length;
  ['supervision','servicio'].forEach(q => {
    const r = revisarEquipo(q, k);
    n += r.conflictos.length + r.avisos.length;
  });
  return n;
}
/* Borra las casillas de un equipo y solo de ese equipo */
function vaciarEquipo(eq){
  const nombre = infoEquipo(eq).nombre;
  confirmar('Se borrara el horario de <b>' + esc(nombre.toLowerCase()) + '</b> de esta semana, incluido lo que pusiste a mano. ' +
           'Los otros dos horarios no se tocan.', () => {
    const w = semana(SEMANA);
    plantilla(eq).forEach(e => { for(let d = 0; d < 7; d++) delete w.celdas[ck(e.id, d)]; });
    w.modificado = new Date().toISOString();
    bitacora('Se vacio el horario de ' + nombre.toLowerCase() + ' de la semana del ' + fechaLarga(SEMANA) + '.');
    guardar(); cerrar(); render(); toast(nombre + ': horario vaciado');
  });
}
function hacerLimpiar(modo){
  const w = semana(SEMANA);
  if(modo === 'auto'){
    for(const key in w.celdas) if(w.celdas[key].o === 'auto' && !w.celdas[key].b) delete w.celdas[key];
    bitacora('Se quitaron las sugerencias de la semana del ' + fechaLarga(SEMANA) + '.');
    guardar(); cerrar(); render(); toast('Quitado lo que puso el sistema');
  } else if(modo === 'soltar'){
    for(const key in w.celdas){ w.celdas[key].o = 'auto'; w.celdas[key].b = false; }
    bitacora('Se solto lo fijado en la semana del ' + fechaLarga(SEMANA) + '.');
    guardar(); cerrar(); render(); toast('Ya nada esta fijado: el sistema puede cambiarlo');
  } else {
    cerrar();
    vaciarSemana();
  }
}

function pantallaHorario(){
  /* Las semanas hechas antes de poner un dia libre fijo se corrigen solas
     al abrirlas: no hay que acordarse de regenerar nada. */
  /* Las semanas hechas antes de un cambio de reglas se corrigen solas al
     abrirlas. Y como la limpieza deja huecos, un borrador se vuelve a
     completar en el momento: si no, la pantalla se abria llena de
     "puesto sin cubrir" por algo que no habias hecho tu. */
  decidirVista();
  const arreglados = sanearSemana(SEMANA);
  let recompuesta = false;
  if(arreglados){
    bitacora('Se quitaron ' + arreglados + ' turno(s) que ya no encajaban con las reglas, en la semana del ' + fechaLarga(SEMANA) + '.');
    if(semana(SEMANA).estado !== 'publicado'){
      try { autocompletar(SEMANA); recompuesta = true; } catch(e){}
    }
    guardar();
  }
  /* autocompletar solo mira el counter. Los huecos de supervisores y de
     agentes de servicio se rellenan aqui, para que al pasar de una semana
     a otra no queden filas a medias. */
  if(semana(SEMANA).estado !== 'publicado'){
    try { if(completarOtrosEquipos(SEMANA)) guardar(); } catch(e){}
  }
  const w = semana();
  const tipo = tipoSemana(SEMANA);
  const vacia = Object.keys(w.celdas).length === 0;
  /* Lo mismo para el counter: si su hoja esta en blanco no se avisa de que
     falta todo, que eso ya se ve. Se mira SU horario, no el de la semana:
     antes bastaba con que otro equipo tuviera algo escrito para que el
     counter empezara a quejarse de puestos que nadie habia repartido aun. */
  const counterEnBlanco = equipoVacio('rotativo', SEMANA);
  const rev = counterEnBlanco
    ? { conflictos:[], avisos:[], faltantes:[], equidad: equidad(ctxReal(SEMANA)) }
    : revisar();
  const mapaConf = {};
  rev.conflictos.forEach(c => mapaConf[ck(c.empId, c.dia)] = c);

  /* Toda la informacion de la semana en un solo sitio: antes la fecha salia
     tres veces y "semana de N dias" dos. */
  const derecha =
    '<div class="rango">Horario del ' + fechaLarga(SEMANA) + ' al ' + fechaLarga(addDias(SEMANA,6)) + '</div>' +
    '<div class="meta">' +
      '<span class="pill info">2 dias libres: ' +
        esc((empleado(turnoDosLibres(SEMANA))||{}).nombre || 'sin rotacion') +
        (S.semanas[SEMANA] && S.semanas[SEMANA].turno2 ? ' (a mano)' : '') + '</span>' +
      (w.estado === 'publicado'
        ? '<span class="pill ok">Publicado' + (w.publicado ? ' el ' + w.publicado.slice(0,10).split('-').reverse().join('/') : '') + '</span>'
        : '<span class="pill warn">Borrador</span>') +
      '<span class="tiny">Modificado: ' + (w.modificado ? w.modificado.slice(0,10).split('-').reverse().join('/') : '-') + '</span>' +
    '</div>';

  /* La barra se queda solo con lo de moverse por las semanas. Cambiar a
     quien le tocan los dos dias libres de una semana suelta sigue estando,
     dentro de "Elegir semana", que es donde se mira una semana concreta. */
  const barra =
    '<button class="btn sec sm" onclick="cambiarSemana(-1)">&larr; Anterior</button>' +
    '<button class="btn sm" onclick="abrirCalendario()">Elegir semana</button>' +
    '<button class="btn sec sm" onclick="irSemanaActual()">Semana actual</button>' +
    '<button class="btn sec sm" onclick="cambiarSemana(1)">Siguiente &rarr;</button>';

  let h = cabecera('Horario semanal', derecha, barra);

  h += '<div class="card noprint" style="padding:11px 14px"><div class="row">' +
    '<button class="btn sec" onclick="duplicarAnterior()">Duplicar semana anterior</button>' +
    '<button class="btn sec" onclick="verConflictos()">Revisar' +
      (vacia ? '' : ' (' + numeroPendientes(SEMANA, rev) + ')') + '</button>' +
    '<div class="spacer"></div>' +
    (w.estado === 'publicado'
      ? '<button class="btn sec" onclick="volverBorrador()">Volver a borrador</button>'
      : '<button class="btn ok" onclick="publicar()">Publicar</button>') +
    '<button class="btn sec" onclick="menuExportar()">Exportar</button>' +
    '<button class="btn sec" onclick="imprimirHorario()">Imprimir</button>' +
    '</div></div>';

  if(arreglados){
    h += '<div class="alert ' + (recompuesta ? 'info' : 'warn') + ' noprint">' +
         '<b>Esta semana venia de antes de un cambio de reglas</b>' +
         'Habia ' + arreglados + ' turno(s) que ya no encajan (un turno fuera de uso, o una marca que esa persona no puede hacer). ' +
         (recompuesta
          ? 'Se quitaron y la semana se volvio a completar sola.'
          : 'Se quitaron. Como la semana esta publicada no se ha tocado nada mas: pulsa <b>Completar lo que falta</b> cuando quieras.') +
         '</div>';
  }
  if(vacia){
    h += '<div class="alert info noprint"><b>Esta semana esta en blanco</b>' +
         'Cada horario se arma por su cuenta: pulsa <b>Llenar este horario</b> en el panel del equipo que quieras. ' +
         'Los agentes de renta se reparten respetando todas las reglas, gerencia y car control toman su horario fijo ' +
         'y los agentes de servicio giran sus turnos.</div>';
  }
  if(rev.conflictos.length || rev.faltantes.length){
    h += '<div class="noprint">';
    rev.conflictos.slice(0,3).forEach(c => h += '<div class="alert bad"><b>Conflicto</b>' + esc(c.texto) + (c.sugerencia ? '<br><i>' + esc(c.sugerencia) + '</i>' : '') + '</div>');
    rev.faltantes.slice(0,3).forEach((f,i) => h += '<div class="alert warn"><b>Puesto sin cubrir</b>' + esc(f.texto) +
      '<div class="row" style="margin-top:6px"><button class="btn sec sm" onclick="porQue(' + f.dia + ',\'' + f.turnoId + '\',\'' + f.puestoId + '\')">Ver por que</button>' +
      '<button class="btn sm" onclick="accionOtra()">Probar otro reparto</button></div></div>');
    if(rev.conflictos.length + rev.faltantes.length > 6) h += '<div class="alert info">Hay mas avisos. Pulsa "Revisar" para verlos todos.</div>';
    h += '</div>';
  }

  if(pantallaAngosta() || modoDia()) h += barraDiasHTML();
  EQUIPO_IDS.forEach(eq => { h += tablaEquipo(eq, mapaConf, vacia); });

  h += '<div class="leyenda"><b style="color:var(--ink)">Terminales y marcas:</b> ' +
       /* En la leyenda si hay sitio para escribir las marcas enteras: en la
          casilla no caben las tres de la Terminal B y salen recortadas. */
       puestosActivos().map(p => uniHTML(p, p.corto + ((p.marcas||[]).length > 1
         ? ' · ' + p.marcas.join(', ') : ''))).join(' ') +
       '<span class="uni"><i style="background:var(--line)"></i>Dia libre</span>' +
       motivosDeLaSemana().map(t =>
         '<span class="uni"><i class="rayas ' + t + '"></i>' + esc(TIPOS_AUSENCIA[t]) + '</span>').join(' ') +
       '<span style="margin-left:6px">Momento del dia: ' +
       '<span class="tipomuestra"><i style="background:var(--t-temprano-b)"></i>temprano</span> ' +
       '<span class="tipomuestra"><i style="background:var(--t-intermedio-b)"></i>intermedio</span> ' +
       '<span class="tipomuestra"><i style="background:var(--t-tarde-b)"></i>tardio</span></span>' +
       '<span class="noprint">&#9679; Puesto por ti, el sistema no lo toca</span>' +
       '<span class="noprint">&#9888; Con problema</span></div>';

  h += resumenHTML(rev.equidad);
  return h;
}

/* =====================================================================
   UNA TABLA POR EQUIPO
   Las tres tienen la misma forma (nombre, siete dias y un resumen) para
   que se lean de corrido, pero cada una trae los botones y las cuentas
   que le sirven a ese equipo y no las del otro.
   ===================================================================== */
/* =====================================================================
   EL HORARIO EN EL TELEFONO: UN DIA A LA VEZ
   Siete columnas por doce filas no caben en una pantalla de 375 puntos.
   La tabla mide 1320 y hay que deslizar casi cuatro pantallas para leer
   una semana, que en un telefono no hay quien lo use.

   Asi que en pantalla angosta se le da la vuelta: eliges UN dia y ves
   quien entra ese dia, los tres equipos uno debajo de otro y cada
   persona en su renglon. Tocar un renglon abre el mismo menu de siempre.

   La tabla de la semana no desaparece: esta a un boton de distancia, y
   en el ordenador sigue siendo lo primero que se ve.
   ===================================================================== */
let DIA_MOVIL = null;          // null = sin decidir, -1 = la semana, 0..6 = ese dia
/* ¿La vista la eligio la persona o la decidio el ancho de la ventana?
   Hace falta distinguirlo: lo que elige la persona se respeta, y lo que
   decidio la pantalla hay que volver a decidirlo si la pantalla cambia. */
let VISTA_A_MANO = false;
function pantallaAngosta(){ return document.documentElement.clientWidth < 700; }
function modoDia(){ return DIA_MOVIL !== null && DIA_MOVIL >= 0; }
function diaDeHoyEnLaSemana(){
  const hoy = hoyISO();
  for(let d = 0; d < 7; d++) if(addDias(SEMANA, d) === hoy) return d;
  return 0;
}
/* Antes esto decidia UNA sola vez, la primera, y ahi se quedaba. El fallo
   salia asi: se abria la aplicacion con la ventana estrecha -media pantalla,
   el navegador con mucho zoom, un portatil pequeno- y se elegia la vista de
   un dia. Al ensanchar la ventana despues, el horario seguia mostrando un
   solo dia y la semana entera no volvia por si sola: parecia que el horario
   no se desplegaba. Ahora, mientras nadie elija a mano, manda el ancho. */
function decidirVista(){
  if(VISTA_A_MANO){ if(DIA_MOVIL === null) DIA_MOVIL = -1; return; }
  DIA_MOVIL = pantallaAngosta() ? diaDeHoyEnLaSemana() : -1;
}
function verDia(d){ DIA_MOVIL = Number(d); VISTA_A_MANO = true; render(); }
/* Volver a dejar que mande la ventana */
function vistaAutomatica(){ VISTA_A_MANO = false; decidirVista(); render(); }
/* Al cambiar el tamano de la ventana solo se repinta si de verdad se cruzo
   el limite; si no, se estaria repintando en cada pixel del arrastre. */
let ERA_ANGOSTA = null;
window.addEventListener('resize', function(){
  const ahora = pantallaAngosta();
  if(ERA_ANGOSTA === ahora) return;
  ERA_ANGOSTA = ahora;
  if(typeof PANTALLA !== 'undefined' && PANTALLA === 'horario') render();
});
function barraDiasHTML(){
  const hoy = hoyISO();
  let h = '<div class="card noprint diasmov"><div class="row" style="gap:4px;flex-wrap:nowrap;overflow-x:auto">';
  for(let d = 0; d < 7; d++){
    const fecha = addDias(SEMANA, d);
    const fer = feriadoEn(fecha);
    h += '<button class="btn ' + (DIA_MOVIL === d ? '' : 'sec ') + 'sm diachip' + (fecha === hoy ? ' hoy' : '') + '" ' +
         'onclick="verDia(' + d + ')" title="' + DIAS[d] + (fer ? ' &middot; ' + esc(fer.nombre) : '') + '">' +
         DIAS_CORTO[d] + '<span>' + fecha.slice(8) + (fer ? ' &bull;' : '') + '</span></button>';
  }
  h += '</div><div class="row" style="margin-top:8px">' +
       '<button class="btn ' + (modoDia() ? 'sec ' : '') + 'sm" onclick="verDia(-1)">Ver la semana completa</button>' +
       (modoDia() ? '' : '<span class="tiny muted">Toca un dia para verlo en grande</span>') +
       (VISTA_A_MANO ? '<button class="btn sec sm" onclick="vistaAutomatica()" ' +
         'title="Que vuelva a decidirlo el tamano de la ventana">Vista automatica</button>' : '') +
       '</div></div>';
  return h;
}

function tablaEquipo(eq, mapaConf, vacia){
  const info = infoEquipo(eq);
  const emps = plantilla(eq);
  const esRot = eq === 'rotativo';
  const revEq = esRot ? null : revisarEquipo(eq, SEMANA);

  /* Cada equipo mira SI ESTA VACIO EL SUYO, no si lo esta la semana entera:
     los tres paneles son independientes y uno puede estar hecho y otro no. */
  const vacioEq = equipoVacio(eq, SEMANA);
  let acc = '';
  if(esRot){
    /* Los tres paneles con la misma forma: llenar, otra alternativa y
       limpiar. En agentes de renta el de limpiar abre el menu completo,
       que ademas deja quitar solo lo que puso el sistema o soltar lo que
       fijaste tu sin borrarlo. */
    acc = '<button class="btn sm" onclick="accionCompletar()">' +
          (vacioEq ? 'Llenar este horario' : 'Completar lo que falta') + '</button>' +
          '<button class="btn sec sm" onclick="accionOtra()">Otra alternativa</button>' +
          '<button class="btn sec sm" onclick="menuLimpiar()">Limpiar o vaciar</button>';
  } else {
    /* Los tres paneles se manejan igual: llenar, otra alternativa y vaciar.
       En agentes de servicio la alternativa cambia el giro de los turnos y
       donde caen los dias libres; en gerencia y car control, que es un
       horario fijo, lo unico que puede cambiar es quien cubre el feriado. */
    acc = '<button class="btn sm" onclick="accionEquipo(\'' + eq + '\')">' +
          (vacioEq ? 'Llenar este horario' : 'Completar lo que falta') + '</button>' +
          '<button class="btn sec sm" onclick="' +
            (eq === 'servicio' ? 'otraAlternativaServicio()' : 'otraAlternativaSupervision()') +
          '">Otra alternativa</button>' +
          '<button class="btn sec sm"' + (vacioEq ? ' disabled' : '') +
          ' onclick="vaciarEquipo(\'' + eq + '\')">Vaciar</button>';
  }
  let h = '<section class="equipo ' + info.clase + '">' +
    '<div class="equipo-cab"><h2>' + esc(info.nombre) + '</h2>' +
    '<span class="pill off">' + emps.length + (emps.length === 1 ? ' persona' : ' personas') + '</span>' +
    '<span class="sub">' + esc(info.sub) + '</span>' +
    '<div class="acc noprint">' + acc + '</div></div>';

  if(!emps.length){
    h += '<div class="alert info" style="margin:0">Todavia no hay nadie en este horario. ' +
         'Anade a las personas en <b>Empleados</b> y elige el equipo <b>' + esc(info.nombre) + '</b> en su ficha.</div></section>';
    return h;
  }

  if(revEq && revEq.conflictos.length)
    h += '<div class="alert bad noprint" style="margin-bottom:8px"><b>' + revEq.conflictos.length + ' problema(s)</b>' +
         esc(revEq.conflictos[0].texto) + '</div>';
  if(revEq && revEq.avisos.length)
    h += '<div class="alert warn noprint" style="margin-bottom:8px">' + esc(revEq.avisos[0].texto) +
         (revEq.avisos.length > 1 ? ' <b>(+' + (revEq.avisos.length - 1) + ')</b>' : '') + '</div>';

  /* En el telefono, la lista del dia elegido en lugar de la tabla */
  if(modoDia()){
    const dm = DIA_MOVIL;
    h += '<div class="listadia">';
    emps.forEach(e => {
      const conf = mapaConf[ck(e.id, dm)];
      h += '<div class="filadia" onclick="menuCelda(\'' + e.id + '\',' + dm + ')">' +
           '<div class="quien"><b>' + esc(e.nombre) + '</b>' +
             (e.cargo ? '<span>' + esc(e.cargo) + '</span>' : '') + '</div>' +
           '<div class="que">' + chipHTML(e, dm, conf) + '</div></div>';
    });
    h += '</div></section>';
    return h;
  }

  h += '<div class="cal-wrap"><table class="cal"><thead><tr><th class="emp">Empleado</th>' +
    DIAS.map((d,i) => {
      const fer = feriadoEn(addDias(SEMANA,i));
      return '<th' + (fer ? ' title="' + esc(fer.nombre) + '"' : '') + '>' + d +
             '<small>' + fechaCorta(addDias(SEMANA,i)) + (fer ? ' &middot; feriado' : '') + '</small></th>';
    }).join('') +
    '<th style="width:88px">Resumen</th></tr></thead><tbody>';

  const confEq = {};
  if(revEq) revEq.conflictos.forEach(c => confEq[ck(c.empId, c.dia)] = c);

  emps.forEach(e => {
    h += '<tr><th class="emp"><div class="nm">' + esc(e.nombre) + '</div>' +
         (e.cargo ? '<div class="mt">' + esc(e.cargo) + '</div>' : '') + '</th>';
    for(let d = 0; d < 7; d++) h += celdaHTML(e, d, esRot ? mapaConf[ck(e.id,d)] : confEq[ck(e.id,d)]);
    const dd = diasTrabajados(e.id), hh = horasSemana(e.id);
    if(esRot){
      const vb = visitasB(e.id);
      const toca = diasObjetivoDe(e.id, SEMANA);
      const colD = dd === toca ? 'var(--ok)' : (dd > toca ? 'var(--bad)' : 'var(--warn)');
      const colB = vb === objetivoBDe(e.id) ? 'var(--ok)' : (vb > S.config.maxB ? 'var(--bad)' : 'var(--warn)');
      h += '<td style="text-align:center;font-weight:700;font-size:12.5px">' +
           '<span style="color:' + colD + '">' + dd + '/' + toca + ' dias</span><br>' +
           '<span class="tiny" style="color:' + colB + ';font-weight:600">B: ' + vb + '/' + objetivoBDe(e.id) + '</span><br>' +
           '<span class="tiny muted" style="font-weight:400">' + hh + ' h</span></td></tr>';
    } else {
      h += '<td style="text-align:center;font-weight:700;font-size:12.5px">' + dd + ' dias' +
           '<br><span class="tiny muted" style="font-weight:400">' + hh + ' h</span></td></tr>';
    }
  });

  /* Pie del counter: cuantos libran cada dia. Ya no es el mismo numero
     todos los dias, porque el 6o puesto solo entra algunos. */
  if(esRot){
    /* Ya no hay un numero fijo de puestos: cada dia se abren tantos como
       gente trabaje, empezando por los principales. Lo que se enseña es
       cuantos se han cubierto de los que se abrieron, y en rojo solo si
       falta alguno de los principales. */
    h += '<tr><th class="emp" style="background:#fafbfc"><div class="nm pie">Puestos abiertos</div>' +
         '<div class="mt">de ellos, ' + nucleoDia(0) + ' principales</div></th>';
    for(let d = 0; d < 7; d++){
      let libran = 0, trabajan = 0;
      activos().forEach(e => {
        const c = celda(e.id, d);
        if(esLibreReal(c)) libran++;
        else if(c && c.t !== LIBRE) trabajan++;
      });
      const abiertos = puestosDia(d, SEMANA);
      let nucleoFalta = 0;
      prioridadDia(d, SEMANA).forEach(x => {
        if(!x.clave) return;
        if(ocupacion(ctxReal(SEMANA), d, x.turnoId, x.puestoId) < 1) nucleoFalta++;
      });
      const col = vacioEq ? 'var(--soft)' : (nucleoFalta ? 'var(--bad)' : (trabajan === abiertos ? 'var(--ok)' : 'var(--warn)'));
      h += '<td style="text-align:center;background:#fafbfc;font-weight:700;color:' + col + '">' +
           (vacioEq ? '&ndash;' : trabajan + '/' + abiertos) +
           '<div class="tiny muted" style="font-weight:400">' +
           (vacioEq ? '' : (nucleoFalta ? 'falta 1 principal' : (libran ? libran + ' libra' + (libran > 1 ? 'n' : '') : 'todos'))) +
           '</div></td>';
    }
    h += '<td style="background:#fafbfc"></td></tr>';
  }
  /* Pie de los agentes de servicio: los turnos que hay que cubrir cada dia */
  if(eq === 'servicio'){
    h += '<tr><th class="emp" style="background:#fafbfc"><div class="nm pie">Turnos abiertos</div>' +
         '<div class="mt">de ellos, ' + nucleoServicioDia(0) + ' principales</div></th>';
    for(let d = 0; d < 7; d++){
      const abren = turnosServicioDia(d, SEMANA);
      const hechos = [];
      emps.forEach(e => { const c = celda(e.id,d); if(c && c.t !== LIBRE && !esAusencia(c)) hechos.push(c.t); });
      /* Rojo SOLO si falta un principal. Los de refuerzo pueden quedarse sin
         nadie sin que pase nada: para eso son. */
      let faltaClave = Math.max(0, nucleoServicioDia(d) - abren.filter(x => x.clave).length);
      const resto = hechos.slice();
      abren.filter(x => x.clave).forEach(x => {
        const i = resto.indexOf(x.turnoId);
        if(i >= 0) resto.splice(i, 1); else faltaClave++;
      });
      /* Con la hoja sin hacer no se pinta un cero en rojo: no es un fallo,
         es que todavia no se ha armado. */
      const col = vacioEq ? 'var(--soft)' : (faltaClave ? 'var(--bad)' : 'var(--ok)');
      h += '<td style="text-align:center;background:#fafbfc;font-weight:700;color:' + col + '">' +
           (vacioEq ? '&ndash;' : hechos.length + '/' + abren.length) +
           '<div class="tiny muted" style="font-weight:400">' +
           (vacioEq ? '' : (faltaClave ? 'falta ' + faltaClave + ' principal' : 'principales OK')) +
           '</div></td>';
    }
    h += '<td style="background:#fafbfc"></td></tr>';
  }
  return h + '</tbody></table></div></section>';
}

/* =====================================================================
   CAMBIAR DE TURNO SOLO ESTA SEMANA
   Mueve los dos dias libres a otra persona sin tocar la rotacion: la
   semana siguiente sigue por donde iba. Sirve para un imprevisto suelto.
   ===================================================================== */
function cambiarTurnoSemana(){
  const { orden } = rotacionLibres();
  const actual = turnoDosLibres(SEMANA);
  const w = S.semanas[SEMANA];
  if(!orden.length) return toast('No hay nadie en la rotacion');

  let h = '<p class="muted" style="margin-top:0">Semana del ' + fechaLarga(SEMANA) + ' al ' + fechaLarga(addDias(SEMANA,6)) + '.</p>' +
    '<div class="alert info">Esto cambia <b>solo esta semana</b>. La rotacion sigue su curso normal a partir de la siguiente. ' +
    'Si lo que quieres es correr la rotacion entera, hazlo en <b>Ajustes</b>.</div>';
  orden.forEach(id => {
    const e = empleado(id);
    if(!e) return;
    h += '<button class="opt' + (actual === id ? ' on' : '') + '" onclick="ponerTurnoSemana(\'' + id + '\')">' +
      '<b>' + esc(e.nombre) + '</b>' +
      (e.libreFijo >= 0 ? '<small>libra fijo los ' + DIAS[e.libreFijo].toLowerCase() + 's, asi que sus 2 dias incluiran ese</small>' : '') +
      '</button>';
  });
  if(w && w.turno2)
    h += '<button class="opt" style="margin-top:8px" onclick="ponerTurnoSemana(null)">' +
         'Volver a lo que dice la rotacion (<b>' + esc((empleado(turnoDosLibresRotacion(SEMANA))||{}).nombre || '-') + '</b>)</button>';
  modal('Quien libra 2 dias esta semana', h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>');
}
/* Lo que diria la rotacion si no hubiera cambio a mano */
function turnoDosLibresRotacion(k){
  const { orden, inicio } = rotacionLibres();
  if(!orden.length) return null;
  const i = ((semanasAbsolutas(k) + inicio) % orden.length + orden.length) % orden.length;
  return orden[i];
}
function ponerTurnoSemana(empId){
  const w = semana(SEMANA);
  w.turno2 = empId || null;
  olvidarSemana(SEMANA);          // los dias de refuerzo dependen de quien libra
  bitacora(empId
    ? 'En la semana del ' + fechaLarga(SEMANA) + ' los 2 dias libres pasan a ' + empleado(empId).nombre + '.'
    : 'La semana del ' + fechaLarga(SEMANA) + ' vuelve al turno normal de la rotacion.');
  guardar(); cerrar(); render();
  toast(empId ? 'Esta semana libra 2 dias ' + empleado(empId).nombre : 'Vuelve al turno normal');
}

/* La celda de la tabla no es mas que el recuadro metido en un <td>. Se
   separan porque en el telefono el mismo recuadro se usa en una lista, sin
   tabla ninguna. */
function celdaHTML(e, d, conf){
  const fer = feriadoEn(addDias(SEMANA, d));
  const we = (d >= 5 ? ' we' : '') + (fer ? ' feriado' : '');
  const attr = 'data-e="' + e.id + '" data-d="' + d + '" onclick="menuCelda(\'' + e.id + '\',' + d + ')"';
  return '<td class="cell' + we + '" ' + attr + '>' + chipHTML(e, d, conf) + '</td>';
}
function chipHTML(e, d, conf){
  const c = celda(e.id, d);

  /* Un dia que el empleado tiene marcado como no disponible no es un hueco
     ni un dia libre: se muestra tal cual para que se entienda. */
  const vaciaHTML = !e.diasDisponibles[d]
    ? '<div class="chip nodisp">No disponible</div>'
    : '<div class="chip vacio">+</div>';

  if(!c) return vaciaHTML;
  const t = turno(c.t);
  if(!t) return vaciaHTML;

  /* Marcas discretas: un punto si lo pusiste tu, un aviso si hay problema */
  const tags = (c.b ? '&#9679;' : '') + (conf ? ' &#9888;' : '');
  const extra = conf ? ' conflicto' : '';

  /* Vacaciones, licencia o permiso: no es un turno ni un dia libre */
  if(esAusencia(c)){
    const a = ausenciaEn(e.id, addDias(SEMANA, d));
    return '<div class="chip ausente ' + esc(TIPOS_AUSENCIA[c.aus] ? c.aus : 'otro') + '" ' +
           'title="' + esc((a && a.nota) || '') + '">' + esc(TIPOS_AUSENCIA[c.aus] || 'Ausencia') +
           (a ? '<span class="h">al ' + fechaCorta(a.hasta) + '</span>' : '') + '</div>';
  }
  if(c.t === LIBRE){
    /* El descanso que enlaza domingo con lunes se lee en la tabla como dos
       dias sueltos, y no lo es: el domingo sigue en el lunes de la semana
       de al lado. Se dice en la propia casilla para que no confunda. */
    let enlace = '';
    if(d === 0 || d === 6){
      const otro = celda(e.id, d === 0 ? 6 : 0);
      if(esLibreReal(otro))
        enlace = '<span class="h">' + (d === 6 ? 'sigue el lunes' : 'viene del domingo') + '</span>';
    }
    return '<div class="chip libre' + extra + '" draggable="true" data-e="' + e.id + '" data-d="' + d + '">' +
           '<span class="tags">' + tags + '</span>Libre' + enlace + '</div>';
  }

  const p = puesto(c.p);
  const tipoCol = { temprano:'var(--t-temprano-b)', intermedio:'var(--t-intermedio-b)', tarde:'var(--t-tarde-b)' }[t.tipo] || 'var(--soft-2)';
  /* El color de la marca no rellena la casilla: va en la barra de la
     izquierda, en un fondo apenas tenido y en el nombre de la marca. */
  return '<div class="chip' + extra + '" style="' + estiloPuesto(p) + '" draggable="true" ' +
         'data-e="' + e.id + '" data-d="' + d + '"><span class="tags">' + tags + '</span>' +
         esc(t.corto) + '<span class="h">' + hora12(t.inicio) + ' a ' + hora12(t.fin) + '</span>' +
         '<span class="marca"' + (p ? ' title="' + esc(p.terminal + ' · ' + (p.marcas||[]).join(', ')) + '"' : '') + '>' +
           (p ? esc(marcaCorta(p)) : esc(t.nombre.split(' - ')[0] || 'turno')) + '</span>' +
         '<span class="tipo" style="background:' + tipoCol + '" title="' + TIPOS_TURNO[t.tipo] + '"></span></div>';
}

/* Etiqueta corta de la marca para que quepa en una sola linea */
function marcaCorta(p){
  if(!p) return '';
  const m = p.marcas || [];
  if(!m.length) return p.terminal;
  /* Se enseñan TODAS las marcas: en la Terminal B se atienden las tres y
     hay que verlo en la casilla. Si no cabe, el propio recuadro la corta
     con puntos suspensivos y el nombre entero sale al pasar el raton. */
  return p.terminal + ' · ' + m.join('/');
}

/* El bloque que enlaza domingo con lunes se escribe en ese orden,
   para que se lea como un descanso corrido y no como dos dias sueltos. */
function textoLibres(dias){
  if(dias.length === 2 && dias.includes(0) && dias.includes(6)) return 'Dom + Lun';
  return dias.map(x => DIAS_CORTO[x]).join(', ');
}

function resumenHTML(eq){
  let h = '<div class="card" style="margin-top:16px"><h2>Resumen de la semana</h2>';
  h += '<div class="grid g4" style="margin-bottom:12px">' +
    kpi(eq.equilibrio + '%', 'Equilibrio') +
    kpi(eq.cumplimiento + '%', 'Dias que tocan cumplidos') +
    kpi(eq.faltan, 'Puestos sin cubrir') +
    kpi(eq.difB, 'Diferencia de visitas a B') + '</div>';
  h += '<table class="data"><thead><tr><th>Empleado</th><th>Dias</th><th>Horas</th><th>Terminal B</th>' +
       '<th>Tempranos</th><th>Intermedios</th><th>Tardios</th><th>Fin de semana</th><th>Libres</th></tr></thead><tbody>';
  eq.filas.forEach(f => {
    const toca = diasObjetivoDe(f.empId, SEMANA);
    const cd = f.dias === toca ? 'ok' : (f.dias > toca ? 'bad' : 'warn');
    const cb = f.visitasB === objetivoBDe(f.empId) ? 'ok' : (f.visitasB > S.config.maxB ? 'bad' : 'warn');
    h += '<tr><td><b>' + esc(f.nombre) + '</b></td>' +
         '<td><span class="pill ' + cd + '">' + f.dias + ' / ' + toca + '</span></td>' +
         '<td>' + f.horas + ' h</td>' +
         '<td><span class="pill ' + cb + '">' + f.visitasB + '</span></td>' +
         '<td>' + f.tempranos + '</td><td>' + f.intermedios + '</td><td>' + f.tardes + '</td><td>' + f.findes + '</td>' +
         '<td>' + f.libres + (f.libreDias.length ? ' <span class="tiny muted">(' + textoLibres(f.libreDias) + ')</span>' : '') +
         (f.libreDias.length > 1 ? (diasSeguidos(f.libreDias) ? ' <span class="pill ok">seguidos</span>' : ' <span class="pill bad">separados</span>') : '') + '</td></tr>';
  });
  h += '</tbody></table>';
  const dos = empleado(turnoDosLibres(SEMANA));
  h += '<p class="tiny muted" style="margin-bottom:0">Esta semana los <b>2 dias libres seguidos</b> son de <b>' +
       esc(dos ? dos.nombre : '-') + '</b>; los demas libran uno. El dia antes de librar entra lo mas temprano que se pueda ' +
       'y el dia que vuelve entra lo mas tarde posible, para estirar el descanso por los dos lados. ' +
       'A quien le toca <b>domingo y lunes</b> el descanso no se corta: enlaza con la semana de al lado.</p>';
  h += '</div>';
  return h;
}

/* =====================================================================
   BOTONES DE LLENADO

function accionCompletar(){

  render();
  toast(ev.eq.faltan ? 'Completado, quedan ' + ev.eq.faltan + ' puesto(s) sin cubrir' : 'Agentes de renta: completo');
}
function accionOtra(){
  const ev = otraAlternativa(SEMANA);
  render();
  toast(ev.eq.faltan ? 'Otra alternativa (quedan ' + ev.eq.faltan + ' sin cubrir)' : 'Otra alternativa lista');
}
/* Los otros dos equipos: "Armar" respeta lo que pusiste a mano,
   "Rehacer todo" lo tira y vuelve a empezar. */
/* =====================================================================
   OTRA ALTERNATIVA PARA GERENCIA Y CAR CONTROL
   Su horario de lunes a domingo es fijo, asi que lo unico que se puede
   cambiar es quien cubre el feriado de esa semana. Se cambia solo en esa
   semana: el resto del ano sigue con su alternancia.
   ===================================================================== */
function otraAlternativaSupervision(k){
  k = k || SEMANA;
  const w = semana(k);
  let hayFeriado = false;
  for(let d = 0; d < 7; d++) if(feriadoEn(addDias(k, d))) hayFeriado = true;
  const puedeCambiar = hayFeriado && plantilla('supervision').some(e => horarioSupervisorDe(e.id).feriados === 'alterna');
  if(puedeCambiar) w.varSup = ((w.varSup || 0) + 1) % 2;
  generarSupervision(k, {});
  if(puedeCambiar) bitacora('Otra alternativa en gerencia y car control de la semana del ' + fechaLarga(k) + ': cambia quien cubre el feriado.');
  guardar(); render();
  toast(puedeCambiar
    ? 'Cambia quien cubre el feriado de esta semana'
    : (hayFeriado ? 'Nadie tiene los feriados alternos: no hay otra alternativa'
                  : 'Su horario es fijo: esta semana no hay otra alternativa'));
}

/* =====================================================================
   OTRA ALTERNATIVA PARA LOS AGENTES DE SERVICIO
   Corre un puesto el giro de los turnos y mueve donde caen los dias
   libres, respetando todas las reglas: los dos principales cubiertos, los
   dos dias seguidos, el turno clavado y el descanso minimo. Lo que
   pusiste a mano se queda como esta.
   ===================================================================== */
function otraAlternativaServicio(k){
  k = k || SEMANA;
  const w = semana(k);
  w.varSer = ((w.varSer || 0) + 1) % 7;
  generarServicio(k, {});
  bitacora('Otra alternativa para los agentes de servicio de la semana del ' + fechaLarga(k) + '.');
  guardar(); render();
  toast('Agentes de servicio: otra alternativa');
}

function accionEquipo(eq, rehacer){
  const hacer = () => {
    generarEquipo(eq, SEMANA, { rehacer: !!rehacer });
    render();
    toast(infoEquipo(eq).nombre + (rehacer ? ': horario rehecho' : ': horario armado'));
  };
  if(!rehacer){ hacer(); return; }
  confirmar('Se rehara el horario de <b>' + esc(infoEquipo(eq).nombre.toLowerCase()) +
            '</b> de esta semana, incluido lo que pusiste a mano.', hacer);
}
/* Si ese equipo no tiene ni una casilla puesta esta semana. Se pregunta por
   equipo y no por la semana entera porque los tres paneles van por libre. */
function equipoVacio(eq, k){
  k = k || SEMANA;
  const w = S.semanas[k];
  if(!w || !w.celdas) return true;
  return !plantilla(eq).some(e => {
    for(let d = 0; d < 7; d++) if(w.celdas[ck(e.id, d)]) return true;
    return false;
  });
}

/* =====================================================================
   MENU DE CADA CASILLA
   ===================================================================== */
function menuCelda(empId, d){
  if(equipoDe(empId) !== 'rotativo') return menuCeldaSimple(empId, d);
  const e = empleado(empId), c = celda(empId, d);
  const tipo = tipoSemana(SEMANA);
  let h = '<p class="muted" style="margin-top:0">' + DIAS[d] + ' ' + fechaCorta(addDias(SEMANA,d)) +
          ' &middot; lleva ' + diasTrabajados(empId) + ' de ' + diasObjetivoDe(empId, SEMANA) + ' dias &middot; ' + visitasB(empId) + ' vez(veces) en la Terminal B</p>';

  if(c){
    const t = turno(c.t), p = puesto(c.p);
    h += '<div class="alert info"><b>Ahora: ' + esc(t ? t.corto : '?') + (p ? ' en ' + esc(p.corto) : '') + '</b>' +
         (c.b ? 'Lo pusiste tu, el sistema no lo toca.' : 'Lo puso el sistema, se puede cambiar.') + '</div>';
    const r = validar(ctxReal(), empId, d, c.t, c.p, { reemplazar:true, refuerzo: !!c.refuerzo, autorizarSinDescanso: !!c.exc });
    if(!r.ok) h += '<div class="alert ' + (r.aviso ? 'warn' : 'bad') + '"><b>' + (r.aviso ? 'Aviso' : 'Problema') + '</b>' +
                   esc(r.texto) + (r.sugerencia ? '<br><i>' + esc(r.sugerencia) + '</i>' : '') + '</div>';
  }

  if(c && c.t !== LIBRE){
    h += '<h3>Cambiar solo la terminal y la marca</h3><div class="row" style="margin-bottom:10px">';
    puestosActivos().forEach(p => {
      const tn = tonosPuesto(p);
      h += '<button class="btn sec sm" style="border-left:4px solid ' + tn.c + ';background:' + tn.bg + ';color:' + tn.txt +
           ';border-color:' + tn.line + (c.p===p.id?';font-weight:800':'') + '" ' +
           'onclick="asignar(\'' + empId + '\',' + d + ',\'' + c.t + '\',\'' + p.id + '\')">' + esc(p.corto) + '</button>';
    });
    h += '</div>';
  }

  /* Se muestran primero los turnos que ese dia hacen falta de verdad.
     Los demas quedan recogidos abajo, sin avisos que asusten. */
  const botonTurno = (p, t) => {
    const r = validar(ctxReal(), empId, d, t.id, p.id, { reemplazar:true });
    const on = c && c.t === t.id && c.p === p.id;
    const nec = cobNec(p.id, t.id, d, SEMANA);
    const hay = ocupacion(ctxReal(), d, t.id, p.id);
    const etiqueta = nec > 0
      ? (hay >= nec ? ' <span class="pill ok">ya cubierto</span>'
                    : ' <span class="pill warn">falta ' + (nec - hay) + '</span>')
      : ' <span class="tiny muted">extra</span>';
    /* El cupo no es un problema: tu mandas. Solo se avisa de lo que si lo es. */
    const problema = (!r.ok && r.motivo !== 'cupo')
      ? '<small style="color:' + (r.aviso ? 'var(--warn)' : 'var(--bad)') + '">&#9888; ' + esc(r.texto) + '</small>' : '';
    return '<button class="opt' + (on ? ' on' : '') + '" style="margin-bottom:4px" onclick="asignar(\'' + empId + '\',' + d + ',\'' + t.id + '\',\'' + p.id + '\')">' +
      '<span class="pill ' + pillTipo(t.tipo) + '">' + esc(t.corto) + '</span> ' + hora12(t.inicio) + ' a ' + hora12(t.fin) + etiqueta +
      (t.nota ? '<small class="muted">' + esc(t.nota) + '</small>' : '') + problema + '</button>';
  };

  const hacenFalta = [], resto = [];
  puestosActivos().forEach(p => turnosDe('rotativo').forEach(t => {
    (cobNec(p.id, t.id, d, SEMANA) > 0 ? hacenFalta : resto).push({ p, t });
  }));

  if(hacenFalta.length){
    h += '<h3>Lo que hace falta el ' + DIAS[d].toLowerCase() + '</h3>';
    let ult = null;
    hacenFalta.forEach(x => {
      if(x.p.corto !== ult){ ult = x.p.corto; h += '<div style="margin:8px 0 4px">' + uniHTML(x.p) + '</div>'; }
      h += botonTurno(x.p, x.t);
    });
  }

  if(resto.length){
    h += '<details style="margin:10px 0"><summary style="cursor:pointer;font-weight:600;font-size:13.5px">' +
         'Otros turnos y marcas (' + resto.length + ')</summary>' +
         '<p class="tiny muted">No estaban previstos para este dia, pero puedes usarlos si quieres.</p>';
    let ult2 = null;
    resto.forEach(x => {
      if(x.p.corto !== ult2){ ult2 = x.p.corto; h += '<div style="margin:8px 0 4px">' + uniHTML(x.p) + '</div>'; }
      h += botonTurno(x.p, x.t);
    });
    /* Los turnos "guardados para despues" no se ofrecen: asignarlos daba
       siempre el conflicto "ese turno no esta activo". Para usar uno hay
       que ponerlo En uso en Ajustes, que es donde toca. */
    const guardados = S.turnos.filter(t => !t.activo && (t.equipos||[]).indexOf('rotativo') >= 0);
    if(guardados.length){
      h += '<p class="tiny muted" style="margin-top:8px">Fuera de uso y por eso no se pueden asignar: <b>' +
           guardados.map(t => esc(t.corto)).join(', ') + '</b>. ' +
           'Si necesitas alguno, ponlo <i>En uso</i> en Ajustes &rarr; Turnos.</p>';
    }
    h += '</details>';
  }

  h += '<button class="opt' + (c && c.t === LIBRE ? ' on':'') + '" onclick="asignar(\'' + empId + '\',' + d + ',\'' + LIBRE + '\',null)">' +
       '<span class="pill off">Libre</span> Marcar como dia libre</button>';

  h += '<h3 style="margin-top:12px">Acciones</h3><div class="row">';
  if(c) h += '<button class="btn sec sm" onclick="alternarBloqueo(\'' + empId + '\',' + d + ')">' + (c.b ? 'Desbloquear' : 'Bloquear') + '</button>';
  if(c) h += '<button class="btn sec sm" onclick="asignar(\'' + empId + '\',' + d + ',null,null)">Vaciar casilla</button>';
  if(c && c.t !== LIBRE) h += '<button class="btn sec sm" onclick="verReemplazos(\'' + empId + '\',' + d + ')">Buscar reemplazo</button>';
  h += '<button class="btn sec sm" onclick="verIntercambio(\'' + empId + '\',' + d + ')">Intercambiar</button>';
  if(c && c.t !== LIBRE){
    const r = validar(ctxReal(), empId, d, c.t, c.p, { reemplazar:true });
    if(!r.ok && r.motivo === 'descanso') h += '<button class="btn warn sm" onclick="autorizarExcepcion(\'' + empId + '\',' + d + ')">Autorizar sin descanso</button>';
  }
  h += '</div>';

  modal(esc(e.nombre), h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>', true);
}

/* =====================================================================

    (eq === 'supervision'
      ? (trabajaFeriado(empId, addDias(SEMANA, d))
         ? 'Le toca entrar este feriado, con el turno de lunes a viernes.'

      '<span class="pill ' + pillTipo(t.tipo) + '">' + esc(t.corto) + '</span> ' + hora12(t.inicio) + ' a ' + hora12(t.fin) +
      ' <span class="tiny muted">' + horasTurno(t) + ' h</span>' +

      (av ? '<small style="color:var(--bad)">&#9888; ' + esc(av) + '</small>' : '') + '</button>';

  /* Terminal y marca: opcional en estos dos equipos, util para el 11-7 */
  h += '<h3 style="margin-top:12px">Terminal y marca <span class="tiny muted">(opcional)</span></h3><div class="row">';
  h += '<button class="btn sec sm" onclick="asignarPuesto(\'' + empId + '\',' + d + ',null)"' +

  puestosActivos().forEach(p => {

       '<span class="pill off">Libre</span> Marcar como dia libre</button>';

  h += '<h3 style="margin-top:12px">Acciones</h3><div class="row">';
  if(c) h += '<button class="btn sec sm" onclick="alternarBloqueo(\'' + empId + '\',' + d + ')">' + (c.b ? 'Desbloquear' : 'Bloquear') + '</button>';
  if(c) h += '<button class="btn sec sm" onclick="asignar(\'' + empId + '\',' + d + ',null,null)">Vaciar casilla</button>';
  h += '<button class="btn sec sm" onclick="cerrar();accionEquipo(\'' + eq + '\')">Rearmar este horario</button>';
  h += '</div>';

  modal(esc(e.nombre), h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>', true);
}
/* Descanso entre el turno del dia anterior y el que se va a poner */
function avisoDescanso(empId, d, turnoId){
  if(S.config.permitirSinDescanso) return '';
  const t = turno(turnoId);
  if(!t || turnoId === LIBRE) return '';
  const ant = asigEnFecha(ctxReal(SEMANA), empId, addDias(fechaDe(SEMANA,d), -1));
  if(!ant || ant.t === LIBRE || !turno(ant.t)) return '';
  const hrs = descansoEntre(turno(ant.t), t);
  if(hrs >= S.config.descansoMin) return '';
  return 'Solo ' + hrs + ' horas desde el turno del dia anterior (el minimo es ' + S.config.descansoMin + ').';
}
/* Cambia la terminal y la marca sin tocar el turno */
function asignarPuesto(empId, d, puestoId){
  const c = celda(empId, d);
  if(!c || c.t === LIBRE){ toast('Primero elige un turno'); return; }
  asignar(empId, d, c.t, puestoId);
}

function asignar(empId, d, turnoId, puestoId){
  const aplicar = () => {
    if(turnoId === null) ponerCelda(empId, d, null);
    else ponerCelda(empId, d, turnoId, puestoId, 'manual', true);
    cerrar();
    if(S.config.autocompletar && turnoId !== null && equipoDe(empId) === 'rotativo'){
      const ev = autocompletar(SEMANA);
      render();
      toast(ev.eq.faltan ? 'Listo. Quedan ' + ev.eq.faltan + ' puesto(s) sin cubrir' : 'Listo, el resto de la semana se lleno solo');
    } else {
      guardar(); render();
      toast(turnoId === LIBRE ? 'Dia libre marcado' : 'Turno asignado. Sigue poniendo los que quieras.');
    }
  };
  if(turnoId === null){ aplicar(); return; }

  /* Los supervisores y los agentes de servicio no entran en la rotacion del
     counter: no se les aplican sus reglas ni sus avisos. Lo unico que se
     mira aqui es el dia reservado en la ficha y el descanso entre turnos. */
  if(equipoDe(empId) !== 'rotativo'){
    if(turnoId !== LIBRE && diaReservado(empId, d)){
      modal('Ese dia lo tiene reservado',
        '<div class="alert bad"><b>' + esc(empleado(empId).nombre) + ' tiene ese dia reservado en su ficha.</b>' +
        'Es un dia libre fijo o un dia en el que no esta disponible.</div>' +
        '<p class="muted">Para que trabaje ese dia hay que cambiarlo en su ficha.</p>',
        '<button class="btn sec" onclick="cerrar()">Cerrar</button>' +
        '<button class="btn" onclick="cerrar();editarEmpleado(\'' + empId + '\')">Abrir su ficha</button>');
      return;
    }
    const av = turnoId === LIBRE ? '' : avisoDescanso(empId, d, turnoId);
    if(av){
      modal('Se queda corto de descanso',
        '<div class="alert warn"><b>' + esc(av) + '</b>Puedes ponerlo igualmente si esta semana toca asi.</div>',
        '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
        '<button class="btn warn" id="okasig2">Asignar de todas formas</button>');
      el('okasig2').onclick = aplicar;
      return;
    }
    aplicar();
    return;
  }

  /* Marcar un dia libre fuera de la rotacion rompe el encaje: la rotacion de
     libres esta determinada por el maximo de dias seguidos. Se avisa antes. */
  if(turnoId === LIBRE){
    /* Primero lo que no cuadra por aritmetica: si ese dia ya libra toda la
       gente que cabe, poner otro libre deja un puesto sin cubrir si o si. */
    const rl = validar(ctxReal(), empId, d, LIBRE, null, { reemplazar:true });
    if(!rl.ok && (rl.motivo === 'cupoLibres' || rl.motivo === 'libresDeMas')){
      modal('Ese dia libre deja un puesto sin cubrir',
        '<div class="alert bad"><b>' + esc(rl.texto) + '</b>' + esc(rl.sugerencia) + '</div>' +
        '<p class="muted">No es una preferencia del sistema: cada dia tiene tantos puestos como gente disponible, ' +
        'asi que un libre de mas es un puesto de menos.</p>',
        '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
        '<button class="btn" onclick="cerrar();verIntercambio(\'' + empId + '\',' + d + ')">Intercambiar con un companero</button>' +
        '<button class="btn warn" id="oklibre2">Ponerlo igualmente</button>');
      el('oklibre2').onclick = aplicar;
      return;
    }
    const patron = patronLibres(SEMANA, baseManual(SEMANA));
    const bloque = patron[empId] || [];
    if(bloque.length && !bloque.includes(d)){
      modal('Ese dia libre rompe la rotacion',
        '<div class="alert warn"><b>A ' + esc(empleado(empId).nombre) + ' le tocan libres el ' +
          bloque.map(x => DIAS[x].toLowerCase()).join(' y el ') + '.</b>' +
          'La rotacion de dias libres no es una preferencia: esta calculada para que nadie pase de ' +
          (empleado(empId).maxDiasConsec || 7) + ' dias seguidos y para que cada dia libre exactamente ' +
          cupoLibres(d, SEMANA) + ' persona(s).</div>' +
        '<p class="muted">Si lo marcas igualmente, esa semana quedara algun puesto sin cubrir o el reparto de ' +
        'libres saldra descuadrado. Lo veras marcado en rojo debajo de la tabla.</p>' +
        '<p class="muted">Si lo que quieres es cambiarle el descanso de forma permanente, es mejor ' +
        '<b>intercambiar los dias libres con otro companero</b> desde el boton Intercambiar.</p>',
        '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
        '<button class="btn warn" id="oklibre">Marcarlo igualmente</button>');
      el('oklibre').onclick = aplicar;
      return;
    }
    aplicar(); return;
  }
  const r = validar(ctxReal(), empId, d, turnoId, puestoId, { reemplazar:true });
  /* El cupo lo decides tu: se asigna sin preguntar y se avisa por lo bajo. */
  if(!r.ok && r.motivo === 'cupo'){
    const nec = cobNec(puestoId, turnoId, d, SEMANA);
    aplicar();
    toast(nec === 0 ? 'Asignado como extra: ese puesto no estaba previsto ese dia'
                    : 'Asignado como refuerzo: ese puesto ya estaba cubierto');
    return;
  }
  /* El dia libre fijo y los dias no disponibles se deciden en la ficha, no
     aqui: ofrecer "asignar de todas formas" solo serviria para dejar el
     horario contradiciendose con lo que tu mismo configuraste. */
  if(!r.ok && (r.motivo === 'libreFijo' || r.motivo === 'diaNoDisp')){
    modal('Ese dia lo tiene reservado',
      '<div class="alert bad"><b>' + esc(r.texto) + '</b>' + esc(r.sugerencia) + '</div>' +
      '<p class="muted">Esto no es una sugerencia del sistema: lo pusiste tu en su ficha. ' +
      'Para que trabaje ese dia hay que cambiarlo alli.</p>',
      '<button class="btn sec" onclick="cerrar()">Cerrar</button>' +
      '<button class="btn" onclick="cerrar();editarEmpleado(\'' + empId + '\')">Abrir su ficha</button>');
    return;
  }
  if(!r.ok){
    modal(r.aviso ? 'Confirma este cambio' : 'Ojo con esto',
      '<div class="alert ' + (r.aviso?'warn':'bad') + '"><b>' + esc(r.texto) + '</b>' + esc(r.sugerencia) + '</div>' +
      '<p class="muted">Tu decides: puedes asignarlo igualmente y quedara marcado.</p>',
      '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
      '<button class="btn" id="okasig">Asignar de todas formas</button>');
    el('okasig').onclick = aplicar;
    return;
  }
  aplicar();
}

function verConflictos(){
  if(Object.keys(semana(SEMANA).celdas).length === 0){
    return modal('Revision de la semana',
      '<div class="alert info"><b>Esta semana esta en blanco</b>No hay nada que revisar todavia. ' +
      'Pulsa <b>Llenar la semana</b> y despues vuelve aqui.</div>',
      '<button class="btn sec" onclick="cerrar()">Cerrar</button>' +
      '<button class="btn" onclick="cerrar();accionCompletar()">Llenar la semana</button>');
  }
  const rev = revisar();
  const otros = ['supervision','servicio'].map(q => ({ q, r: revisarEquipo(q, SEMANA) }));
  /* si el counter no esta armado, no se le reprocha nada */
  if(equipoVacio('rotativo', SEMANA)){ rev.conflictos = []; rev.faltantes = []; rev.avisos = []; }
  const hayOtros = otros.some(o => o.r.conflictos.length || o.r.avisos.length);
  let h = '';
  if(!rev.conflictos.length && !rev.faltantes.length && !rev.avisos.length && !hayOtros)
    h = '<div class="alert ok"><b>Todo en orden</b>Sin conflictos y todos los puestos cubiertos en los tres horarios.</div>';
  if(rev.conflictos.length || rev.faltantes.length || rev.avisos.length) h += '<h2 style="margin-top:4px">Agentes de Renta</h2>';
  if(rev.conflictos.length){
    h += '<h3>Conflictos</h3>';
    rev.conflictos.forEach(c => h += '<div class="alert bad"><b>' + esc(empleado(c.empId).nombre) + ' - ' + DIAS[c.dia] + '</b>' +
      esc(c.texto) + (c.sugerencia ? '<br><i>Solucion: ' + esc(c.sugerencia) + '</i>' : '') + '</div>');
  }
  if(rev.faltantes.length){
    h += '<h3>Puestos sin cubrir</h3>';
    rev.faltantes.forEach(f => {
      const t = turno(f.turnoId), p = puesto(f.puestoId);
      h += '<div class="alert warn"><b>' + DIAS[f.dia] + ' &middot; ' + esc(p ? p.corto : '') + ' &middot; ' + esc(t.corto) + '</b>' +
        'Falta ' + f.faltan + ' persona(s). ' + esc(f.motivo);
      if(f.candidatos.length) h += '<br><b>Pueden cubrirlo:</b> ' + f.candidatos.map(id => esc(empleado(id).nombre)).join(', ');
      h += '<div class="row" style="margin-top:6px"><button class="btn sec sm" onclick="cerrar();porQue(' + f.dia + ',\'' + f.turnoId + '\',\'' + f.puestoId + '\')">Ver por que</button></div>';
      h += '</div>';
    });
  }
  if(rev.avisos.length){
    h += '<h3>Avisos</h3>';
    rev.avisos.forEach(a => h += '<div class="alert info">' + esc(a.texto) + '</div>');
  }
  otros.forEach(o => {
    if(!o.r.conflictos.length && !o.r.avisos.length) return;
    h += '<h2 style="margin-top:16px">' + esc(infoEquipo(o.q).nombre) + '</h2>';
    o.r.conflictos.forEach(c => h += '<div class="alert bad">' + esc(c.texto) + '</div>');
    o.r.avisos.forEach(a => h += '<div class="alert warn">' + esc(a.texto) +
      ' <button class="btn sec sm" style="margin-left:6px" onclick="cerrar();accionEquipo(\'' + o.q + '\')">Rearmar</button></div>');
  });
  modal('Revision de la semana', h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>', true);
}

   ===================================================================== */
let _drag = null;
function activarArrastre(){
  document.querySelectorAll('.chip[draggable]').forEach(ch => {
    ch.addEventListener('dragstart', ev => {
      _drag = { e: ch.dataset.e, d: Number(ch.dataset.d) };
      ch.classList.add('drag');
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain','x');
    });
    ch.addEventListener('dragend', () => { ch.classList.remove('drag'); _drag = null;
      document.querySelectorAll('td.cell').forEach(c => c.classList.remove('dropok')); });
  });
  document.querySelectorAll('td.cell').forEach(td => {
    td.addEventListener('dragover', ev => { if(_drag){ ev.preventDefault(); td.classList.add('dropok'); } });
    td.addEventListener('dragleave', () => td.classList.remove('dropok'));
    td.addEventListener('drop', ev => {
      ev.preventDefault(); td.classList.remove('dropok');
      if(_drag) soltar(_drag.e, _drag.d, td.dataset.e, Number(td.dataset.d));
    });
  });
}
function soltar(eA, dA, eB, dB){
  if(eA === eB && dA === dB) return;
  /* Cada horario es el suyo: un turno de counter no se arrastra a la fila
     de un supervisor ni al reves. */
  if(equipoDe(eA) !== equipoDe(eB)){
    toast('Solo se pueden mover turnos dentro del mismo horario');
    return;
  }
  const w = semana();
  const a = w.celdas[ck(eA,dA)] ? JSON.parse(JSON.stringify(w.celdas[ck(eA,dA)])) : null;
  const b = w.celdas[ck(eB,dB)] ? JSON.parse(JSON.stringify(w.celdas[ck(eB,dB)])) : null;

  const ctx = ctxCopia(SEMANA, w.celdas);
  if(b) ctx.celdas[ck(eA,dA)] = b; else delete ctx.celdas[ck(eA,dA)];
  if(a) ctx.celdas[ck(eB,dB)] = a; else delete ctx.celdas[ck(eB,dB)];

  const problemas = [];
  if(equipoDe(eA) === 'rotativo'){
    if(a){ const r = validar(ctx, eB, dB, a.t, a.p, { reemplazar:true }); if(!r.ok && !r.aviso) problemas.push(r); }
    if(b){ const r = validar(ctx, eA, dA, b.t, b.p, { reemplazar:true }); if(!r.ok && !r.aviso) problemas.push(r); }
  } else {
    /* en los horarios fijos lo unico duro es el dia reservado en la ficha */
    if(a && a.t !== LIBRE && diaReservado(eB, dB)) problemas.push({ texto: empleado(eB).nombre + ' tiene el ' + DIAS[dB].toLowerCase() + ' reservado en su ficha.', sugerencia:'Cambialo en Empleados si debe trabajar ese dia.' });
    if(b && b.t !== LIBRE && diaReservado(eA, dA)) problemas.push({ texto: empleado(eA).nombre + ' tiene el ' + DIAS[dA].toLowerCase() + ' reservado en su ficha.', sugerencia:'Cambialo en Empleados si debe trabajar ese dia.' });
  }

  if(problemas.length){
    modal('El cambio produce un conflicto',
      problemas.map(p => '<div class="alert bad"><b>' + esc(p.texto) + '</b>' + esc(p.sugerencia) + '</div>').join('') +
      '<p class="muted">El movimiento no se aplico.</p>',
      '<button class="btn sec" onclick="cerrar()">Entendido</button>');
    return;
  }
  w.celdas = ctx.celdas;
  [[eA,dA],[eB,dB]].forEach(([id,d]) => { const c = w.celdas[ck(id,d)]; if(c){ c.o = 'manual'; c.b = true; } });
  w.modificado = new Date().toISOString();
  bitacora('Movimiento manual: ' + empleado(eA).nombre + ' (' + DIAS[dA] + ') y ' + empleado(eB).nombre + ' (' + DIAS[dB] + ').');
  guardar(); render(); toast('Cambio aplicado y bloqueado');
}

         S.puestos.map(p => '<td>' + (a.h.porPuesto[p.id] || 0) + '</td>').join('') + '</tr>';
  });
  h += '</tbody></table>';
  if(acum.length){
    const dif = maxB - Math.min(...acum.map(a => a.h.visitasB));
    h += '<div class="alert ' + (dif > 3 ? 'warn' : 'ok') + '" style="margin-top:10px">' +

         (dif > 3 ? ' Conviene compensar en las proximas semanas.' : ' El reparto es parejo.') + '</div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>Reparto de turnos por empleado</h2>' +
       '<p class="muted" style="margin-top:-4px">Los tres equipos, cada uno con sus turnos.</p>';
  EQUIPO_IDS.forEach(eqid => {

    gente.forEach(e => {
      const hs = historialEmpleado(e.id, k, 8);
      h += '<tr><td><b>' + esc(e.nombre) + '</b></td>' +
        ts.map(t => '<td>' + (hs.porTurno[t.id] || 0) + '</td>').join('') +
        '<td><b>' + hs.dias + '</b></td></tr>';
    });
    h += '</tbody></table>';
  });
  h += '</div>';

  h += '<div class="card"><h2>Semanas registradas</h2>';
  if(!semanas.length) h += '<p class="muted">Todavia no hay semanas guardadas.</p>';
  else {
    h += '<table class="data"><thead><tr><th>Semana</th><th>Tipo</th><th>Estado</th><th>Turnos</th><th>Sin cubrir</th><th>Equilibrio</th><th></th></tr></thead><tbody>';
    semanas.slice(0,20).forEach(x => {
      const ctx = { k:x, celdas:S.semanas[x].celdas };
      const eq = equidad(ctx);
      let n = 0;
      for(const e of activos()) for(let d = 0; d < 7; d++){ const c = ctx.celdas[ck(e.id,d)]; if(c && c.t !== LIBRE) n++; }
      h += '<tr><td><b>' + fechaLarga(x) + '</b></td><td>' + esc((empleado(turnoDosLibres(x))||{}).nombre || '-') + '</td>' +
           '<td>' + (S.semanas[x].estado === 'publicado' ? '<span class="pill ok">Publicado</span>' : '<span class="pill warn">Borrador</span>') + '</td>' +
           '<td>' + n + '</td><td>' + eq.faltan + '</td><td>' + eq.equilibrio + '%</td>' +
           '<td style="text-align:right"><button class="btn sec sm" onclick="abrirSemana(\'' + x + '\')">Abrir</button></td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  h += '<div class="card"><h2>Historial de cambios</h2>';
  h += S.historial.length
    ? '<table class="data"><tbody>' + S.historial.slice(0,50).map(x =>
        '<tr><td style="width:150px" class="tiny muted">' + new Date(x.cuando).toLocaleString('es') + '</td><td>' + esc(x.texto) + '</td></tr>').join('') + '</tbody></table>'
    : '<p class="muted">Sin movimientos.</p>';
  h += '</div>';

  h += '<div class="card noprint"><h2>Comprobacion del sistema</h2>' +
       '<button class="btn sec" onclick="verPruebas()">Ejecutar pruebas</button></div>';
  return h;
}

function textoCelda(e, d){
  const c = celda(e.id, d);
  if(!c) return '';
  if(c.t === LIBRE) return 'Libre';
  const t = turno(c.t), p = puesto(c.p);
  return (t ? t.corto : '') + (p ? ' / ' + p.corto : '');
}
function exportarCSV(){
  const w = semana();
  let txt = S.empresa + '\n';
  txt += 'Horario del ' + fechaLarga(SEMANA) + ' al ' + fechaLarga(addDias(SEMANA,6)) + '\n';
  txt += 'Dos dias libres;' + ((empleado(turnoDosLibres(SEMANA))||{}).nombre || '-') + '\n';
  txt += 'Estado;' + (w.estado === 'publicado' ? 'Publicado' : 'Borrador') + '\n';
  txt += 'Publicado;' + (w.publicado ? new Date(w.publicado).toLocaleString('es') : '-') + '\n';
  txt += 'Ultima modificacion;' + (w.modificado ? new Date(w.modificado).toLocaleString('es') : '-') + '\n\n';
  EQUIPO_IDS.forEach(eqid => {
    const gente = plantilla(eqid);
    if(!gente.length) return;
    txt += '\n' + infoEquipo(eqid).nombre.toUpperCase() + '\n';
    txt += 'Empleado;Cargo;' + DIAS.join(';') + ';Dias;Horas;Terminal B\n';
    gente.forEach(e => {
      const fila = [];
      for(let d = 0; d < 7; d++) fila.push(textoCelda(e, d));
      txt += e.nombre + ';' + e.cargo + ';' + fila.join(';') + ';' + diasTrabajados(e.id) + ';' +
             horasSemana(e.id) + ';' + (eqid === 'rotativo' ? visitasB(e.id) : '-') + '\n';
    });
  });
  if(feriados().some(f => f.fecha >= SEMANA && f.fecha <= addDias(SEMANA,6))){
    txt += '\nFeriados de la semana\n';
    feriados().filter(f => f.fecha >= SEMANA && f.fecha <= addDias(SEMANA,6))
      .forEach(f => txt += f.fecha + ';' + f.nombre + '\n');
  }
  txt += '\nTerminales y marcas\n';
  S.puestos.forEach(p => txt += p.corto + ';' + (p.marcas||[]).join(' - ') + '\n');
  const b = new Blob(['﻿' + txt], { type:'text/csv;charset=utf-8' });
  descargarArchivo(URL.createObjectURL(b), 'horario-' + SEMANA + '.csv');
  cerrar(); toast('Hoja de calculo descargada');
}

/* La imagen sale con los tres horarios uno debajo de otro y con la misma
   idea que la pantalla: el color de la marca en una barra fina y un fondo
   apenas tenido, no rellenando la casilla entera. */
function exportarImagen(){
  const w = semana();
  const INK = '#141b26', SOFT = '#6b7686', LINE = '#e5e8ee';
  const anchoEmp = 176, anchoDia = 146, altoFila = 54, altoTitulo = 30, cabecera = 152;

  const bloques = EQUIPO_IDS.map(id => ({ id, info: infoEquipo(id), gente: plantilla(id) }))
                            .filter(b => b.gente.length);
  let filas = 0;
  bloques.forEach(b => { filas += b.gente.length; });
  const pieAlto = 26 + puestosActivos().length * 18;
  const W = anchoEmp + anchoDia*7 + 100;
  const H = cabecera + altoFila + filas*altoFila + bloques.length*altoTitulo + pieAlto + 26;

  const cv = document.createElement('canvas');
  cv.width = W*2; cv.height = H*2;
  const x = cv.getContext('2d'); x.scale(2,2);
  x.fillStyle = '#ffffff'; x.fillRect(0,0,W,H);

  x.fillStyle = INK; x.font = 'bold 28px Segoe UI, Arial';
  x.fillText('ANDEL STAR', 20, 40);
  MARCAS_COLOR.forEach((m, i) => {
    const mx = 22 + i*92;
    x.fillStyle = m.color; x.fillRect(mx, 51, 11, 11);
    x.fillStyle = SOFT; x.font = 'bold 12.5px Segoe UI, Arial';
    x.fillText(m.nombre, mx + 17, 61);
  });
  x.fillStyle = INK; x.font = 'bold 15px Segoe UI, Arial';
  x.fillText('Horario del ' + fechaLarga(SEMANA) + ' al ' + fechaLarga(addDias(SEMANA,6)), 20, 92);
  x.fillStyle = SOFT; x.font = '12px Segoe UI, Arial';
  x.fillText('Agentes de Renta: 2 dias libres para ' + ((empleado(turnoDosLibres(SEMANA))||{}).nombre || '-') + '   |   ' + (w.estado === 'publicado' ? 'Publicado' : 'Borrador') +
    '   |   Publicado: ' + (w.publicado ? new Date(w.publicado).toLocaleDateString('es') : '-') +
    '   |   Modificado: ' + (w.modificado ? new Date(w.modificado).toLocaleDateString('es') : '-'), 20, 110);
  x.strokeStyle = INK; x.lineWidth = 2;
  x.beginPath(); x.moveTo(20, 118); x.lineTo(W-20, 118); x.stroke();

  const y0 = cabecera - 26;
  x.fillStyle = '#fafbfc'; x.fillRect(20, y0, W-40, altoFila);
  x.fillStyle = SOFT; x.font = 'bold 11.5px Segoe UI, Arial';
  x.fillText('EMPLEADO', 30, y0 + 30);
  DIAS.forEach((d,i) => {
    const fer = feriadoEn(addDias(SEMANA,i));
    x.fillStyle = SOFT; x.font = 'bold 11.5px Segoe UI, Arial';
    x.fillText(d.toUpperCase(), 20 + anchoEmp + i*anchoDia + 8, y0 + 22);
    x.font = '10.5px Segoe UI, Arial';
    x.fillText(fechaCorta(addDias(SEMANA,i)) + (fer ? '  feriado' : ''), 20 + anchoEmp + i*anchoDia + 8, y0 + 38);
  });
  x.fillStyle = SOFT; x.font = 'bold 11.5px Segoe UI, Arial';
  x.fillText('RESUMEN', 20 + anchoEmp + 7*anchoDia + 8, y0 + 30);

  let y = y0 + altoFila;
  bloques.forEach(b => {
    /* titulo del equipo */
    x.fillStyle = '#f2f4f7'; x.fillRect(20, y, W-40, altoTitulo);
    x.fillStyle = INK; x.font = 'bold 12.5px Segoe UI, Arial';
    x.fillText(b.info.nombre.toUpperCase(), 30, y + 20);
    x.fillStyle = SOFT; x.font = '11px Segoe UI, Arial';
    x.fillText(b.info.sub, 30 + x.measureText(b.info.nombre.toUpperCase()).width + 24, y + 20);
    y += altoTitulo;

    b.gente.forEach(e => {
      x.strokeStyle = LINE; x.lineWidth = 1;
      x.beginPath(); x.moveTo(20,y); x.lineTo(W-20,y); x.stroke();
      x.fillStyle = INK; x.font = 'bold 12.5px Segoe UI, Arial';
      x.fillText(e.nombre.slice(0,24), 30, y + 22);
      if(e.cargo){ x.fillStyle = SOFT; x.font = '10.5px Segoe UI, Arial'; x.fillText(e.cargo.slice(0,26), 30, y + 36); }
      for(let d = 0; d < 7; d++){
        const c = celda(e.id, d);
        const cx = 20 + anchoEmp + d*anchoDia + 4, cy = y + 4, cw = anchoDia - 8, chh = altoFila - 8;
        if(!c){ x.fillStyle = '#d7dbe3'; x.font = '13px Segoe UI, Arial'; x.fillText('-', cx + 10, cy + 24); continue; }
        if(c.t === LIBRE){
          x.strokeStyle = LINE; x.strokeRect(cx, cy, cw, chh);
          x.fillStyle = '#9aa3b2'; x.font = '12.5px Segoe UI, Arial'; x.fillText('Libre', cx + 10, cy + 26);
          continue;
        }
        const t = turno(c.t), p = puesto(c.p);
        if(!t) continue;
        const tn = tonosPuesto(p);
        x.fillStyle = tn.bg; x.fillRect(cx, cy, cw, chh);
        x.strokeStyle = tn.line; x.strokeRect(cx, cy, cw, chh);
        x.fillStyle = tn.c; x.fillRect(cx, cy, 4, chh);
        x.fillStyle = INK; x.font = 'bold 14px Segoe UI, Arial'; x.fillText(t.corto, cx + 11, cy + 17);
        x.fillStyle = SOFT; x.font = '10.5px Segoe UI, Arial';
        x.fillText(hora12(t.inicio) + ' a ' + hora12(t.fin), cx + 11, cy + 30);
        x.fillStyle = tn.txt; x.font = 'bold 10px Segoe UI, Arial';
        x.fillText((p ? marcaCorta(p) : (t.nombre.split(' - ')[0] || '')).slice(0,22).toUpperCase(), cx + 11, cy + 42);
      }
      x.fillStyle = INK; x.font = 'bold 12.5px Segoe UI, Arial';
      x.fillText(diasTrabajados(e.id) + ' dias', 20 + anchoEmp + 7*anchoDia + 8, y + 22);
      x.fillStyle = SOFT; x.font = '10px Segoe UI, Arial';
      x.fillText(horasSemana(e.id) + ' h' + (b.id === 'rotativo' ? '  ·  B: ' + visitasB(e.id) : ''),
                 20 + anchoEmp + 7*anchoDia + 8, y + 36);
      y += altoFila;
    });
  });
  x.strokeStyle = LINE; x.lineWidth = 1; x.strokeRect(20, y0, W-40, y - y0);

  let yy = y + 22;
  x.fillStyle = INK; x.font = 'bold 11.5px Segoe UI, Arial';
  x.fillText('TERMINALES Y MARCAS', 20, yy);
  puestosActivos().forEach((p,i) => {
    const ly = yy + 16 + i*18;
    const tn = tonosPuesto(p);
    x.fillStyle = tn.bg; x.fillRect(20, ly - 10, 16, 13);
    x.fillStyle = tn.c;  x.fillRect(20, ly - 10, 4, 13);
    x.fillStyle = INK; x.font = '11px Segoe UI, Arial';
    x.fillText(p.corto + '   (' + (p.marcas||[]).join(', ') + ')', 42, ly);
  });
  x.fillStyle = SOFT; x.font = '11px Segoe UI, Arial';
  x.fillText('Generado el ' + new Date().toLocaleString('es'), W - 220, H - 10);

  /* Un blob y no un data: la imagen sale de 2600 px de ancho y como texto
     pasa del medio mega, que hay navegadores que no tragan en un enlace. */
  const nombre = 'horario-' + SEMANA + '.png';
  const fin = (url) => { descargarArchivo(url, nombre); cerrar(); toast('Imagen descargada'); };
  if(cv.toBlob) cv.toBlob(function(b){ fin(b ? URL.createObjectURL(b) : cv.toDataURL('image/png')); }, 'image/png');
  else fin(cv.toDataURL('image/png'));
}
