        if(!(b - a === 1 || (a === 0 && b === 6)))
          avisos.push({ clave:'s' + e.id, texto: e.nombre + ' libra ' + DIAS[a].toLowerCase() + ' y ' +
            DIAS[b].toLowerCase() + ', que no son dos dias seguidos.' });
      }
    });
  }
  if(eq === 'supervision'){
    /* Los feriados ya no son "uno si y otro no entre los dos": cada uno
       tiene su regla, asi que puede tocarle a uno, a los dos o a ninguno.
       Que no entre nadie ya no es un fallo, es la regla; lo que si sirve es
       decir quien entra. */
    for(let d = 0; d < 7; d++){
      const fecha = addDias(k, d);
      const fer = feriadoEn(fecha);
      if(!fer) continue;
      const dentro = supervisoresDeFeriadoEn(k, d);
      avisos.push({ clave:'fer' + d, texto: 'El ' + DIAS[d].toLowerCase() + ' es feriado (' + fer.nombre + '): ' +
        (dentro.length ? 'entra ' + dentro.map(x => x.nombre).join(' y ') + '.'
                       : 'no le toca a nadie, asi que no entra ninguno.') });
    }
  }
  return { avisos, conflictos };
}

/* =====================================================================
   REEMPLAZOS E INTERCAMBIOS
   ===================================================================== */
function buscarReemplazo(empId, d){
  const ctx = ctxReal();
  const c = ctx.celdas[ck(empId,d)];
  if(!c || c.t === LIBRE) return { turnoId:null, puestoId:null, listos:[], casi:[] };
  const sin = ctxCopia(SEMANA, ctx.celdas);
  delete sin.celdas[ck(empId,d)];
  return {
    turnoId:c.t, puestoId:c.p,
    listos: candidatosPara(sin, d, c.t, c.p, empId),
    casi: casiPodrian(sin, d, c.t, c.p).filter(x => x.empId !== empId)
  };
}

function evaluarIntercambio(empA, empB, d){
  const w = semana();
  const a = w.celdas[ck(empA,d)] || null;
  const b = w.celdas[ck(empB,d)] || null;
  const ctx = ctxCopia(SEMANA, w.celdas);
  if(b) ctx.celdas[ck(empA,d)] = JSON.parse(JSON.stringify(b)); else delete ctx.celdas[ck(empA,d)];
  if(a) ctx.celdas[ck(empB,d)] = JSON.parse(JSON.stringify(a)); else delete ctx.celdas[ck(empB,d)];

  const problemas = [];
  [[empA, b], [empB, a]].forEach(([id, nuevo]) => {
    if(!nuevo) return;
    const r = validar(ctx, id, d, nuevo.t, nuevo.p, { reemplazar:true });
    if(!r.ok && !r.aviso) problemas.push({ empId:id, texto:r.texto, sugerencia:r.sugerencia });
  });

  return {
    posible: problemas.length === 0, problemas,
    antes: equidad(ctxReal()), despues: equidad(ctx), celdas: ctx.celdas,
    turnoA: a ? a.t : null, puestoA: a ? a.p : null,
    turnoB: b ? b.t : null, puestoB: b ? b.p : null
  };
}
/* =====================================================================
   BLOQUE 4 - INTERFAZ: base, panel, empleados, ajustes
   ===================================================================== */

const PANTALLAS = [
  { id:'panel',     nombre:'Panel' },
  { id:'horario',   nombre:'Horario semanal' },
  { id:'empleados', nombre:'Empleados' },
  { id:'reportes',  nombre:'Reportes' },
  { id:'ajustes',   nombre:'Ajustes' }
];

function ir(p){ PANTALLA = p; render(); window.scrollTo(0,0); }

/* =====================================================================
   RECORDAR DONDE ESTABAS
   Al refrescar la pagina se vuelve a la misma pantalla y a la misma
   semana, en vez de saltar al Panel. Dura mientras la pestana este abierta.
   ===================================================================== */
const CLAVE_VISTA = 'horarios_vista';
function guardarVista(){
  try { sessionStorage.setItem(CLAVE_VISTA, JSON.stringify({ p:PANTALLA, s:SEMANA })); } catch(e){}
}
function restaurarVista(){
  try {
    const v = JSON.parse(sessionStorage.getItem(CLAVE_VISTA) || 'null');
    if(!v) return;
    if(v.p && PANTALLAS.some(x => x.id === v.p)) PANTALLA = v.p;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v.s || '')) SEMANA = lunesDe(v.s);
  } catch(e){}
}

/* =====================================================================
   LAS TABLAS ANCHAS SE DESLIZAN DENTRO DE SU TARJETA
   En un telefono, una tabla de 690 puntos empujaba la pagina entera y
   toda la pantalla se movia de lado. Metiendola en una caja que se
   desliza, lo unico que se mueve es la tabla y el resto se queda quieto.
   Se hace al terminar de dibujar porque estas tablas se escriben en una
   docena de sitios y no tenia sentido tocarlos uno a uno.
   ===================================================================== */
function envolverTablas(){
  try {
    const tablas = el('app').querySelectorAll('table.data, table.matriz');
    for(const t of tablas){
      const p = t.parentElement;
      if(p && p.classList.contains('tablascroll')) continue;
      const caja = document.createElement('div');
      caja.className = 'tablascroll';
      p.insertBefore(caja, t);
      caja.appendChild(t);
    }
  } catch(e){}
}

function render(){
  try {
    el('empresaNombre').textContent = S.empresa + (nubeLista() ? '  - sincronizado en la nube' : '');
    if(el('loginLogo') && !el('loginLogo').innerHTML) el('loginLogo').innerHTML = logoHorizontal(58, false);
    el('nav').innerHTML = PANTALLAS.map(p =>
      '<button class="' + (PANTALLA===p.id?'on':'') + '" onclick="ir(\'' + p.id + '\')">' + p.nombre + '</button>').join('') +
      (nubeLista() ? '<button id="btnActualizar" onclick="actualizarAhora()" title="Buscar ahora los cambios del otro equipo">Actualizar</button>' : '') +
      '<button onclick="cerrarSesion()" title="Cerrar la sesion y pedir la clave">Salir</button>';
    const f = { panel:pantallaPanel, horario:pantallaHorario, empleados:pantallaEmpleados,
                reportes:pantallaReportes, ajustes:pantallaAjustes }[PANTALLA] || pantallaPanel;
    el('app').innerHTML = f();
    if(PANTALLA === 'horario') activarArrastre();
    envolverTablas();
    guardarVista();
  } catch(e){
    pantallaError(e);
  }
}

/* Si algo se rompe, se explica y se ofrece arreglarlo en vez de dejar la pantalla vacia */
function pantallaError(e){
  const detalle = (e && e.message ? e.message : String(e)) + '\n' + ((e && e.stack) ? e.stack.split('\n').slice(0,4).join('\n') : '');
  try {
    el('app').innerHTML =
      '<div class="card"><h2>No se pudo mostrar esta pantalla</h2>' +
      '<p>Casi siempre es porque la informacion guardada viene de una version anterior y algo quedo a medias. ' +
      'Tus empleados y tus semanas <b>no se han perdido</b>.</p>' +
      '<div class="row" style="margin:12px 0">' +
        '<button class="btn" onclick="repararDatos()">Reparar la informacion</button>' +
        '<button class="btn sec" onclick="exportarDatos()">Descargar copia antes de tocar nada</button>' +
        '<button class="btn bad" onclick="reiniciar()">Empezar de cero con los datos de ejemplo</button>' +
      '</div>' +
      '<details><summary style="cursor:pointer;font-size:13px;color:var(--soft)">Detalle tecnico</summary>' +
      '<pre style="font-size:11.5px;white-space:pre-wrap;background:#f7f9fc;padding:10px;border-radius:8px">' + esc(detalle) + '</pre></details></div>';
  } catch(e2){
    document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif">' +
      '<h2>No se pudo abrir la aplicacion</h2><p>' + esc(detalle) + '</p></div>';
  }
}
function repararDatos(){
  try {
    sanear();
    S.version = 10;
    guardar();
    SEMANA = lunesDe(hoyISO());
    PANTALLA = 'panel';
    render();
    toast('Informacion reparada');

}
window.addEventListener('error', function(ev){
  const app = el('app');
  if(app && app.innerHTML.length < 100 && !el('login').classList.contains('hidden') === false) pantallaError(ev.error || ev.message);

function modal(titulo, cuerpo, botones, ancho){
  el('veil').classList.remove('hidden');
  el('veil').innerHTML =
    '<div class="modal' + (ancho?' wide':'') + '">' +
      '<div class="mh"><h2>' + titulo + '</h2><button class="x" onclick="cerrar()">&times;</button></div>' +
      '<div class="mb">' + cuerpo + '</div>' +
      (botones ? '<div class="mf">' + botones + '</div>' : '') +
    '</div>';
}
function cerrar(){ el('veil').classList.add('hidden'); el('veil').innerHTML = ''; }
let _t;
function toast(m){
  clearTimeout(_t);
  let d = el('toast');
  if(!d){ d = document.createElement('div'); d.id = 'toast'; document.body.appendChild(d); }
  d.textContent = m; d.style.display = 'block';
  _t = setTimeout(() => d.style.display = 'none', 2800);
}
function confirmar(txt, fn){
  modal('Confirmar', '<p>' + txt + '</p>',
    '<button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn bad" id="okc">Si, continuar</button>');

}
/* =====================================================================
   SESION
   Al entrar se deja una marca para que al refrescar la pagina no vuelva
   a pedir la clave. Si desmarcas la casilla, la sesion dura solo mientras
   la pestana este abierta.
   ===================================================================== */
const CLAVE_SESION = 'horarios_sesion';
const DURACION_SESION = 30 * 24 * 60 * 60 * 1000;   // 30 dias

function sesionAbierta(){
  try {
    if(sessionStorage.getItem(CLAVE_SESION)) return true;
    const hasta = Number(localStorage.getItem(CLAVE_SESION) || 0);
    if(hasta > Date.now()) return true;
  } catch(e){}
  return false;
}
function abrirSesion(recordar){
  try {
    sessionStorage.setItem(CLAVE_SESION, '1');
    if(recordar) localStorage.setItem(CLAVE_SESION, String(Date.now() + DURACION_SESION));
    else localStorage.removeItem(CLAVE_SESION);
  } catch(e){}
}
function cerrarSesion(){
  try { sessionStorage.removeItem(CLAVE_SESION); localStorage.removeItem(CLAVE_SESION); } catch(e){}
  /* hay que quitar la marca del arranque: si no, la regla que oculta el login
     para evitar el parpadeo dejaria la pantalla de la clave invisible */
  document.documentElement.classList.remove('consesion');
  el('login').classList.remove('hidden');
  el('pin').value = '';
  el('pinmsg').textContent = '';
  cerrar();
  try { el('pin').focus(); } catch(e){}
}
function entrar(){
  if(el('pin').value === String(S.pin)){
    abrirSesion(el('recordar') ? el('recordar').checked : true);
    document.documentElement.classList.add('consesion');
    el('login').classList.add('hidden');
    el('pin').value = '';
    render();
  } else {
    el('pinmsg').style.color = 'var(--bad)';
    el('pinmsg').textContent = 'Clave incorrecta.';
  }
}
function campo(t, id, tipo, val, extra){
  return '<label class="f"><span>' + t + '</span><input type="' + tipo + '" id="' + id + '" value="' + val + '" ' + (extra||'') + '></label>';
}
function kpi(v, t){ return '<div class="kpi"><b>' + v + '</b><span>' + t + '</span></div>'; }
function pillTipo(t){ return t === 'tarde' ? 'bad' : (t === 'temprano' ? 'info' : 'ok'); }
/* =====================================================================

        '<i style="display:inline-block;width:' + Math.round(h*0.13) + 'px;height:' + Math.round(h*0.13) + 'px;border-radius:3px;background:' + m.color + '"></i>' + m.nombre + '</span>').join('') +

/* Etiqueta de terminal y marca: el color va en una pastilla fina a la
   izquierda, no rellenando la etiqueta entera. */
function uniHTML(p, texto){
  if(!p) return '<span class="uni"><i style="background:var(--soft-2)"></i>Sin marca</span>';
  const t = tonosPuesto(p);
  return '<span class="uni" style="background:' + t.bg + ';border-color:' + t.line + '">' +
         '<i style="background:' + t.c + '"></i>' + esc(texto || p.corto) + '</span>';

/* =====================================================================
   PANEL
   ===================================================================== */
function pantallaPanel(){
  const hoy = hoyISO();
  const k = lunesDe(hoy);
  const d = Math.round((s2d(hoy) - s2d(k)) / 86400000);
  const w = S.semanas[k];
  const vaciaHoy = !w || Object.keys(w.celdas || {}).length === 0;
  /* Igual que en el horario: si el counter no esta armado no se le
     reprocha nada. Mirar solo si la semana entera esta vacia no bastaba,
     porque con el horario de servicio hecho y el del counter en blanco el
     Panel se llenaba de "puesto sin cubrir" de un reparto que nadie habia
     hecho todavia. */
  const rev = (vaciaHoy || equipoVacio('rotativo', k)) ? null : revisar({ k, celdas:w.celdas });
  const tipo = tipoSemana(k);

  const trabajan = [], libres = [];
  activosTodos().forEach(e => {
    const c = w ? w.celdas[ck(e.id,d)] : null;
    if(c && c.t !== LIBRE && turno(c.t)) trabajan.push({ e, t:turno(c.t), p:puesto(c.p) });
    else libres.push(e);
  });
  trabajan.sort((a,b) => min2(a.t.inicio) - min2(b.t.inicio));
  const fer = feriadoEn(hoy);

  let h = '<div class="banda">' + logoHorizontal(66, true) +
    '<div class="fecha"><b>' + DIAS[d] + ', ' + fechaLarga(hoy) + '</b>' +
    (fer ? 'Feriado: ' + esc(fer.nombre) + ' &middot; ' : '') +
    'Semana de ' + tipo + ' dias en agentes de renta</div></div>';
  h += '<h1>Panel principal</h1>';
  h += '<div class="grid g4" style="margin-bottom:16px">' +
    kpi(trabajan.length, 'Trabajan hoy') +
    kpi(trabajan.filter(x => x.p && x.p.terminal === 'B').length, 'Hoy en Terminal B') +
    kpi(libres.length, 'Libres hoy') +
    kpi(rev ? rev.faltantes.reduce((a,x)=>a+x.faltan,0) : '-', 'Puestos de renta sin cubrir') + '</div>';

  h += '<div class="card"><h2>Quien trabaja hoy</h2>';
  if(vaciaHoy) h += '<p class="muted">Todavia no hay horario para esta semana. <a href="#" onclick="ir(\'horario\');return false">Crearlo ahora</a>.</p>';
  else if(!trabajan.length) h += '<p class="muted">Nadie tiene turno asignado hoy.</p>';
  else {
    /* agrupado por equipo: de un vistazo se ve quien esta en counter, quien
       supervisa y quien esta de servicio */
    EQUIPO_IDS.forEach(eqid => {
      const filas = trabajan.filter(x => equipoDe(x.e) === eqid);
      if(!filas.length) return;
      h += '<h3 style="margin:12px 0 4px;color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px">' +
           esc(infoEquipo(eqid).nombre) + '</h3>';
      h += '<table class="data"><tbody>' + filas.map(x =>
        '<tr><td><b>' + esc(x.e.nombre) + '</b>' + (x.e.cargo ? '<br><span class="tiny muted">' + esc(x.e.cargo) + '</span>' : '') + '</td>' +
        '<td>' + (x.p ? uniHTML(x.p) : '<span class="tiny muted">-</span>') + '</td>' +
        '<td style="text-align:right"><span class="pill ' + pillTipo(x.t.tipo) + '">' + esc(x.t.corto) + '</span><br>' +
        '<span class="tiny muted">' + hora12(x.t.inicio) + ' a ' + hora12(x.t.fin) + '</span></td></tr>').join('') + '</tbody></table>';
    });
  }
  const fuera = activosTodos().filter(e => ausenciaEn(e.id, hoy));
  const librandoHoy = libres.filter(e => !ausenciaEn(e.id, hoy));
  if(librandoHoy.length) h += '<p style="margin-bottom:' + (fuera.length ? '4px' : '0') + '"><b>Libres hoy:</b> ' +
    librandoHoy.map(e => esc(e.nombre)).join(', ') + '</p>';
  if(fuera.length) h += '<p style="margin-bottom:0"><b>Fuera hoy:</b> ' +
    fuera.map(e => esc(e.nombre) + ' <span class="tiny muted">(' +
      esc(TIPOS_AUSENCIA[ausenciaEn(e.id, hoy).tipo]) + ' hasta el ' + fechaCorta(ausenciaEn(e.id, hoy).hasta) + ')</span>').join(', ') + '</p>';
  h += '</div>';

  if(!vaciaHoy){
    h += '<div class="card"><h2>Reparto de la Terminal B esta semana</h2>' +
         '<p class="muted" style="margin-top:-4px">Lo parejo son ' + S.config.objetivoB + ' visitas por persona (tope ' + S.config.maxB + '). Quien tenga la Terminal B prohibida no cuenta.</p><div class="row">';
    activos().forEach(e => {
      const v = visitasB(e.id, k);
      const cl = v === objetivoBDe(e.id) ? 'ok' : (v > S.config.maxB ? 'bad' : 'warn');
      h += '<span class="pill ' + cl + '" style="margin:0 6px 6px 0">' + esc(e.nombre) + ': ' + v + '</span>';
    });
    h += '</div></div>';
  }

  h += '<div class="card"><h2>Estado del horario</h2>';
  h += '<p>Semana actual: <b>' + fechaLarga(k) + '</b> - ' +
       (vaciaHoy ? '<span class="pill off">En blanco</span>'
                 : (w.estado === 'publicado' ? '<span class="pill ok">Publicado</span>' : '<span class="pill warn">Borrador</span>')) + '</p>';
  if(vaciaHoy){
    h += '<div class="alert info">El horario de esta semana esta en blanco. Abrelo y pulsa <b>Llenar la semana</b>.</div>';
  } else if(rev){
    if(rev.conflictos.length) h += '<div class="alert bad"><b>' + rev.conflictos.length + ' conflicto(s)</b>' + esc(rev.conflictos[0].texto) + '</div>';
    rev.faltantes.slice(0,3).forEach(f => h += '<div class="alert warn"><b>Puesto sin cubrir</b>' + esc(f.texto) + ' ' + esc(f.motivo) + '</div>');
    rev.avisos.slice(0,3).forEach(a => h += '<div class="alert info">' + esc(a.texto) + '</div>');
    if(!rev.conflictos.length && !rev.faltantes.length && !rev.avisos.length) h += '<div class="alert ok">Todo en orden.</div>';
  }
  h += '<div class="row" style="margin-top:10px"><button class="btn" onclick="ir(\'horario\')">Abrir horario semanal</button>' +
       '<button class="btn sec" onclick="ir(\'empleados\')">Ver empleados</button></div></div>';
  return h;
}

/* =====================================================================
   EMPLEADOS
   ===================================================================== */
function pantallaEmpleados(){
  const k = SEMANA || lunesDe(hoyISO());
  /* Los turnos que reparte la semana y los puestos principales que hay que
     cubrir. Antes aqui se comparaba con activos * dias de la semana, que era
     del modelo viejo de semanas de 5 y 6 dias: con la lista de prioridad esa
     cuenta ya no significa nada y saltaba un aviso de que 'sobraba' un turno
     con el horario en blanco. */
  const turnosSemana = (() => { let n = 0; activos().forEach(e => n += diasObjetivoDe(e.id, k)); return n; })();
  const principales  = (() => { let n = 0; for(let d = 0; d < 7; d++) n += nucleoDia(d, k); return n; })();
  const sinManos     = manosPrevistas(k);

  let h = '<div class="row"><h1 style="margin:0">Empleados</h1><span class="pill info">' + activosTodos().length + ' activos</span>' +
          '<div class="spacer"></div><button class="btn" onclick="editarEmpleado()">+ Agregar empleado</button></div>';
  h += '<p class="muted">Los agentes de renta rotan; gerencia, car control y los agentes de servicio tienen horario propio. ' +
       'El equipo de cada persona se elige en su ficha.</p>';

  h += '<div class="grid g4" style="margin-bottom:14px">' +
    kpi(activos().length, 'Agentes de renta') +
    kpi(turnosSemana, 'Turnos que reparte la semana') +
    kpi(principales, 'Puestos principales que cubrir') +
    kpi(S.config.objetivoB, 'Visitas a Terminal B por persona') + '</div>';
  if(sinManos)
    h += '<div class="alert warn">No hay manos para <b>' + sinManos + ' puesto(s) principal(es)</b> de esta semana. ' +
         'Puede ser por ausencias o porque quien queda no puede hacerlos. El reparto cubre lo que puede y te marca en el ' +
         'horario cual se queda sin nadie: no le quita el descanso a nadie para taparlo.</div>';
  EQUIPO_IDS.forEach(eqid => {
    const info = infoEquipo(eqid);
    const delEq = S.empleados.filter(x => equipoDe(x) === eqid);
    h += '<div class="grupo-tit"><h2>' + esc(info.nombre) + '</h2>' +
         '<span class="pill off">' + delEq.filter(x => x.activo).length + ' activos</span>' +
         '<span class="sub">' + esc(info.sub) + '</span>' +
         '<div class="spacer"></div>' +
         '<button class="btn sec sm" onclick="editarEmpleado(null,\'' + eqid + '\')">+ Agregar</button></div>';
    if(!delEq.length){ h += '<p class="muted" style="margin-top:-4px">Todavia no hay nadie en este equipo.</p>'; return; }
    h += fichasHTML(delEq, k);
  });
  return h;
}

/* Las tarjetas de un grupo de empleados */
function fichasHTML(lista, k){
  let h = '<div class="fichas">';
  lista.forEach(e => {
    const eqid = equipoDe(e);
    const esRot = eqid === 'rotativo';
    const hist = historialEmpleado(e.id, k, 8);
    const dias = diasTrabajados(e.id, k), vb = visitasB(e.id, k);
    /* Los dias que le tocan son los SUYOS: quien libra dos seguidos esa
       semana trabaja uno menos que el resto, asi que no vale una sola cifra
       para todos como en el modelo viejo de semanas de 5 y 6 dias. */
    const meta = diasObjetivoDe(e.id, k);
    const colD = dias === meta ? 'ok' : (dias > meta ? 'bad' : 'warn');
    const colB = vb === objetivoBDe(e.id) ? 'ok' : (vb > S.config.maxB ? 'bad' : 'warn');

    /* Solo lo que se sale de lo normal. Lo que esta en su valor de siempre
       no se escribe: antes cada ficha repetia "Ninguno" cinco veces. */
    const marcas = [];
    const noDisp = e.diasDisponibles.map((v,i) => v ? null : DIAS_CORTO[i]).filter(Boolean);
    (e.fijos||[]).forEach(f => {
      const t = turno(f.turnoId);
      if(t) marcas.push('<span class="marc" style="border-color:var(--brand-line);background:var(--brand-soft)">' +
        '<i>Siempre</i>' + esc(t.corto) + ' los ' + f.dias.map(x => DIAS_CORTO[x].toLowerCase()).join(' y ') + '</span>');
    });
    if(noDisp.length)                 marcas.push('<span class="marc"><i>No trabaja</i>' + esc(noDisp.join(', ')) + '</span>');
    if(e.libreFijo >= 0)              marcas.push('<span class="marc" style="border-color:var(--brand-line);background:var(--brand-soft)">' +
      '<i>Libre fijo</i>' + DIAS[e.libreFijo] + '</span>');
    if(esRot && e.prefLibre >= 0)     marcas.push('<span class="marc"><i>Prefiere librar</i>' + DIAS[e.prefLibre] + '</span>');
    if((e.turnosProhibidos||[]).length) marcas.push('<span class="marc"><i>Sin turno</i>' +
      esc(e.turnosProhibidos.map(id => (turno(id)||{}).corto).filter(Boolean).join(', ')) + '</span>');
    if(esRot && (e.puestosProhibidos||[]).length) marcas.push('<span class="marc"><i>Sin puesto</i>' +
      esc(e.puestosProhibidos.map(id => (puesto(id)||{}).corto).filter(Boolean).join(', ')) + '</span>');
    if(esRot){
      const enRot = rotacionLibres().orden.indexOf(e.id) >= 0;
      if(!enRot) marcas.push('<span class="marc"><i>Libres</i>1 dia fijo, sin turno de 2</span>');
      else if(turnoDosLibres(k) === e.id) marcas.push('<span class="marc" style="border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)">' +
        '<i style="color:var(--ok)">Esta semana</i>2 dias seguidos</span>');
      else {
        const n = proximaVezDosLibres(e.id, k);
        if(n) marcas.push('<span class="marc"><i>2 dias seguidos</i>en ' + n + (n === 1 ? ' semana' : ' semanas') + '</span>');
      }
    }
    if(esRot && e.maxDiasConsec !== 7) marcas.push('<span class="marc"><i>Max. seguidos</i>' + e.maxDiasConsec + '</span>');
    if(e.telefono)                    marcas.push('<span class="marc"><i>Tel.</i>' + esc(e.telefono) + '</span>');
    if(entrenando(e))                 marcas.unshift('<span class="pill warn">En entrenamiento</span>');
    const ausHoy = ausenciaEn(e.id, hoyISO());
    if(ausHoy) marcas.unshift('<span class="pill bad">' + esc(TIPOS_AUSENCIA[ausHoy.tipo]) +
      ' hasta el ' + fechaCorta(ausHoy.hasta) + '</span>');
    if(!e.activo)                     marcas.unshift('<span class="pill off">Inactivo</span>');

    /* Debajo del nombre solo va lo que distingue a esta persona */
    const sub = [];
    if(e.ficha) sub.push(esc(e.ficha));
    if(e.cargo) sub.push(esc(e.cargo));

    h += '<div class="ficha' + (e.activo ? '' : ' off') + '">' +
      '<div class="top"><div class="ini">' + esc(iniciales(e.nombre)) + '</div>' +
        '<div style="flex:1;min-width:0"><h3>' + esc(e.nombre || 'Sin nombre') + '</h3>' +
        (sub.length ? '<div class="sub">' + sub.join(' &middot; ') + '</div>' : '') +
        '</div></div>' +
      '<div class="cifras">' +
        (esRot

      '<div class="notas">' +
        (marcas.length ? marcas.join('') : '<span class="limpio">Sin restricciones</span>') +
      '</div>' +
      (e.obs ? '<div class="tiny muted" style="padding:8px 14px 0">' + esc(e.obs) + '</div>' : '') +

        ? '<div style="padding:10px 14px 0"><button class="btn ok sm" style="width:100%" ' +
          'onclick="verEntrenamiento(\'' + e.id + '\')">Ya esta listo: quitarle las limitaciones</button></div>'

  });

  return h;
}

/* =====================================================================
   EL BOTON DE "YA ESTA LISTO"
   Antes de tocar nada se ensena punto por punto lo que va a cambiar, y
   despues se rehacen los borradores para que el horario ya salga con las
   reglas nuevas.
   ===================================================================== */
function verEntrenamiento(id){
  const e = empleado(id);
  if(!e) return;
  const listo = !entrenando(e);
  const cambios = cambiosAlTerminarEntrenamiento(id);
  const borradores = Object.keys(S.semanas)
    .filter(k => k >= lunesDe(hoyISO()) && S.semanas[k].estado !== 'publicado' &&
                 Object.keys(S.semanas[k].celdas || {}).length).length;

  let h;
  if(listo){
    h = '<div class="alert ok"><b>' + esc(e.nombre) + ' trabaja en condiciones normales</b>' +
        'No tiene ninguna restriccion de entrenamiento.</div>' +
        (cambios.length
          ? '<p class="muted">Si vuelves a ponerlo en entrenamiento se le devolveran estas restricciones:</p><ul style="margin:0 0 12px;padding-left:20px;line-height:1.9">' +
            cambios.map(x => '<li>' + x.replace('Podra trabajar en','No podra trabajar en')
                                       .replace('Podra hacer el turno','No podra hacer el turno')
                                       .replace('Entrara en el turno de','Saldra del turno de') + '</li>').join('') + '</ul>'
          : '<p class="muted">No hay restricciones guardadas, asi que volver a entrenamiento no cambiaria nada.</p>');
  } else {
    h = '<div class="alert warn"><b>' + esc(e.nombre) + ' esta en entrenamiento</b>' +
        'Por eso el horario le respeta unas limitaciones.</div>';
    h += cambios.length
      ? '<p class="muted">Al darle por listo, de un golpe:</p><ul style="margin:0 0 12px;padding-left:20px;line-height:1.9">' +
        cambios.map(x => '<li>' + x + '</li>').join('') + '</ul>'
      : '<p class="muted">No tiene ninguna limitacion guardada: darle por listo no cambiaria nada.</p>';
    h += '<p class="muted">Todo esto queda guardado, asi que puedes volver a ponerlo en entrenamiento cuando quieras.</p>';
  }
  if(borradores)
    h += '<div class="alert info">Hay <b>' + borradores + ' semana(s)</b> en borrador de hoy en adelante. ' +
         'Se van a rehacer para que salgan ya con las reglas nuevas. Las publicadas y las pasadas no se tocan.</div>';

  modal(esc(e.nombre) + ' &middot; entrenamiento', h,
    '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
    (listo
      ? '<button class="btn warn" id="okent">Volver a ponerlo en entrenamiento</button>'
      : '<button class="btn ok" id="okent">Si, ya esta listo</button>'));
  const b = el('okent');
  if(b) b.onclick = () => aplicarEntrenamiento(id, listo);
}
function aplicarEntrenamiento(id, activar){
  const e = empleado(id);
  ponerEntrenamiento(id, activar);
  const n = rehacerBorradoresProximos();
  bitacora(activar
    ? e.nombre + ' vuelve a entrenamiento: se le devolvieron sus limitaciones.'
    : e.nombre + ' termino el entrenamiento: trabaja en condiciones normales.');
  guardar(); cerrar(); render();
  toast((activar ? e.nombre + ' vuelve a entrenamiento' : e.nombre + ' ya trabaja normal') +
        (n ? ' &middot; ' + n + ' semana(s) rehecha(s)' : ''));
}

function alternarActivo(id){
  const e = empleado(id); e.activo = !e.activo;
  bitacora((e.activo ? 'Se activo a ' : 'Se desactivo a ') + e.nombre + '.');
  guardar(); render(); toast(e.activo ? 'Empleado activado' : 'Empleado desactivado');
}
function borrarEmpleado(id){
  const e = empleado(id);
  confirmar('Se eliminara a <b>' + esc(e.nombre) + '</b> y sus asignaciones. Si solo quieres sacarlo de la rotacion, usa "Desactivar".', () => {
    S.empleados = S.empleados.filter(x => x.id !== id);
    for(const k in S.semanas) for(let d = 0; d < 7; d++) delete S.semanas[k].celdas[ck(id,d)];
    bitacora('Se elimino al empleado ' + e.nombre + '.');
    guardar(); render(); toast('Empleado eliminado');
  });
}

/* Al marcar "2 dias seguidos todas las semanas" ya no tiene sentido el
   turno rotativo: se desmarca y se bloquea para que no se contradigan. */
function editarEmpleadoDosLibres(){
  const dos = el('emp_dos2'), rot = el('emp_rot2');
  if(!dos || !rot) return;
  if(dos.checked){ rot.checked = false; rot.disabled = true; }
  else rot.disabled = false;
}

/* Al cambiar de equipo la ficha entera cambia: se vuelve a dibujar con los
   campos de ese equipo, conservando lo que ya habias escrito. */
function editarEmpleadoCambiaEquipo(){
  if(!window._empEdit) return;
  const e = leerFichaEmpleado(window._empEdit);
  const existe = S.empleados.some(x => x.id === e.id);
  /* los turnos y puestos prohibidos eran del equipo anterior: no valen aqui */
  e.turnosProhibidos = []; e.turnosPreferidos = []; e.fijos = [];
  editarEmpleado(existe ? e.id : null, e.equipo, e);
}
/* Lee del formulario todo lo que exista en pantalla en ese momento */
function leerFichaEmpleado(e){
  const val = (id) => { const x = el(id); return x ? x.value : null; };
  const chk = (id) => { const x = el(id); return x ? x.checked : null; };
  const eqid = val('emp_equipo') || equipoDe(e);
  if(val('emp_nombre') !== null) e.nombre = val('emp_nombre').trim() || 'Sin nombre';
  if(val('emp_ficha')  !== null) e.ficha = val('emp_ficha').trim();
  if(val('emp_cargo')  !== null) e.cargo = val('emp_cargo').trim();
  if(val('emp_tel')    !== null) e.telefono = val('emp_tel').trim();
  if(val('emp_ingreso')!== null) e.ingreso = val('emp_ingreso');
  if(val('emp_obs')    !== null) e.obs = val('emp_obs');
  if(val('emp_activo') !== null) e.activo = val('emp_activo') === '1';
  e.equipo = EQUIPO_IDS.includes(eqid) ? eqid : 'rotativo';
  e.maxDiasConsec = Number(val('emp_maxc')) || e.maxDiasConsec || 7;
  /* dos dias seguidos todas las semanas */
  if(el('emp_dos2')) e.dosLibresFijos = el('emp_dos2').checked;
  /* entrar o salir del turno de dos dias libres seguidos */
  if(el('emp_rot2')){
    const rl = S.config.rotacionLibres;
    const dentro = el('emp_rot2').checked && !e.dosLibresFijos;
    const i = rl.orden.indexOf(e.id);
    if(dentro && i < 0) rl.orden.push(e.id);
    if(!dentro && i >= 0){
      rl.orden.splice(i, 1);
      /* al quitar a alguien de la lista, el turno se corre: se ajusta el
         punto de partida para que a quien le tocaba le siga tocando */
      if(rl.orden.length && i < rl.inicio) rl.inicio = (rl.inicio - 1 + rl.orden.length) % rl.orden.length;
    }
  }
  if(val('emp_pref') !== null) e.prefLibre = Number(val('emp_pref'));
  if(val('emp_fijo') !== null) e.libreFijo = Number(val('emp_fijo'));
  if(!(e.libreFijo >= 0 && e.libreFijo <= 6)) e.libreFijo = -1;
  if(el('emp_d0')) e.diasDisponibles = DIAS.map((_,i) => !!chk('emp_d'+i));
  /* turno clavado */
  const tf = val('emp_fijo_turno');
  if(tf !== null){
    const dias = DIAS.map((_,i) => chk('emp_fd'+i) ? i : -1).filter(i => i >= 0);
    e.fijos = (tf && dias.length) ? [{ dias, turnoId: tf, puestoId: val('emp_fijo_puesto') || null }] : [];
  }
  const ts = turnosDe(e.equipo);
  if(ts.length && el('emp_np_' + ts[0].id)){
    e.turnosProhibidos = ts.filter(t => chk('emp_np_'+t.id)).map(t => t.id);
    if(el('emp_pf_' + ts[0].id)) e.turnosPreferidos = ts.filter(t => chk('emp_pf_'+t.id)).map(t => t.id);
  }
  const ps = puestosActivos();
  if(ps.length && el('emp_pp_' + ps[0].id))
    e.puestosProhibidos = ps.filter(p => chk('emp_pp_'+p.id)).map(p => p.id);
  return e;
}
function guardarEmpleado(){
  const e = leerFichaEmpleado(window._empEdit);
  const i = S.empleados.findIndex(x => x.id === e.id);
  /* la casilla del entrenamiento se aplica al guardar, con sus dos efectos:
     levantar (o devolver) las limitaciones y entrar (o salir) del turno de
     dos dias libres */
  const quiereEnt = el('emp_entrena') ? el('emp_entrena').checked : entrenando(e);
  const cambiaEnt = i >= 0 && quiereEnt !== entrenando(S.empleados[i]);
  if(i >= 0){ S.empleados[i] = e; bitacora('Se edito la ficha de ' + e.nombre + '.'); }
  else { S.empleados.push(e); bitacora('Se agrego al empleado ' + e.nombre + '.'); }
  if(cambiaEnt){
    /* lo que el usuario acaba de marcar a mano en la ficha manda sobre lo
       que hubiera guardado el entrenamiento */
    ponerEntrenamiento(e.id, quiereEnt);
    const n = rehacerBorradoresProximos();
    bitacora(quiereEnt
      ? e.nombre + ' vuelve a entrenamiento: se le devolvieron sus limitaciones.'
      : e.nombre + ' termino el entrenamiento: trabaja en condiciones normales.');
    guardar(); cerrar(); render();
    toast((quiereEnt ? e.nombre + ' vuelve a entrenamiento' : e.nombre + ' ya trabaja normal') +
          (n ? ' &middot; ' + n + ' semana(s) rehecha(s)' : ''));
    return;
  }
  guardar(); cerrar(); render(); toast('Ficha guardada');
}

function historialDe(id){
  const e = empleado(id);
  const ks = Object.keys(S.semanas).sort().reverse().slice(0,10);
  let h = '<p class="muted">Ultimas semanas registradas de ' + esc(e.nombre) + '.</p>';
  if(!ks.length) h += '<p class="muted">Todavia no hay semanas registradas.</p>';
  else {
    h += '<table class="data"><thead><tr><th>Semana</th>' + DIAS_CORTO.map(d => '<th>' + d + '</th>').join('') + '<th>Dias</th><th>En B</th></tr></thead><tbody>';
    ks.forEach(k => {
      let dd = 0, vb = 0; const tds = [];
      for(let d = 0; d < 7; d++){
        const c = S.semanas[k].celdas[ck(id,d)];
        if(!c) tds.push('<td class="muted">-</td>');
        else if(c.t === LIBRE) tds.push('<td class="muted">Libre</td>');
        else { const t = turno(c.t), p = puesto(c.p); dd++; if(esTerminalB(c.p)) vb++;
          tds.push('<td>' + esc(t ? t.corto : '?') + (p ? '<span class="mini2">' + esc(p.corto) + '</span>' : '') + '</td>'); }
      }
      h += '<tr><td>' + fechaCorta(k) + '</td>' + tds.join('') + '<td><b>' + dd + '</b></td><td>' + vb + '</td></tr>';
    });

  }
  const hist = historialEmpleado(id, lunesDe(hoyISO()), 12);
  h += '<h3 style="margin-top:14px">Acumulado</h3><div class="grid g4">' +
       kpi(hist.dias,'Dias trabajados') + kpi(hist.visitasB,'Veces en Terminal B') +
       kpi(hist.tardes,'Turnos tardios') + kpi(hist.findes,'Dias de fin de semana') + '</div>';
  h += '<h3 style="margin-top:12px">Reparto por terminal y marca</h3><div class="row">' +
       S.puestos.map(p => uniHTML(p, p.corto + ': ' + (hist.porPuesto[p.id] || 0))).join(' ') + '</div>';
  h += '<h3 style="margin-top:12px">Reparto por turno</h3><div class="row">' +
       S.turnos.filter(t => t.activo).map(t => '<span class="pill info" style="margin:0 6px 6px 0">' + esc(t.corto) + ': ' + (hist.porTurno[t.id] || 0) + '</span>').join('') + '</div>';
  modal('Historial de ' + esc(e.nombre), h, '<button class="btn sec" onclick="cerrar()">Cerrar</button>', true);
}

/* =====================================================================
   EL TURNO DE LOS DOS DIAS LIBRES
   Se ve la vuelta entera: quien va antes, quien va despues y en que
   semana le toca a cada uno. El orden se cambia con las flechas.
   ===================================================================== */
/* =====================================================================
   REHACER LOS BORRADORES DEL MOSTRADOR
   Cambiar el reparto de descansos no sirve de nada si las semanas que ya
   estaban armadas se quedan como estaban: la casilla parece no hacer nada.
   Se rehacen las de esta semana en adelante.

   Lo publicado NO se toca, y lo puesto a mano tampoco: 'otraAlternativa'
   arranca de 'baseManual', que conserva las casillas manuales y las
   bloqueadas.

   Va de una en una con setTimeout porque cada semana tarda un par de
   segundos; de golpe dejaria la pantalla congelada sin explicar por que.
   ===================================================================== */
/* Que semanas hay que rehacer: borradores con algo dentro, de esta semana
   en adelante. Va aparte para poder comprobarla sin armar ningun horario. */
function borradoresDeRenta(){
  const desde = lunesDe(hoyISO());
  return Object.keys(S.semanas)
    .filter(k => k >= desde && S.semanas[k].estado !== 'publicado' &&
                 Object.keys(S.semanas[k].celdas || {}).length)
    .sort();
}
function rehacerRentaProximos(){
  const ks = borradoresDeRenta();
  if(!ks.length) return 0;
  toast('Rehaciendo ' + ks.length + (ks.length > 1 ? ' semanas...' : ' semana...'));
  let i = 0;
  (function paso(){
    if(i >= ks.length){
      guardar(); render();
      toast(ks.length > 1 ? (ks.length + ' semanas rehechas con el reparto nuevo')
                          : 'Semana rehecha con el reparto nuevo');
      return;
    }
    try { otraAlternativa(ks[i]); } catch(e){}
    i++; setTimeout(paso, 0);
  })();
  return ks.length;
}
/* Le da la vuelta a que grupo empieza con los dos dias */
function cambiarSemanaDosUno(){
  S.config.modoDosUnoDesfase = S.config.modoDosUnoDesfase ? 0 : 1;
  priTocar('Cambio el arranque del reparto de dos-y-uno: esta semana pasan a los dos dias los del otro grupo.');
  if(!rehacerRentaProximos()) toast('Los grupos cambiaron de papel');
}
/* Vuelve a sortear quien va en cada grupo.
   Insiste hasta que salga un reparto distinto del que habia: si diera el
   mismo pareceria que el boton no hace nada. Con muy poca gente puede que
   no haya otro reparto posible, y por eso el tope de intentos. */
function sortearGruposDosUno(){
  const antes = gruposDosUno().a.join(',');
  const guarda = S.config.modoDosUnoSemilla;
  for(let i = 0; i < 60; i++){
    S.config.modoDosUnoSemilla = 1 + Math.floor(Math.random() * 900000);
    if(gruposDosUno().a.join(',') !== antes) break;
  }
  if(S.config.modoDosUnoSemilla === guarda){ toast('No hay otro reparto posible'); return; }
  const g = gruposDosUno();
  priTocar('Se sortearon otra vez los dos grupos de dias libres. Grupo 1: ' +
           nombresGrupo(g.a).join(', ') + '. Grupo 2: ' + nombresGrupo(g.b).join(', ') + '.');
  if(!rehacerRentaProximos()) toast('Grupos sorteados otra vez');
}
/* Enciende o apaga el reparto de dos-y-uno */
function ponerModoDosUno(v){
  S.config.modoDosUno = !!v;
  bitacora(v ? 'Se encendio el reparto de dos-y-uno en agentes de renta: la plantilla se parte en dos grupos y, mientras uno libra dos dias seguidos, el otro libra uno.'
             : 'Se apago el reparto de dos-y-uno: vuelve el turno de dos dias seguidos por rotacion.');
  priTocar('');
  if(!rehacerRentaProximos()) toast(v ? 'Reparto de dos-y-uno encendido' : 'Vuelve el reparto de siempre');
}

function ajustesRotacion(){
  const k = SEMANA || lunesDe(hoyISO());

  const fuera = activos().filter(e => orden.indexOf(e.id) < 0);

       ' onchange="ponerModoDosUno(this.checked)"> <b>Dos grupos: mientras uno libra 2 dias, el otro libra 1</b></label>' +

       'cada persona alterna dos, uno, dos, uno, y <b>nunca libran dos dias todos a la vez</b>. Sin marcar, se ' +
       'reparte como siempre: dos dias seguidos para una sola persona por semana, por turno riguroso.</p>';

  if(dosUno){
    const g = gruposDosUno();
    const cuenta = activos().length;
    const primero = leTocanDosLibres(g.a[0], k);        // ¿al grupo 1 le tocan los dos esta semana?
    const chapa = (ids, dosAhora) =>
      '<div style="margin:0 0 6px"><span class="pill' + (dosAhora ? ' ok' : '') + '">' +
      (dosAhora ? '2 dias' : '1 dia') + '</span> ' + esc(nombresGrupo(ids).join(', ')) + '</div>';

    h += '<div class="alert ok" style="margin-bottom:10px"><b>Reparto de dos-y-uno encendido</b>' +
      'Esta semana (' + fechaCorta(k) + ') libran <b>2 dias seguidos</b> ' +
      esc(nombresGrupo(primero ? g.a : g.b).join(', ')) + ', y <b>1 dia</b> ' +
      esc(nombresGrupo(primero ? g.b : g.a).join(', ')) + '. La semana que viene, al reves.</div>';

    h += '<p class="tiny muted" style="margin:0 0 4px"><b>Grupo 1</b> (' + g.a.length + ') y ' +
         '<b>grupo 2</b> (' + g.b.length + '), esta semana:</p>' +
         chapa(g.a, primero) + chapa(g.b, !primero);

    h += '<table class="data"><thead><tr><th>Semana</th><th>Libran 2 dias seguidos</th><th>Libran 1 dia</th><th>Trabajan al dia</th></tr></thead><tbody>';
    for(let i = 0; i < 6; i++){
      const kk = addDias(k, 7*i);
      const p = leTocanDosLibres(g.a[0], kk);
      const dosN = (p ? g.a : g.b).length, unoN = (p ? g.b : g.a).length;
      h += '<tr' + (i === 0 ? ' style="background:var(--ok-bg)"' : '') + '>' +
        '<td><b>' + fechaCorta(kk) + '</b> al ' + fechaCorta(addDias(kk,6)) + (i === 0 ? ' <span class="pill ok">esta</span>' : '') + '</td>' +
        '<td>' + esc(nombresGrupo(p ? g.a : g.b).join(', ')) + '</td>' +
        '<td class="tiny muted">' + esc(nombresGrupo(p ? g.b : g.a).join(', ')) + '</td>' +
        '<td class="tiny muted">' + Math.max(0, cuenta - Math.round((dosN*2 + unoN)/7)) + ' de ' + cuenta + '</td></tr>';
    }

        esc((empleado(id)||{}).nombre || '?') + '</option>').join('') +

    '<span class="tiny muted" style="max-width:420px">Cambiarlo aqui corre la rotacion entera desde esta semana. ' +

  /* el cuadre de la semana, para que se vea que la cuenta cierra */
  let turnosSem = 0; activos().forEach(e => { turnosSem += diasObjetivoDe(e.id, k); });
  let puestosSem = 0;
  for(let d = 0; d < 7; d++) for(const cmb of combinaciones()) puestosSem += cobNec(cmb.puestoId, cmb.turnoId, d, k);
  h += '<div class="alert ' + (turnosSem === puestosSem ? 'ok' : 'bad') + '" style="margin:10px 0 0">' +
    (turnosSem === puestosSem
      ? 'La cuenta cierra: <b>' + turnosSem + ' turnos</b> disponibles y <b>' + puestosSem + ' puestos</b> que cubrir.'
      : 'Descuadre: hay <b>' + turnosSem + ' turnos</b> disponibles y <b>' + puestosSem + ' puestos</b> que cubrir. ' +
        'Revisa la tabla de cobertura mas abajo.') + '</div>';

  return h + '</div>';

function moverRotacion(i, dir){
  const rl = S.config.rotacionLibres;
  const j = i + dir;
  if(j < 0 || j >= rl.orden.length) return;
  const t = rl.orden[i]; rl.orden[i] = rl.orden[j]; rl.orden[j] = t;
  /* el punto de partida sigue apuntando a quien le tocaba esta semana */
  if(rl.inicio === i) rl.inicio = j; else if(rl.inicio === j) rl.inicio = i;
  bitacora('Se cambio el orden del turno de dias libres.');
  guardar(); render(); toast('Orden actualizado');
}
/* Corre la rotacion entera para que esta semana le toque a quien elijas */
function fijarTurnoSemana(empId){
  const rl = S.config.rotacionLibres;
  const i = rl.orden.indexOf(empId);
  if(i < 0) return;
  const k = SEMANA || lunesDe(hoyISO());
  const n = rl.orden.length;
  rl.inicio = ((i - semanasAbsolutas(k)) % n + n) % n;
  olvidarRefuerzos();
  bitacora('Desde la semana del ' + fechaLarga(k) + ' el turno de 2 dias libres empieza por ' + empleado(empId).nombre + '.');
  guardar(); render(); toast('Rotacion ajustada');
}

      '<h3 style="margin:0 0 2px">' + esc(e.nombre) + '</h3>' +
      '<p class="tiny muted" style="margin:0 0 10px">' + (esc(e.cargo) || 'Sin cargo') + '</p>' +
      '<div class="grid g2"><div>' +
        '<label class="f"><span>Turno de lunes a viernes</span>' + opcTurno('sup' + i + '_ts', p.turnoSemana) + '</label>' +
        '<label class="f"><span>Turno del sabado</span>' + opcTurno('sup' + i + '_tb', p.turnoSabado) + '</label>' +
        '<label class="f"><span>Los dias feriados</span><select id="sup' + i + '_fer">' +
          '<option value="alterna"' + (p.feriados === 'alterna' ? ' selected' : '') + '>Trabaja uno si y otro no</option>' +
          '<option value="libre"'   + (p.feriados === 'libre'   ? ' selected' : '') + '>Siempre libres</option>' +
          '<option value="siempre"' + (p.feriados === 'siempre' ? ' selected' : '') + '>Trabaja todos</option>' +
        '</select></label>' +
      '</div><div>' +
        '<p class="tiny" style="font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 4px">Que hace cada dia</p>' +
        DIAS.map((d, j) => '<label class="f" style="display:flex;align-items:center;gap:10px;margin-bottom:5px">' +
          '<span style="width:80px;margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">' + d + '</span>' +
          '<select id="sup' + i + '_d' + j + '" style="flex:1">' +
            '<option value="1"' + (p.dias[j] === 1 ? ' selected' : '') + '>Turno de lunes a viernes</option>' +
            '<option value="2"' + (p.dias[j] === 2 ? ' selected' : '') + '>Turno del sabado</option>' +
            '<option value="0"' + (p.dias[j] === 0 ? ' selected' : '') + '>Libre</option>' +
          '</select></label>').join('') +

    /* los proximos feriados, para que se vea a quien le tocan */
    if(proximos.length){

      h += '<p class="tiny muted" style="margin:8px 0 0"><b>Proximos feriados:</b> ' +
        (p.feriados === 'libre' ? 'los tiene libres todos.'
         : suyos.length ? suyos.map(f => fechaCorta(f.fecha) + ' (' + esc(f.nombre) + ')').join(', ') + '.'

      if(p.feriados === 'alterna')
        h += '<button type="button" class="btn sec sm" style="margin-top:6px" onclick="cambiarFeriadosDe(\'' + e.id + '\')">' +
             'Darle los otros feriados</button>';

  h += '<label class="f" style="max-width:320px"><span>Terminal y marca (opcional)</span><select id="sup_puesto">' +
    '<option value="">Sin marca</option>' +
    puestosActivos().map(q => '<option value="' + q.id + '"' + (sup.puestoId === q.id ? ' selected' : '') + '>' + esc(q.corto) + '</option>').join('') +
    '</select></label>';

/* Le da la vuelta a cuales le tocan: los que trabajaba pasa a librarlos */
function cambiarFeriadosDe(empId){
  const sup = S.config.supervision;
  if(!sup.personas) sup.personas = {};
  const p = sup.personas[empId] || (sup.personas[empId] = horarioSupervisorDe(empId));
  p.desfase = p.desfase ? 0 : 1;
  bitacora('Cambiaron los feriados que le tocan a ' + (empleado(empId) || {}).nombre + '.');
  guardar();
  if(PANTALLA === 'ajustes') render();
  toast('Feriados cambiados');
}
function guardarSupervision(){
  const sup = S.config.supervision;
  const eq = plantilla('supervision');
  if(!sup.personas) sup.personas = {};
  eq.forEach((e, i) => {
    const p = sup.personas[e.id] || (sup.personas[e.id] = horarioSupervisorDe(e.id));
    if(el('sup' + i + '_ts'))  p.turnoSemana = el('sup' + i + '_ts').value;
    if(el('sup' + i + '_tb'))  p.turnoSabado = el('sup' + i + '_tb').value;
    if(el('sup' + i + '_fer')) p.feriados    = el('sup' + i + '_fer').value;
    p.dias = DIAS.map((_, j) => el('sup' + i + '_d' + j) ? Number(el('sup' + i + '_d' + j).value) : p.dias[j]);
  });
  if(el('sup_puesto')) sup.puestoId = el('sup_puesto').value || null;
  bitacora('Se cambio el horario de gerencia y car control.');
  guardar(); render(); toast('Horario guardado');
}

/* =====================================================================
   EL TURNO CLAVADO DE LOS AGENTES DE SERVICIO
   "Los lunes y los sabados esta persona y no otra hace el 11-7 de la
   Terminal A". Vive en la ficha, en Turno clavado en dias concretos, pero
   cambiar de persona a mano eran dos ediciones y era facil dejarlo puesto
   en dos sitios a la vez o en ninguno. Con esto es un boton.
   ===================================================================== */
/* Quien lo tiene ahora mismo, si alguien */
function clavadoServicio(){
  const e = plantilla('servicio').find(x => (x.fijos || []).some(f => turno(f.turnoId)));
  if(!e) return null;
  return { emp:e, fijo: e.fijos.find(f => turno(f.turnoId)) };
}
/* El que se pondria si todavia no lo tiene nadie: el 11-7 de lunes y sabado */
function clavadoServicioPorDefecto(){
  const t = S.turnos.find(x => x.corto === '11-7' && x.activo &&
                               (x.equipos || []).indexOf('servicio') >= 0);
  return t ? { turnoId:t.id, puestoId:null, dias:[0,5] } : null;
}
function textoClavado(f){
  const t = turno(f.turnoId);
  return (t ? t.corto : '?') + ' de los ' +
         (f.dias || []).map(x => DIAS_CORTO[x].toLowerCase()).join(' y ');
}
/* Se lo pasa a esta persona y se lo quita a quien lo tuviera. Uno solo lo
   tiene: dos fichas con el mismo turno clavado el mismo dia abrian el turno
   dos veces y dejaban otro sin nadie. */
function pasarClavadoServicio(empId){
  const nuevo = empleado(empId);
  if(!nuevo || equipoDe(nuevo) !== 'servicio') return;
  const act = clavadoServicio();
  const f = act ? act.fijo : clavadoServicioPorDefecto();
  if(!f) return;
  plantilla('servicio').forEach(e => { e.fijos = []; });
  nuevo.fijos = [{ turnoId:f.turnoId, puestoId:f.puestoId || null, dias:(f.dias || []).slice() }];
  bitacora('El turno ' + textoClavado(f) + ' pasa a ' + nuevo.nombre + '.');
}
function quitarClavadoServicio(){
  const act = clavadoServicio();
  if(!act) return;
  const txt = textoClavado(act.fijo);
  plantilla('servicio').forEach(e => { e.fijos = []; });
  bitacora('Se quito el turno clavado ' + txt + ': vuelve al giro como los demas.');
}
/* Rehace los borradores del horario de servicio de hoy en adelante. Las
   semanas publicadas y las pasadas no se tocan. */
function rehacerServicioProximos(){
  const desde = lunesDe(hoyISO());
  const ks = Object.keys(S.semanas)
    .filter(k => k >= desde && S.semanas[k].estado !== 'publicado' &&
                 Object.keys(S.semanas[k].celdas || {}).length)
    .sort();
  ks.forEach(k => { try { generarServicio(k, { rehacer:true }); } catch(e){} });
  return ks.length;
}
/* El boton que sale en la ficha de cada agente de servicio */
function botonClavadoServicio(e){
  if(equipoDe(e) !== 'servicio' || !e.activo) return '';
  const act = clavadoServicio();
  const f = act ? act.fijo : clavadoServicioPorDefecto();
  if(!f) return '';
  const tiene = !!(act && act.emp.id === e.id);
  return '<div style="padding:10px 14px 0"><button class="btn ' + (tiene ? 'sec ' : '') + 'sm" style="width:100%" ' +
    'onclick="verClavadoServicio(\'' + e.id + '\')">' +
    (tiene ? 'Quitarle el ' : 'Pasarle el ') + esc(textoClavado(f)) + '</button></div>';
}
function verClavadoServicio(empId){
  const e = empleado(empId);
  if(!e) return;
  const act = clavadoServicio();
  const f = act ? act.fijo : clavadoServicioPorDefecto();
  if(!f){ toast('No hay ningun turno de servicio que clavar'); return; }
  const tiene = !!(act && act.emp.id === empId);
  const txt = textoClavado(f);
  const borradores = Object.keys(S.semanas)
    .filter(k => k >= lunesDe(hoyISO()) && S.semanas[k].estado !== 'publicado' &&
                 Object.keys(S.semanas[k].celdas || {}).length).length;
  let h;
  if(tiene){
    h = '<div class="alert info"><b>' + esc(e.nombre) + ' hace el ' + esc(txt) + '</b>' +
        'Al armar el horario se le pone ese turno esos dias, antes de repartir nada mas.</div>' +
        '<p class="muted">Si se lo quitas, ese turno vuelve al giro y lo hara quien toque cada semana.</p>';
  } else {
    h = '<div class="alert warn"><b>Pasarle el ' + esc(txt) + ' a ' + esc(e.nombre) + '</b>' +
        (act ? 'Ahora lo hace ' + esc(act.emp.nombre) + ', asi que se lo quitas a el y se lo das a ' + esc(e.nombre) + '.'
             : 'Ahora mismo no lo tiene clavado nadie, asi que ese turno lo hace quien toque por el giro.') + '</div>' +
        '<p class="muted">Lo tiene una sola persona a la vez. El resto de turnos del dia siguen girando entre todos.</p>';
  }
  if(borradores)
    h += '<div class="alert info">Hay <b>' + borradores + ' semana(s)</b> en borrador de hoy en adelante. ' +
         'El horario de servicio se rehace para que salga ya con el cambio. Las publicadas y las pasadas no se tocan.</div>';
  modal(esc(e.nombre) + ' &middot; turno clavado', h,
    '<button class="btn sec" onclick="cerrar()">Cancelar</button>' +
    (tiene ? '<button class="btn warn" id="okclav">Quitarselo</button>'
           : '<button class="btn ok" id="okclav">Si, pasarselo</button>'));
  const b = el('okclav');
  if(b) b.onclick = () => aplicarClavadoServicio(empId, !tiene);
}
function aplicarClavadoServicio(empId, dar){
  const e = empleado(empId);
  if(dar) pasarClavadoServicio(empId); else quitarClavadoServicio();
  const nn = rehacerServicioProximos();
  guardar(); cerrar(); render();
  toast((dar ? e.nombre + ' hace ahora el ' + textoClavado(clavadoServicio().fijo)
             : 'Turno clavado quitado') +
        (nn ? ' \u00b7 ' + nn + ' semana(s) rehecha(s)' : ''));
}

function ajustesServicio(){
  const ser = S.config.servicio;
  const eq = plantilla('servicio');
  const l = Array.isArray(ser.prioridad) ? ser.prioridad : [];
  const k = SEMANA || lunesDe(hoyISO());

  let h = '<div class="card"><h2>Agentes de servicio: que se cubre primero</h2>' +
    '<p class="muted" style="margin-top:-4px">Cada dia se abren tantos turnos como agentes haya trabajando, y se llenan por este orden. ' +
    'Los <b>principales</b> son los que no pueden faltar: la manana y la noche de la Terminal A. ' +
    'Lo que va debajo es refuerzo, y se abre solo cuando hay una tercera persona.</p>';

  h += '<div style="overflow-x:auto"><table class="data" style="min-width:620px"><thead><tr><th style="width:34px">#</th><th>Turno</th>' +
       '<th>Dias en que entra</th><th style="width:92px">Principal</th><th style="width:118px">Orden</th><th></th></tr></thead><tbody>';
  if(!l.length) h += '<tr><td colspan="6" class="muted">La lista esta vacia: no se abriria ningun turno. Anade al menos los dos principales.</td></tr>';
  l.forEach((x, i) => {
    const tu = turno(x.turnoId);
    const dias = Array.isArray(x.dias) ? x.dias : [1,1,1,1,1,1,1];
    h += '<tr' + (tu && tu.activo ? '' : ' style="opacity:.55"') + '>' +
      '<td><b>' + (i + 1) + '</b></td>' +
      '<td>' + (tu ? '<b>' + esc(tu.corto) + '</b><span class="mini2">' + hora12(tu.inicio) + ' a ' + hora12(tu.fin) + '</span>'
                   : '<span class="muted">(turno borrado)</span>') +
        (tu && !tu.activo ? ' <span class="pill off">guardado</span>' : '') + '</td>' +
      '<td style="white-space:nowrap">' + DIAS.map((d, j) =>
        '<button class="btn ' + (dias[j] ? '' : 'sec ') + 'sm" style="padding:2px 6px;margin:1px;min-width:32px" ' +
        'title="' + d + '" onclick="serDia(' + i + ',' + j + ')">' + d.slice(0,2) + '</button>').join('') + '</td>' +
      '<td><label class="check"><input type="checkbox"' + (x.clave ? ' checked' : '') +
        ' onchange="serClave(' + i + ', this.checked)"> <span>' + (x.clave ? 'Si' : 'No') + '</span></label></td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn sec sm"' + (i === 0 ? ' disabled' : '') + ' onclick="serMover(' + i + ',-1)">Subir</button> ' +
        '<button class="btn sec sm"' + (i === l.length - 1 ? ' disabled' : '') + ' onclick="serMover(' + i + ',1)">Bajar</button></td>' +
      '<td style="text-align:right"><button class="btn sec sm" onclick="serQuitar(' + i + ')">Quitar</button></td></tr>';
  });
  h += '</tbody></table></div>';

  /* Anadir uno nuevo. Aqui salen tambien los turnos sueltos para casos
     especiales: el 10-6, el 11-7 y el 12-8. */
  const tus = turnosDe('servicio').filter(t => t.activo);
  h += '<div class="fila" style="margin-top:12px;gap:8px;flex-wrap:wrap;align-items:flex-end">' +
    '<label style="flex:1;min-width:220px"><span class="tiny muted">Turno</span>' +
    '<select id="ser_turno">' + tus.map(t => '<option value="' + t.id + '">' + esc(t.corto) +
      ' &middot; ' + hora12(t.inicio) + ' a ' + hora12(t.fin) + '</option>').join('') + '</select></label>' +
    '<button class="btn" onclick="serAnadir()">Anadir a la lista</button></div>';

  /* Los dias libres: uno por cabeza y punto. Aqui no hay rotacion de dos
     dias seguidos como en agentes de renta. */
  h += '<h3 style="margin-top:16px">Los dias libres</h3>' +
    '<p class="tiny muted" style="margin-top:-6px">Cada agente libra <b>un dia por semana</b>. ' +
    'El dia lo elige el reparto: nunca cae en un dia del turno clavado, ni deja un turno principal sin nadie. ' +
    'La vispera se entra en el primer turno del dia y el dia de vuelta en el ultimo.</p>';

  /* Quien hace el turno clavado */
  const act = clavadoServicio();
  h += '<h3 style="margin-top:16px">Quien hace el turno clavado</h3>' +
    '<p class="tiny muted" style="margin-top:-6px">El turno que hace siempre la misma persona ciertos dias. ' +
    'Lo tiene uno solo a la vez, y tambien se cambia con el boton de su ficha, en <b>Empleados</b>.</p>' +
    '<div class="fila" style="gap:8px;flex-wrap:wrap;align-items:center">' +
    (act ? '<span class="marc" style="border-color:var(--brand-line);background:var(--brand-soft)"><i>' +
             esc(act.emp.nombre) + '</i>' + esc(textoClavado(act.fijo)) + '</span>'
         : '<span class="muted" style="margin-right:6px">Ahora mismo no lo tiene nadie: ese turno lo hace quien toque por el giro.</span>') +
    eq.filter(e => !act || e.id !== act.emp.id).map(e =>
      '<button class="btn sec sm" onclick="verClavadoServicio(\'' + e.id + '\')">Pasarselo a ' + esc(e.nombre) + '</button>').join(' ') +
    '</div>';

  h += '<label class="f" style="max-width:320px;margin-top:12px"><span>Terminal y marca por defecto</span><select id="ser_puesto" onchange="guardarServicioPuesto()">' +
    '<option value="">Sin marca</option>' +
    puestosActivos().map(p => '<option value="' + p.id + '"' + (ser.puestoId === p.id ? ' selected' : '') + '>' + esc(p.corto) + '</option>').join('') +
    '</select></label>';

  /* El resumen, que es lo que se mira de verdad */
  const nuc = l.filter(x => x.clave).length;
  const abren = []; for(let d = 0; d < 7; d++) abren.push(turnosServicioDia(d, k).length);
  const falta = faltanManosServicio(k);
  h += '<div class="alert ' + (falta ? 'warn' : 'info') + '" style="margin-top:14px">' +
    '<b>' + nuc + ' principal(es)</b> y ' + (l.length - nuc) + ' de refuerzo, con ' + eq.length + ' agente(s). ' +
    'Esta semana se abren ' + abren.join(', ') + ' turnos, de lunes a domingo, y cada agente libra un dia.' +
    (falta ? ' <b>Ojo:</b> faltan manos para ' + falta + ' turno(s) principal(es) esta semana.' : '') + '</div>';
  return h + '</div>';
}
function serTocar(txt){
  if(txt) bitacora(txt);
  guardar();
  if(PANTALLA === 'ajustes') render();
}
function nombreSer(x){ const t = turno(x.turnoId); return t ? t.corto : '?'; }
function serMover(i, paso){
  const l = S.config.servicio.prioridad, j = i + paso;
  if(!l || !l[i] || j < 0 || j >= l.length) return;
  const t = l[j]; l[j] = l[i]; l[i] = t;
  serTocar('Se cambio el orden de los turnos de los agentes de servicio.');
}
function serClave(i, v){
  const l = S.config.servicio.prioridad || [], x = l[i];
  if(!x) return;
  if(!v && l.filter(y => y.clave).length <= 1){
    toast('Tiene que quedar al menos un turno principal'); render(); return;
  }
  x.clave = !!v;
  serTocar('El turno ' + nombreSer(x) + (v ? ' pasa a ser principal en agentes de servicio.' : ' deja de ser principal en agentes de servicio.'));
}
function serDia(i, d){
  const x = (S.config.servicio.prioridad || [])[i];
  if(!x) return;
  if(!Array.isArray(x.dias)) x.dias = [1,1,1,1,1,1,1];
  const antes = x.dias[d];
  x.dias[d] = antes ? 0 : 1;
  if(!x.dias.some(v => v)){ x.dias[d] = antes; toast('Tiene que entrar al menos un dia'); return; }
  serTocar('Cambiaron los dias del turno ' + nombreSer(x) + ' en agentes de servicio.');
}
function serQuitar(i){
  const l = S.config.servicio.prioridad || [], x = l[i];
  if(!x) return;
  if(x.clave && l.filter(y => y.clave).length <= 1){
    toast('No puedes quedarte sin ningun turno principal'); return;
  }
  const nom = nombreSer(x);
  confirmar('Quitar de la lista',
    'El turno <b>' + esc(nom) + '</b> dejara de abrirse en agentes de servicio. Los horarios que ya tienes hechos no cambian.',
    () => { S.config.servicio.prioridad.splice(i, 1);
            serTocar('Se quito ' + nom + ' de la lista de agentes de servicio.'); });
}
function serAnadir(){
  const tid = (el('ser_turno') || {}).value;
  if(!tid){ toast('Elige un turno'); return; }
  if(!Array.isArray(S.config.servicio.prioridad)) S.config.servicio.prioridad = [];
  /* A proposito se deja repetir el mismo turno: cuando lleguen mas agentes
     puede hacer falta abrir dos veces la misma franja. */
  S.config.servicio.prioridad.push({ turnoId:tid, dias:[1,1,1,1,1,1,1], clave:false });
  serTocar('Se anadio ' + ((turno(tid) || {}).corto || '?') + ' a la lista de agentes de servicio.');

function ajustesAusencias(){

  const activasHoy = l.filter(a => a.desde <= hoy && hoy <= a.hasta);

  let h = '<div class="card"><h2>Vacaciones, licencias y permisos</h2>' +
    '<p class="muted" style="margin-top:-4px">Se apuntan por fechas. Esos dias la persona no entra en el reparto, ' +
    'y el horario se rehace solo alrededor: no son dias libres, son dias en que no esta.</p>' +
    '<div class="row" style="margin-bottom:10px;align-items:flex-end">' +
      '<label class="f" style="margin:0;min-width:180px"><span>Quien</span><select id="aus_emp">' +
        activosTodos().map(e => '<option value="' + e.id + '">' + esc(e.nombre) + '</option>').join('') +
      '</select></label>' +
      '<label class="f" style="margin:0;min-width:150px"><span>Motivo</span><select id="aus_tipo">' +
        Object.keys(TIPOS_AUSENCIA).map(t => '<option value="' + t + '">' + TIPOS_AUSENCIA[t] + '</option>').join('') +
      '</select></label>' +
      '<label class="f" style="margin:0;min-width:150px"><span>Desde</span><input type="date" id="aus_desde" value="' + hoy + '"></label>' +
      '<label class="f" style="margin:0;min-width:150px"><span>Hasta</span><input type="date" id="aus_hasta" value="' + hoy + '"></label>' +
      '<label class="f" style="margin:0;flex:1;min-width:160px"><span>Nota (opcional)</span><input type="text" id="aus_nota" placeholder="Se ve al pasar el raton"></label>' +
      '<button class="btn" onclick="agregarAusencia()">Registrar</button>' +
    '</div>';

  if(!l.length)
    return h + '<div class="alert info" style="margin:0">No hay ninguna ausencia registrada.</div></div>';

  const tabla = (titulo, arr, tenue) => {
    if(!arr.length) return '';
    let t = '<h3 style="margin:14px 0 6px">' + titulo + ' <span class="tiny muted">(' + arr.length + ')</span></h3>' +
      '<table class="data"><thead><tr><th>Quien</th><th>Motivo</th><th>Desde</th><th>Hasta</th><th>Dias</th><th>Nota</th><th></th></tr></thead><tbody>';
    arr.forEach(a => {
      const e = empleado(a.empId);
      const dias = Math.round((s2d(a.hasta) - s2d(a.desde)) / 86400000) + 1;
      t += '<tr' + (tenue ? ' style="opacity:.55"' : '') + '>' +
        '<td><b>' + esc((e || {}).nombre || '?') + '</b>' +
          (e ? '<span class="mini2">' + esc(infoEquipo(equipoDe(e)).nombre) + '</span>' : '') + '</td>' +
        '<td><span class="pill ' + (a.tipo === 'medica' ? 'bad' : (a.tipo === 'vacaciones' ? 'info' : 'warn')) + '">' +
          esc(TIPOS_AUSENCIA[a.tipo]) + '</span></td>' +
        '<td>' + fechaCorta(a.desde) + '/' + a.desde.slice(0,4) + '</td>' +
        '<td>' + fechaCorta(a.hasta) + '/' + a.hasta.slice(0,4) + '</td>' +
        '<td><b>' + dias + '</b></td>' +
        '<td class="tiny muted">' + esc(a.nota || '') + '</td>' +
        '<td style="text-align:right"><button class="btn sec sm" onclick="borrarAusencia(\'' + a.id + '\')">Eliminar</button></td></tr>';
    });
    return t + '</tbody></table>';
  };
  h += tabla('Ahora mismo fuera', activasHoy, false);
  h += tabla('Por venir', futuras, false);
  h += tabla('Ya pasadas', pasadas, true);

  /* aviso si alguna semana se queda corta de gente */
  const avisos = [];
  for(let s = 0; s < 8; s++){
    const k = addDias(lunesDe(hoy), 7*s);
    const fuera = activos().filter(e => diasAusente(e.id, k).length);
    if(!fuera.length) continue;
    /* Con la lista de prioridad los puestos se abren segun la gente que haya,
       asi que nunca 'sobran' turnos. Lo unico que puede faltar de verdad es
       un puesto principal, y eso es lo que se avisa. */
    const sinManos = manosPrevistas(k);
    if(sinManos){
      const q = porQueNoCuadra(k);
      avisos.push('<b>Semana del ' + fechaCorta(k) + '</b>: ' + q.titular + '.' +

         'Estos avisos son para que lo sepas con antelacion y decidas tu.</span></div>';
  else
    h += '<div class="alert ok" style="margin-top:12px">Las proximas 8 semanas cuadran con las ausencias registradas.</div>';
  /* El tope de "8 dias fuera" era del modelo viejo, cuando los puestos eran
     un numero fijo. Ahora los puestos se abren segun la gente que haya, asi
     que lo unico que importa es cuantas personas pueden cubrir los puestos
     principales. */
  const kSem = lunesDe(hoy);
  const aptos = activos().filter(e => { for(let d = 0; d < 7; d++) if(puedeCubrirNucleo(e, d, kSem)) return true; return false; });
  const nApt = aptos.length, nNuc = nucleoDia(0, kSem);
  h += '<p class="tiny muted" style="margin:8px 0 0">El horario se arma con la gente que haya, sean siete personas o cuatro. ' +
       'Lo unico que hace falta es que cada dia queden <b>' + nNuc + ' personas que puedan cubrir los puestos principales</b>. ' +
       'Ahora mismo pueden hacerlo <b>' + nApt + ' de ' + activos().length + '</b> agentes de renta' +
       (nApt < activos().length
         ? ' (' + activos().filter(e => aptos.indexOf(e) < 0).map(e => esc(e.nombre)).join(', ') + ' no, por lo que tiene vetado en su ficha)'
         : '') + '.</p>';

  return h + '</div>';
}
function agregarAusencia(){
  const empId = el('aus_emp').value;
  const desde = el('aus_desde').value, hasta = el('aus_hasta').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(desde) || !/^\d{4}-\d{2}-\d{2}$/.test(hasta)){ toast('Faltan las fechas'); return; }
  const a = { id:uid(), empId, tipo:el('aus_tipo').value, nota:el('aus_nota').value.trim(),
              desde: desde <= hasta ? desde : hasta, hasta: desde <= hasta ? hasta : desde };
  S.ausencias.push(a);
  /* las semanas ya hechas que caen dentro se rehacen para que salga bien */
  const n = rehacerSemanasDe(a.desde, a.hasta);
  bitacora(TIPOS_AUSENCIA[a.tipo] + ' de ' + empleado(empId).nombre + ' del ' + a.desde + ' al ' + a.hasta + '.');

function borrarAusencia(id){
  const a = ausencias().find(x => x.id === id);
  if(!a) return;
  S.ausencias = ausencias().filter(x => x.id !== id);
  const n = rehacerSemanasDe(a.desde, a.hasta);
  bitacora('Se quito la ausencia de ' + (empleado(a.empId) || {}).nombre + ' del ' + a.desde + ' al ' + a.hasta + '.');
  guardar(); render();
  toast('Ausencia eliminada' + (n ? ' · ' + n + ' semana(s) rehecha(s)' : ''));

/* Rehace los borradores que toquen ese tramo de fechas, de hoy en adelante */
function rehacerSemanasDe(desde, hasta){
  const dHoy = lunesDe(hoyISO());
  const ini = lunesDe(desde < dHoy ? dHoy : desde), fin = lunesDe(hasta);
  if(fin < ini) return 0;
  let n = 0;
  for(let k = ini; k <= fin; k = addDias(k, 7)){
    const w = S.semanas[k];
    if(!w || w.estado === 'publicado' || !Object.keys(w.celdas || {}).length) continue;
    try { otraAlternativa(k); n++; } catch(e){}
  }
  return n;
}

/* =====================================================================
   LOS FERIADOS DOMINICANOS
   Se calculan para el ano que pidas y se anaden a la lista para que los
   revises: la aplicacion no decide nada por ti, solo te ahorra teclearlos.

   Unos caen siempre en su fecha y otros se mueven al lunes, que es lo que
   dice la Ley 139-97: si el feriado cae martes o miercoles se pasa al
   lunes anterior, y si cae jueves o viernes, al lunes siguiente. Sabado y
   domingo se quedan donde estan.

   Ojo con dos: el Dia de la Restauracion (16 de agosto) NO se mueve en
   los anos de toma de posesion (los que acaban en 4), y Corpus Christi
   siempre cae en jueves porque va atado a la Pascua. Repasa la lista
   antes de darla por buena: cualquier fecha se puede corregir a mano.
   ===================================================================== */
/* Domingo de Pascua por el algoritmo de Meeus/Butcher */
function domingoPascua(anio){
  const a = anio % 19, b = Math.floor(anio / 100), c = anio % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const hh = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), kk = c % 4;
  const l = (32 + 2*e + 2*i - hh - kk) % 7;
  const m = Math.floor((a + 11*hh + 22*l) / 451);
  const mes = Math.floor((hh + l - 7*m + 114) / 31);
  const dia = ((hh + l - 7*m + 114) % 31) + 1;
  return new Date(Date.UTC(anio, mes - 1, dia));
}
function isoDe(dt){
  return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth()+1).padStart(2,'0') + '-' + String(dt.getUTCDate()).padStart(2,'0');
}
/* Ley 139-97: martes y miercoles al lunes anterior; jueves y viernes al
   lunes siguiente. Lo demas se queda igual. */
function moverALunes(iso){
  const dt = new Date(iso + 'T00:00:00Z');
  const dw = dt.getUTCDay();                       // 0 domingo ... 6 sabado
  let salto = 0;
  if(dw === 2 || dw === 3) salto = -(dw - 1);      // martes -1, miercoles -2
  else if(dw === 4 || dw === 5) salto = 8 - dw;    // jueves +4, viernes +3
  if(!salto) return iso;
  dt.setUTCDate(dt.getUTCDate() + salto);
  return isoDe(dt);
}
function feriadosDominicanos(anio){
  const pascua = domingoPascua(anio);
  const menos = (dias) => { const d = new Date(pascua.getTime()); d.setUTCDate(d.getUTCDate() - dias); return isoDe(d); };
  const mas   = (dias) => { const d = new Date(pascua.getTime()); d.setUTCDate(d.getUTCDate() + dias); return isoDe(d); };
  const y = String(anio);
  /* mueve: si la Ley 139-97 lo traslada al lunes */
  const base = [
    { fecha:y+'-01-01', nombre:'Ano Nuevo',                          mueve:false },
    { fecha:y+'-01-06', nombre:'Dia de los Santos Reyes',            mueve:true  },
    { fecha:y+'-01-21', nombre:'Nuestra Senora de la Altagracia',    mueve:false },
    { fecha:y+'-01-26', nombre:'Dia de Duarte',                      mueve:true  },
    { fecha:y+'-02-27', nombre:'Dia de la Independencia',            mueve:false },
    { fecha:menos(2),   nombre:'Viernes Santo',                      mueve:false },
    { fecha:y+'-05-01', nombre:'Dia del Trabajo',                    mueve:true  },
    { fecha:mas(60),    nombre:'Corpus Christi',                     mueve:false },
    /* en los anos de toma de posesion no se mueve */
    { fecha:y+'-08-16', nombre:'Dia de la Restauracion',             mueve: (anio % 5) !== 4 },
    { fecha:y+'-09-24', nombre:'Nuestra Senora de las Mercedes',     mueve:false },
    { fecha:y+'-11-06', nombre:'Dia de la Constitucion',             mueve:true  },
    { fecha:y+'-12-25', nombre:'Navidad',                            mueve:false }
  ];
  return base.map(f => {
    const movida = f.mueve ? moverALunes(f.fecha) : f.fecha;
    return { fecha:movida, nombre:f.nombre, original:f.fecha, movido: movida !== f.fecha };
  }).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
}

    '<select id="pri_puesto">' + pus.map(q => '<option value="' + q.id + '">' + esc(q.corto) + '</option>').join('') + '</select></label>' +
    '<label style="flex:1;min-width:140px"><span class="tiny muted">Turno</span>' +
    '<select id="pri_turno">' + tus.map(t => '<option value="' + t.id + '">' + esc(t.corto) + '</option>').join('') + '</select></label>' +
    '<button class="btn" onclick="priAnadir()">Anadir a la lista</button></div>';

  /* el resumen, que es lo que la gente mira de verdad */
  const k = SEMANA || lunesDe(hoyISO());
  const nuc = l.filter(x => x.clave).length;
  const rel = l.length - nuc;
  const abren = []; for(let d = 0; d < 7; d++) abren.push(puestosDia(d, k));
  const sueltos = l.filter(x => Array.isArray(x.dias) && !x.dias.every(v => v)).length;
  const falta = faltanManos(k);
  h += '<div class="alert ' + (falta ? 'warn' : 'info') + '" style="margin-top:14px">' +
    '<b>' + nuc + ' principal(es)</b> y ' + rel + ' de relleno' +

    'Esta semana se abren ' + abren.join(', ') + ' puestos, de lunes a domingo, segun la gente que trabaje cada dia.' +
    (falta ? ' <b>Ojo:</b> faltan manos para ' + falta + ' puesto(s) principal(es) esta semana.' : '') + '</div></div>';
  return h;
}
function priTocar(txt){
  olvidarPrioridad(); olvidarRefuerzos(); olvidarLibres(); olvidarObjetivoTipo();
  if(txt) bitacora(txt);
  guardar();
  if(PANTALLA === 'ajustes') render();
}
function nombrePri(x){
  const q = puesto(x.puestoId), t = turno(x.turnoId);
  return (q ? q.corto : '?') + ' ' + (t ? t.corto : '?');
}
function priMover(i, paso){
  const l = S.config.prioridad, j = i + paso;
  if(!l || !l[i] || j < 0 || j >= l.length) return;
  const t = l[j]; l[j] = l[i]; l[i] = t;
  priTocar('Se cambio el orden en que se cubren los puestos de los agentes de renta.');
}
function priClave(i, v){
  const x = (S.config.prioridad || [])[i];
  if(!x) return;
  if(!v && (S.config.prioridad || []).filter(y => y.clave).length <= 1){
    toast('Tiene que quedar al menos un puesto principal'); render(); return;
  }
  x.clave = !!v;
  priTocar('El puesto ' + nombrePri(x) + (v ? ' pasa a ser principal.' : ' deja de ser principal.'));
}
function priDia(i, d){
  const x = (S.config.prioridad || [])[i];
  if(!x) return;
  if(!Array.isArray(x.dias)) x.dias = [1,1,1,1,1,1,1];
  const antes = x.dias[d];
  x.dias[d] = antes ? 0 : 1;
  if(!x.dias.some(v => v)){ x.dias[d] = antes; toast('Tiene que entrar al menos un dia'); return; }
  priTocar('Cambiaron los dias del puesto ' + nombrePri(x) + '.');
}
function priQuitar(i){
  const l = S.config.prioridad || [], x = l[i];
  if(!x) return;
  if(x.clave && l.filter(y => y.clave).length <= 1){
    toast('No puedes quedarte sin ningun puesto principal'); return;
  }
  const nom = nombrePri(x);
  confirmar('Quitar de la lista',
    'El puesto <b>' + esc(nom) + '</b> dejara de abrirse. Los horarios que ya tienes hechos no cambian.',
    () => { S.config.prioridad.splice(i, 1);
            priTocar('Se quito ' + nom + ' de la lista de puestos de los agentes de renta.'); });
}
function priAnadir(){
  const pid = (el('pri_puesto') || {}).value, tid = (el('pri_turno') || {}).value;
  if(!pid || !tid){ toast('Elige puesto y turno'); return; }
  if(!Array.isArray(S.config.prioridad)) S.config.prioridad = [];
  if(S.config.prioridad.some(x => x.puestoId === pid && x.turnoId === tid)){
    toast('Ese puesto y turno ya estan en la lista'); return;
  }
  S.config.prioridad.push({ puestoId:pid, turnoId:tid, dias:[1,1,1,1,1,1,1], clave:false });
  priTocar('Se anadio ' + nombrePri({ puestoId:pid, turnoId:tid }) + ' a la lista de los agentes de renta.');
}

function guardarConfig(){
  const c = S.config;
  /* Los numeros se encajan dentro de lo posible antes de guardarlos: un
     campo vacio o un valor absurdo dejaba la aplicacion sin poder repartir
     ningun dia. */
  const num = (id, porDefecto, min, max) => {
    const v = Number((el(id) || {}).value);
    if(!isFinite(v) || v === 0 && porDefecto) return porDefecto;
    return Math.min(max, Math.max(min, v));
  };
  c.semanaRef = lunesDe(el('cfg_ref').value || hoyISO());
  c.maxLibresDia = num('cfg_maxlib', 2, 1, 7);
  c.objetivoB = num('cfg_objB', 2, 0, 7);
  c.maxB = num('cfg_maxB', 3, 1, 7);
  c.descansoMin = Math.min(24, Math.max(0, Number((el('cfg_desc')||{}).value) || 0));
  if(c.maxB < c.objetivoB) c.maxB = c.objetivoB;
  c.autocompletar = el('cfg_auto').checked;
  c.permitirSinDescanso = el('cfg_sindesc').checked;
  bitacora('Se actualizo el reparto de dias libres y las reglas.');
  guardar(); render(); toast('Configuracion guardada');
}

}

    '<textarea readonly style="min-height:90px;font-family:Consolas,monospace;font-size:12px" ' +
    'onclick="this.select()">' + esc(txt) + '</textarea>' +
    '<div class="alert warn" style="margin-top:10px">Trata este texto como una contrasena: quien lo tenga puede ver y ' +
    'cambiar tus horarios. Mandalo solo a tus propios equipos.</div>',
    '<button class="btn sec" onclick="cerrar()">Cerrar</button>');

function pegarConexion(){
  modal('Pegar datos de conexion',

    'Empieza por <b>HORARIOS1|</b>.</p>' +
    '<textarea id="pegar_con" style="min-height:90px;font-family:Consolas,monospace;font-size:12px" ' +
    'placeholder="HORARIOS1|https://...supabase.co|eyJ...|principal"></textarea>',

function aplicarConexion(){
  const txt = (el('pegar_con').value || '').trim();

  if(p[0] !== 'HORARIOS1' || !p[1] || !p[2]){
    el('pegar_con').value = txt;
    return toast('Ese texto no es valido. Debe empezar por HORARIOS1|');
  }
  const n = nubeConfig();
  n.url = p[1]; n.clave = p[2]; n.id = p[3] || 'principal'; n.activa = true;
  try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(S)); } catch(e){}
  cerrar();
  _nubeEstado = 'Conectando y trayendo el horario...'; render(); pintarEstadoNube();
  return nubeBajar()
    .then(hubo => {
      if(!hubo){ _nubeEstado = 'Conectado, pero en la nube todavia no hay nada guardado.'; render(); pintarEstadoNube(); return; }
      SEMANA = lunesDe(hoyISO()); PANTALLA = 'panel'; render(); nubeVigilar();

    })
    .catch(e => { _nubeEstado = nubeMensajeError(e); render(); pintarEstadoNube(); });
}

/* ---------- copias ---------- */
/* =====================================================================
   DESCARGAR UN ARCHIVO E IMPRIMIR
   Dos cosas que fallaban en silencio.

   La primera: el enlace de la descarga se creaba suelto y se pulsaba sin
   meterlo en la pagina. Chrome lo acepta, pero Firefox y varios visores no
   hacen nada con un enlace que no esta en el documento, asi que el boton
   parecia muerto. Ahora se mete, se pulsa y se saca.

   La segunda: cuando la aplicacion se abre DENTRO de un visor o de una
   previsualizacion, el navegador no deja ni descargar ni imprimir, y antes
   tampoco se decia. Ahora se avisa y se explica que hay que abrir el
   archivo de verdad.
   ===================================================================== */
/* ¿Estamos dentro de un visor? Ahi no hay descargas ni impresion. */
function dentroDeUnVisor(){
  try { return window.self !== window.top; } catch(e){ return true; }
}
function avisoDeVisor(){
  return dentroDeUnVisor()
    ? '<div class="alert warn"><b>Estas viendo la aplicacion dentro de un visor</b>' +
      'Los visores y las previsualizaciones no permiten descargar ni imprimir, asi que estos botones no van a hacer nada aqui. ' +
      'Abre <b>Horarios Rotativos.html</b> con doble clic, o desde tu direccion de internet, y funcionan con normalidad.</div>'
    : '';
}
function descargarArchivo(url, nombre){
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  a.rel = 'noopener';
  a.style.position = 'fixed';
  a.style.left = '-9999px';
  document.body.appendChild(a);
  try { a.click(); } finally { document.body.removeChild(a); }
  /* El objeto se suelta un minuto despues: soltarlo al momento corta la
     descarga a medias en algunos navegadores. */
  if(String(url).slice(0,5) === 'blob:')

function cambiarSemana(n){ SEMANA = addDias(SEMANA, 7*n); render(); }
